id: use-secretspec-for-forge-commands
snapshots:
  ? |
    {
      "scripts": {
        "deploy": "forge deploy"
      }
    }
  : labels:
      - source: forge deploy
        style: primary
        start: 32
        end: 44
      - source: |-
          "scripts": {
              "deploy": "forge deploy"
            }
        style: secondary
        start: 4
        end: 49
  ? |
    {
      "scripts": {
        "install": "forge install"
      }
    }
  : labels:
      - source: forge install
        style: primary
        start: 33
        end: 46
      - source: |-
          "scripts": {
              "install": "forge install"
            }
        style: secondary
        start: 4
        end: 51
  ? |
    {
      "scripts": {
        "uninstall": "forge uninstall"
      }
    }
  : labels:
      - source: forge uninstall
        style: primary
        start: 35
        end: 50
      - source: |-
          "scripts": {
              "uninstall": "forge uninstall"
            }
        style: secondary
        start: 4
        end: 55
  ? |
    {
      "scripts": {
        "variables:set": "forge variables set FOO bar"
      }
    }
  : labels:
      - source: forge variables set FOO bar
        style: primary
        start: 39
        end: 66
      - source: |-
          "scripts": {
              "variables:set": "forge variables set FOO bar"
            }
        style: secondary
