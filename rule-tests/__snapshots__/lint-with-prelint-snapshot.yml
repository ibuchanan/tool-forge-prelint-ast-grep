id: lint-with-prelint
snapshots:
  ? |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      }
    }
  : labels:
      - source: "@forge/api"
        style: primary
        start: 27
        end: 37
      - source: |-
          "dependencies": {
              "@forge/api": "^4.0.0"
            }
        style: secondary
        start: 4
        end: 52
  ? |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "lint:prelint": "ast-grep scan --config node_modules/tool-forge-prelint-ast-grep/sgconfig.recommended.yml"
      }
    }
  : labels:
      - source: "@forge/api"
        style: primary
        start: 27
        end: 37
      - source: |-
          "dependencies": {
              "@forge/api": "^4.0.0"
            }
        style: secondary
        start: 4
        end: 52
