    - source: |-
        {
          "scripts": {
            "build": "tsc"
          }
        }
      style: primary
      start: 0
      end: 41
    - source: |
        {
          "scripts": {
            "build": "tsc"
          }
        }
      style: secondary
      start: 0
      end: 42
