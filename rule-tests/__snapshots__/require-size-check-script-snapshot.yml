id: require-size-check-script
snapshots:
  ? |
    {
      "scripts": { "build": "tsc" },
      "size-limit": [{ "path": "dist/**/*.js", "limit": "10 kB" }]
    }
  : labels:
    - source: '"size-limit": [{ "path": "dist/**/*.js", "limit": "10 kB" }]'
      style: primary
      start: 37
      end: 97
  ? |
    {
      "scripts": { "size": "npm run build && size-limit" },
      "devDependencies": { "@size-limit/file": "^12.1" }
    }
  : labels:
    - source: '@size-limit/file'
      style: primary
      start: 82
      end: 98
    - source: '"devDependencies": { "@size-limit/file": "^12.1" }'
      style: secondary
      start: 60
      end: 110
  ? |
    {
      "scripts": { "size:check": "echo skip" },
      "devDependencies": { "@size-limit/file": "^12.1" }
    }
  : labels:
    - source: '@size-limit/file'
      style: primary
      start: 70
      end: 86
    - source: '"devDependencies": { "@size-limit/file": "^12.1" }'
      style: secondary
      start: 48
      end: 98
  ? |
    {
      "scripts": { "size:check": "size-limit" },
      "devDependencies": { "@size-limit/file": "^12.1" }
    }
  : labels:
    - source: '@size-limit/file'
      style: primary
      start: 71
      end: 87
    - source: '"devDependencies": { "@size-limit/file": "^12.1" }'
      style: secondary
      start: 49
      end: 99
