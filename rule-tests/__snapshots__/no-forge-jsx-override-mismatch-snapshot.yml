id: no-forge-jsx-override-mismatch
snapshots:
  ? |
    {
      "compilerOptions": {
        "jsx": "react-jsx"
      }
    }
  : labels:
    - source: |-
        {
          "compilerOptions": {
            "jsx": "react-jsx"
          }
        }
      style: primary
      start: 0
      end: 53
    - source: |
        {
          "compilerOptions": {
            "jsx": "react-jsx"
          }
        }
      style: secondary
      start: 0
      end: 54
  ? |
    {
      "compilerOptions": {
        "target": "ES2022"
      }
    }
  : labels:
    - source: |-
        {
          "compilerOptions": {
            "target": "ES2022"
          }
        }
      style: primary
      start: 0
      end: 53
    - source: |
        {
          "compilerOptions": {
            "target": "ES2022"
          }
        }
      style: secondary
      start: 0
      end: 54
  ? |
    {
      "include": ["src"]
    }
  : labels:
    - source: |-
        {
          "include": ["src"]
        }
      style: primary
      start: 0
      end: 24
    - source: |
        {
          "include": ["src"]
        }
      style: secondary
      start: 0
      end: 25
