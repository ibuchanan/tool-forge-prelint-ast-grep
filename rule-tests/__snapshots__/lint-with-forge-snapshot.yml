id: lint-with-forge
snapshots:
  ? |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      }
    }
  : labels:
    - source: '@forge/api'
      style: primary
      start: 27
      end: 37
    - source: |-
        "dependencies": {
            "@forge/api": "^4.0.0"
          }
      style: secondary
      start: 4
      end: 52
  ? |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "lint": "forge lint"
      }
    }
  : labels:
    - source: '@forge/api'
      style: primary
      start: 27
      end: 37
    - source: |-
        "dependencies": {
            "@forge/api": "^4.0.0"
          }
      style: secondary
      start: 4
      end: 52
  ? |
    {
      "dependencies": {
        "@forge/events": "^3.0.0"
      }
    }
  : labels:
    - source: '@forge/events'
      style: primary
      start: 27
      end: 40
    - source: |-
        "dependencies": {
            "@forge/events": "^3.0.0"
          }
      style: secondary
      start: 4
      end: 55
