id: no-forge-source-map-override-mismatch
snapshots:
  ? |
    {
      "compilerOptions": {
        "jsx": "react"
      }
    }
  : labels:
    - source: |-
        {
          "compilerOptions": {
            "jsx": "react"
          }
        }
      style: primary
      start: 0
      end: 49
    - source: |
        {
          "compilerOptions": {
            "jsx": "react"
          }
        }
      style: secondary
      start: 0
      end: 50
  ? |
    {
      "compilerOptions": {
        "sourceMap": false
      }
    }
  : labels:
    - source: |-
        {
          "compilerOptions": {
            "sourceMap": false
          }
        }
      style: primary
      start: 0
      end: 53
    - source: |
        {
          "compilerOptions": {
            "sourceMap": false
          }
        }
      style: secondary
      start: 0
      end: 54
  ? |
    {
      "include": ["src"]
    }
  : labels:
    - source: |-
        {
          "include": ["src"]
        }
      style: primary
      start: 0
      end: 24
    - source: |
        {
          "include": ["src"]
        }
      style: secondary
      start: 0
      end: 25
