id: use-size-limit
snapshots:
  ? |
    {
      "name": "my-forge-app",
      "scripts": {
        "build": "forge build",
        "test": "vitest"
      },
      "dependencies": {
        "@forge/api": "^4.0.0",
        "@forge/react": "^10.0.0"
      },
      "devDependencies": {
        "@forge/cli": "^10.0.0"
      }
    }
  : labels:
      - source: build
        style: primary
        start: 48
        end: 53
      - source: |-
          "scripts": {
              "build": "forge build",
              "test": "vitest"
            }
        style: secondary
        start: 30
        end: 95
  ? |
    {
      "scripts": {
        "build": "forge build"
      }
    }
  : labels:
      - source: build
        style: primary
        start: 22
        end: 27
      - source: |-
          "scripts": {
              "build": "forge build"
            }
        style: secondary
        start: 4
        end: 47
