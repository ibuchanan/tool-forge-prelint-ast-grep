id: no-bundle-bloat-dependencies
snapshots:
  ? |
    {
      "dependencies": {
        "axios": "^1.6.0"
      }
    }
  : labels:
      - source: axios
        style: primary
        start: 27
        end: 32
      - source: |-
          "dependencies": {
              "axios": "^1.6.0"
            }
        style: secondary
        start: 4
        end: 47
