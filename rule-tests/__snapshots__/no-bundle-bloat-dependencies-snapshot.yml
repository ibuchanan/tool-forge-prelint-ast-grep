        style: primary
        start: 27
        end: 33
      - source: |-
          "dependencies": {
              "lodash": "^4.17.21"
            }
        style: secondary
        start: 4
        end: 50
  ? |
    {
      "dependencies": {
        "moment": "^2.29.0"
      }
    }
  : labels:
      - source: moment
        style: primary
        start: 27
        end: 33
      - source: |-
          "dependencies": {
              "moment": "^2.29.0"
            }
        style: secondary
