id: require-lefthook-pre-commit-gitleaks
snapshots:
  ? |
    pre-commit:
      commands:
        lint:
          run: npm run lint
        format:
          run: npm run format:check
    pre-push:
      commands:
        test:
          run: npm run test
  : labels:
