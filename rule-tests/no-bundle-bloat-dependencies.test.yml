id: no-bundle-bloat-dependencies
valid:
  # Safe production dependencies
  - |
    {
      "dependencies": {
        "express": "^4.18.0"
      }
    }
  # Bloat packages are fine in devDependencies
  - |
    {
      "devDependencies": {
        "axios": "^1.0.0",
        "moment": "^2.0.0",
        "lodash": "^4.0.0"
      }
    }
  # Related-but-not-exact package names should not fire
  - |
    {
      "dependencies": {
        "lodash-es": "^4.17.21",
        "lodash.get": "^4.4.2",
        "axios-mock-adapter": "^1.21.0",
        "moment-timezone": "^0.5.0"
      }
    }
invalid:
  - |
    {
      "dependencies": {
        "moment": "^2.29.0"
      }
    }
  - |
    {
      "dependencies": {
        "lodash": "^4.17.21"
      }
    }
  - |
    {
      "dependencies": {
        "axios": "^1.6.0"
      }
    }
