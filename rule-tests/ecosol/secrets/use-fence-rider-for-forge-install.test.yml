id: use-fence-rider-for-forge-install
valid:
  # Both initial installation and upgrades use the configured workflow.
  - |
    {"scripts": {
      "forge:install": "cmd=$(fence-rider install -- --confirm-scopes --non-interactive) && sh -c \"$cmd\" sh",
      "forge:upgrade": "cmd=$(fence-rider install -- --upgrade --confirm-scopes --non-interactive) && sh -c \"$cmd\" sh"
    }}
  # Other commands, aliases and external helpers are outside this check.
  - |
    {"scripts": {"tunnel": "forge tunnel", "register": "forge register", "install": "sh scripts/install.sh"}}
  - |
    {"scripts": {"install": "npm run forge:install", "other": "my-forge install && forge installation"}}
  # Keys and unrelated metadata must not be mistaken for commands.
  - |
    {"description": "forge install", "scripts": {"forge install": "echo ready"}, "config": {"scripts": {"install": "forge install"}}}
  - |
    {"scripts": {"uninstall": "forge uninstall", "deploy": "forge deploy", "lint": "forge lint"}}
invalid:
  - |
    {"scripts": {"forge:install": "forge install"}}
  - |
    {"scripts": {"forge:upgrade": "forge install --upgrade --non-interactive"}}
  - |
    {"scripts": {"forge:upgrade": "forge install -u"}}
  # Direct SecretSpec wrappers still need migration to the team convention.
  - |
    {"scripts": {"install": "secretspec run -- forge install"}}
  - |
    {"scripts": {"install": "bash scripts/env-var.sh 'forge install --site example.atlassian.net'"}}
  - |
    {"scripts": {"install": "npm run build && forge   install --non-interactive"}}
  # A Fence Rider invocation must not exempt another, direct Forge command.
  - |
    {"scripts": {"install": "cmd=$(fence-rider install) && sh -c \"$cmd\" sh && forge install"}}
