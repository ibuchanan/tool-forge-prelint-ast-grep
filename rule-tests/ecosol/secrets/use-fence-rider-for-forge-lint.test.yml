id: use-fence-rider-for-forge-lint
valid:
  - |
    {"scripts": {"lint:forge": "cmd=$(fence-rider lint) && sh -c \"$cmd\" sh"}}
  - |
    {"scripts": {"tunnel": "forge tunnel", "lint": "sh scripts/lint.sh"}}
  - |
    {"scripts": {"lint": "npm run lint:forge", "other": "my-forge lint && forge linting"}}
  - |
    {"description": "forge lint", "scripts": {"forge lint": "echo ready"}, "config": {"scripts": {"lint": "forge lint"}}}
  - |
    {"scripts": {"install": "forge install", "uninstall": "forge uninstall", "deploy": "forge deploy"}}
invalid:
  - |
    {"scripts": {"lint:forge": "forge lint"}}
  - |
    {"scripts": {"lint": "secretspec run -- forge lint"}}
  - |
    {"scripts": {"lint": "bash scripts/env-var.sh 'forge lint'"}}
  - |
    {"scripts": {"lint": "npm run lint:check && forge   lint --verbose"}}
  - |
    {"scripts": {"lint": "cmd=$(fence-rider lint) && sh -c \"$cmd\" sh && forge lint"}}
