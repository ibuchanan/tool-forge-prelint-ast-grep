id: use-fence-rider-for-forge-uninstall
valid:
  - |
    {"scripts": {"forge:uninstall": "cmd=$(fence-rider uninstall) && sh -c \"$cmd\" sh"}}
  - |
    {"scripts": {"tunnel": "forge tunnel", "uninstall": "sh scripts/uninstall.sh"}}
  - |
    {"scripts": {"uninstall": "npm run forge:uninstall", "other": "my-forge uninstall && forge uninstallation"}}
  - |
    {"description": "forge uninstall", "scripts": {"forge uninstall": "echo ready"}, "config": {"scripts": {"uninstall": "forge uninstall"}}}
  - |
    {"scripts": {"install": "forge install", "deploy": "forge deploy", "lint": "forge lint"}}
invalid:
  - |
    {"scripts": {"forge:uninstall": "forge uninstall"}}
  - |
    {"scripts": {"uninstall": "secretspec run -- forge uninstall"}}
  - |
    {"scripts": {"uninstall": "bash scripts/env-var.sh 'forge uninstall --site example.atlassian.net'"}}
  - |
    {"scripts": {"uninstall": "npm run check; forge   uninstall --product jira"}}
  - |
    {"scripts": {"uninstall": "cmd=$(fence-rider uninstall) && sh -c \"$cmd\" sh && forge uninstall"}}
