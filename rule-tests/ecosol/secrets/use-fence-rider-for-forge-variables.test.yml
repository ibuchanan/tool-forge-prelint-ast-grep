id: use-fence-rider-for-forge-variables
valid:
  - |
    {"scripts": {"forge:variables:set": "fence-rider variables"}}
  - |
    {"scripts": {"release": "fence-rider variables && cmd=$(fence-rider deploy) && sh -c \"$cmd\" sh"}}
  - |
    {"scripts": {"variables": "bun run forge:variables:set", "other": "forge variables list"}}
  - |
    {"scripts": {"other": "my-forge variables set", "helper": "bun run scripts/forge-vars-from-secretspec.js.backup"}}
  - |
    {"description": "forge variables set", "scripts": {"forge variables set": "echo ready"}, "config": {"scripts": {"variables": "forge variables set"}}}
  - |
    {"scripts": {"helper": "bun run scripts/custom-upload.js", "metadata": "echo scripts/forge-vars-from-secretspec.js"}}
invalid:
  - |
    {"scripts": {"forge:variables:set": "forge variables set API_TOKEN value --encrypt"}}
  - |
    {"scripts": {"variables": "secretspec run -- forge   variables  set API_TOKEN \"$API_TOKEN\""}}
  - |
    {"scripts": {"variables": "node scripts/forge-vars-from-secretspec.js"}}
  - |
    {"scripts": {"variables": "bun run ./scripts/forge-vars-from-secretspec.js"}}
  - |
    {"scripts": {"variables": "bun scripts/forge-vars-from-secretspec.js && bun run forge:deploy"}}
