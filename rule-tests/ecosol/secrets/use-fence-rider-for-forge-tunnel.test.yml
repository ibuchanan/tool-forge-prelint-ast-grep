id: use-fence-rider-for-forge-tunnel
valid:
  - |
    {"scripts": {"tunnel": "cmd=$(fence-rider tunnel) && sh -c \"$cmd\" sh"}}
  - |
    {"scripts": {"tunnel": "bun run forge:tunnel", "helper": "sh scripts/tunnel.sh"}}
  - |
    {"scripts": {"other": "my-forge tunnel && forge tunneling"}}
  - |
    {"description": "forge tunnel", "scripts": {"forge tunnel": "echo ready"}, "config": {"scripts": {"tunnel": "forge tunnel"}}}
  - |
    {"scripts": {"deploy": "forge deploy", "variables": "forge variables set KEY value"}}
invalid:
  - |
    {"scripts": {"tunnel": "forge tunnel"}}
  - |
    {"scripts": {"forge:tunnel": "secretspec run -- forge tunnel"}}
  - |
    {"scripts": {"tunnel": "bash scripts/env-var.sh 'forge tunnel --environment development'"}}
  - |
    {"scripts": {"tunnel": "FORGE_USER_VAR_API_TOKEN=$API_TOKEN forge   tunnel"}}
  - |
    {"scripts": {"tunnel": "cmd=$(fence-rider tunnel) && sh -c \"$cmd\" sh && forge tunnel"}}
