id: no-unguarded-fence-rider-evaluation
valid:
  - |
    {"scripts": {"deploy": "cmd=$(fence-rider deploy) && sh -c \"$cmd\" sh"}}
  - |
    {"scripts": {"lint": "if cmd=$(fence-rider lint); then eval \"$cmd\"; else exit 1; fi"}}
  - |
    {"scripts": {"variables": "fence-rider variables", "doctor": "fence-rider doctor"}}
  - |
    {"scripts": {"print": "echo 'eval $(fence-rider deploy)'", "inspect": "fence-rider deploy | cat"}}
  - |
    {"scripts": {"checked-pipe": "set -o pipefail; fence-rider deploy | bash"}}
  - |
    {"description": "eval $(fence-rider deploy)", "scripts": {"eval $(fence-rider deploy)": "echo ready"}, "config": {"scripts": {"deploy": "eval $(fence-rider deploy)"}}}
  - |
    {"scripts": {"other": "eval \"$(other-tool deploy)\"", "print": "fence-rider deploy > deploy.sh"}}
invalid:
  - |
    {"scripts": {"deploy": "eval \"$(fence-rider deploy)\""}}
  - |
    {"scripts": {"tunnel": "eval $(fence-rider tunnel)"}}
  - |
    {"scripts": {"lint": "bun run build && sh -c \"$(fence-rider lint)\""}}
  - |
    {"scripts": {"install": "bash -c \"$(fence-rider install -- --non-interactive)\""}}
  - |
    {"scripts": {"uninstall": "zsh -c \"$(fence-rider uninstall)\""}}
  - |
    {"scripts": {"deploy": "fence-rider deploy | sh"}}
  - |
    {"scripts": {"deploy": "bun run build && fence-rider deploy -- --non-interactive | bash -s"}}
  - |
    {"scripts": {"tunnel": "fence-rider tunnel | zsh; echo finished"}}
