id: require-fence-rider-script-execution
valid:
  - |
    {"scripts": {"forge:deploy": "cmd=$(fence-rider deploy -- --non-interactive) && sh -c \"$cmd\" sh"}}
  - |
    {"scripts": {"variables": "fence-rider variables", "doctor": "fence-rider doctor --resolve"}}
  - |
    {"scripts": {"help": "fence-rider deploy --help", "short-help": "fence-rider tunnel -h", "version": "fence-rider --version"}}
  # Explicitly printing or saving a script can be intentional.
  - |
    {"scripts": {"print": "fence-rider deploy > deploy.sh", "capture": "cmd=$(fence-rider tunnel)"}}
  - |
    {"scripts": {"helper": "sh scripts/deploy.sh", "alias": "bun run forge:deploy", "other": "fence-rider deployment"}}
  - |
    {"description": "fence-rider deploy", "scripts": {"fence-rider deploy": "echo ready"}, "config": {"scripts": {"deploy": "fence-rider deploy"}}}
invalid:
  - |
    {"scripts": {"forge:deploy": "fence-rider deploy"}}
  - |
    {"scripts": {"lint:forge": "fence-rider lint -- --verbose"}}
  - |
    {"scripts": {"forge:install": "fence-rider install -- --confirm-scopes --non-interactive"}}
  - |
    {"scripts": {"forge:uninstall": "fence-rider uninstall"}}
  - |
    {"scripts": {"tunnel": "  fence-rider   tunnel -e development  "}}
  - |
    {"scripts": {"deploy": "fence-rider deploy -- --approve RULE_WITH--help-IN-NAME"}}
