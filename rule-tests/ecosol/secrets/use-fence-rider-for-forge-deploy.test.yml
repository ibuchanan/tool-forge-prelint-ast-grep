id: use-fence-rider-for-forge-deploy
valid:
  # Deployment may legitimately reuse previously uploaded runtime values.
  - |
    {"scripts": {"forge:deploy": "cmd=$(fence-rider deploy -- --non-interactive) && sh -c \"$cmd\" sh"}}
  - |
    {"scripts": {"release": "fence-rider variables && cmd=$(fence-rider deploy -- --non-interactive) && sh -c \"$cmd\" sh"}}
  - |
    {"scripts": {"tunnel": "forge tunnel", "deploy": "sh scripts/deploy.sh"}}
  - |
    {"scripts": {"deploy": "npm run forge:deploy", "other": "my-forge deploy && forge deployment"}}
  - |
    {"description": "forge deploy", "scripts": {"forge deploy": "echo ready"}, "config": {"scripts": {"deploy": "forge deploy"}}}
  - |
    {"scripts": {"install": "forge install", "uninstall": "forge uninstall", "lint": "forge lint"}}
invalid:
  - |
    {"scripts": {"forge:deploy": "forge deploy"}}
  - |
    {"scripts": {"deploy": "secretspec run -- forge deploy"}}
  - |
    {"scripts": {"deploy": "bash scripts/env-var.sh 'forge deploy --non-interactive'"}}
  - |
    {"scripts": {"deploy": "npm run build && forge   deploy --non-interactive"}}
  - |
    {"scripts": {"deploy": "cmd=$(fence-rider deploy) && sh -c \"$cmd\" sh && forge deploy"}}
