id: require-lefthook-prepare
valid:
  # Drop Calf's Forge-app default.
  - |
    {
      "scripts": {
        "prepare": "lefthook install || true",
        "test": "vitest run"
      }
    }
  # A failing install can be intentional.
  - |
    {
      "scripts": {
        "prepare": "lefthook install"
      }
    }
  - |
    {"scripts": {"prepare": "lefthook install||true"}}
  - |
    {"scripts": {"prepare": "lefthook install  ||  true"}}
  # Direct composition preserves the existing user workflow.
  - |
    {"scripts":{"prepare":"lefthook install || true && npm run skill:link-wrangler"}}
  - |
    {"scripts":{"prepare":"lefthook install && npm run skill:link-wrangler"}}
  - |
    {"scripts":{"prepare":"run-s prepare:hooks 'skill:link-*'","prepare:hooks":"lefthook install || true"}}
  - |
    {"scripts":{"prepare":"run-s --npm-path npm --print-label prepare:hooks 'skill:link-*'","prepare:hooks":"lefthook install"}}
  - |
    {"scripts":{"prepare":"run-s --print-label --npm-path npm \"prepare:hooks\" \"skill:link-*\"","prepare:hooks":"lefthook install"}}
  - |
    {"scripts":{"prepare":"run-s 'prepare:hooks'","prepare:hooks":"lefthook install"}}
invalid:
  - |
    {"scripts":{"prepare":"run-s prepare:hooks prepare","prepare:hooks":"lefthook install"}}
  # Hooks must be selected first, not merely mentioned later.
  - |
    {"scripts":{"prepare":"run-s 'skill:link-*' prepare:hooks","prepare:hooks":"lefthook install"}}
  - |
    {"scripts":{"prepare":"run-s prepare:hooks 'skill:link-*'"}}
  - |
    {"scripts":{"prepare":"run-s prepare:hooks 'skill:link-*'","prepare:hooks":"echo lefthook install"}}
  - |
    {"scripts":{"prepare":"run-s 'skill:link-*'","prepare:hooks":"lefthook install"}}
  - |
    {"scripts":{"prepare":"run-s prepare:hooks-extra","prepare:hooks":"lefthook install"}}
  - |
    {"scripts":{"prepare":"echo run-s prepare:hooks","prepare:hooks":"lefthook install"}}
  - |
    {"scripts":{"prepare":"run-s prepare:hooks || true","prepare:hooks":"lefthook install"}}
  - |
    {"scripts":{"prepare":"run-s prepare:hooks","nested":{"prepare:hooks":"lefthook install"}}}
  - |
    {"scripts":{"prepare":"run-s prepare:hooks"},"other":{"scripts":{"prepare:hooks":"lefthook install"}}}
  - |
    {"scripts":{"prepare":"lefthook install-later"}}
  - |
    {"scripts":{"prepare":"lefthook install || trueish"}}
  - |
    {"scripts": {"prepare": true}}
  - |
    {"scripts": {"prepare": ["lefthook", "install"]}}
  - |
    {"scripts": {"prepare": "echo lefthook install"}}
  - |
    {"scripts": {"prepare-extra": "lefthook install || true"}}
  - |
    {"scripts": {"prepare": "lefthook install --help"}}
  - |
    {"scripts": {"prepare": "lefthook install || echo ignored"}}
  - |
    {
      "scripts": {
        "test": "vitest run"
      }
    }
  - |
    {
      "name": "forge-app"
    }
  - |
    {
      "scripts": {
        "prepare": "echo ready"
      }
    }
  # A nested lookalike cannot install hooks for this package.
  - |
    {
      "scripts": {
        "test": "vitest run"
      },
      "other": {
        "scripts": {
          "prepare": "lefthook install || true"
        }
      }
    }
  # An unrelated property under scripts is not the prepare lifecycle script.
  - |
    {
      "scripts": {
        "test": "vitest run",
        "nested": {
          "prepare": "lefthook install"
        }
      }
    }
