id: require-release-check-script
valid:
  # Forge-app checks seeded by the pinned release capability.
  - |
    { "scripts": { "release:check": "npm run test && npm run typecheck" } }
  # Owner checks are not frozen to the seed or a library's pack:check.
  - |
    { "scripts": { "release:check": "owner-check" } }
  - |
    { "scripts": { "release:check": "npm run lint && npm test && npm run typecheck && npm run security:audit" } }
  - |
    { "scripts": { "release:check": "bun run test && bun run typecheck" } }
  - |
    { "scripts": { "release:check": "bash ./scripts/verify.sh --strict" } }
  - |
    { "scripts": { "release:check": "run-s lint test typecheck" } }
  - |
    { "scripts": { "release:check": "CHECK_MODE=release owner-check --offline" } }
  # Command names containing placeholder words are not themselves placeholders.
  - |
    { "scripts": { "release:check": "todo-check && true" }, "config": { "release:check": "owner data" } }
invalid:
  # A successful logging command is not validation.
  - |
    { "scripts": { "release:check": "echo checks passed" } }
  - |
    { "name": "forge-app" }
  - |
    { "scripts": {} }
  - |
    { "scripts": null }
  - |
    { "scripts": { "release:check": false } }
  - |
    { "scripts": { "release:check": ["npm test"] } }
  - |
    { "scripts": { "release:check": { "command": "npm test" } } }
  - |
    { "other": { "scripts": { "release:check": "npm test" } } }
  - |
    { "scripts": { "nested": { "release:check": "npm test" } } }
  - |
    { "scripts": [{ "release:check": "npm test" }] }
  - |
    { "scripts": { "release-check": "npm test" } }
  - |
    { "scripts": { "release:check": "" } }
  - |
    { "scripts": { "release:check": "   " } }
  - |
    { "scripts": { "release:check": "printf 'All good'" } }
  - |
    { "scripts": { "release:check": "true" } }
  - |
    { "scripts": { "release:check": "false" } }
  - |
    { "scripts": { "release:check": "exit 0" } }
  - |
    { "scripts": { "release:check": ":" } }
  - |
    { "scripts": { "release:check": "# npm test" } }
  - |
    { "scripts": { "release:check": "TODO" } }
  - |
    { "scripts": { "release:check": "Not yet implemented" } }
  - |
    { "scripts": { "release:check": "placeholder" } }
