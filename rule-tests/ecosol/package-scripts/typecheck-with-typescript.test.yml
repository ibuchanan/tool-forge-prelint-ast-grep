id: typecheck-with-typescript
valid:
  - |
    {
      "scripts": {
        "build": "tsc -p tsconfig.build.json",
        "typecheck": "tsc --noEmit -p tsconfig.typecheck.json"
      }
    }
  - |
    {
      "scripts": {
        "build": "tsc",
        "typecheck": "tsc --noEmit --project tsconfig.typecheck.json"
      }
    }
  # The noEmit flag may appear before or after the project argument
  - |
    {
      "scripts": {
        "typecheck": "tsc -p tsconfig.typecheck.json --noEmit"
      }
    }
invalid:
  # Missing typecheck script
  - |
    {
      "scripts": {
        "build": "tsc -p tsconfig.build.json"
      }
    }
  # Typecheck script emits output
  - |
    {
      "scripts": {
        "typecheck": "tsc"
      }
    }
  # Bare --noEmit with no project argument only checks the default tsconfig.json
  - |
    {
      "scripts": {
        "typecheck": "tsc --noEmit"
      }
    }
  # Points at the deploy baseline instead of the exhaustive typecheck config
  - |
    {
      "scripts": {
        "typecheck": "tsc --noEmit -p tsconfig.json"
      }
    }
