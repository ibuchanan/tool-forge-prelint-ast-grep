id: typecheck-with-typescript
valid:
  # Not a Forge app (no @forge/api dependency)
  - |
    {
      "dependencies": {
        "express": "^4.18.0"
      }
    }
  # Forge app already using the repo-init TypeScript build scripts
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "build": "tsc -p tsconfig.build.json",
        "typecheck": "tsc --noEmit -p tsconfig.json"
      }
    }
  # Forge app using the conventional package-level no-emit typecheck script
  - |
    {
      "dependencies": {
        "@forge/bridge": "*",
        "@forge/react": "*",
        "@forge/resolver": "*"
      },
      "scripts": {
        "build": "tsc",
        "typecheck": "tsc --noEmit"
      }
    }
  # The noEmit flag may appear after an explicit project argument
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "typecheck": "tsc -p tsconfig.json --noEmit"
      }
    }
invalid:
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      }
    }
  # Missing from a Forge app that only depends on @forge/bridge
  - |
    {
      "dependencies": {
        "@forge/bridge": "^4.0.0"
      }
    }
  # Missing typecheck script
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "build": "tsc -p tsconfig.build.json"
      }
    }
  # Typecheck script emits output
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "typecheck": "tsc"
      }
    }
