id: require-composed-check
valid:
  - |
    {
      "scripts": {
        "check": "lefthook run pre-push"
      }
    }
  # --force is needed so check doesn't skip commands when run outside an
  # actual git push (no push-file diff to match filters against)
  - |
    {
      "scripts": {
        "check": "lefthook run pre-push --force"
      }
    }
  # -f is the short form of --force
  - |
    {
      "scripts": {
        "check": "lefthook run pre-push -f"
      }
    }
  # Dependencies are irrelevant — this ruleset assumes it only ever runs
  # against a Forge app
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "check": "lefthook run pre-push"
      }
    }
invalid:
  # Missing entirely
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
  # The old sequential chain is no longer the expected form
  - |
    {
      "scripts": {
        "check": "npm run format:check && npm run typecheck && npm run lint && npm run test"
      }
    }
  # Wrong hook name
  - |
    {
      "scripts": {
        "check": "lefthook run pre-commit"
      }
    }
