id: require-composed-check
valid:
  # Not a Forge app (no @forge/api dependency)
  - |
    {
      "dependencies": {
        "express": "^4.18.0"
      }
    }
  # check composes all four gates in order
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "check": "npm run format:check && npm run typecheck && npm run lint && npm run test"
      }
    }
  # Extra whitespace around && (e.g. from a formatter) should not cause a false positive
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "check": "npm run format:check && npm run typecheck  && npm run lint && npm run test"
      }
    }
invalid:
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      }
    }
  # Missing from a Forge app that only depends on @forge/kvs
  - |
    {
      "dependencies": {
        "@forge/kvs": "^2.0.0"
      }
    }
  # Missing typecheck from the chain
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "check": "npm run format:check && npm run lint && npm run test"
      }
    }
  # Wrong order
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "check": "npm run test && npm run lint && npm run format:check && npm run typecheck"
      }
    }
