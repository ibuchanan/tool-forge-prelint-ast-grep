id: require-composed-check
valid:
  # Read-only check tasks can be selected by a quoted glob.
  - |
    {"scripts":{"check":"run-p --npm-path npm --print-label \"check:*\""}}
  - |
    {"scripts":{"check":"run-p --print-label --npm-path npm '*:check'"}}
  # Explicit task lists and optional runner flags are supported too.
  - |
    {"scripts":{"check":"run-p format:check typecheck lint test"}}
  - |
    {"scripts":{"check":"run-p 'check:*' --print-label"}}
  - |
    {"scripts":{"check":"  run-p   'check:*'"}}
  # Dependencies do not determine whether the package is a Forge app.
  - |
    {"dependencies":{"@forge/api":"^4.0.0"},"scripts":{"check":"run-p 'check:*'"}}
invalid:
  - |
    {"scripts":{"build":"tsc"}}
  - |
    {"scripts":{"check":"lefthook run pre-push"}}
  - |
    {"scripts":{"check":"lefthook run pre-push --force"}}
  - |
    {"scripts":{"check":"lefthook run pre-push -f"}}
  - |
    {"scripts":{"check":"npm run format:check && npm run typecheck && npm run lint && npm run test"}}
  - |
    {"scripts":{"check":"tsc --noEmit"}}
  - |
    {"scripts":{"check":"run-s 'check:*'"}}
  - |
    {"scripts":{"check":"echo run-p 'check:*'"}}
  - |
    {"scripts":{"check":"run-parallel 'check:*'"}}
  - |
    {"scripts":{"check":"run-p"}}
  - |
    {"scripts":{"check":"run-p   "}}
  # Only the root scripts object may satisfy the rule.
  - |
    {"check":"run-p 'check:*'"}
  - |
    {"config":{"scripts":{"check":"run-p 'check:*'"}}}
  - |
    {"scripts":{"other":{"check":"run-p 'check:*'"}}}
