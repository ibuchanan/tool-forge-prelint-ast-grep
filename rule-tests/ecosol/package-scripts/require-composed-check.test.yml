id: require-composed-check
valid:
  # Read-only check tasks can be selected by a quoted glob.
  - |
    {"scripts":{"check":"run-p --npm-path npm --print-label \"check:*\""}}
  - |
    {"scripts":{"check":"run-p --print-label --npm-path npm '*:check'"}}
  # Explicit task lists and optional runner flags are supported too.
  - |
    {"scripts":{"check":"run-p format:check typecheck lint test"}}
  - |
    {"scripts":{"check":"run-p 'check:*' --print-label"}}
  - |
    {"scripts":{"check":"  run-p   'check:*'"}}
  # Pinned brace selection preserves optional tasks, including an absent pack:check.
  - |
    {"scripts":{"check":"run-p --npm-path npm --print-label \"{lint,test,size:check,pack:check}\"","lint":"run-p 'lint:check:*'","test":"vitest run","size:check":"size-limit","lint:docs":"markdownlint-cli2"}}
  - |
    {"scripts":{"check":"run-p '{lint,test,size:check,pack:check}' --print-label","lint":"run-p 'lint:check:*'","test":"vitest run","size:check":"size-limit","pack:check":"attw --pack"}}
  - |
    {"scripts":{"check":"  run-p --print-label 'size:check' test lint --npm-path npm","lint":"run-p 'lint:check:*'","test":"vitest run","size:check":"size-limit"}}
  # Dependencies do not determine whether the package is a Forge app.
  - |
    {"dependencies":{"@forge/api":"^4.0.0"},"scripts":{"check":"run-p 'check:*'"}}
invalid:
  - |
    {"scripts":{"check":"run-p build"}}
  - |
    {"scripts":{"check":"run-p lint-extra test size:check","lint":"run-p 'lint:check:*'"}}
  - |
    {"scripts":{"check":"run-p lint test 'size:check:watch'","size:check":"size-limit"}}
  - |
    {"scripts":{"check":"run-p lint test check"}}
  - |
    {"scripts":{"check":"run-p '{lint,test,size:check,pack:check,check}'"}}
  - |
    {"scripts":{"check":"run-p '{lint,test,size:check,pack:check}' lint:fix","lint:fix":"biome lint --write"}}
  - |
    {"scripts":{"check":"run-p lint test format","format":"biome format --write"}}
  - |
    {"scripts":{"check":"run-p lint test '*:fix'"}}
  # Each declared workflow must be covered; pack:check is optional, not required.
  - |
    {"scripts":{"check":"run-p test size:check","lint":"run-p 'lint:check:*'"}}
  - |
    {"scripts":{"check":"run-p lint size:check","test":"vitest run"}}
  - |
    {"scripts":{"check":"run-p lint test","size:check":"size-limit"}}
  - |
    {"scripts":{"check":"run-p lint test size:check","pack:check":"attw --pack"}}
  # Flags alone do not select a verification task.
  - |
    {"scripts":{"check":"run-p --npm-path npm --print-label"}}
  - |
    {"scripts":{"build":"tsc"}}
  - |
    {"scripts":{"check":"lefthook run pre-push"}}
  - |
    {"scripts":{"check":"lefthook run pre-push --force"}}
  - |
    {"scripts":{"check":"lefthook run pre-push -f"}}
  - |
    {"scripts":{"check":"npm run format:check && npm run typecheck && npm run lint && npm run test"}}
  - |
    {"scripts":{"check":"tsc --noEmit"}}
  - |
    {"scripts":{"check":"run-s 'check:*'"}}
  - |
    {"scripts":{"check":"echo run-p 'check:*'"}}
  - |
    {"scripts":{"check":"run-parallel 'check:*'"}}
  - |
    {"scripts":{"check":"run-p"}}
  - |
    {"scripts":{"check":"run-p   "}}
  # Only the root scripts object may satisfy the rule.
  - |
    {"check":"run-p 'check:*'"}
  - |
    {"config":{"scripts":{"check":"run-p 'check:*'"}}}
  - |
    {"scripts":{"other":{"check":"run-p 'check:*'"}}}
