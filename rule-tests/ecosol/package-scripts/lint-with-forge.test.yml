id: lint-with-forge
valid:
  - |
    {"scripts":{"lint:check:forge":"forge lint"}}
  - |
    {"scripts":{"lint:check:forge":"cmd=$(fence-rider lint) && sh -c \"$cmd\" sh"}}
  - |
    {"scripts":{"lint:check:forge":"secretspec run -- forge lint --verbose"}}
  - |
    {"scripts":{"lint:check:forge":"bash scripts/env-var.sh 'forge lint'"}}
invalid:
  # The named task must contain a recognizable lint command.
  - |
    {"scripts":{"lint:check:forge":"echo ready"}}
  - |
    {"scripts":{"lint:check:forge":"my-forge lint && fence-rider linting"}}
  # Unrelated metadata cannot satisfy the script requirement.
  - |
    {"lint:check:forge":"forge lint","scripts":{"build":"tsc"}}
  - |
    {"config":{"scripts":{"lint:check:forge":"fence-rider lint"}}}
  - |
    {"scripts":{"other":{"lint:check:forge":"forge lint"}}}
  - |
    {"scripts":{"build":"tsc"}}
  # Neither a direct aggregate nor the legacy name is selected by lint:check:*.
  - |
    {"scripts":{"lint":"forge lint"}}
  - |
    {"scripts":{"lint:forge":"forge lint"}}
