id: lint-with-forge
valid:
  - |
    {
      "scripts": {
        "lint:forge": "forge lint"
      }
    }
invalid:
  # Missing entirely
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
  # forge lint called directly instead of through the alias
  - |
    {
      "scripts": {
        "lint": "forge lint"
      }
    }
