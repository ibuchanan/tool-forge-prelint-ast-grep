id: require-release-script
valid:
  # Maintained package command from the pinned Drop Calf release capability.
  - |
    { "scripts": { "release": "bash scripts/release.sh" } }
  # Equivalent direct relative path and ordinary spacing still invoke the helper.
  - |
    { "scripts": { "release": "  bash  ./scripts/release.sh  " } }
invalid:
  - |
    { "name": "forge-app" }
  - |
    { "scripts": {} }
  - |
    { "scripts": null }
  - |
    { "scripts": { "release": null } }
  - |
    { "scripts": { "release": ["bash scripts/release.sh"] } }
  - |
    { "scripts": { "release": { "command": "bash scripts/release.sh" } } }
  - |
    { "other": { "scripts": { "release": "bash scripts/release.sh" } } }
  - |
    { "scripts": { "nested": { "release": "bash scripts/release.sh" } } }
  - |
    { "scripts": [{ "release": "bash scripts/release.sh" }] }
  - |
    { "scripts": { "release:prepare": "bash scripts/release.sh" } }
  - |
    { "scripts": { "release": "" } }
  - |
    { "scripts": { "release": "echo Not implemented" } }
  - |
    { "scripts": { "release": "echo bash scripts/release.sh" } }
  - |
    { "scripts": { "release": "echo 'bash scripts/release.sh'" } }
  - |
    { "scripts": { "release": "bash scripts/other.sh" } }
  - |
    { "scripts": { "release": "bash scripts/release.sh.bak" } }
  - |
    { "scripts": { "release": "bash -n scripts/release.sh" } }
  - |
    { "scripts": { "release": "bash -c 'echo scripts/release.sh'" } }
  - |
    { "scripts": { "release": "sh scripts/release.sh" } }
  - |
    { "scripts": { "release": "true # bash scripts/release.sh" } }
  - |
    { "scripts": { "release": "bash scripts/release.sh --help" } }
  - |
    { "scripts": { "release": "bash scripts/release.sh && echo done" } }
