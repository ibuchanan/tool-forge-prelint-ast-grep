id: use-explicit-vitest-watch
valid:
  - |
    {
      "scripts": {
        "test:watch": "vitest watch"
      }
    }
  # --watch flag also counts as explicit
  - |
    {
      "scripts": {
        "test:watch": "vitest --watch"
      }
    }
  # No test:watch script at all - nothing to flag
  - |
    {
      "scripts": {
        "test": "vitest run"
      }
    }
invalid:
  - |
    {
      "scripts": {
        "test:watch": "vitest"
      }
    }
  # Dependencies are irrelevant — this ruleset assumes it only ever runs
  # against a Forge app
  - |
    {
      "dependencies": {
        "@forge/react": "^4.0.0"
      },
      "scripts": {
        "test:watch": "vitest"
      }
    }
