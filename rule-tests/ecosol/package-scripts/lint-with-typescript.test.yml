id: lint-with-typescript
valid:
  - |
    {"scripts":{"lint:check:typecheck":"npm run typecheck"}}
  - |
    {"scripts":{"lint:check:typecheck":"bun run typecheck"}}
  - |
    {"scripts":{"lint:check:typecheck":"  npm   run   typecheck  ","typecheck":"tsc --project tsconfig.typecheck.json --noEmit"}}
invalid:
