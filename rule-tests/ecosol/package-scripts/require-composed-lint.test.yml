id: require-composed-lint
valid:
  - |
    {
      "scripts": {
        "lint": "lefthook run lint"
      }
    }
  # Dependencies are irrelevant — this ruleset assumes it only ever runs
  # against a Forge app
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "lint": "lefthook run lint"
      }
    }
  # Monorepo: package delegates to its own lefthook.yml group
  - |
    {
      "scripts": {
        "lint": "lefthook run lint-github-import"
      }
    }
invalid:
  # Missing entirely
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
  # The old sequential chain is no longer the expected form
  - |
    {
      "scripts": {
        "lint": "npm run lint:prelint && npm run lint:check && npm run lint:forge"
      }
    }
  # Wrong lefthook group name
  - |
    {
      "scripts": {
        "lint": "lefthook run pre-push"
      }
    }
