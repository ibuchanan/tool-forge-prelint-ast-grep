id: require-composed-lint
valid:
  # Not a Forge app (no @forge/api dependency)
  - |
    {
      "dependencies": {
        "express": "^4.18.0"
      }
    }
  # lint composes all three namespaced scripts in order
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "lint": "npm run lint:prelint && npm run lint:check && npm run lint:forge"
      }
    }
invalid:
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      }
    }
  # Missing lint:forge from the chain
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "lint": "npm run lint:prelint && npm run lint:check"
      }
    }
  # Calls forge lint directly instead of the composed chain
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "lint": "npm run lint:prelint && forge lint"
      }
    }
