id: require-clean-script
valid:
  - |
    {"scripts":{"clean":"rm -rf dist"}}
  - |
    {"scripts":{"clean":"  rm  -rf  ./dist/  "}}
  # Cleanup targets and hard-clean composition belong to the app owner.
  - |
    {"scripts":{"clean":"rm -rf ./dist ./src/discourse/api","clean:hard":"npm run clean && rm -rf ./node_modules package-lock.json"}}
  - |
    {"scripts":{"clean":"bash scripts/clean.sh"}}
  - |
    {"scripts":{"clean":"rimraf dist generated"}}
  - |
    {"scripts":{"clean":"run-s clean:build clean:generated"}}
  - |
    {"scripts":{"clean":"rm -rf dist && node scripts/clean.mjs"}}
  # Declaration-only validation does not attempt to prove execution or safety.
  - |
    {"scripts":{"clean":"echo 'nothing to clean'"}}
  - |
    {"scripts":{"clean":"rm -rf node_modules package-lock.json dist"}}
invalid:
  - |
    {"name":"forge-app"}
  - |
    {"scripts":{}}
  - |
    {"scripts":null}
  - |
    {"scripts":{"clean":null}}
  - |
    {"scripts":{"clean":false}}
  - |
    {"scripts":{"clean":["rm -rf dist"]}}
  - |
    {"scripts":{"clean":{"command":"rm -rf dist"}}}
  - |
    {"config":{"scripts":{"clean":"rm -rf dist"}}}
  - |
    {"scripts":{"nested":{"clean":"rm -rf dist"}}}
  - |
    {"scripts":[{"clean":"rm -rf dist"}]}
  - |
    {"scripts":{"clean:hard":"rm -rf dist"}}
  - |
    {"scripts":{"clean":""}}
  - |
    {"scripts":{"clean":"   "}}
  - |
    {"scripts":{"clean":"\t\n\r"}}
  - |
    {"scripts":{"clean":"\u0020\u0009\u000a\u000d"}}
