id: lint-and-format-with-biome
valid:
  - |
    {
      "scripts": {
        "format": "biome format --write .",
        "format:check": "biome format .",
        "lint:check": "biome lint .",
        "lint:fix": "biome lint --write ."
      }
    }
invalid:
  # Missing entirely
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
  # Biome installed but no scripts wired up
  - |
    {
      "devDependencies": {
        "@biomejs/biome": "^1.9.0"
      }
    }
  # Missing lint:fix script
  - |
    {
      "scripts": {
        "format": "biome format --write .",
        "format:check": "biome format .",
        "lint:check": "biome lint ."
      }
    }
  # lint:check script present but does not invoke biome
  - |
    {
      "scripts": {
        "format": "biome format --write .",
        "format:check": "biome format .",
        "lint:check": "eslint .",
        "lint:fix": "biome lint --write ."
      }
    }
