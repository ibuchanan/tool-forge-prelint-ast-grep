id: lint-and-format-with-biome
valid:
  # Not a Forge app (no @forge/api dependency)
  - |
    {
      "dependencies": {
        "express": "^4.18.0"
      }
    }
  # Forge app with all four Biome scripts wired up
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "format": "biome format --write .",
        "format:check": "biome format .",
        "lint:check": "biome lint .",
        "lint:fix": "biome lint --write ."
      }
    }
invalid:
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      }
    }
  # Missing from a frontend-only Forge app (no @forge/api, but @forge/react present)
  - |
    {
      "dependencies": {
        "@forge/react": "^4.0.0"
      }
    }
  # Biome installed but no scripts wired up
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "devDependencies": {
        "@biomejs/biome": "^1.9.0"
      }
    }
  # Missing lint:fix script
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "format": "biome format --write .",
        "format:check": "biome format .",
        "lint:check": "biome lint ."
      }
    }
  # lint:check script present but does not invoke biome
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "format": "biome format --write .",
        "format:check": "biome format .",
        "lint:check": "eslint .",
        "lint:fix": "biome lint --write ."
      }
    }
