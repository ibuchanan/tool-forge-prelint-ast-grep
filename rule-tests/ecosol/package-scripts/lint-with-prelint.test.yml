id: lint-with-prelint
valid:
  # Present, wired to a shipped tier the normal way
  - |
    {
      "scripts": {
        "lint:prelint": "ast-grep scan --config node_modules/tool-forge-prelint-ast-grep/sgconfig.ecosol.yml --globs '!node_modules/**'"
      }
    }
  # Present but misconfigured (that's require-valid-prelint-config's and
  # require-prelint-node-modules-glob's concern, not this rule's)
  - |
    {
      "scripts": {
        "lint:prelint": "ast-grep scan --config sgconfig.yml"
      }
    }
invalid:
  # Missing entirely
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
