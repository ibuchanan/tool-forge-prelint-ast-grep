id: lint-with-prelint
valid:
  # Drop Calf's generated task is selected by lint:check:*.
  - |
    {"scripts":{"lint:check:prelint":"ast-grep scan --globs '!specs/**' --globs '!node_modules/**' --config ./node_modules/@forge-ahead/prelint/sgconfig.ecosol.yml"}}
  # Config and glob correctness belong to the companion rules.
  - |
    {"scripts":{"lint:check:prelint":"ast-grep scan --config sgconfig.yml"}}
invalid:
  - |
    {"scripts":{"build":"tsc"}}
  # The old name is not selected by the new aggregate glob.
  - |
    {"scripts":{"lint:prelint":"ast-grep scan --config sgconfig.ecosol.yml"}}
  # Only a string-valued task in the root scripts object counts.
  - |
    {"lint:check:prelint":"ast-grep scan"}
  - |
    {"config":{"scripts":{"lint:check:prelint":"ast-grep scan"}}}
  - |
    {"scripts":{"other":{"lint:check:prelint":"ast-grep scan"}}}
  - |
    {"scripts":{"lint:check:prelint":false}}
