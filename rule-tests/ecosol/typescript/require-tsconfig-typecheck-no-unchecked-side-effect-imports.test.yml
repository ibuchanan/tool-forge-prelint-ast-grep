id: require-tsconfig-typecheck-no-unchecked-side-effect-imports
valid:
  - |
    {
      "compilerOptions": {
        "noUncheckedSideEffectImports": true
      }
    }
  - |
    {
      "extends": "./tsconfig.json",
      "compilerOptions": {
        "noEmit": true,
        "noUncheckedSideEffectImports": true
      }
    }
invalid:
  # explicitly disabled
  - |
    {
      "compilerOptions": {
        "noUncheckedSideEffectImports": false
      }
    }
  # missing entirely
  - |
    {
      "compilerOptions": {
        "noEmit": true
      }
    }
  # no compilerOptions at all
  - |
    {
      "extends": "./tsconfig.json"
    }
