id: require-lefthook-pre-push-typecheck
valid:
  - |
    pre-push:
      commands:
        format:
          run: npm run format:check
        typecheck:
          run: npm run typecheck
        lint:
          run: npm run lint
        test:
          run: npm run test
  - |
    lint:
      commands:
        prelint:
          run: npm run lint:prelint
        biome:
          run: npm run lint:check
        typecheck:
          run: npm run typecheck

    pre-push:
      commands:
        format:
          run: npm run format:check
        lint:
          run: npm run lint
        test:
          run: npm run test
invalid:
  - |
    pre-push:
      commands:
        format:
          run: npm run format:check
        lint:
          run: npm run lint
        test:
          run: npm run test
  # No pre-push block at all
  - |
    pre-commit:
      commands:
        gitleaks:
          run: gitleaks protect --staged
  # lint group has typecheck, but pre-push never invokes lint
  - |
    lint:
      commands:
        typecheck:
          run: npm run typecheck

    pre-push:
      commands:
        format:
          run: npm run format:check
        test:
          run: npm run test
