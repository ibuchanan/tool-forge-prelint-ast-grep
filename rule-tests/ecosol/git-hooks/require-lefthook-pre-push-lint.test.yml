id: require-lefthook-pre-push-lint
valid:
  - |
    pre-push:
      commands:
        format:
          run: npm run format:check
        typecheck:
          run: npm run typecheck
        lint:
          run: npm run lint
        test:
          run: npm run test
invalid:
  - |
    pre-push:
      commands:
        format:
          run: npm run format:check
        typecheck:
          run: npm run typecheck
        test:
          run: npm run test
  # No pre-push block at all
  - |
    pre-commit:
      commands:
        gitleaks:
          run: gitleaks protect --staged
