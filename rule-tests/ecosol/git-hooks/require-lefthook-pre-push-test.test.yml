id: require-lefthook-pre-push-test
valid:
  - |
    pre-commit:
      commands:
        gitleaks:
          run: gitleaks protect --staged
    pre-push:
      commands:
        test:
          run: npm run test
invalid:
  # pre-commit is complete, but pre-push is missing the test guard
  - |
    pre-commit:
      commands:
        gitleaks:
          run: gitleaks protect --staged
        lint:
          run: npm run lint
        format:
          run: npm run format:check
        typecheck:
          run: npm run typecheck
    pre-push:
      commands:
        build:
          run: npm run build
  # No pre-push block at all
  - |
    pre-commit:
      commands:
        gitleaks:
          run: gitleaks protect --staged
