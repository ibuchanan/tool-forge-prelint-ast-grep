id: use-node-24
valid:
  # The package part of Drop Calf's Node 24 baseline
  - |
    {
      "dependencies": { "@forge/api": "^8.0" },
      "devDependencies": { "@types/node": "24" }
    }
invalid:
  # Type definitions missing
  - |
    { "dependencies": { "@forge/api": "^8.0" }, "devDependencies": {} }
  # Wrong type definitions, even without engines
  - |
    { "devDependencies": { "@types/node": "22" } }
  # Runtime engine declaration conflicts even when type definitions match
  - |
    {
      "devDependencies": { "@types/node": "24" },
      "engines": { "node": "24.x" }
    }
  # A dependency outside devDependencies does not count
  - |
    { "dependencies": { "@types/node": "24" }, "devDependencies": {} }
