id: use-forge-variables-set
valid:
  - |
    {
      "scripts": {
        "forge:variables:set": "source .env && forge variables set --environment \"$FORGE_ENVIRONMENT\""
      }
    }
  # A dedicated script file is an accepted equivalent — repo-init no longer
  # requires calling `forge variables set` directly in package.json
  - |
    {
      "scripts": {
        "forge:variables:set": "node scripts/forge-vars-from-secretspec.js"
      }
    }
  # Dependencies are irrelevant now — this ruleset assumes it only ever runs
  # against a Forge app
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "forge:variables:set": "source .env && forge variables set --environment \"$FORGE_ENVIRONMENT\""
      }
    }
invalid:
  # Present under the wrong key name
  - |
    {
      "scripts": {
        "variables:set": "forge variables set --environment \"$FORGE_ENVIRONMENT\""
      }
    }
  # The separate encrypted-variant naming is now folded into forge:variables:set
  - |
    {
      "scripts": {
        "forge:variables:set-encrypted": "source .env && forge variables set --encrypt --environment \"$FORGE_ENVIRONMENT\""
      }
    }
  # Missing entirely, regardless of dependencies present
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "build": "tsc"
      }
    }
