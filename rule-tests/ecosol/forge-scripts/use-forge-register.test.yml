id: use-forge-register
valid:
  - |
    {
      "scripts": {
        "forge:register": "forge register"
      }
    }
  # Dependencies are irrelevant now — this ruleset assumes it only ever runs
  # against a Forge app
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "forge:register": "forge register"
      }
    }
invalid:
  # Known lifecycle commands must keep their role even under the expected name.
  - |
    {"scripts": {"forge:register": "cmd=$(fence-rider deploy) && sh -c \"$cmd\" sh"}}
  # Present under the wrong key name
  - |
    {
      "scripts": {
        "register": "forge register"
      }
    }
  - |
    {
      "scripts": {
        "forge-register": "forge register"
      }
    }
  # Misnamed Fence Rider (recognized command under wrong role key)
  - |
    {
      "scripts": {
        "fence:register": "fence-rider register"
      }
    }
  # Missing entirely, regardless of dependencies present
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "build": "tsc"
      }
    }
