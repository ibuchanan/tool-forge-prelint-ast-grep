id: use-forge-register
valid:
  - |
    {
      "scripts": {
        "forge:register": "forge register"
      }
    }
  # Dependencies are irrelevant now — this ruleset assumes it only ever runs
  # against a Forge app
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "forge:register": "forge register"
      }
    }
invalid:
  # Present under the wrong key name
  - |
    {
      "scripts": {
        "register": "forge register"
      }
    }
  # Missing entirely, regardless of dependencies present
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "build": "tsc"
      }
    }
