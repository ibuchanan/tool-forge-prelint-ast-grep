id: use-secretspec-for-forge-commands
valid:
  # Forge commands already wrapped with secretspec
  - |
    {
      "scripts": {
        "deploy": "secretspec run -- forge deploy",
        "install": "secretspec run -- forge install"
      }
    }
  # No Forge deploy/install/uninstall/variables-set commands present
  - |
    {
      "scripts": {
        "build": "tsc -p tsconfig.build.json",
        "lint": "forge lint"
      }
    }
invalid:
  - |
    {
      "scripts": {
        "deploy": "forge deploy"
      }
    }
  - |
    {
      "scripts": {
        "install": "forge install"
      }
    }
  - |
    {
      "scripts": {
        "uninstall": "forge uninstall"
      }
    }
  - |
    {
      "scripts": {
        "variables:set": "forge variables set FOO bar"
      }
    }
