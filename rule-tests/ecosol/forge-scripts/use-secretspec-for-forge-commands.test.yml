id: use-secretspec-for-forge-commands
valid:
  # Forge commands already wrapped with secretspec
  - |
    {
      "scripts": {
        "deploy": "secretspec run -- forge deploy",
        "install": "secretspec run -- forge install"
      }
    }
  # Real-world wrapping with extra flags and an sh -c wrapper for quoted env vars
  - |
    {
      "scripts": {
        "forge:deploy": "secretspec run --provider dotenv --reason \"npm run forge:deploy\" -- sh -c 'forge deploy --environment \"$FORGE_ENVIRONMENT\"'",
        "forge:uninstall": "secretspec run --provider dotenv --reason \"npm run forge:uninstall\" -- sh -c 'forge uninstall --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\"'"
      }
    }
  # variable-setting scripts are out of scope for this rule
  - |
    {
      "scripts": {
        "forge:variables:set": "node scripts/forge-vars-from-secretspec.js"
      }
    }
  # No Forge deploy/install/uninstall commands present
  - |
    {
      "scripts": {
        "build": "tsc -p tsconfig.build.json",
        "lint": "forge lint"
      }
    }
invalid:
  - |
    {
      "scripts": {
        "deploy": "forge deploy"
      }
    }
  - |
    {
      "scripts": {
        "install": "forge install"
      }
    }
  - |
    {
      "scripts": {
        "uninstall": "forge uninstall"
      }
    }
