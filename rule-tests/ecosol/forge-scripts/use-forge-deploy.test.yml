id: use-forge-deploy
valid:
  - |
    {
      "scripts": {
        "forge:deploy": "forge deploy --environment \"$FORGE_ENVIRONMENT\""
      }
    }
  - |
    {
      "scripts": {
        "forge:deploy": "source .env && forge deploy --environment \"$FORGE_ENVIRONMENT\""
      }
    }
  # Dependencies are irrelevant now — this ruleset assumes it only ever runs
  # against a Forge app
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "forge:deploy": "forge deploy --environment \"$FORGE_ENVIRONMENT\""
      }
    }
invalid:
  # Known lifecycle commands must keep their role even under the expected name.
  - |
    {"scripts": {"forge:deploy": "cmd=$(fence-rider uninstall) && sh -c \"$cmd\" sh"}}
  # Present under the wrong key name
  - |
    {
      "scripts": {
        "deploy": "forge deploy --environment \"$FORGE_ENVIRONMENT\""
      }
    }
  - |
    {
      "scripts": {
        "forge-deploy": "forge deploy"
      }
    }
  # Missing entirely, regardless of dependencies present
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "build": "tsc"
      }
    }
