id: use-forge-install
valid:
  - |
    {
      "scripts": {
        "forge:install": "forge install --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\" --environment \"$FORGE_ENVIRONMENT\" --non-interactive"
      }
    }
  # forge:upgrade (with --upgrade) should not trigger this rule as a
  # misnamed match (forge:install must still be present separately)
  - |
    {
      "scripts": {
        "forge:upgrade": "source .env && forge install --upgrade --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\" --environment \"$FORGE_ENVIRONMENT\" --non-interactive",
        "forge:install": "forge install --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\" --environment \"$FORGE_ENVIRONMENT\" --non-interactive"
      }
    }
  # Dependencies are irrelevant now — this ruleset assumes it only ever runs
  # against a Forge app
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "forge:install": "forge install --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\" --environment \"$FORGE_ENVIRONMENT\" --non-interactive"
      }
    }
invalid:
  # Present under the wrong key name
  - |
    {
      "scripts": {
        "install": "forge install --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\""
      }
    }
  # Missing entirely, regardless of dependencies present
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "build": "tsc"
      }
    }
