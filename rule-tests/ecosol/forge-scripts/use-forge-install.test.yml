id: use-forge-install
valid:
  # Not a Forge app (no @forge/api dependency) and no forge install script
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
  - |
    {
      "scripts": {
        "forge:install": "forge install --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\" --environment \"$FORGE_ENVIRONMENT\" --non-interactive"
      }
    }
  - |
    {
      "scripts": {
        "forge:upgrade": "source .env && forge install --upgrade --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\" --environment \"$FORGE_ENVIRONMENT\" --non-interactive"
      }
    }
  # Forge app with forge:install correctly present
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "forge:install": "forge install --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\" --environment \"$FORGE_ENVIRONMENT\" --non-interactive"
      }
    }
invalid:
  # Present under the wrong key name
  - |
    {
      "scripts": {
        "install": "forge install --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\""
      }
    }
  # Missing entirely from a Forge app
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "build": "tsc"
      }
    }
