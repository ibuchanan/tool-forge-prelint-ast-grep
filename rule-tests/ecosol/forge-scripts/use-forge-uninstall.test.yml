id: use-forge-uninstall
valid:
  - |
    {
      "scripts": {
        "forge:uninstall": "forge uninstall --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\""
      }
    }
  # Dependencies are irrelevant now — this ruleset assumes it only ever runs
  # against a Forge app
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "forge:uninstall": "forge uninstall --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\""
      }
    }
invalid:
  # Known lifecycle commands must keep their role even under the expected name.
  - |
    {"scripts": {"forge:uninstall": "cmd=$(fence-rider deploy) && sh -c \"$cmd\" sh"}}
  # Present under the wrong key name
  - |
    {
      "scripts": {
        "uninstall": "forge uninstall --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\""
      }
    }
  - |
    {
      "scripts": {
        "forge-uninstall": "forge uninstall --site \"$FORGE_SITE\""
      }
    }
  # Misnamed Fence Rider (recognized command under wrong role key)
  - |
    {
      "scripts": {
        "fence:uninstall": "fence-rider uninstall --site \"$FORGE_SITE\""
      }
    }
  # Missing entirely, regardless of dependencies present
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "build": "tsc"
      }
    }
