id: use-forge-upgrade
valid:
  # Not a Forge app (no @forge/api dependency) and no forge install --upgrade script
  - |
    {
      "scripts": {
        "build": "tsc"
      }
    }
  - |
    {
      "scripts": {
        "forge:upgrade": "source .env && forge install --upgrade --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\" --environment \"$FORGE_ENVIRONMENT\" --non-interactive"
      }
    }
  # forge:install without --upgrade should not trigger this rule
  - |
    {
      "scripts": {
        "forge:install": "forge install --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\" --environment \"$FORGE_ENVIRONMENT\" --non-interactive"
      }
    }
  # Forge app with forge:upgrade correctly present
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "forge:upgrade": "source .env && forge install --upgrade --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\" --environment \"$FORGE_ENVIRONMENT\" --non-interactive"
      }
    }
invalid:
  # Present under the wrong key name
  - |
    {
      "scripts": {
        "upgrade": "forge install --upgrade --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\""
      }
    }
  # Missing entirely from a Forge app
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      },
      "scripts": {
        "build": "tsc"
      }
    }
  # Missing from a Forge app that only depends on @forge/kvs
  - |
    {
      "dependencies": {
        "@forge/kvs": "^2.0.0"
      },
      "scripts": {
        "build": "tsc"
      }
    }
