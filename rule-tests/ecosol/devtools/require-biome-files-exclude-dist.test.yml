id: require-biome-files-exclude-dist
valid:
  - |
    {
      "files": { "includes": ["**", "!dist/**"] }
    }
  # Monorepo: exclude dist at any depth
  - |
    {
      "files": { "includes": ["**", "!**/dist/**"] }
    }
  # Preferred hard exclusion: do not scan generated output at any depth
  - |
    {
      "files": { "includes": ["**", "!!**/dist"] }
    }
  - |
    {
      "files": { "includes": ["**", "!!dist"] }
    }
invalid:
  # Missing files entirely
  - |
    {
      "formatter": { "indentStyle": "space" }
    }
  # dist not excluded from files.includes
  - |
    {
      "files": { "includes": ["**"] }
    }
  # Excluding dist only from a different tool section does not protect scanning
  - |
    {
      "files": { "includes": ["**"] },
      "formatter": { "includes": ["**", "!!**/dist"] }
    }
  # Another key or a partial folder name is not the dist exclusion
  - |
    {
      "files": { "ignoreUnknown": "!!**/dist", "includes": ["**"] }
    }
  - |
    {
      "files": { "includes": ["**", "!!**/dist-backup"] }
    }
