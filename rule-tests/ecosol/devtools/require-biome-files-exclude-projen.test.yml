id: require-biome-files-exclude-projen
valid:
  - |
    {
      "files": { "includes": ["**", "!.projen/**", "!dist/**"] }
    }
invalid:
  # Missing files entirely
  - |
    {
      "formatter": { "indentStyle": "space" }
    }
  # .projen not excluded from files.includes
  - |
    {
      "files": { "includes": ["**", "!dist/**"] }
    }
