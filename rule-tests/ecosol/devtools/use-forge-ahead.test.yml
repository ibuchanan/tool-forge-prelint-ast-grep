id: use-forge-ahead
valid:
  # Not a Forge app (no @forge/api dependency)
  - |
    {
      "dependencies": {
        "express": "^4.18.0"
      }
    }
  # Forge app with both Forge Ahead helper packages already wired up
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0",
        "@forge-ahead/atlassian-api-types": "^1.0.0",
        "@forge-ahead/errors": "^1.0.0"
      }
    }
invalid:
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      }
    }
  # Missing from a Forge app that only depends on @forge/events
  - |
    {
      "dependencies": {
        "@forge/events": "^3.0.0"
      }
    }
  # Missing @forge-ahead/errors
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0",
        "@forge-ahead/atlassian-api-types": "^1.0.0"
      }
    }
  # Missing @forge-ahead/atlassian-api-types
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0",
        "@forge-ahead/errors": "^1.0.0"
      }
    }
