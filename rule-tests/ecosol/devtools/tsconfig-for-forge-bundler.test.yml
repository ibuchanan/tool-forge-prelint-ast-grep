id: tsconfig-for-forge-bundler
valid:
  - |
    {
      "compilerOptions": {
        "module": "ESNext",
        "moduleResolution": "node",
        "jsx": "react-jsx",
        "target": "ES2022",
        "rootDir": "src",
        "outDir": "dist",
        "strict": true,
        "noUncheckedIndexedAccess": true
      },
      "include": ["src"]
    }
invalid:
  # module drifted to CommonJS, rest of the baseline missing
  - |
    {
      "compilerOptions": {
        "module": "CommonJS",
        "target": "ES2022"
      }
    }
  # Missing noUncheckedIndexedAccess only
  - |
    {
      "compilerOptions": {
        "module": "ESNext",
        "moduleResolution": "node",
        "jsx": "react-jsx",
        "target": "ES2022",
        "rootDir": "src",
        "outDir": "dist",
        "strict": true
      }
    }
  # No compilerOptions at all
  - |
    {
      "include": ["src"]
    }
