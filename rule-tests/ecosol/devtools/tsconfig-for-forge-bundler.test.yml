id: tsconfig-for-forge-bundler
valid:
  - |
    {
      "compilerOptions": {
        "module": "ESNext",
        "moduleResolution": "node",
        "jsx": "react-jsx",
        "target": "ES2022",
        "rootDir": "src",
        "outDir": "dist",
        "strict": true,
        "noUncheckedIndexedAccess": true
      },
      "include": ["src"]
    }
  - |
    {
      "$schema": "https://json.schemastore.org/tsconfig",
      "include": ["src"],
      "compilerOptions": {
        "esModuleInterop": true,
        "skipLibCheck": true,
        "target": "ES2022",
        "resolveJsonModule": true,
        "moduleDetection": "force",
        "noEmit": false,
        "outDir": "dist",
        "rootDir": "src",
        "sourceMap": true,
        "moduleResolution": "node",
        "module": "ESNext",
        "strict": true,
        "forceConsistentCasingInFileNames": true,
        "noUncheckedIndexedAccess": true,
        "noImplicitReturns": true,
        "noImplicitThis": true,
        "noImplicitAny": true,
        "strictNullChecks": true,
        "types": ["node"],
        "lib": ["ES2022"],
        "jsx": "react-jsx"
      }
    }
invalid:
  # module drifted to CommonJS, rest of the baseline missing
  - |
    {
      "compilerOptions": {
        "module": "CommonJS",
        "target": "ES2022"
      }
    }
  # Missing noUncheckedIndexedAccess only
  - |
    {
      "compilerOptions": {
        "module": "ESNext",
        "moduleResolution": "node",
        "jsx": "react-jsx",
        "target": "ES2022",
        "rootDir": "src",
        "outDir": "dist",
        "strict": true
      }
    }
  # NodeNext is valid TypeScript, but it is not the deploy-time Forge bundler baseline
  - |
    {
      "compilerOptions": {
        "module": "NodeNext",
        "moduleResolution": "NodeNext",
        "jsx": "react-jsx",
        "target": "ES2022",
        "rootDir": "src",
        "outDir": "dist",
        "strict": true,
        "noUncheckedIndexedAccess": true
      }
    }
  # No compilerOptions at all
  - |
    {
      "include": ["src"]
    }
