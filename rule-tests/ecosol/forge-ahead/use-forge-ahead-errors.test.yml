id: use-forge-ahead-errors
valid:
  # Forge app with shared Forge Ahead errors package
  - |
    {
      "dependencies": {
        "@forge/bridge": "*",
        "@forge/react": "*",
        "@forge/resolver": "*",
        "@forge-ahead/errors": "^1.0.0"
      }
    }
  # API-using Forge app with shared Forge Ahead errors package
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0",
        "@forge-ahead/errors": "^1.0.0"
      }
    }
  # Generated and owner-selected references are not version-pinned.
  - |
    {"dependencies":{"@forge-ahead/errors":"github:ibuchanan/forge-ahead-errors#0.1.0"}}
  - |
    {"dependencies":{"@forge-ahead/errors":"npm:@example/errors@^2"}}
  - |
    {"dependencies":{"@forge-ahead/errors":"file:../errors"}}
invalid:
  # Only a direct entry in root dependencies satisfies this advice.
  - |
    {"@forge-ahead/errors":"^1.0.0"}
  - |
    {"config":{"dependencies":{"@forge-ahead/errors":"^1.0.0"}}}
  - |
    {"dependencies":{"config":{"@forge-ahead/errors":"^1.0.0"}}}
  - |
    {"scripts":{"@forge-ahead/errors":"echo installed"}}
  - |
    {"peerDependencies":{"@forge-ahead/errors":"^1.0.0"}}
  - |
    {"optionalDependencies":{"@forge-ahead/errors":"^1.0.0"}}
  - |
    {"customdependencies":{"@forge-ahead/errors":"^1.0.0"}}
  - |
    {"dependencies":{"@forge-ahead/errors-extra":"^1.0.0"}}
  # A development-only entry is not a production dependency.
  - |
    {"devDependencies":{"@forge-ahead/errors":"^1.0.0"}}
  # Missing entirely — always expected, this tool always scans a Forge app
  - |
    {
      "dependencies": {
        "express": "^4.18.0"
      }
    }
  # Missing from an API-using Forge app
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      }
    }
  # Missing from a frontend/resolver Forge app
  - |
    {
      "dependencies": {
        "@forge/bridge": "*",
        "@forge/react": "*",
        "@forge/resolver": "*"
      }
    }
  # Missing from an event-only Forge app
  - |
    {
      "dependencies": {
        "@forge/events": "^3.0.0"
      }
    }
