id: use-forge-ahead-logging
valid:
  # Forge app with the shared Forge Ahead logging package
  - |
    {
      "dependencies": {
        "@forge/bridge": "*",
        "@forge/react": "*",
        "@forge/resolver": "*",
        "@forge-ahead/logging": "^1.0.0"
      }
    }
  # API-using Forge app with the shared Forge Ahead logging package
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0",
        "@forge-ahead/logging": "^1.0.0"
      }
    }
  # Generated and owner-selected references are not version-pinned.
  - |
    {"dependencies":{"@forge-ahead/logging":"github:ibuchanan/forge-ahead-logging#0.1.0"}}
  - |
    {"dependencies":{"@forge-ahead/logging":"workspace:*"}}
  - |
    {"dependencies":{"@forge-ahead/logging":"https://example.com/logging.tgz"}}
invalid:
  # Only a direct entry in root dependencies satisfies this advice.
  - |
    {"@forge-ahead/logging":"^1.0.0"}
  - |
    {"config":{"dependencies":{"@forge-ahead/logging":"^1.0.0"}}}
  - |
    {"dependencies":{"config":{"@forge-ahead/logging":"^1.0.0"}}}
  - |
    {"scripts":{"@forge-ahead/logging":"echo installed"}}
  - |
    {"peerDependencies":{"@forge-ahead/logging":"^1.0.0"}}
  - |
    {"optionalDependencies":{"@forge-ahead/logging":"^1.0.0"}}
  - |
    {"customdependencies":{"@forge-ahead/logging":"^1.0.0"}}
  - |
    {"dependencies":{"@forge-ahead/logging-extra":"^1.0.0"}}
  # A development-only entry is not a production dependency.
  - |
    {"devDependencies":{"@forge-ahead/logging":"^1.0.0"}}
  # Missing entirely — always expected, this tool always scans a Forge app
  - |
    {
      "dependencies": {
        "express": "^4.18.0"
      }
    }
  # Missing from an API-using Forge app
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0"
      }
    }
  # Missing from a frontend/resolver Forge app
  - |
    {
      "dependencies": {
        "@forge/bridge": "*",
        "@forge/react": "*",
        "@forge/resolver": "*"
      }
    }
  # @forge-ahead/errors is separate and does not satisfy the logging helper
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0",
        "@forge-ahead/errors": "^1.0.0"
      }
    }
