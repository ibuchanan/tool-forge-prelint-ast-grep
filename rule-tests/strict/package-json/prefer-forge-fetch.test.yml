id: prefer-forge-fetch
valid:
  # Flagged libraries are fine in devDependencies
  - |
    {
      "devDependencies": {
        "node-fetch": "^3.0.0",
        "axios": "^1.0.0"
      }
    }
  # Safe production dependencies
  - |
    {
      "dependencies": {
        "@forge/api": "^4.0.0",
        "express": "^4.18.0"
      }
    }
  # Partial name matches should not fire
  - |
    {
      "dependencies": {
        "node-fetch-native": "^1.0.0",
        "axios-mock-adapter": "^1.0.0"
      }
    }
invalid:
  - |
    {
      "dependencies": {
        "node-fetch": "^3.3.2"
      }
    }
  - |
    {
      "dependencies": {
        "axios": "^1.6.0"
      }
    }
  - |
    {
      "dependencies": {
        "got": "^13.0.0"
      }
    }
  - |
    {
      "dependencies": {
        "form-data": "^4.0.0"
      }
    }
  - |
    {
      "dependencies": {
        "superagent": "^9.0.0"
      }
    }
  - |
    {
      "dependencies": {
        "abort-controller": "^3.0.0"
      }
    }
