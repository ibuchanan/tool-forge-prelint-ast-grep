id: no-frontend-escape-imports-tsx
valid:
  # relative import within frontend — stays inside
  - "import { MyComponent } from './components'"
  # util is the allowed exception
  - "import { formatDate } from '../util'"
  - "import { formatDate } from '../util/date'"
invalid:
  # backend external module
  - "import { callExternal } from '../external'"
  # escaping two levels to resolvers
  - "import { handler } from '../../resolvers'"
