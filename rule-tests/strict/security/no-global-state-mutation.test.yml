id: no-global-state-mutation
valid:
  - "const requestId = globalThis.crypto.randomUUID()"
  - "const tenantId = process.env.TENANT_ID"
  - "process.env.NODE_ENV = 'production'"
  - "const env = {}; env.TENANT_ID = context.cloudId"
  - "const globalState = {}; globalState.cache = {}"
  - |
    export async function handler(context) {
      const cache = {};
      cache[context.cloudId] = {};
    }
invalid:
  - "globalThis.cache = {}"
  - "global.cache ??= {}"
  - "globalThis.cache.set(context.cloudId, user)"
  - "globalThis.count++"
  - "delete global.cache"
  - "globalThis['cache'] = {}"
  - "process.env.TENANT_ID = context.cloudId"
  - "process.env['TENANT_ID'] = context.cloudId"
  - "process.env['NODE_ENV'] = 'production'"
