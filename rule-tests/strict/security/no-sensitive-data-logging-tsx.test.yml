id: no-sensitive-data-logging-tsx
valid:
  - "console.log('token count:', count)"
  - "console.info('metadata', { tokenCount: 1 })"
  - "logger.info('secret redacted', redact(token))"
  - "console.log({token: redact(token)})"
  - console.log(() => token)
  - console.log(user.tokenCount)
  - audit.info(token)
  - "console.log('password')"
  - "console.log({tokenCount:1, status:'token expired'})"
  - "console.log(otherheaders.get('authorization'))"
  - "console.log({count: token.length})"
  - "console.log({get value(){ return token }})"
  - "console.log(JSON.stringify({token: redact(token)}))"
  - "console.log({publicValue: redact(user.token)})"
  - "console.log(JSON.stringify(credentials, redact))"
  - "console.log({value: object[token]})"
  - "console.log(JSON.stringify({length: token.length}, null, 2))"
  - "console.log(JSON.stringify({value(){return token}}))"
  - "console.log(`count: ${token.length}`)"
  - 'console.log({value: sanitize(headers.get("authorization"))})'
invalid:
  - "console.log('password:', password)"
  - "console.log('token', accessToken)"
  - "console.warn('api key is', apiKey)"
  - "console.error('secret value', secretValue)"
  - "console.debug('credentials', credentials)"
  - "logger.info('request', request.headers.authorization)"
  - "log.warn(headers['Authorization'])"
  - "logger.error(headers.get('authorization'))"
  - console.log(user.accessToken)
  - "console.log({key: token})"
  - "console.log({token})"
  - "console.log([password])"
  - console.error(JSON.stringify(credentials))
  - "logger.info(request.headers.get('Authorization'))"
  - "console.log(JSON.stringify({nested: {accessToken}}))"
  - "logger.info(JSON.stringify({authorization: headers.get('authorization')}))"
  - "console.log(`credential: ${accessToken}`)"
  - 'console.log("credential: " + accessToken)'
  - "console.log(user['refreshToken'])"
  - "console.log([{secret: user.clientSecret}])"
  - "console.log(JSON.stringify({token}, null, 2))"
  - "console.log({serialized: JSON.stringify({token})})"
  - "console.log(JSON.stringify(credentials, null))"
  - 'console.log(`header: ${headers.get("authorization")}`)'
