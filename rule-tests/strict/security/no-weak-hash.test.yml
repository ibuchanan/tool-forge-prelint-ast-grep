id: no-weak-hash
valid:
  - "import crypto from 'crypto'; crypto.createHash('sha256')"
  - "import crypto from 'crypto'; crypto.createHash('sha384')"
  - "import crypto from 'crypto'; crypto.createHash('sha512')"
  - "crypto.createHash('SHA256')"
  - "const hash = crypto.createHash('sha256'); hash.update('data')"
  - "createHash('sha256')"
  - "const algo = 'md5'; crypto.createHash(algo)"
  - "crypto.createHash('sha256', 'md5')"
  - "// md5 is deprecated in comments only"
  - "const comment = 'sha1 example'"
invalid:
  - "someLib.createHash('md5')"
  - "crypto.createHash('md5')"
  - "crypto.createHash('MD5')"
  - "crypto.createHash('Md5')"
  - "crypto.createHash('sha1')"
  - "crypto.createHash('SHA1')"
  - "crypto.createHash('Sha1')"
  - "createHash('md5')"
  - "createHash('sha1')"
  - "const hash = crypto.createHash('md5'); hash.update('data')"
  - "import {createHash} from 'crypto'; createHash('sha1')"
