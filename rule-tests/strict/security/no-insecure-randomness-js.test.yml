id: no-insecure-randomness-js
valid:
  - "const sessionId = Math.random()"
  - "const token = 'fixed', noise = Math.random()"
  - "const obj = {token: 'fixed', noise: Math.random()}"
  - "const text = 'const token = Math.random()'"
  - "const randomValue = Math.random()"
  - "import crypto from 'crypto'; const token = crypto.randomBytes(16)"
  - "const sessionId = generateSecureId()"
  - "const secret = process.env.SECRET"
  - "const randomSeed = Math.random()"
  - "function compute() { return Math.random() }"
  - "const {token: sessionToken} = config"
  - "// Math.random() used for token in comment"
  - "const data = `seed: ${Math.random()}`"
  - "const x = Math.random(); const token = x"
  - "const obj = { randomVal: Math.random() }"
invalid:
  - "const token = Math.random().toString(36)"
  - "const obj = {'csrfToken': Math.random()}"
  - "const session = `id-${Math.random()}`"
  - "const token = Math.random()"
  - "const TOKEN = Math.random()"
  - "const apiKey = Math.random()"
  - "const secret = Math.random()"
  - "const password = Math.random()"
  - "const passwd = Math.random()"
  - "const nonce = Math.random()"
  - "const salt = Math.random()"
  - "const otp = Math.random()"
  - "const csrf = Math.random()"
  - "token = Math.random()"
  - "const obj = { sessionKey: Math.random() }"
  - "const obj = { csrfToken: Math.random() }"
  - "let refreshToken; refreshToken = Math.random()"
