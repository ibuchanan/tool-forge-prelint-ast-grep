id: review-raw-html-sink-js
valid:
  - node.textContent = text
  - "const html = '<b>text</b>'"
  - "const props = {children: text}"
  - "const view = <div>{text}</div>"
invalid:
  - node.innerHTML = data
  - node.outerHTML = sanitize(data)
  - "node['innerHTML'] = data"
  - "node.insertAdjacentHTML('beforeend', text)"
  - "document.write(a,b)"
  - "const props = {dangerouslySetInnerHTML: {__html: data}}"
  - "const view = <div dangerouslySetInnerHTML={{__html: text}} />"
