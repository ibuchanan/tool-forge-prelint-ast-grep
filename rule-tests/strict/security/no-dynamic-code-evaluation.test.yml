id: no-dynamic-code-evaluation
valid:
  - "setTimeout(() => run(), 100)"
  - "setInterval(function () { run() }, 100)"
  - "setTimeout(run, 100, 'data-not-code')"
  - "function run(setTimeout) { setTimeout('local callback', 100) }"
  - "const setInterval = scheduler; setInterval('local callback', 100)"
  - "obj.setTimeout('not a global timer', 100)"
  - JSON.parse(text)
  - obj.eval(text)
  - obj.Function(text)
  - "function run(eval) { return eval(text) }"
  - const Function = factory; Function(text)
  - "import { evaluate as eval } from 'safe'; eval(text)"
  - "const x = 'eval(code)'"
  - "function eval(code) { return code }; eval(text)"
  - const run = eval => eval(text)
invalid:
  - "setTimeout('run()', 100)"
  - "setInterval('run()', 100)"
  - "setTimeout(`run()`, 100)"
  - "setInterval('run()', 100, value)"
  - eval(code)
  - eval()
  - "Function('a', 'b', code)"
  - "new Function('a', code)"
  - new Function()
  - "function other() { const eval = safe; eval(text) } eval(untrusted)"
  - "import {eval as safeEval} from 'safe'; eval(untrusted)"
