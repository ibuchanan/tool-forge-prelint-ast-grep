id: review-hardcoded-secret-js
valid:
  - "const token = `prefix-${process.env.TOKEN}`"
  - "const token = process.env.TOKEN"
  - "const secret = getSecret()"
  - "const apiKey = config.apiKey"
  - "const data = `prefix-${process.env.SECRET}`"
  - "const password = userInput"
  - "const randomData = 'not_a_secret'"
  - "const config = {auth: computeAuth()}"
  - "const {apiKey} = environment"
  - "const privateKey = fs.readFileSync(keyPath, 'utf8')"
  - "// apiKey = 'hardcoded_value' in comment"
  - "const str = 'password: placeholder'"
invalid:
  - "const token = 'abc123'"
  - "const TOKEN = 'abc123'"
  - "const secret = 'my-secret-key'"
  - "const apiKey = 'sk-1234567890'"
  - "const password = 'P@ssw0rd'"
  - "const passwd = 'insecure'"
  - "const clientSecret = 'secret123'"
  - "const privateKey = '-----BEGIN RSA PRIVATE KEY-----'"
  - "const accessKey = 'AKIAIOSFODNN7EXAMPLE'"
  - "const auth = 'Bearer token123'"
  - "const client_secret = 'mysecret'"
  - "const api_key = 'key123'"
  - "const access_key = 'access123'"
  - "const csrfToken = 'csrf_token_value'"
  - "secret = 'hardcoded_secret'"
  - "const obj = {apiKey: 'key123'}"
  - "const obj = {privateKey: '-----BEGIN-----'}"
  - "const token = `fixed-token`"
  - "const obj = {'api-key': 'fixed-key'}"
  - 'const obj = {"client_secret": `fixed-secret`}'
