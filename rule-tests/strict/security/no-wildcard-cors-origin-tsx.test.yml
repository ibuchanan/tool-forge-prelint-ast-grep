id: no-wildcard-cors-origin-tsx
valid:
  - |
    const headers = {
      'Access-Control-Allow-Origin': 'https://example.atlassian.net'
    };
  - |
    const headers = {
      'Access-Control-Allow-Origin': [allowedOrigin]
    };
invalid:
  - "headers['Access-Control-Allow-Origin'] = '*'"
  - "headers['access-control-allow-origin'] = '*'"
  - |
    const headers = {
      'Access-Control-Allow-Origin': '*'
    };
  - |
    const headers = {
      'Access-Control-Allow-Origin': ['*']
    };
