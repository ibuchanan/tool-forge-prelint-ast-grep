id: no-write-flags-in-readonly-script
valid:
  - |
    {
      "scripts": {
        "lint": "npm run lint:prelint && npm run lint:check && npm run lint:forge",
        "lint:check": "biome lint",
        "lint:fix": "biome lint --write",
        "format:check": "biome format .",
        "format": "biome format --write ."
      }
    }
  - |
    {"scripts":{"lint":"run-p 'lint:check:*'","lint:check:biome":"biome lint","lint:check:format":"npm run format:check","lint:fix":"biome lint --write"}}
invalid:
  - |
    {"scripts":{"lint:check:biome":"biome lint --write"}}
  - |
    {"scripts":{"lint:check:forge":"forge lint --fix"}}
  - |
    {"scripts":{"lint:check:format":"biome format --write"}}
  - |
    {
      "scripts": {
        "lint": "biome lint --write"
      }
    }
  - |
    {
      "scripts": {
        "lint:check": "biome lint --fix"
      }
    }
  - |
    {
      "scripts": {
        "format:check": "biome format --write ."
      }
    }
