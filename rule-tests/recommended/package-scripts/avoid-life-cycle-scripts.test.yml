id: avoid-life-cycle-scripts
valid:
  - |
    {
      "scripts": {
        "build": "tsc -p tsconfig.build.json",
        "test": "vitest run"
      }
    }
  # lefthook install is a known-safe exception
  - |
    {
      "scripts": {
        "prepare": "lefthook install"
      }
    }
  - |
    {
      "scripts": {
        "prepare": "lefthook install || true"
      }
    }
invalid:
  - |
    {
      "scripts": {
        "postinstall": "node scripts/patch-package.js"
      }
    }
  # placeholder alone is no longer exempt; only a bare `lefthook install` is
  - |
    {
      "scripts": {
        "prepare": "echo 'Not implemented'"
      }
    }
  # lefthook install chained with anything else is no longer exempt
  - |
    {
      "scripts": {
        "prepare": "echo 'Not implemented' && lefthook install"
      }
    }
  - |
    {
      "scripts": {
        "preinstall": "npx only-allow npm"
      }
    }
  - |
    {
      "scripts": {
        "prepare": "npm run build"
      }
    }
  - |
    {
      "scripts": {
        "prepublishOnly": "npm run build && npm test"
      }
    }
  - |
    {
      "scripts": {
        "preversion": "npm test"
      }
    }
  - |
    {
      "scripts": {
        "prepublish": "npm run build"
      }
    }
  - |
    {
      "scripts": {
        "publish": "echo done"
      }
    }
  - |
    {
      "scripts": {
        "postpublish": "curl -X POST https://example.com/notify"
      }
    }
