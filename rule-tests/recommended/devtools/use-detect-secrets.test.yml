id: use-detect-secrets
valid:
  # detect-secrets already in devDependencies
  - |
    {
      "name": "my-forge-app",
      "dependencies": { "@forge/api": "^4.0.0" },
      "devDependencies": { "@lirantal/detect-secrets": "^1.0.0" }
    }
  # not a Forge app — no @forge/api trigger
  - |
    {
      "name": "plain-node-app",
      "dependencies": { "express": "^4.18.0" }
    }
  # @forge/api only in devDependencies (e.g. a tooling package) — does not trigger
  - |
    {
      "name": "my-tool",
      "devDependencies": { "@forge/api": "^4.0.0" }
    }
invalid:
  # Forge app with no detect-secrets at all
  - |
    {
      "name": "my-forge-app",
      "dependencies": { "@forge/api": "^4.0.0" },
      "devDependencies": { "@forge/cli": "^10.0.0" }
    }
  # Realistic Forge app package.json
  - |
    {
      "name": "my-forge-app",
      "dependencies": {
        "@forge/api": "^4.0.0",
        "@forge/react": "^10.0.0"
      },
      "devDependencies": {
        "@forge/cli": "^10.0.0",
        "vitest": "^1.0.0"
      }
    }
