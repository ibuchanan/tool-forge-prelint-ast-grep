id: no-package-exports
valid:
  - |
    {
      "dependencies": {
        "@forge/api": "^8.0"
      }
    }
invalid:
  - |
    {
      "exports": {
        ".": {
          "import": "./dist/index.mjs",
          "types": "./dist/index.d.mts"
        }
      },
      "dependencies": {
        "@forge/api": "^8.0"
      }
    }
  # exports is unwanted regardless of what else is in dependencies
  - |
    {
      "exports": {
        ".": {
          "import": "dist/index.mjs"
        }
      },
      "dependencies": {
        "express": "^4.18.0"
      }
    }
