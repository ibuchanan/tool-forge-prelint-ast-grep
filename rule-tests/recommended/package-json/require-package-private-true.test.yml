id: require-package-private-true
valid:
  - |
    {
      "private": true,
      "dependencies": {
        "@forge/api": "^8.0"
      }
    }
invalid:
  - |
    {
      "license": "Apache-2.0",
      "dependencies": {
        "@forge/api": "^8.0"
      }
    }
  # Missing private, no @forge dependency either — this app should still be private
  - |
    {
      "dependencies": {
        "express": "^4.18.0"
      }
    }
