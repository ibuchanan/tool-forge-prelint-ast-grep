id: no-package-types
valid:
  - |
    {
      "dependencies": {
        "@forge/api": "^8.0"
      }
    }
invalid:
  - |
    {
      "types": "dist/index.d.mts",
      "dependencies": {
        "@forge/api": "^8.0"
      }
    }
  # types is unwanted regardless of what else is in dependencies
  - |
    {
      "types": "dist/index.d.ts",
      "dependencies": {
        "express": "^4.18.0"
      }
    }
