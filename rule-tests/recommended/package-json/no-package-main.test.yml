id: no-package-main
valid:
  - |
    {
      "dependencies": {
        "@forge/api": "^8.0"
      }
    }
invalid:
  - |
    {
      "main": "dist/index.mjs",
      "dependencies": {
        "@forge/api": "^8.0"
      }
    }
  # main is unwanted regardless of what else is in dependencies
  - |
    {
      "main": "dist/index.js",
      "dependencies": {
        "express": "^4.18.0"
      }
    }
