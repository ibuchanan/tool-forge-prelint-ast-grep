id: use-tsconfig-skip-lib-check
valid:
  - |
    {
      "compilerOptions": {
        "skipLibCheck": true,
        "target": "ES2022"
      }
    }
  - |
    {
      "compilerOptions": {
        "target": "ES2022",
        "module": "CommonJS",
        "strict": true,
        "esModuleInterop": true,
        "skipLibCheck": true,
        "forceConsistentCasingInFileNames": true
      }
    }
invalid:
  # skipLibCheck missing entirely
  - |
    {
      "compilerOptions": {
        "target": "ES2022"
      }
    }
  # no compilerOptions at all
  - |
    {
      "include": ["src"]
    }
