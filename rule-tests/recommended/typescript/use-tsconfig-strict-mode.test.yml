id: use-tsconfig-strict-mode
valid:
  - |
    {
      "compilerOptions": {
        "strict": true,
        "target": "ES2022"
      }
    }
  - |
    {
      "compilerOptions": {
        "target": "ES2022",
        "module": "CommonJS",
        "strict": true,
        "esModuleInterop": true,
        "skipLibCheck": true,
        "forceConsistentCasingInFileNames": true
      }
    }
  # extends a shared base config: strict may be inherited, can't verify
  - |
    {
      "extends": "./tsconfig.base.json",
      "compilerOptions": {
        "rootDir": "src"
      }
    }
invalid:
  # strict missing entirely
  - |
    {
      "compilerOptions": {
        "target": "ES2022"
      }
    }
  # no compilerOptions at all
  - |
    {
      "include": ["src"]
    }
