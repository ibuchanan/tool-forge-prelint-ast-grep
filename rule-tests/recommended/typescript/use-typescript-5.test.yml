id: use-typescript-5
valid:
  # TypeScript isn't required at all
  - |
    {
      "dependencies": {
        "@forge/api": "^8.0"
      }
    }
  # Pinned to typescript 5
  - |
    {
      "dependencies": {
        "@forge/api": "^8.0"
      },
      "devDependencies": {
        "typescript": "^5.9"
      }
    }
invalid:
  - |
    {
      "dependencies": {
        "@forge/api": "^8.0"
      },
      "devDependencies": {
        "typescript": "^4.9"
      }
    }
  - |
    {
      "dependencies": {
        "@forge/api": "^8.0"
      },
      "devDependencies": {
        "typescript": "^6.0"
      }
    }
