id: no-forge-jsx-override-mismatch
valid:
  - |
    {
      "compilerOptions": {
        "jsx": "react-jsx",
        "target": "ES2022"
      }
    }
  - |
    {
      "compilerOptions": {
        "target": "ES2022",
        "module": "CommonJS",
        "jsx": "react-jsx",
        "sourceMap": true
      }
    }
invalid:
  # jsx set to the legacy UI Kit 1 (@forge/ui) value
  - |
    {
      "compilerOptions": {
        "jsx": "react"
      }
    }
  # jsx missing entirely
  - |
    {
      "compilerOptions": {
        "target": "ES2022"
      }
    }
  # no compilerOptions at all
  - |
    {
      "include": ["src"]
    }
