id: require-tsconfig-module-resolution-node
valid:
  - |
    {
      "compilerOptions": {
        "moduleResolution": "Node"
      }
    }
  - |
    {
      "compilerOptions": {
        "module": "CommonJS",
        "moduleResolution": "Node",
        "target": "ES2022",
        "lib": ["ES2022"]
      }
    }
  # extends a shared base config: moduleResolution may be inherited, can't verify
  - |
    {
      "extends": "./tsconfig.base.json",
      "compilerOptions": {
        "rootDir": "src"
      }
    }
invalid:
  # moduleResolution drifted to bundler
  - |
    {
      "compilerOptions": {
        "moduleResolution": "bundler"
      }
    }
  # moduleResolution missing entirely
  - |
    {
      "compilerOptions": {
        "target": "ES2022"
      }
    }
  # no compilerOptions at all
  - |
    {
      "include": ["src"]
    }
