id: no-forge-jsx-factory-override-mismatch
valid:
  - |
    {
      "compilerOptions": {
        "jsx": "react-jsx",
        "target": "ES2022"
      }
    }
  - |
    {
      "compilerOptions": {
        "target": "ES2022",
        "module": "CommonJS",
        "jsx": "react-jsx",
        "sourceMap": true
      }
    }
  # no compilerOptions at all
  - |
    {
      "include": ["src"]
    }
invalid:
  # jsxFactory left over from the deprecated @forge/ui (UI Kit 1) framework
  - |
    {
      "compilerOptions": {
        "jsx": "react-jsx",
        "jsxFactory": "ForgeUI.createElement"
      }
    }
  # jsxFactory set to any other value is still a stale pragma
  - |
    {
      "compilerOptions": {
        "jsxFactory": "React.createElement"
      }
    }
  # jsxFragmentFactory alone is also stale
  - |
    {
      "compilerOptions": {
        "jsx": "react-jsx",
        "jsxFragmentFactory": "Fragment"
      }
    }
