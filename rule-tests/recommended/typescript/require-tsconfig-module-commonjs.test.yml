id: require-tsconfig-module-commonjs
valid:
  - |
    {
      "compilerOptions": {
        "module": "CommonJS"
      }
    }
  - |
    {
      "compilerOptions": {
        "module": "CommonJS",
        "moduleResolution": "Node",
        "target": "ES2022",
        "lib": ["ES2022"]
      }
    }
  # extends a shared base config: module may be inherited, can't verify
  - |
    {
      "extends": "./tsconfig.base.json",
      "compilerOptions": {
        "rootDir": "src"
      }
    }
invalid:
  # module drifted to ESNext
  - |
    {
      "compilerOptions": {
        "module": "ESNext"
      }
    }
  # module missing entirely
  - |
    {
      "compilerOptions": {
        "target": "ES2022"
      }
    }
  # no compilerOptions at all
  - |
    {
      "include": ["src"]
    }
