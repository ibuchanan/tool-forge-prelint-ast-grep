id: review-llm-call-in-loop-js
valid:
  - "import {chat} from '@forge/llm'; await chat(prompt)"
  - "for(const x of items){chat(prompt)}"
  - "import {list as chat} from '@forge/llm'; for(const x of items){chat()}"
  - "import {chat} from 'other'; items.map(x=>chat(x))"
  - "import {chat} from '@forge/llm'; for(const x of items){ const later=()=>chat(prompt) }"
  - "import {chat} from '@forge/llm'; items.map(x=>()=>chat(x))"
  - "import {chat} from '@forge/llm'; once(()=>chat(prompt))"
  - "import {chat} from '@forge/llm'; items.reduce((p,x)=>p, ()=>chat(prompt))"
  - "import {chat} from '@forge/llm'; for(const x of items){setTimeout(()=>chat(prompt), 1)}"
  - "import {chat} from '@forge/llm'; items.map(x=>({run(){return chat(x)}}))"
  - "import * as sdk from 'other'; for(const x of items){sdk.chat(x)}"
invalid:
  - "import {chat} from '@forge/llm'; for(const item of items){await chat(prompt)}"
  - "import {stream as infer} from '@forge/llm'; while(remaining){infer(prompt)}"
  - "import * as llm from '@forge/llm'; items.map(async x=>llm.chat(x))"
  - "import {chat} from '@forge/llm'; items.forEach(function(x){chat(x)})"
  - "import {chat} from '@forge/llm'; do {await chat(prompt)} while(next)"
  - "import {chat} from '@forge/llm'; for(let i=0;i<3;i++){chat(prompt)}"
  - "import {chat} from '@forge/llm'; items.reduce(async (p,x)=>chat(x), initial)"
  - "import {chat} from '@forge/llm'; async function run(){for await(const x of items){await chat(x)}}"
  - "import {stream as run} from '@forge/llm'; for(const key in items){run(key)}"
  - "import {chat} from '@forge/llm'; items.flatMap(x=>chat(x))"
