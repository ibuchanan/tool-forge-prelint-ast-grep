id: lint-with-prelint
language: Json
severity: info
message: >
  Forge Prelint checks Forge code for unsavory patterns before deploy
note: >
  Forge Prelint adds a range of rules,
  many of which should not block deployment.
  It is based on ast-grep to avoid dev dependency bloat,
  to make rules & sets easy to improve,
  and to run fast. Pass --globs '!node_modules/**' so ast-grep does not
  descend into vendored packages.
  https://github.com/ibuchanan/tool-forge-prelint-ast-grep
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      stopBy: end
      kind: pair
      regex: '"lint:prelint"\s*:\s*"ast-grep scan --config node_modules/tool-forge-prelint-ast-grep/sgconfig\.(recommended|strict|ecosol|atlassian)\.yml --globs ''!node_modules/\*\*''"'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
