id: lint-with-prelint
language: Json
severity: info
message: >
  Add a `lint:prelint` script to run Forge Prelint before deploy.
note: >
  Forge Prelint adds a range of rules,
  many of which should not block deployment.
  It is based on ast-grep to avoid dev dependency bloat,
  to make rules & sets easy to improve,
  and to run fast.
  Wire it into your `lint` script so it runs on every check.
  https://github.com/ibuchanan/tool-forge-prelint-ast-grep
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      stopBy: end
      kind: pair
      regex: '^"lint:prelint"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
