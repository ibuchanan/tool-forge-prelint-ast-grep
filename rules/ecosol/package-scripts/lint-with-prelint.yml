id: lint-with-prelint
language: Json
severity: info
message: >
  Forge Prelint checks Forge code for unsavory patterns before deploy
note: >
  Forge Prelint adds a range of rules,
  many of which should not block deployment.
  It is based on ast-grep to avoid dev dependency bloat,
  to make rules & sets easy to improve,
  and to run fast.
  https://github.com/ibuchanan/tool-forge-prelint-ast-grep
rule:
  all:
    - kind: string_content
      regex: "^@forge/(api|react|bridge|kvs|events|resolver)$"
      inside:
        stopBy: end
        kind: pair
        regex: '"dependencies"\s*:'
    - not:
        inside:
          stopBy: end
          kind: object
          has:
            kind: pair
            regex: '"lint:prelint"\s*:\s*"ast-grep scan --config node_modules/tool-forge-prelint-ast-grep/sgconfig\.(recommended|strict|ecosol|atlassian)\.yml"'
files:
  - "**/package.json"
