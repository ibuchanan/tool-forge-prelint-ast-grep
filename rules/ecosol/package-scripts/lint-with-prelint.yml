id: lint-with-prelint
language: Json
severity: info
message: >
  Add a `lint:check:prelint` script so the parallel lint workflow runs Forge Prelint.
note: >
  Forge Prelint provides fast AST-based checks, including advisory findings
  that should not block deployment. Drop Calf's lint capability runs
  `lint:check:*` scripts in parallel, so name this task `lint:check:prelint`;
  the legacy `lint:prelint` name is not selected by that glob.
  This rule checks for a string-valued task in the root scripts object,
  not its command body or inclusion in an explicit lint task list.
  https://github.com/ibuchanan/tool-forge-prelint-ast-grep
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '^"scripts"\s*:'
      has:
        kind: object
        has:
          kind: pair
          regex: '^"lint:check:prelint"\s*:'
          has:
            field: value
            kind: string
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references: ["https://github.com/ibuchanan/tool-forge-prelint-ast-grep"]
  category: package-scripts
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests distinguish a root scripts.lint:check:prelint string from legacy names, misplaced keys and non-string values, accepting different config text. The matcher does not validate the command body or orchestration; equivalent enforcement outside this wrapper remains an assessment gap. Evidence: rule-tests/ecosol/package-scripts/lint-with-prelint.test.yml (valid/invalid) and rule-tests/__snapshots__/lint-with-prelint-snapshot.yml."
  impact: low
  impact-rationale: The repository describes Prelint as an additional local/CI check, including advisory findings. Missing its preferred wrapper reduces discoverability and feedback consistency; it does not establish an actual unsafe or broken app.
