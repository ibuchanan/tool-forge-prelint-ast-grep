id: no-invalid-script-name-chars
language: Json
severity: hint
message: >
  Use the colon-namespaced script name instead of a hyphenated or mixed-case variant.
note: >
  Standard script variants use a colon namespace
  (lint:check, lint:fix, lint:prelint, lint:forge, format:check, test:watch, test:coverage).
  Hyphenated look-alikes or mixed-case, space, or underscore names
  usually mean a script was added by hand without matching the established convention.
  https://docs.npmjs.com/cli/v10/using-npm/scripts
rule:
  any:
    - kind: pair
      regex: '^"(lint-check|lint-fix|lint-prelint|lint-forge|format-check|test-watch|test-coverage)"\s*:'
      inside:
        stopBy: end
        kind: pair
        regex: '"scripts"\s*:'
    - kind: pair
      regex: '^"[^"]*[A-Z_ ][^"]*"\s*:'
      inside:
        stopBy: end
        kind: pair
        regex: '"scripts"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references: ["https://docs.npmjs.com/cli/v10/using-npm/scripts"]
  category: package-scripts
  precision: high
  scope-profile: [package-json, tests]
  precision-rationale: "Tests flag the enumerated hyphenated variants and uppercase, spaces or underscores within scripts while accepting colon namespaces and unrelated db-migrate. This directly detects the team's naming convention, not npm-invalid characters; deeper non-string script structures remain an assessment gap. Evidence: rule-tests/ecosol/package-scripts/no-invalid-script-name-chars.test.yml (valid/invalid) and rule-tests/__snapshots__/no-invalid-script-name-chars-snapshot.yml."
  impact: low
  impact-rationale: npm supports named package scripts; consistent colon namespaces improve local discovery and composition. Departures cause bounded maintenance friction, not invalid npm syntax, deployment failure or security impact.
