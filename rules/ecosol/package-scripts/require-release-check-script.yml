id: require-release-check-script
language: Json
severity: info
message: >
  Set `scripts.release:check` to a non-placeholder validation command; retain your owner-defined checks.
note: >
  Drop Calf seeds test followed by typecheck for Forge apps and preserves owner
  checks on update. This checks only a direct root script string, not the selected
  tasks or their success. Library pack checks and the seeded command text are not
  required. Echo/printf, shell no-op/exit commands and placeholder starts are not
  recognized validation entrypoints; equivalent wrappers or logging-first checks
  need review and suppression. Shell syntax, escaped JSON, task existence, helper
  existence, worktree cleanliness and atomic publication are not validated.
  Scope this ecosol convention to Forge-app package.json files.
  https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/release.ts
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      has:
        field: key
        regex: '^"scripts"$'
      all:
        - has:
            field: value
            kind: object
            has:
              kind: pair
              has:
                field: key
                regex: '^"release:check"$'
              all:
                - has:
                    field: value
                    kind: string
                    all:
                      - regex: '^"[ \t]*[A-Za-z0-9_./-]'
                      - not:
                          regex: '^"[ \t]*(?:(?:echo|printf|true|false|exit)(?:[ \t;&|]|")|(?i:todo|not[ \t]+(?:yet[ \t]+)?implemented|placeholder)(?:[ \t:!;&|]|"))'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references:
    - https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/release.ts
  tags: [capability:release]
  category: package-scripts
  precision: medium
  precision-rationale: "Bounded entrypoint-text screen preserves owner commands without proving execution or shell semantics; logging-first checks and escaped JSON need review. Evidence: rule-tests/ecosol/package-scripts/require-release-check-script.test.yml and rule-tests/__snapshots__/require-release-check-script-snapshot.yml."
  impact: low
  impact-rationale: A missing or inert preferred validation entrypoint needs bounded workflow repair; no failed checks or unsafe release is inferred.
  scope-profile: [package-json, tests]
