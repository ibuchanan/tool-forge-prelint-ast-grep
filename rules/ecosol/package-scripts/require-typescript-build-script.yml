id: require-typescript-build-script
language: Json
severity: warning
message: >
  Set `scripts.build` to compile TypeScript with `tsc --project tsconfig.json` (or `tsconfig.build.json`).
note: >
  Drop Calf enforces `tsc --project tsconfig.json` for Forge apps. The older
  Forge-app fixture compiles with `tsc -p tsconfig.build.json`. Both create
  output for `size:check`, which invokes the build before measuring bundle size.
  Do not use --noEmit in a build script; use the separate typecheck script.
  This checks script text, not the referenced config's emit settings or whether
  compilation succeeds. Scope this ecosol rule to Forge app package.json files.
  TypeScript compiler reference:
  https://www.typescriptlang.org/docs/handbook/compiler-options.html
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '^"scripts"\s*:'
      has:
        kind: object
        has:
          all:
            - kind: pair
            - regex: '^"build"\s*:\s*"tsc\s+(?:--project|-p)\s+tsconfig(?:\.build)?\.json(?:\s|")'
            - not:
                regex: '(?:^|\s)--noEmit(?:\s|")'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references:
    ["https://www.typescriptlang.org/docs/handbook/compiler-options.html"]
  category: package-scripts
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests accept root/build project commands, reject noEmit, lookalike paths, echo and nested scripts. The matcher does not read emit options, resolve configs or permit all equivalent compiler wrappers; those and actual compilation are assessment gaps. Evidence: rule-tests/ecosol/package-scripts/require-typescript-build-script.test.yml (valid/invalid) and rule-tests/__snapshots__/require-typescript-build-script-snapshot.yml."
  impact: medium
  impact-rationale: TypeScript project compilation produces the local artifacts consumed by the team's size/build workflow. Genuine lack of output can block that workflow or leave stale measurement inputs; it is not proof that Forge's separate bundler cannot deploy.
