id: require-lefthook-prepare
language: Json
severity: info
message: >
  Add a `prepare` script that runs `lefthook install` so Git hooks are set up on install.
note: >
  Drop Calf enforces `scripts.prepare: "lefthook install || true"` for Forge apps.
  Accepting `lefthook install` without the fallback also supports repositories
  that want installation failures to fail the package install. This checks the
  script configuration, not whether hooks were installed; package managers can
  skip lifecycle scripts. Scope this ecosol rule to Forge app package.json files.
  Lefthook installation reference:
  https://lefthook.dev/installation/
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '^"scripts"\s*:'
      has:
        kind: object
        has:
          kind: pair
          regex: '^"prepare"\s*:\s*"lefthook install(\s*\|\|\s*true)?"$'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references: ["https://lefthook.dev/installation/"]
  category: package-scripts
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests distinguish a top-level prepare install command with optional fallback from missing, inert and nested entries. Alternative installation workflows can be effective; lifecycle skipping and actual hook installation are unresolved assessment gaps, not facts established by script text. Evidence: rule-tests/ecosol/package-scripts/require-lefthook-prepare.test.yml (valid/invalid) and rule-tests/__snapshots__/require-lefthook-prepare-snapshot.yml."
  impact: low
  impact-rationale: Lefthook installation wires local hooks; genuine absence of the intended setup creates local configuration friction and inconsistent feedback. It does not show that security guards or CI are absent, and a configured prepare command need not execute.
