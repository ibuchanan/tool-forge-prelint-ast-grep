id: require-lefthook-prepare
language: Json
severity: info
message: >
  Run `lefthook install` in `prepare`, directly or through a selected `prepare:hooks` task.
note: >
  Install local Git hooks during package preparation. Accepts a direct
  lefthook install command with optional || true and subsequent && work,
  or run-s from npm-run-all2 selecting prepare:hooks as its first task.
  The selected prepare:hooks script must directly run lefthook install,
  optionally tolerating failure with || true. Runner options --npm-path npm
  and --print-label are supported before task names; task names may be
  unquoted, single-quoted or JSON-escaped double-quoted. Other wrappers,
  aliases, runner options and shell semantics require review or suppression.
  This checks declarations in the same root scripts object, not successful
  hook installation; package managers can skip lifecycle scripts.
  Additional preparation still warrants lifecycle security review.
  Scope this ecosol rule to Forge app package.json files.
  https://lefthook.dev/installation/
  https://github.com/bcomnes/npm-run-all2/blob/HEAD/docs/run-s.md
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '^"scripts"\s*:'
      has:
        kind: object
        any:
          - has:
              kind: pair
              regex: '^"prepare"\s*:\s*"\s*lefthook\s+install(\s*\|\|\s*true)?\s*(&&\s*[^\s"].*)?"$'
          - all:
              - has:
                  kind: pair
                  regex: '^"prepare:hooks"\s*:\s*"\s*lefthook\s+install(\s*\|\|\s*true)?\s*"$'
              - not:
                  has:
                    kind: pair
                    all:
                      - regex: '^"prepare"\s*:'
                      - regex: >-
                          (\s|\\"|')prepare(\s|\\"|'|")
              - has:
                  kind: pair
                  regex: >-
                    ^"prepare"\s*:\s*"\s*run-s\s+(?:(?:--npm-path\s+npm|--print-label)\s+)*(?:prepare:hooks|'prepare:hooks'|\\"prepare:hooks\\")(?:\s+(?:[a-zA-Z0-9_-]+(?::[a-zA-Z0-9_*-]+)*|'[a-zA-Z0-9_-]+(?::[a-zA-Z0-9_*-]+)*'|\\"[a-zA-Z0-9_-]+(?::[a-zA-Z0-9_*-]+)*\\"))*\s*"$
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references:
    - https://lefthook.dev/installation/
    - https://github.com/bcomnes/npm-run-all2/blob/HEAD/docs/run-s.md
  category: package-scripts
  tags: [capability:git-hooks]
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests accept direct installation with optional fallback and subsequent work, or bounded run-s delegation to a same-root prepare:hooks definition. Missing, inert, nested, lookalike and unselected hooks are rejected. Arbitrary shell semantics, wrappers, transitive aliases, task existence beyond prepare:hooks and actual installation remain assessment gaps. Evidence: rule-tests/ecosol/package-scripts/require-lefthook-prepare.test.yml and scripts/check-git-hooks-fixtures.sh."
  impact: low
  impact-rationale: Lefthook installation wires local hooks; genuine absence creates local configuration friction and inconsistent feedback. It does not show that security guards or CI are absent, and a configured prepare command need not execute.
