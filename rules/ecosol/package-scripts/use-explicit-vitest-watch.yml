id: use-explicit-vitest-watch
language: Json
severity: hint
message: >
  Use an explicit watch invocation for test:watch instead of bare `vitest`
note: >
  Bare `vitest` relies on Vitest's implicit watch-mode default, which reads
  ambiguously next to `test: "vitest run"`. repo-init now generates an explicit
  watch invocation (e.g. `vitest watch`) so intent is clear from the command
  alone.
rule:
  all:
    - kind: pair
      regex: '^"test:watch"\s*:\s*"vitest"\s*$'
      inside:
        stopBy: end
        kind: pair
        regex: '"scripts"\s*:'
    - inside:
        stopBy: end
        kind: object
        has:
          kind: pair
          regex: '"@forge/(api|react|bridge|kvs|events|resolver)"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
