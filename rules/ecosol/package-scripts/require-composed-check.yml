id: require-composed-check
language: Json
severity: info
message: >
  Compose the `check` script with `run-p` from `npm-run-all2` to run independent checks in parallel.
note: >
  Compose independent read-only validation scripts with `run-p` from npm-run-all2
  instead of delegating to Lefthook's pre-push hook or repeating a sequential
  `&&` chain. Select scripts explicitly or with a quoted glob such as `check:*`;
  ensure that namespace includes every intended check without selecting `check`
  itself or write-back tasks. Use `--npm-path npm` to select npm explicitly and
  `--print-label` to identify each task's output. Keep dependent build steps
  ordered within their own scripts. Local and CI checks should not depend on
  Git hook file filters or require Lefthook's `--force` flag.
  This rule checks a direct `run-p` command in the root `scripts.check` field,
  not the runner dependency, option validity, task coverage, or shell semantics.
  Scope the scan to Forge app directories: ast-grep cannot establish deployable
  app identity by checking whether manifest.yml exists in another file.
  https://github.com/bcomnes/npm-run-all2/blob/HEAD/docs/run-p.md
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '^"scripts"\s*:'
      has:
        kind: object
        has:
          kind: pair
          regex: '^"check"\s*:\s*"\s*run-p\s+[^\s"]'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references:
    - https://github.com/bcomnes/npm-run-all2/blob/HEAD/docs/run-p.md
  category: package-scripts
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests accept direct run-p commands with quoted globs, explicit tasks, whitespace and varying flags; they reject Lefthook delegation with or without force, sequential chains, lookalikes, bare run-p and misplaced keys. The matcher does not validate runner options, task coverage, dependencies or shell semantics; equivalent orchestration and deployable app identity remain assessment gaps. Evidence: rule-tests/ecosol/package-scripts/require-composed-check.test.yml (valid/invalid) and rule-tests/__snapshots__/require-composed-check-snapshot.yml."
  impact: low
  impact-rationale: npm-run-all2 documents parallel npm-script composition. Genuine duplication can drift and add local maintenance overhead. Sequential or alternate complete checks are not inherently unsafe, and the script text alone does not guarantee task independence or complete validation.
