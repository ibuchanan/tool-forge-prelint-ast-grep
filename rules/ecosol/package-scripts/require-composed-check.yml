id: require-composed-check
language: Json
severity: info
message: >
  Delegate the `check` script to `lefthook run pre-push`
  as a broad guardrail for AI coding agents (if not humans).
note: >
  lefthook.yml's pre-push hook is already the single source of truth
  for which checks must pass and runs them in parallel;
  `npm run check` should reuse it via `lefthook run pre-push`
  instead of re-enumerating the same checks a second time
  (which drifts silently when one list is updated and the other isn't)
  or falling back to a slower sequential `&&` chain.
  Add --force (or -f) so it doesn't skip commands whose file filters don't
  match anything when check runs outside an actual git push, since pre-push
  otherwise skips any command with no matching push files.
  This rule assumes package.json belongs to a Forge app: in a monorepo, a
  workspace root or an internal shared library's package.json will also
  match — even one that imports @forge packages without being deployable
  itself. manifest.yml is the real signal for "is this a Forge app," and
  ast-grep can't check whether that file exists, so scope the scan to your
  Forge app directories rather than the whole monorepo.
  https://lefthook.dev/configuration/
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      stopBy: end
      kind: pair
      regex: '"check"\s*:\s*"lefthook run pre-push(\s+(--force|-f))?"'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
metadata:
  references: ["https://lefthook.dev/configuration/"]
  category: package-scripts
  precision: medium
  scope-profile: [unique]
  scope-rationale: Preserve package.json files with only node_modules excluded; dist, coverage, specs and test-local package scripts stay included unlike the shared baseline. App/workspace identity is unresolved; ticket 08 owns scope normalization.
  precision-rationale: "Tests accept lefthook run pre-push with optional force and flag sequential or wrong-hook alternatives. The matcher accepts absence of force despite the note recommending it and searches descendant keys without verifying scripts placement or hook contents. Equivalent orchestration and app identity remain assessment gaps. Evidence: rule-tests/ecosol/package-scripts/require-composed-check.test.yml (valid/invalid) and rule-tests/__snapshots__/require-composed-check-snapshot.yml."
  impact: low
  impact-rationale: Lefthook documents reusable command groups; genuine duplication can drift and add local maintenance overhead. Sequential or alternate complete checks are not inherently unsafe, and parallel execution is configuration-dependent rather than guaranteed by this script.
