id: require-composed-check
language: Json
severity: info
message: >
  Delegate the `check` script to `lefthook run pre-push`
  as a broad guardrail for AI coding agents (if not humans).
note: >
  lefthook.yml's pre-push hook is already the single source of truth
  for which checks must pass and runs them in parallel;
  `npm run check` should reuse it via `lefthook run pre-push`
  instead of re-enumerating the same checks a second time
  (which drifts silently when one list is updated and the other isn't)
  or falling back to a slower sequential `&&` chain.
  Add --force (or -f) so it doesn't skip commands whose file filters don't
  match anything when check runs outside an actual git push, since pre-push
  otherwise skips any command with no matching push files.
  https://lefthook.dev/configuration/
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      stopBy: end
      kind: pair
      regex: '"check"\s*:\s*"lefthook run pre-push(\s+(--force|-f))?"'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
