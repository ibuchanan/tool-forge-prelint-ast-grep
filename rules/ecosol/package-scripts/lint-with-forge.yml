id: lint-with-forge
language: Json
severity: warning
message: >
  Add a `lint:check:forge` script that runs Forge Lint for platform-specific validation.

note: >
  Forge Lint catches platform-specific errors before deployment.
  Name its wrapper `lint:check:forge` so Drop Calf's parallel `lint:check:*`
  workflow selects it; the legacy `lint:forge` name is not selected.
  This presence check accepts direct Forge lint and Fence Rider lint wrappers;
  use-fence-rider-for-forge-lint separately checks the ecosol resolution convention.
  It recognizes command text, not whether a generated script is actually executed.
  Scope the scan to Forge app directories: a monorepo root or internal shared
  library is not necessarily deployable, and ast-grep cannot check whether
  manifest.yml exists in another file.
  https://developer.atlassian.com/platform/forge/cli-reference/lint/

rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      stopBy: end
      kind: pair
      regex: '^"lint:check:forge"\s*:'
      has:
        field: value
        kind: string
        regex: '(^|[\s"'';&|(])(forge|fence-rider)[ \t]+lint([\s"'';&|)]|$)'
      inside:
        kind: object
        inside:
          kind: pair
          has:
            field: key
            regex: '^"scripts"$'
          inside:
            kind: object
            inside:
              kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  category: package-scripts
  references:
    ["https://developer.atlassian.com/platform/forge/cli-reference/lint/"]
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests accept direct, environment-helper, SecretSpec and guarded Fence Rider lint:check:forge wrappers and reject legacy names, wrong keys, nested scripts and lookalike command names. Command text cannot prove generated-script execution or deployable app identity; separate CI/wrapper workflows remain assessment gaps. Evidence: rule-tests/ecosol/package-scripts/lint-with-forge.test.yml (valid/invalid) and rule-tests/__snapshots__/lint-with-forge-snapshot.yml."
  impact: medium
  impact-rationale: Forge lint documents platform validation that can reveal deployment-blocking errors. Genuine absence of the intended local check delays bounded integration/deployment feedback; this does not prove a security defect or that validation never runs elsewhere.
