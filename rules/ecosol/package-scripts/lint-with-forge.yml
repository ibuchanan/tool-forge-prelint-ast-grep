id: lint-with-forge
language: Json
severity: info
message: >
  Analyze Forge app code for platform-specific errors and rule violations.

note: >
  Forge Lint catches Forge-specific runtime errors. Even though it is required for deployment, frequent checks with Forge Lint ensures security and compliance early. Use an npm wrapper script (lint:forge) for better composability. This presence check accepts direct Forge lint and Fence Rider lint wrappers; use-fence-rider-for-forge-lint separately checks the ecosol resolution convention. It recognizes command text, not whether a generated script is actually executed. This rule assumes package.json belongs to a Forge app: in a monorepo, a workspace root or an internal shared library's package.json will also match — even one that imports @forge packages without being deployable itself. manifest.yml is the real signal for "is this a Forge app," and ast-grep can't check whether that file exists, so scope the scan to your Forge app directories rather than the whole monorepo. https://developer.atlassian.com/platform/forge/cli-reference/lint/

rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      stopBy: end
      kind: pair
      regex: '^"lint:forge"\s*:'
      has:
        field: value
        kind: string
        regex: '(^|[\s"'';&|(])(forge|fence-rider)[ \t]+lint([\s"'';&|)]|$)'
      inside:
        kind: object
        inside:
          kind: pair
          has:
            field: key
            regex: '^"scripts"$'
          inside:
            kind: object
            inside:
              kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
metadata:
  category: package-scripts
  references:
    ["https://developer.atlassian.com/platform/forge/cli-reference/lint/"]
  precision: medium
  scope-profile: [unique]
  scope-rationale: Preserve package.json files with only node_modules excluded; dist, coverage, specs and test-local package scripts stay included unlike the shared baseline. App/workspace identity is unresolved; ticket 08 owns scope normalization.
  precision-rationale: "Tests accept direct, SecretSpec and guarded Fence Rider lint wrappers and reject wrong keys, nested scripts and lookalike command names. Command text cannot prove generated-script execution or deployable app identity; separate CI/wrapper workflows remain assessment gaps. Evidence: rule-tests/ecosol/package-scripts/lint-with-forge.test.yml (valid/invalid) and rule-tests/__snapshots__/lint-with-forge-snapshot.yml."
  impact: medium
  impact-rationale: Forge lint documents platform validation that can reveal deployment-blocking errors. Genuine absence of the intended local check delays bounded integration/deployment feedback; this does not prove a security defect or that validation never runs elsewhere.
