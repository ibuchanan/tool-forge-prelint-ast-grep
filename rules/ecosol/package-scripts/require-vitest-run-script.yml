id: require-vitest-run-script
language: Json
severity: warning
message: >
  Set `scripts.test` to `vitest run` so tests finish in hooks and CI.
note: >
  Drop Calf enforces `vitest run --passWithNoTests` for Forge apps. The older
  Forge-app fixture uses `vitest run` without that optional flag. Bare `vitest`
  and `vitest watch` can stay running rather than finish in a pre-push hook.
  This checks the package.json script text, not whether the command succeeds.
  Scope this ecosol rule to Forge app package.json files.
  Vitest CLI reference:
  https://vitest.dev/guide/cli.html
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '^"scripts"\s*:'
      has:
        kind: object
        has:
          all:
            - kind: pair
            - regex: '^"test"\s*:\s*"vitest run(?:\s|")'
            - not:
                regex: '\s(?:--watch(?:=true|\s+true)?|-w)(?:\s|")'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references: ["https://vitest.dev/guide/cli.html"]
  category: package-scripts
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests accept run with optional flags and reject watch modes, echo, lookalike runner and nested scripts. Equivalent wrappers and environment-dependent bare Vitest defaults remain assessment gaps; script text does not establish success or whether tests exist. Evidence: rule-tests/ecosol/package-scripts/require-vitest-run-script.test.yml (valid/invalid) and rule-tests/__snapshots__/require-vitest-run-script-snapshot.yml."
  impact: medium
  impact-rationale: Vitest run provides one-shot execution suitable for hooks/CI. A genuinely interactive command in a noninteractive guard can stall checks and delivery, while missing/alternate scripts require context; no unbounded production resource consumption is inferred.
