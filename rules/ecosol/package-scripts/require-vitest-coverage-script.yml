id: require-vitest-coverage-script
language: Json
severity: info
message: >
  Add a `test:coverage` script that runs `vitest run --coverage`.
note: >
  Drop Calf enforces a Vitest coverage script for Forge apps. Its generated
  command also uses --passWithNoTests, but the coverage check does not require
  that optional flag or its order. This checks package.json script text, not
  whether Vitest's coverage provider is installed or the command succeeds.
  Scope this ecosol rule to Forge app package.json files.
  Vitest coverage reference:
  https://vitest.dev/guide/coverage.html
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '^"scripts"\s*:'
      has:
        kind: object
        has:
          all:
            - kind: pair
            - regex: '^"test:coverage"\s*:\s*"vitest run\s'
            - regex: '\s--coverage(?:\s|")'
            - not:
                regex: '\s--coverage(?:=false|\s+false)(?:\s|")'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: [capability:test]
  references: ["https://vitest.dev/guide/coverage.html"]
  category: package-scripts
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests cover flag ordering, missing/false coverage flags, echo and nested script rejection. Provider installation, successful execution and equivalent wrappers remain assessment gaps; text alone cannot prove coverage collection or its usefulness. Evidence: rule-tests/ecosol/package-scripts/require-vitest-coverage-script.test.yml (valid/invalid) and rule-tests/__snapshots__/require-vitest-coverage-script-snapshot.yml."
  impact: low
  impact-rationale: Vitest documents optional coverage reporting. Missing the team's coverage command reduces local test-observability consistency and adds review friction; coverage absence is not evidence of untested code or a production defect.
