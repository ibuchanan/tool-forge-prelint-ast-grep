id: lint-and-format-with-biome
language: Json
severity: info
message: >
  Biome is a blazing-fast, Rust-based toolchain that unifies linting and formatting
note: >
  Biome reduce dev dep bloat
  and is "batteries included" (zero config) for TypeScript and React.
  Use @biomejs/biome in package scripts for format, format:check, lint:check, and lint:fix.
  https://biomejs.dev/
rule:
  kind: object
  inside:
    kind: document
  any:
    - not:
        has:
          stopBy: end
          kind: pair
          regex: '"format"\s*:\s*"[^"]*biome[^"]*"'
    - not:
        has:
          stopBy: end
          kind: pair
          regex: '"format:check"\s*:\s*"[^"]*biome[^"]*"'
    - not:
        has:
          stopBy: end
          kind: pair
          regex: '"lint:check"\s*:\s*"[^"]*biome[^"]*"'
    - not:
        has:
          stopBy: end
          kind: pair
          regex: '"lint:fix"\s*:\s*"[^"]*biome[^"]*"'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
metadata:
  references: ["https://biomejs.dev/"]
  category: package-scripts
  precision: medium
  scope-profile: [unique]
  scope-rationale: Preserve package.json files with only node_modules excluded; dist, coverage, specs and test-local package scripts stay included unlike the shared baseline. App/workspace identity is unresolved; ticket 08 owns scope normalization.
  precision-rationale: "Tests require four named commands containing biome and reject missing commands or eslint. Descendant regex matches do not establish scripts placement, real invocation or correct flags; equivalent delegated tooling and non-app packages remain assessment gaps. Evidence: rule-tests/ecosol/package-scripts/lint-and-format-with-biome.test.yml (valid/invalid) and rule-tests/__snapshots__/lint-and-format-with-biome-snapshot.yml."
  impact: low
  impact-rationale: Biome provides unified formatting/linting; departing from the team's chosen tool adds local workflow and dependency-maintenance friction. Another functioning formatter/linter is not itself unsafe or a runtime defect.
