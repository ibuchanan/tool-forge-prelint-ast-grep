id: lint-and-format-with-biome
language: Json
severity: info
message: >
  Biome is a blazing-fast, Rust-based toolchain that unifies linting and formatting
note: >
  Biome reduce dev dep bloat
  and is "batteries included" (zero config) for TypeScript and React.
  Use @biomejs/biome in package scripts for format, format:check, lint:check, and lint:fix.
  https://biomejs.dev/
rule:
  kind: object
  inside:
    kind: document
  any:
    - not:
        has:
          stopBy: end
          kind: pair
          regex: '"format"\s*:\s*"[^"]*biome[^"]*"'
    - not:
        has:
          stopBy: end
          kind: pair
          regex: '"format:check"\s*:\s*"[^"]*biome[^"]*"'
    - not:
        has:
          stopBy: end
          kind: pair
          regex: '"lint:check"\s*:\s*"[^"]*biome[^"]*"'
    - not:
        has:
          stopBy: end
          kind: pair
          regex: '"lint:fix"\s*:\s*"[^"]*biome[^"]*"'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
