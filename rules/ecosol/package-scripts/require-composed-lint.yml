id: require-composed-lint
language: Json
severity: info
message: >
  Compose the `lint` script with `run-p` from `npm-run-all2` to run lint checks in parallel.
note: >
  Forge Prelint, Biome, and Forge Lint scan the source tree independently,
  so compose their read-only npm scripts with `run-p` from npm-run-all2
  instead of a sequential `&&` chain or a Lefthook command group.
  Select scripts explicitly or with a quoted glob such as `lint:check:*`;
  ensure that namespace includes every intended lint check and no fix scripts.
  Use `--npm-path npm` to select npm explicitly and `--print-label` to identify
  each task's output. Keep Git hook configuration separate from npm script
  composition so local and CI checks do not depend on hook file filters.
  This rule checks a direct `run-p` command in the root `scripts.lint` field,
  not the runner dependency, option validity, task coverage, or shell semantics.
  Scope the scan to Forge app directories: ast-grep cannot establish deployable
  app identity by checking whether manifest.yml exists in another file.
  https://github.com/bcomnes/npm-run-all2/blob/HEAD/docs/run-p.md
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '^"scripts"\s*:'
      has:
        kind: object
        has:
          kind: pair
          regex: '^"lint"\s*:\s*"\s*run-p\s+[^\s"]'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references:
    - https://github.com/bcomnes/npm-run-all2/blob/HEAD/docs/run-p.md
  category: package-scripts
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests accept direct run-p commands with quoted globs, explicit tasks, whitespace and varying flags; they reject Lefthook delegation, sequential chains, lookalikes, bare run-p and misplaced keys. The matcher does not validate runner options, task coverage, dependencies or shell semantics; equivalent orchestration and deployable app identity remain assessment gaps. Evidence: rule-tests/ecosol/package-scripts/require-composed-lint.test.yml (valid/invalid) and rule-tests/__snapshots__/require-composed-lint-snapshot.yml."
  impact: low
  impact-rationale: npm-run-all2 documents parallel npm-script composition. Genuine divergence adds bounded workflow maintenance or runtime overhead; a sequential complete lint suite is not a security or correctness violation by itself.
