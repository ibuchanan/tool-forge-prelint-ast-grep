id: require-composed-lint
language: Json
severity: info
message: >
  Delegate the `lint` script to `lefthook run lint` to combine general code
  rules with Forge-specific rules.
note: >
  Forge Prelint, Biome, and Forge Lint scan the same source tree independently.
  None depends on another's output or exit order,
  so they can run in parallel instead of a slower sequential `&&` chain.
  A custom `lint` group in lefthook.yml
  (not a git hook, just a named command group)
  is the single source of truth for that enumeration.
  `npm run lint` should reuse it via `lefthook run lint`
  instead of re-listing the same three commands.
  In a monorepo, a package's own package.json may instead delegate to a
  per-package group (e.g. `lefthook run lint-github-import`) that scopes
  the same three commands to that package via lefthook.yml's `root:`.
  This rule also assumes package.json belongs to a Forge app: a workspace
  root or an internal shared library's package.json will also match —
  even one that imports @forge packages without being deployable itself.
  manifest.yml is the real signal for "is this a Forge app," and ast-grep
  can't check whether that file exists, so scope the scan to your Forge
  app directories rather than the whole monorepo.
  See this project's recommended local/CI order:
  https://github.com/ibuchanan/tool-forge-prelint-ast-grep#how-this-fits-with-forge-lint
  https://lefthook.dev/configuration/
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      stopBy: end
      kind: pair
      regex: '"lint"\s*:\s*"lefthook run lint(-[\w-]+)?"'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
