id: typecheck-with-typescript
language: Json
severity: warning
message: >
  Add a `typecheck` script that runs TypeScript without emitting output.
note: >
  TypeScript catches type errors locally
  to prevent sudden, hard-to-debug runtime crashes inside the remote hosting environment.
  Type checking is especially useful for Forge-specific parameters,
  REST API requests & responses,
  and for the mappings from manifest into functions. A conventional
  package-level script is typecheck: "tsc --noEmit"; add an explicit
  -p/--project argument only when the package needs a non-default tsconfig.
  https://www.typescriptlang.org/
rule:
  kind: object
  inside:
    kind: document
  all:
    - has:
        stopBy: end
        kind: pair
        regex: '"dependencies"\s*:'
        has:
          stopBy: end
          kind: string_content
          regex: "^@forge/(api|react|bridge|kvs|events|resolver)$"
    - not:
        has:
          kind: pair
          regex: '"typecheck"\s*:\s*"tsc\b[^"]*--noEmit\b[^"]*"'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
