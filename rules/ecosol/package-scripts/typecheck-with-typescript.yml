id: typecheck-with-typescript
language: Json
severity: warning
message: >
  Add a `typecheck` script that runs TypeScript against tsconfig.typecheck.json
  without emitting output.
note: >
  TypeScript catches type errors locally
  to prevent sudden, hard-to-debug runtime crashes inside the remote hosting environment.
  Type checking is especially useful for Forge-specific parameters,
  REST API requests & responses,
  and for the mappings from manifest into functions. tsconfig.typecheck.json
  carries the exhaustive strict flags beyond the Forge deploy baseline, so
  the typecheck script must point at it explicitly — the conventional
  typecheck: "tsc --noEmit" on its own only checks against the default
  tsconfig.json and misses those flags entirely.
  https://www.typescriptlang.org/
rule:
  kind: object
  inside:
    kind: document
  any:
    - not:
        has:
          kind: pair
          regex: '"typecheck"\s*:\s*"tsc\b[^"]*--noEmit\b[^"]*"'
    - not:
        has:
          kind: pair
          regex: '"typecheck"\s*:\s*"tsc\b[^"]*(-p|--project)\s+tsconfig\.typecheck\.json\b[^"]*"'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: [capability:typescript]
  references:
    - https://www.typescriptlang.org/docs/handbook/compiler-options.html
    - https://www.typescriptlang.org/tsconfig/#noEmit
  category: package-scripts
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests require both noEmit and the typecheck project with either supported project flag/order, rejecting missing or default configs. The matcher is descendant text, not scripts placement or effective compiler options; equivalent inherited noEmit, wrappers and config existence remain assessment gaps. Evidence: rule-tests/ecosol/package-scripts/typecheck-with-typescript.test.yml (valid/invalid) and rule-tests/__snapshots__/typecheck-with-typescript-snapshot.yml."
  impact: medium
  impact-rationale: TypeScript documents project selection and noEmit. Genuine omission of the intended strict check can let actionable type errors reach integration and cause bounded delivery/runtime rework; missing this literal command does not prove crashes or absent validation elsewhere.
