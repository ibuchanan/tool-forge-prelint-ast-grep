id: require-clean-script
language: Json
severity: info
message: >
  Add a non-empty `scripts.clean` command for this app's cleanup workflow.
note: >
  Keep a discoverable cleanup entrypoint in the root scripts object.
  Cleanup targets, wrappers, chained commands and additional clean:* tasks
  are owner-managed; this rule does not prescribe rm, dist-only cleanup or
  reinstall behavior. It checks a string containing a non-whitespace character,
  not whether the command performs cleanup or is safe to execute. Scope this
  ecosol rule to caller-selected Forge-app package.json directories.
  https://docs.npmjs.com/cli/using-npm/scripts
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      has:
        field: key
        regex: '^"scripts"$'
      all:
        - has:
            field: value
            kind: object
            has:
              kind: pair
              has:
                field: key
                regex: '^"clean"$'
              all:
                - has:
                    field: value
                    kind: string
                    regex: '^".*[^\s"].*"$'
                    not:
                      regex: '^"(\s|\\[tnr]|\\u00(?:09|0[aAdD]|20))*"$'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references:
    - https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/composition/profiles.ts
    - https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/clean-build.ts
    - https://docs.npmjs.com/cli/using-npm/scripts
  tags: [capability:clean-build]
  category: package-scripts
  precision: medium
  precision-rationale: "Checks a direct root scripts.clean string with non-whitespace content; command behavior, shell safety, escaped keys and arbitrary Unicode whitespace encodings remain assessment gaps. Evidence: rule-tests/ecosol/package-scripts/require-clean-script.test.yml and scripts/check-fixtures.sh."
  impact: low
  impact-rationale: A missing cleanup entrypoint creates bounded developer-workflow friction; the declaration does not prove cleanup, data loss or execution.
  scope-profile: [package-json, tests]
