id: require-prelint-node-modules-glob
language: Json
severity: info
message: >
  `lint:check:prelint` should exclude node_modules with a `--globs` flag.
note: >
  Forge Prelint is based on ast-grep to run fast, but without a `--globs` flag
  excluding node_modules, ast-grep still walks and parses every vendored
  package on each scan. Add a --globs flag excluding node_modules (accepted
  forms: `!node_modules`, `!node_modules/`, `!node_modules/**`, optionally
  prefixed with `**/`) so ast-grep does not descend into vendored packages.
  Legacy `lint:prelint` scripts are also checked.
  See ast-grep's CLI reference for --globs:
  https://ast-grep.github.io/reference/cli/scan.html#globs-globs
rule:
  all:
    - kind: pair
      regex: '^"lint:(?:check:)?prelint"\s*:\s*"'
      inside:
        stopBy: end
        kind: pair
        regex: '"scripts"\s*:'
    - not:
        regex: "--globs\\s+'!(?:\\*\\*/)?node_modules/?(?:\\*\\*)?'"
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: [capability:prelint]
  references: ["https://ast-grep.github.io/reference/cli/scan.html#globs-globs"]
  category: package-scripts
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests accept several single-quoted node_modules negations and flag missing/incomplete globs. Shell quoting, ignore files, external helpers and a source-only scan can already exclude dependencies; these effective-scope alternatives are assessment gaps, so missing literal flags do not prove all dependencies are parsed. Evidence: rule-tests/ecosol/package-scripts/require-prelint-node-modules-glob.test.yml (valid/invalid) and rule-tests/__snapshots__/require-prelint-node-modules-glob-snapshot.yml."
  impact: low
  impact-rationale: ast-grep documents glob filtering; genuinely scanning irrelevant dependencies adds local lint noise and processing time. Neither scan volume nor substantial resource consumption is measured, and a dedicated flag is only the team's convention.
