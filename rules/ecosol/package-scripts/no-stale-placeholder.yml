id: no-stale-placeholder
language: Json
severity: warning
message: >
  Replace this placeholder script now that the app has real dependencies wired up.
note: >
  Bootstrap/template packages may ship placeholder scripts
  like `echo "Not implemented"` intentionally.
  Once a repo has real Forge dependencies,
  a leftover placeholder usually means the capability was never implemented
  rather than an explicit template convention.
  Scoped to the scripts repo-init's default modules are supposed to make real
  (build, check, format*, lint*, test*, typecheck, changelog, size) so
  intentionally reserved placeholders (generate:openapi, preview, start, ...)
  don't get flagged.
rule:
  all:
    - kind: pair
      regex: '^"(build|check|format(:[a-zA-Z0-9_-]+)?|lint(:[a-zA-Z0-9_-]+)?|test(:[a-zA-Z0-9_-]+)?|typecheck|changelog|size)"\s*:\s*"(echo .*(Not implemented|not yet implemented|TODO).*|exit 1)"'
      inside:
        stopBy: end
        kind: pair
        regex: '"scripts"\s*:'
    - inside:
        stopBy: end
        kind: object
        has:
          kind: pair
          regex: '"@forge/[^/]+"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
