id: require-valid-prelint-config
language: Json
severity: warning
message: >
  `lint:prelint` should point `--config` at one of this package's shipped sgconfig files.
note: >
  Forge Prelint ships one sgconfig file per tier:
  sgconfig.recommended.yml, sgconfig.strict.yml, sgconfig.atlassian.yml, sgconfig.ecosol.yml.
  This package installs from a git dependency rather than the npm registry,
  so the folder name under node_modules is whatever key you used in your
  dependencies entry, not necessarily tool-forge-prelint-ast-grep.
  Point --config at one of the shipped sgconfig.<tier>.yml files, wherever it landed.
  https://github.com/ibuchanan/tool-forge-prelint-ast-grep
rule:
  all:
    - kind: pair
      regex: '^"lint:prelint"\s*:\s*"'
      inside:
        stopBy: end
        kind: pair
        regex: '"scripts"\s*:'
    - not:
        regex: '--config\s+\S*sgconfig\.(recommended|strict|ecosol|atlassian)\.yml'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references: ["https://github.com/ibuchanan/tool-forge-prelint-ast-grep"]
  category: package-scripts
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests accept all shipped tier filenames and renamed dependency folders, rejecting generic or unrelated configs. The text check cannot verify file existence/content, shell quoting or equivalent custom configs; those are assessment gaps. It does not validate a real scan. Evidence: rule-tests/ecosol/package-scripts/require-valid-prelint-config.test.yml (valid/invalid) and rule-tests/__snapshots__/require-valid-prelint-config-snapshot.yml."
  impact: low
  impact-rationale: The repository ships tier configurations for consumer scans; genuinely pointing to the wrong config creates missing/noisy local feedback and maintenance rework. A custom valid config can be intentional, and no security failure is demonstrated.
