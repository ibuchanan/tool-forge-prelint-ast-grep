id: use-forge-deploy
language: Json
severity: info
message: >
  Add or rename this wrapper script as `forge:deploy` for `forge deploy`.
note: >
  A `forge:` namespace keeps Forge CLI wrapper scripts
  discoverable by a predictable name.
  Recommended to use with `use-secretspec-for-forge-commands`:
  "forge:deploy": "secretspec run --provider dotenv --reason \"npm run forge:deploy\" -- sh -c 'forge deploy --environment \"$FORGE_ENVIRONMENT\"'",
  Forge CLI deploy reference:
  https://developer.atlassian.com/platform/forge/cli-reference/deploy/
rule:
  any:
    - all:
        - kind: pair
          regex: 'forge deploy\b'
          inside:
            stopBy: end
            kind: pair
            regex: '"scripts"\s*:'
        - not:
            regex: '^"forge:deploy"\s*:'
    - all:
        - kind: object
          inside:
            kind: document
        - not:
            has:
              stopBy: end
              kind: pair
              regex: '"forge:deploy"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
