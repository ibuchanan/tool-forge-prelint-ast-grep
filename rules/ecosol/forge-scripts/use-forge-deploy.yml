id: use-forge-deploy
language: Json
severity: info
message: >
  Add a `forge:deploy` script with deploy command text; keep other lifecycle roles under their own names.
note: >
  Drop Calf maintains forge:deploy as a guarded Fence Rider deploy command.
  Direct Forge deploy text also satisfies this naming check; the separate
  use-fence-rider-for-forge-deploy rule checks the configuration workflow.
  Only a string directly under root scripts satisfies presence. Recognizable
  deploy commands under other script names are also reported. This is a bounded
  text check, not shell parsing: echoes, quoting, extra commands, forwarded flags
  and successful execution are not validated. Suppress for an intentionally
  maintained external helper or alternative workflow. Callers must select Forge
  app package directories; no manifest or tool installation is inferred.
  https://developer.atlassian.com/platform/forge/cli-reference/deploy/
  https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/secrets.ts
rule:
  any:
    - kind: pair
      has:
        field: value
        kind: string
        regex: '(^|[\s"'';&|(])(forge|fence-rider)[ \t]+deploy([\s"'';&|)]|$)'
      not:
        has:
          field: key
          regex: '^"forge:deploy"$'
      inside:
        kind: object
        inside:
          kind: pair
          has:
            field: key
            regex: '^"scripts"$'
          inside:
            kind: object
            inside:
              kind: document
    - kind: object
      inside:
        kind: document
      not:
        has:
          stopBy: end
          kind: pair
          has:
            field: key
            regex: '^"forge:deploy"$'
          all:
            - has:
                field: value
                kind: string
                regex: '(^|[\s"'';&|(])(forge|fence-rider)[ \t]+deploy([\s"'';&|)]|$)'
          inside:
            kind: object
            inside:
              kind: pair
              has:
                field: key
                regex: '^"scripts"$'
              inside:
                kind: object
                inside:
                  kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: [capability:secrets]
  references:
    - https://developer.atlassian.com/platform/forge/cli-reference/deploy/
    - https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/secrets.ts
  category: forge-scripts
  precision: medium
  impact: low
  scope-profile: [package-json, tests]
  precision-rationale: "Tests cover direct and Fence Rider deploy text, missing scripts and wrong lifecycle roles. Root script placement and string shape are checked; shell interpretation, inert quoted mentions, additional commands, equivalent helpers and deployable app identity remain assessment gaps. Evidence: rule-tests/ecosol/forge-scripts/use-forge-deploy.test.yml and rule-tests/__snapshots__/use-forge-deploy-snapshot.yml."
  impact-rationale: The pinned capability maintains a predictable Forge lifecycle entrypoint. Genuine drift impedes discoverability and maintenance; matching command text proves neither execution nor remote targets, consent or secret handling. Bounded workflow friction warrants low impact.
