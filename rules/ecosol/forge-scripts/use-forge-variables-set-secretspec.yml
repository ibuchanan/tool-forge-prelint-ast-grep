id: use-forge-variables-set-secretspec
language: Json
severity: off
message: >
  Placeholder: the forge:variables:set:secretspec convention isn't decided yet.
note: >
  repo-init's current variable-push story is a dotenv-based wrapper script,
  which doesn't fit the secretspec migration. What replaces it
  (forge:variables:set:secretspec) hasn't been decided yet in repo-init, so this
  rule is a placeholder: the id exists for tracking, but severity is off so it
  never surfaces. Flip the severity and refine the rule once repo-init settles
  on the pattern.
  Forge CLI variables set reference:
  https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
rule:
  kind: string_content
  regex: "^@forge/(api|react|bridge|kvs|events|resolver)$"
  inside:
    stopBy: end
    kind: pair
    regex: '"dependencies"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
