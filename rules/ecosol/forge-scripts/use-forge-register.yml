id: use-forge-register
language: Json
severity: info
message: >
  Add a `forge:register` script with register command text; keep other lifecycle roles under their own names.

note: >
  Drop Calf maintains forge:register as a direct Forge register command. A `forge:` namespace keeps Forge CLI wrapper scripts discoverable by a predictable name. Only a string directly under root scripts satisfies presence. Recognizable register commands under other script names are also reported. This is a bounded text check, not shell parsing: echoes, quoting, extra commands, and successful execution are not validated. Suppress for an intentionally maintained external helper or alternative workflow. This rule assumes package.json belongs to a Forge app: in a monorepo, a workspace root or an internal shared library's package.json will also match — even one that imports @forge packages without being deployable itself. manifest.yml is the real signal for "is this a Forge app," and ast-grep can't check whether that file exists, so scope the scan to your Forge app directories rather than the whole monorepo. Forge CLI register reference: https://developer.atlassian.com/platform/forge/cli-reference/register/ https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/secrets.ts

rule:
  any:
    - kind: pair
      has:
        field: value
        kind: string
        regex: '(^|[\s"'';&|(])forge[ \t]+register([\s"'';&|)]|$)'
      not:
        has:
          field: key
          regex: '^"forge:register"$'
      inside:
        kind: object
        inside:
          kind: pair
          has:
            field: key
            regex: '^"scripts"$'
          inside:
            kind: object
            inside:
              kind: document
    - kind: object
      inside:
        kind: document
      not:
        has:
          stopBy: end
          kind: pair
          has:
            field: key
            regex: '^"forge:register"$'
          all:
            - has:
                field: value
                kind: string
                regex: '(^|[\s"'';&|(])forge[ \t]+register([\s"'';&|)]|$)'
          inside:
            kind: object
            inside:
              kind: pair
              has:
                field: key
                regex: '^"scripts"$'
              inside:
                kind: object
                inside:
                  kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: ["capability:secrets"]
  references:
    - https://developer.atlassian.com/platform/forge/cli-reference/register/
    - https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/secrets.ts
  category: forge-scripts
  precision: medium
  impact: low
  scope-profile: [package-json, tests]
  impact-rationale: The predictable Forge lifecycle entrypoint supports maintenance and integration; matching command text proves neither execution nor remote registration state. Genuine drift impedes discoverability; bounded naming friction warrants low impact.
  precision-rationale: "Tests cover direct Forge register text, misnamed keys, missing scripts and wrong lifecycle roles. Root script placement and string shape are checked; shell interpretation, inert quoted mentions, additional commands, equivalent helpers and deployable app identity remain assessment gaps. Evidence: rule-tests/ecosol/forge-scripts/use-forge-register.test.yml and rule-tests/__snapshots__/use-forge-register-snapshot.yml."
