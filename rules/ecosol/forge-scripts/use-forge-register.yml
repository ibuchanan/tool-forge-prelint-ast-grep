id: use-forge-register
language: Json
severity: info
message: >
  Add or rename this wrapper script as `forge:register` for `forge register`.
note: >
  repo-init names Forge CLI wrapper scripts with a `forge:` namespace.
  Unlike deploy/install/uninstall, `forge register` needs no site, product,
  or environment flags.
  Forge CLI register reference:
  https://developer.atlassian.com/platform/forge/cli-reference/register/
rule:
  any:
    - all:
        - kind: pair
          regex: 'forge register\b'
          inside:
            stopBy: end
            kind: pair
            regex: '"scripts"\s*:'
        - not:
            regex: '^"forge:register"\s*:'
    - all:
        - kind: string_content
          regex: "^@forge/(api|react|bridge|kvs|events|resolver)$"
          inside:
            stopBy: end
            kind: pair
            regex: '"dependencies"\s*:'
        - not:
            inside:
              stopBy: end
              kind: object
              has:
                kind: pair
                regex: '"forge:register"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
