id: use-forge-register
language: Json
severity: info
message: >
  Add or rename this wrapper script as `forge:register` for `forge register`.
note: >
  A `forge:` namespace keeps Forge CLI wrapper scripts
  discoverable by a predictable name.
  `forge register` needs no site, product, or environment flags.
  This rule assumes package.json belongs to a Forge app: in a monorepo, a
  workspace root or an internal shared library's package.json will also
  match — even one that imports @forge packages without being deployable
  itself. manifest.yml is the real signal for "is this a Forge app," and
  ast-grep can't check whether that file exists, so scope the scan to your
  Forge app directories rather than the whole monorepo.
  Forge CLI register reference:
  https://developer.atlassian.com/platform/forge/cli-reference/register/
rule:
  any:
    - all:
        - kind: pair
          regex: 'forge register\b'
          inside:
            stopBy: end
            kind: pair
            regex: '"scripts"\s*:'
        - not:
            regex: '^"forge:register"\s*:'
    - all:
        - kind: object
          inside:
            kind: document
        - not:
            has:
              stopBy: end
              kind: pair
              regex: '"forge:register"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
