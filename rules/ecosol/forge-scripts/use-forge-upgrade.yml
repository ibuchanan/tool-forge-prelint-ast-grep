id: use-forge-upgrade
language: Json
severity: info
message: >
  Add or rename this wrapper script as `forge:upgrade` for `forge install --upgrade`.
note: >
  A `forge:` namespace keeps Forge CLI wrapper scripts
  discoverable by a predictable name.
  Pair this naming convention with `use-fence-rider-for-forge-install`,
  which also covers installation upgrades.
  This rule assumes package.json belongs to a Forge app: in a monorepo, a
  workspace root or an internal shared library's package.json will also
  match — even one that imports @forge packages without being deployable
  itself. manifest.yml is the real signal for "is this a Forge app," and
  ast-grep can't check whether that file exists, so scope the scan to your
  Forge app directories rather than the whole monorepo.
  Forge CLI install reference:
  https://developer.atlassian.com/platform/forge/cli-reference/install/
rule:
  any:
    - all:
        - kind: pair
          regex: 'forge install\b'
          inside:
            stopBy: end
            kind: pair
            regex: '"scripts"\s*:'
        - regex: "--upgrade"
        - not:
            regex: '^"forge:upgrade"\s*:'
    - all:
        - kind: object
          inside:
            kind: document
        - not:
            has:
              stopBy: end
              kind: pair
              regex: '"forge:upgrade"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
metadata:
  references:
    ["https://developer.atlassian.com/platform/forge/cli-reference/install/"]
  category: forge-scripts
  precision: medium
  impact: low
  impact-rationale: Forge documents the command's operation, not a mandatory package-script name. Missing the team's forge namespace creates discoverability and maintenance friction; it does not itself select the wrong app, grant consent, expose a secret or execute remote changes.
  scope-profile: [unique]
  scope-rationale: Preserve package.json files with only node_modules excluded, including test-local and dist/coverage/specs packages. Native scope cannot establish deployable Forge identity; standard package scope would require the full baseline. Ticket 08 owns normalization.
  precision-rationale: "Tests distinguish named upgrade wrappers from install and missing scripts. The text matcher requires --upgrade somewhere in a forge install pair; it does not parse argument semantics or validate descendant-key placement, implementation or app identity. Those are assessment gaps. Evidence: rule-tests/ecosol/forge-scripts/use-forge-upgrade.test.yml (valid/invalid) and rule-tests/__snapshots__/use-forge-upgrade-snapshot.yml."
