id: use-forge-upgrade
language: Json
severity: info
message: >
  Add a `forge:upgrade` script with install --upgrade command text; keep other lifecycle roles under their own names.

note: >
  Drop Calf maintains forge:upgrade as a guarded Fence Rider install --upgrade command. Direct Forge install --upgrade text also satisfies this naming check; the separate use-fence-rider-for-forge-install rule checks the configuration workflow. Only a string directly under root scripts satisfies presence. Recognizable install --upgrade commands under other script names are also reported. This is a bounded text check, not shell parsing: echoes, quoting, extra commands, forwarded flags and successful execution are not validated. Suppress for an intentionally maintained external helper or alternative workflow. Flag order (install -- --upgrade or install --upgrade) is accepted; both install and upgrade checks recognize both orders. This rule assumes package.json belongs to a Forge app: in a monorepo, a workspace root or an internal shared library's package.json will also match — even one that imports @forge packages without being deployable itself. manifest.yml is the real signal for "is this a Forge app," and ast-grep can't check whether that file exists, so scope the scan to your Forge app directories rather than the whole monorepo. Forge CLI install reference: https://developer.atlassian.com/platform/forge/cli-reference/install/ https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/secrets.ts

rule:
  any:
    - kind: pair
      has:
        field: value
        kind: string
        regex: '(^|[\s"'';&|(])(forge|fence-rider)[ \t]+install([\s"'';&|)]|$)'
      not:
        has:
          field: key
          regex: '^"forge:upgrade"$'
      inside:
        kind: object
        inside:
          kind: pair
          has:
            field: key
            regex: '^"scripts"$'
          inside:
            kind: object
            inside:
              kind: document
      all:
        - has:
            field: value
            regex: (^|[\s"';&|(])--upgrade([\s"';&|)]|$)
    - kind: object
      inside:
        kind: document
      not:
        has:
          stopBy: end
          kind: pair
          has:
            field: key
            regex: '^"forge:upgrade"$'
          all:
            - has:
                field: value
                kind: string
                regex: '(^|[\s"'';&|(])(forge|fence-rider)[ \t]+install([\s"'';&|)]|$)'
            - has:
                field: value
                regex: (^|[\s"';&|(])--upgrade([\s"';&|)]|$)
          inside:
            kind: object
            inside:
              kind: pair
              has:
                field: key
                regex: '^"scripts"$'
              inside:
                kind: object
                inside:
                  kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: ["capability:secrets"]
  references:
    - https://developer.atlassian.com/platform/forge/cli-reference/install/
    - https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/secrets.ts
  category: forge-scripts
  precision: medium
  impact: low
  scope-profile: [package-json, tests]
  impact-rationale: The pinned capability maintains a predictable Forge lifecycle entrypoint. Genuine drift impedes discoverability and maintenance; matching command text proves neither execution nor remote targets, consent or secret handling. Bounded workflow friction warrants low impact.
  precision-rationale: "Tests cover direct and guarded install --upgrade text, misnamed keys, missing scripts, wrong lifecycle roles and install separation. Root script placement and string shape are checked; shell interpretation, inert quoted mentions, additional commands, effective CLI options, equivalent helpers and deployable app identity remain assessment gaps. Evidence: rule-tests/ecosol/forge-scripts/use-forge-upgrade.test.yml and rule-tests/__snapshots__/use-forge-upgrade-snapshot.yml."
