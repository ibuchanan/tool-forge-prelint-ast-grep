id: use-forge-uninstall
language: Json
severity: info
message: >
  Add a `forge:uninstall` script with uninstall command text; keep other lifecycle roles under their own names.

note: >
  Drop Calf maintains forge:uninstall as a guarded Fence Rider uninstall command. Direct Forge uninstall text also satisfies this naming check; the separate use-fence-rider-for-forge-uninstall rule checks the configuration workflow. Only a string directly under root scripts satisfies presence. Recognizable uninstall commands under other script names are also reported. This is a bounded text check, not shell parsing: echoes, quoting, extra commands, forwarded flags and successful execution are not validated. Suppress for an intentionally maintained external helper or alternative workflow. This rule assumes package.json belongs to a Forge app: in a monorepo, a workspace root or an internal shared library's package.json will also match — even one that imports @forge packages without being deployable itself. manifest.yml is the real signal for "is this a Forge app," and ast-grep can't check whether that file exists, so scope the scan to your Forge app directories rather than the whole monorepo. Forge CLI uninstall reference: https://developer.atlassian.com/platform/forge/cli-reference/uninstall/ https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/secrets.ts

rule:
  any:
    - kind: pair
      has:
        field: value
        kind: string
        regex: '(^|[\s"'';&|(])(forge|fence-rider)[ \t]+uninstall([\s"'';&|)]|$)'
      not:
        has:
          field: key
          regex: '^"forge:uninstall"$'
      inside:
        kind: object
        inside:
          kind: pair
          has:
            field: key
            regex: '^"scripts"$'
          inside:
            kind: object
            inside:
              kind: document
    - kind: object
      inside:
        kind: document
      not:
        has:
          stopBy: end
          kind: pair
          has:
            field: key
            regex: '^"forge:uninstall"$'
          all:
            - has:
                field: value
                kind: string
                regex: '(^|[\s"'';&|(])(forge|fence-rider)[ \t]+uninstall([\s"'';&|)]|$)'
          inside:
            kind: object
            inside:
              kind: pair
              has:
                field: key
                regex: '^"scripts"$'
              inside:
                kind: object
                inside:
                  kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: ["capability:secrets"]
  references:
    - https://developer.atlassian.com/platform/forge/cli-reference/uninstall/
    - https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/secrets.ts
  category: forge-scripts
  precision: medium
  impact: low
  scope-profile: [package-json, tests]
  impact-rationale: The pinned capability maintains a predictable Forge lifecycle entrypoint. Genuine drift impedes discoverability and maintenance; matching command text proves neither execution nor remote targets, consent or secret handling. Bounded workflow friction warrants low impact.
  precision-rationale: "Tests cover direct and guarded uninstall command text, misnamed keys, missing scripts and wrong lifecycle roles. Root script placement and string shape are checked; shell interpretation, inert quoted mentions, additional commands, equivalent helpers and deployable app identity remain assessment gaps. Evidence: rule-tests/ecosol/forge-scripts/use-forge-uninstall.test.yml and rule-tests/__snapshots__/use-forge-uninstall-snapshot.yml."
