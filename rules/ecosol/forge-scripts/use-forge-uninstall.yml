id: use-forge-uninstall
language: Json
severity: info
message: >
  Add or rename this wrapper script as `forge:uninstall` for `forge uninstall`.
note: >
  A `forge:` namespace keeps Forge CLI wrapper scripts
  discoverable by a predictable name.
  Pair this naming convention with `use-fence-rider-for-forge-uninstall`
  for the ecosol configuration-resolution workflow.
  This rule assumes package.json belongs to a Forge app: in a monorepo, a
  workspace root or an internal shared library's package.json will also
  match — even one that imports @forge packages without being deployable
  itself. manifest.yml is the real signal for "is this a Forge app," and
  ast-grep can't check whether that file exists, so scope the scan to your
  Forge app directories rather than the whole monorepo.
  Forge CLI uninstall reference:
  https://developer.atlassian.com/platform/forge/cli-reference/uninstall/
rule:
  any:
    - all:
        - kind: pair
          regex: 'forge uninstall\b'
          inside:
            stopBy: end
            kind: pair
            regex: '"scripts"\s*:'
        - not:
            regex: '^"forge:uninstall"\s*:'
    - all:
        - kind: object
          inside:
            kind: document
        - not:
            has:
              stopBy: end
              kind: pair
              regex: '"forge:uninstall"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references:
    ["https://developer.atlassian.com/platform/forge/cli-reference/uninstall/"]
  category: forge-scripts
  precision: medium
  impact: low
  impact-rationale: Forge documents the command's operation, not a mandatory package-script name. Missing the team's forge namespace creates discoverability and maintenance friction; it does not itself select the wrong app, grant consent, expose a secret or execute remote changes.
  scope-profile: [package-json, tests]
  precision-rationale: "Tests cover named/misnamed uninstall wrappers and missing scripts. Descendant-key presence does not prove scripts placement or implementation, and removal may intentionally use a separate controlled workflow. Those contextual distinctions and shell quoting are assessment gaps. Evidence: rule-tests/ecosol/forge-scripts/use-forge-uninstall.test.yml (valid/invalid) and rule-tests/__snapshots__/use-forge-uninstall-snapshot.yml."
