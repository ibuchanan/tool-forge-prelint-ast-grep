id: use-forge-uninstall
language: Json
severity: info
message: >
  Add or rename this wrapper script as `forge:uninstall` for `forge uninstall`.
note: >
  repo-init names Forge CLI wrapper scripts with a `forge:` namespace
  (`forge:deploy`, `forge:install`, `forge:uninstall`, `forge:register`, ...).
  Forge CLI uninstall reference:
  https://developer.atlassian.com/platform/forge/cli-reference/uninstall/
rule:
  any:
    - all:
        - kind: pair
          regex: 'forge uninstall\b'
          inside:
            stopBy: end
            kind: pair
            regex: '"scripts"\s*:'
        - not:
            regex: '^"forge:uninstall"\s*:'
    - all:
        - kind: string_content
          regex: "^@forge/(api|react|bridge|kvs|events|resolver)$"
          inside:
            stopBy: end
            kind: pair
            regex: '"dependencies"\s*:'
        - not:
            inside:
              stopBy: end
              kind: object
              has:
                kind: pair
                regex: '"forge:uninstall"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
