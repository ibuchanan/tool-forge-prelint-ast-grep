id: use-forge-variables-set
language: Json
severity: info
message: >
  Add or rename this wrapper script as `forge:variables:set`
  for setting Forge variables.
note: >
  A `forge:` namespace keeps Forge CLI wrapper scripts
  discoverable by a predictable name.
  This rule checks naming only, not the upload implementation.
  Configuration-resolution conventions live in the `secrets` category.
  This rule assumes package.json belongs to a Forge app: in a monorepo, a
  workspace root or an internal shared library's package.json will also
  match — even one that imports @forge packages without being deployable
  itself. manifest.yml is the real signal for "is this a Forge app," and
  ast-grep can't check whether that file exists, so scope the scan to your
  Forge app directories rather than the whole monorepo.
  Forge CLI variables set reference:
  https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
rule:
  any:
    - all:
        - kind: pair
          regex: 'forge variables set\b'
          inside:
            stopBy: end
            kind: pair
            regex: '"scripts"\s*:'
        - not:
            regex: '^"forge:variables:set"\s*:'
    - all:
        - kind: object
          inside:
            kind: document
        - not:
            has:
              stopBy: end
              kind: pair
              regex: '"forge:variables:set"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
metadata:
  references:
    [
      "https://developer.atlassian.com/platform/forge/cli-reference/variables-set/",
    ]
  category: forge-scripts
  precision: medium
  impact: low
  impact-rationale: Forge documents the command's operation, not a mandatory package-script name. Missing the team's forge namespace creates discoverability and maintenance friction; it does not itself select the wrong app, grant consent, expose a secret or execute remote changes.
  scope-profile: [unique]
  scope-rationale: Preserve package.json files with only node_modules excluded, including test-local and dist/coverage/specs packages. Native scope cannot establish deployable Forge identity; standard package scope would require the full baseline. Ticket 08 owns normalization.
  precision-rationale: "Tests accept the expected key with direct or legacy helper implementations and flag a wrong key or absence. This is naming only; descendant-key presence does not validate scripts placement, encryption, runtime allowlists or execution. Those are assessment gaps, not detected secret disclosure. Evidence: rule-tests/ecosol/forge-scripts/use-forge-variables-set.test.yml (valid/invalid) and rule-tests/__snapshots__/use-forge-variables-set-snapshot.yml."
