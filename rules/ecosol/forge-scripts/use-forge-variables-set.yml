id: use-forge-variables-set
language: Json
severity: info
message: >
  Add a `forge:variables:set` script with variables command text; keep other lifecycle roles under their own names.

note: >
  Drop Calf maintains forge:variables:set as a direct or Fence Rider variables command. Accepted implementations include direct `forge variables set`, Fence Rider wrapper, and node/bun helper scripts (e.g., `node scripts/forge-vars-from-secretspec.js`). Only a string directly under root scripts satisfies presence. Recognizable variables commands under other script names are also reported. This is a bounded text check, not shell parsing: echoes, quoting, extra commands, forwarded flags, encryption flags and successful execution are not validated. Suppress for an intentionally maintained external helper or alternative workflow. This rule checks naming only, not the upload implementation or encryption. Configuration-resolution conventions live in the `secrets` category. This rule assumes package.json belongs to a Forge app: in a monorepo, a workspace root or an internal shared library's package.json will also match — even one that imports @forge packages without being deployable itself. manifest.yml is the real signal for "is this a Forge app," and ast-grep can't check whether that file exists, so scope the scan to your Forge app directories rather than the whole monorepo. Forge CLI variables set reference: https://developer.atlassian.com/platform/forge/cli-reference/variables-set/ https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/secrets.ts

rule:
  any:
    - kind: pair
      has:
        field: value
        kind: string
        regex: '(^|[\s"'';&|(])(forge[ \t]+variables[ \t]+set|fence-rider[ \t]+variables|(node|bun)([ \t]+run)?[ \t]+scripts/forge-vars-from-secretspec\.js)([\s"'';&|)]|$)'
      not:
        has:
          field: key
          regex: '^"forge:variables:set"$'
      inside:
        kind: object
        inside:
          kind: pair
          has:
            field: key
            regex: '^"scripts"$'
          inside:
            kind: object
            inside:
              kind: document
    - kind: object
      inside:
        kind: document
      not:
        has:
          stopBy: end
          kind: pair
          has:
            field: key
            regex: '^"forge:variables:set"$'
          all:
            - has:
                field: value
                kind: string
                regex: '(^|[\s"'';&|(])(forge[ \t]+variables[ \t]+set|fence-rider[ \t]+variables|(node|bun)([ \t]+run)?[ \t]+scripts/forge-vars-from-secretspec\.js)([\s"'';&|)]|$)'
          inside:
            kind: object
            inside:
              kind: pair
              has:
                field: key
                regex: '^"scripts"$'
              inside:
                kind: object
                inside:
                  kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: ["capability:secrets"]
  references:
    - https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
    - https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/secrets.ts
  category: forge-scripts
  precision: medium
  impact: low
  scope-profile: [package-json, tests]
  impact-rationale: The pinned capability maintains a predictable Forge lifecycle entrypoint. Genuine drift impedes discoverability and maintenance; matching command text proves neither execution nor remote targets, consent or secret handling. Bounded workflow friction warrants low impact.
  precision-rationale: "Tests cover direct forge variables set, Fence Rider wrapper, and node/bun helper scripts; also misnamed keys, missing scripts and wrong lifecycle roles. Root script placement and string shape are checked; shell interpretation, inert quoted mentions, encryption and forwarded flags, effective helpers and deployable app identity remain assessment gaps. Evidence: rule-tests/ecosol/forge-scripts/use-forge-variables-set.test.yml and rule-tests/__snapshots__/use-forge-variables-set-snapshot.yml."
