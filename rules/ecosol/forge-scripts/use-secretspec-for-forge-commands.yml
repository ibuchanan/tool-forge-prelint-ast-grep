id: use-secretspec-for-forge-commands
language: Json
severity: info
message: >
  Run this Forge command through secretspec instead of calling forge directly.
note: >
  Wrapping Forge commands with secretspec
  resolves configuration and app secrets consistently and safely,
  instead of risking on-disk .env files
  or hardcoding values into the script itself.
  https://secretspec.dev/
rule:
  kind: pair
  regex: "forge (deploy|install|uninstall)"
  inside:
    stopBy: end
    kind: pair
    regex: '"scripts"\s*:'
  not:
    regex: '"[^"]*"\s*:\s*"secretspec run\b[\s\S]*forge (deploy|install|uninstall)'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
