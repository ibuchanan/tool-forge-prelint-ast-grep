id: use-secretspec-for-forge-commands
language: Json
severity: warning
message: >
  Bring this Forge command script up to the repo-init baseline by running it through secretspec.
note: >
  repo-init wraps Forge deploy, install, upgrade, uninstall, and variable-setting
  scripts with secretspec run -- so FORGE_SITE, FORGE_PRODUCT, FORGE_ENVIRONMENT,
  and app secrets are resolved consistently without committing .env files.
  https://secretspec.dev/
  Forge CLI command references:
  https://developer.atlassian.com/platform/forge/cli-reference/deploy/
  https://developer.atlassian.com/platform/forge/cli-reference/install/
  https://developer.atlassian.com/platform/forge/cli-reference/uninstall/
  https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
rule:
  all:
    - kind: string_content
      regex: "forge (deploy|install|uninstall|variables set)"
    - inside:
        stopBy: end
        kind: pair
        regex: '"scripts"\s*:'
    - not:
        regex: "^secretspec run -- forge (deploy|install|uninstall|variables set)"
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
