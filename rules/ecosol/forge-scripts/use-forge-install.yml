id: use-forge-install
language: Json
severity: info
message: >
  Add or rename this wrapper script as `forge:install` for `forge install`.
note: >
  A `forge:` namespace keeps Forge CLI wrapper scripts
  discoverable by a predictable name.
  Recommended to use with `use-secretspec-for-forge-commands`:
  "forge:install": "secretspec run --provider dotenv --reason \"npm run forge:install\" -- sh -c 'forge install --site \"$FORGE_SITE\" --product \"$FORGE_PRODUCT\" --environment \"$FORGE_ENVIRONMENT\" --non-interactive'",
  Forge CLI install reference:
  https://developer.atlassian.com/platform/forge/cli-reference/install/
rule:
  any:
    - all:
        - kind: pair
          regex: 'forge install\b'
          inside:
            stopBy: end
            kind: pair
            regex: '"scripts"\s*:'
        - not:
            regex: "--upgrade"
        - not:
            regex: '^"forge:install"\s*:'
    - all:
        - kind: object
          inside:
            kind: document
        - not:
            has:
              stopBy: end
              kind: pair
              regex: '"forge:install"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
