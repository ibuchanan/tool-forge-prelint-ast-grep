id: require-package-type-module
language: Json
severity: warning
message: >
  Set package.json's top-level `type` to "module" for this Forge app.
note: >
  Drop Calf enforces type: "module" for Forge apps on update. This selects
  ECMAScript module interpretation for .js files and package exports; a nested
  type field does not set the package's module type. Scope this ecosol rule to
  Forge app package.json files, not unrelated workspace packages.
  npm package.json type reference:
  https://docs.npmjs.com/cli/v11/configuring-npm/package-json/#type
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '^"type"\s*:\s*"module"$'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: [capability:package-metadata]
  references:
    ["https://docs.npmjs.com/cli/v11/configuring-npm/package-json/#type"]
  category: package-json
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests distinguish a top-level module declaration from commonjs, absence and a nested type key. The matcher directly checks the explicit team setting but cannot establish Forge-app identity; unrelated CommonJS workspace packages can be legitimate. App identity is an assessment gap, not a tested runtime failure. Evidence: rule-tests/ecosol/package-json/require-package-type-module.test.yml (valid/invalid) and rule-tests/__snapshots__/require-package-type-module-snapshot.yml."
  impact: medium
  impact-rationale: The npm type field controls JavaScript module interpretation; in an app relying on ESM, genuine mismatch can prevent local tools or imports from loading. CommonJS itself is supported, and this declaration does not alone prove Forge deployment or application failure.
