id: use-node-24
language: Json
severity: hint
message: >
  Pin `@types/node` to 24 in devDependencies and omit package.json `engines`.
note: >
  Drop Calf pins Node 24 in .nvmrc and @types/node, and derives the Forge
  manifest runtime from .nvmrc. Forge apps omit package.json engines because
  it can interfere with deployment. This JSON rule checks only package.json;
  it cannot verify .nvmrc or manifest.yml.
  Node version manager file reference:
  https://github.com/nvm-sh/nvm#nvmrc
rule:
  kind: object
  inside:
    kind: document
  any:
    - not:
        has:
          kind: pair
          regex: '^"devDependencies"\s*:'
          has:
            stopBy: end
            kind: pair
            regex: '^"@types/node"\s*:\s*"24"$'
    - has:
        kind: pair
        regex: '^"engines"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
