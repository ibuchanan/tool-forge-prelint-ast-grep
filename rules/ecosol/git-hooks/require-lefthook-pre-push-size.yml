id: require-lefthook-pre-push-size
language: Yaml
severity: warning
message: >
  Run `size:check` from a pre-push command in lefthook.yml to guard bundle size.
note: >
  Drop Calf's Forge-app pre-push hook invokes size:check, which builds before
  measuring the bundle. A command named size without a runnable size:check
  invocation does not protect pushes. This rule checks lefthook.yml only; it
  cannot verify that package.json defines size:check or that the command runs
  without Lefthook filters. See require-size-check-script for the package script.
  Lefthook configuration reference:
  https://lefthook.dev/configuration/
rule:
  kind: block_mapping
  inside:
    kind: block_node
    inside:
      kind: document
  not:
    has:
      kind: block_mapping_pair
      regex: "^pre-push:"
      has:
        stopBy: end
        kind: block_mapping_pair
        regex: "^commands:"
        has:
          kind: block_node
          has:
            kind: block_mapping
            has:
              kind: block_mapping_pair
              not:
                regex: "^run:"
              has:
                kind: block_node
                has:
                  kind: block_mapping
                  has:
                    kind: block_mapping_pair
                    regex: '^run:\s*(npm|bun|pnpm|yarn) run size:check(\s+--if-present)?\s*$'
files:
  - "**/lefthook.yml"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  references: ["https://lefthook.dev/configuration/"]
  category: git-hooks
  precision: medium
  scope-profile: [unique]
  scope-rationale: "Select only the reviewed configuration filenames: lefthook.yml, not lefthook.yaml. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  precision-rationale: "Tests require a runnable size:check command under pre-push.commands, accept a budget-named entry and reject name-only/skip-only and jobs forms. Supported jobs or wrapper commands can be equivalent; package-script existence, --if-present behavior and filters remain explicit assessment gaps. Evidence: rule-tests/ecosol/git-hooks/require-lefthook-pre-push-size.test.yml (valid/invalid) and rule-tests/__snapshots__/require-lefthook-pre-push-size-snapshot.yml."
  impact: low
  impact-rationale: Lefthook can invoke the local size budget before pushing; omission delays bundle-growth feedback and adds bounded rework. The matcher neither measures a bundle nor proves a platform limit breach or substantial resource consumption.
