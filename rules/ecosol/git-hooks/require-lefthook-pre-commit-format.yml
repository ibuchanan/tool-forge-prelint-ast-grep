id: require-lefthook-pre-commit-format
language: Yaml
severity: warning
message: >
  Add a pre-commit format guard to lefthook.yml.
note: >
  Running a format check before every commit
  catches formatting drift before it's committed,
  keeping diffs focused on real changes instead of mixed-in reformatting.
  Lefthook configuration reference:
  https://lefthook.dev/configuration/
rule:
  kind: block_mapping
  inside:
    kind: block_node
    inside:
      kind: document
  not:
    has:
      kind: block_mapping_pair
      regex: 'pre-commit:[\s\S]*?\bformat:'
files:
  - "**/lefthook.yml"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  references: ["https://lefthook.dev/configuration/"]
  category: git-hooks
  precision: medium
  scope-profile: [unique]
  scope-rationale: "Select only the reviewed configuration filenames: lefthook.yml, not lefthook.yaml. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  precision-rationale: "Tests cover a format-named pre-commit entry, missing entry and absent pre-commit hook. The regex checks a key, not run contents or skip/filter behavior; equivalently named scripts, inherited configuration and flow YAML are untested assessment gaps. A missing key is not proof formatting never runs. Evidence: rule-tests/ecosol/git-hooks/require-lefthook-pre-commit-format.test.yml (valid/invalid) and rule-tests/__snapshots__/require-lefthook-pre-commit-format-snapshot.yml."
  impact: low
  impact-rationale: Lefthook can run formatting before commits; genuine omission of the local guard permits recoverable formatting churn and noisier reviews, not a demonstrated production or security failure.
