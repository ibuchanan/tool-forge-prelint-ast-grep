id: require-lefthook-pre-push-typecheck
language: Yaml
severity: warning
message: >
  Add a pre-push typecheck guard to lefthook.yml.
note: >
  pre-push is the comprehensive, "run everything" guard — a full typecheck
  is too heavy-handed for every commit, but appropriate here since pre-push
  only runs once before code leaves your machine. Delegating to a top-level
  "lint" command group that pre-push already invokes also satisfies this rule.
  Lefthook configuration reference:
  https://lefthook.dev/configuration/
rule:
  kind: block_mapping
  inside:
    kind: block_node
    inside:
      kind: document
  not:
    any:
      - has:
          kind: block_mapping_pair
          regex: 'pre-push:[\s\S]*?\btypecheck:'
      - all:
          - has:
              kind: block_mapping_pair
              regex: '^lint:[\s\S]*?\btypecheck:'
          - has:
              kind: block_mapping_pair
              regex: 'pre-push:[\s\S]*?\blint:'
files:
  - "**/lefthook.yml"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  references: ["https://lefthook.dev/configuration/"]
  category: git-hooks
  precision: medium
  scope-profile: [unique]
  scope-rationale: "Select only the reviewed configuration filenames: lefthook.yml, not lefthook.yaml. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  precision-rationale: "Tests accept direct typecheck and delegation via an invoked lint group, rejecting an uninvoked group. Named keys cannot establish the run body, effective compiler inputs or skip filters; equivalent alternate names and inherited configs remain assessment gaps. Evidence: rule-tests/ecosol/git-hooks/require-lefthook-pre-push-typecheck.test.yml (valid/invalid) and rule-tests/__snapshots__/require-lefthook-pre-push-typecheck-snapshot.yml."
  impact: medium
  impact-rationale: Lefthook can run the typecheck contract before sharing; genuine omission permits preventable typecheck failures and integration delay. It does not establish an actual runtime crash or missing CI enforcement.
