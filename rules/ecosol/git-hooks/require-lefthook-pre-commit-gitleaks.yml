id: require-lefthook-pre-commit-gitleaks
language: Yaml
severity: warning
message: >
  Add a pre-commit gitleaks guard to lefthook.yml.
note: >
  Running gitleaks before every commit catches leaked secrets
  (API keys, tokens)
  before they ever reach git history,
  where removing them requires a history rewrite
  and extra effort to revoke the secrets.
  Lefthook configuration reference:
  https://lefthook.dev/configuration/
  Gitleaks project:
  https://github.com/gitleaks/gitleaks
rule:
  kind: block_mapping
  inside:
    kind: block_node
    inside:
      kind: document
  not:
    has:
      kind: block_mapping_pair
      regex: 'pre-commit:[\s\S]*?gitleaks:'
files:
  - "**/lefthook.yml"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  references:
    - https://lefthook.dev/configuration/
    - https://github.com/gitleaks/gitleaks
  category: git-hooks
  precision: medium
  scope-profile: [unique]
  scope-rationale: "Select only the reviewed configuration filenames: lefthook.yml, not lefthook.yaml. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  precision-rationale: "Tests cover a gitleaks-named pre-commit entry and its absence. Key spelling is not executable scanner validation; alternate names, external configuration and effective skip/filter behavior remain assessment gaps. Absence does not establish a committed secret or lack of other secret scanning. Evidence: rule-tests/ecosol/git-hooks/require-lefthook-pre-commit-gitleaks.test.yml (valid/invalid) and rule-tests/__snapshots__/require-lefthook-pre-commit-gitleaks-snapshot.yml."
  impact: high
  impact-rationale: Gitleaks detects credentials before they enter history. Where a real credential is staged and no equivalent guard catches it, omitting the intended scan can permit credential exposure and unauthorized access requiring revocation. This conditional harm is not established by missing configuration alone.
