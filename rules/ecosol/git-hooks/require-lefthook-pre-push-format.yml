id: require-lefthook-pre-push-format
language: Yaml
severity: info
message: >
  Add a pre-push format guard to lefthook.yml.
note: >
  pre-push is the comprehensive, "run everything" guard — slower checks
  that would be too heavy-handed on every commit are fine here, since
  pre-push only runs once before code leaves your machine. A format check
  here catches drift that slipped past (or bypassed) pre-commit. Delegating
  to a top-level "lint" command group that pre-push already invokes also
  satisfies this rule.
  Lefthook configuration reference:
  https://lefthook.dev/configuration/
rule:
  kind: block_mapping
  inside:
    kind: block_node
    inside:
      kind: document
  not:
    any:
      - has:
          kind: block_mapping_pair
          regex: 'pre-push:[\s\S]*?\bformat:'
      - all:
          - has:
              kind: block_mapping_pair
              regex: '^lint:[\s\S]*?\bformat:'
          - has:
              kind: block_mapping_pair
              regex: 'pre-push:[\s\S]*?\blint:'
files:
  - "**/lefthook.yml"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  references: ["https://lefthook.dev/configuration/"]
  category: git-hooks
  precision: medium
  scope-profile: [unique]
  scope-rationale: "Select only the reviewed configuration filenames: lefthook.yml, not lefthook.yaml. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  precision-rationale: "Tests cover direct format entries and delegation through a top-level lint group, rejecting an uninvoked group. Named keys do not establish run contents, filters or execution; equivalent differently named guards and inherited configuration are assessment gaps. Evidence: rule-tests/ecosol/git-hooks/require-lefthook-pre-push-format.test.yml (valid/invalid) and rule-tests/__snapshots__/require-lefthook-pre-push-format-snapshot.yml."
  impact: low
  impact-rationale: Lefthook pre-push formatting catches local drift before sharing; genuine omission adds recoverable formatting noise and review friction. CI or other guards may still protect the branch.
