id: require-lefthook-pre-push-test
language: Yaml
severity: warning
message: >
  Add a pre-push test guard to lefthook.yml.
note: >
  Running tests before every push catches regressions before they reach a
  shared branch or CI, where a failing build blocks everyone else instead
  of just the one commit that introduced it.
  Lefthook configuration reference:
  https://lefthook.dev/configuration/
rule:
  kind: block_mapping
  inside:
    kind: block_node
    inside:
      kind: document
  not:
    has:
      kind: block_mapping_pair
      regex: 'pre-push:[\s\S]*?\btest:'
files:
  - "**/lefthook.yml"
ignores:
  - "**/node_modules/**"
metadata:
  references: ["https://lefthook.dev/configuration/"]
  category: git-hooks
  precision: medium
  scope-profile: [unique]
  scope-rationale: Preserve only lefthook.yml and node_modules exclusion; lefthook.yaml is not selected and dist/coverage/specs plus test-local hooks remain included. There is no standard hook-config selector; ticket 08 owns scope normalization.
  precision-rationale: "Tests cover test-named pre-push entries and missing entry/hook. Key presence does not validate the test command, coverage, filters or execution; equivalent alternative names and inherited configuration remain assessment gaps. Evidence: rule-tests/ecosol/git-hooks/require-lefthook-pre-push-test.test.yml (valid/invalid) and rule-tests/__snapshots__/require-lefthook-pre-push-test-snapshot.yml."
  impact: medium
  impact-rationale: The documented pre-push runner can prevent known failing tests from reaching a shared branch. Genuine absence of the intended guard risks shared build failures and bounded delivery/reliability rework, without proving tests would detect a production failure.
