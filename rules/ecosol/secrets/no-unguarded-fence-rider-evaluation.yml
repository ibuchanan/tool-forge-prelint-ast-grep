id: no-unguarded-fence-rider-evaluation
language: Json
severity: warning
message: >
  Fence Rider generation can fail silently here. Capture its output with `&&` before executing it.
note: >
  Fence Rider generators print no script on refusal and exit nonzero. Direct
  eval or sh -c of command substitution can turn that failure into a successful
  empty command. A direct pipe into a shell normally reports only the shell's
  status. Use cmd=$(fence-rider deploy) && sh -c "$cmd" sh so generation must
  succeed before execution. This check recognizes literal eval/sh/bash/zsh -c
  command substitutions and simple direct generator-to-shell pipelines in
  package scripts. Pipelines mentioning pipefail are excluded because their
  failure status may already be preserved. Guarded captures and conditionals
  are not interpreted; arbitrary shell syntax, aliases, escaped arguments,
  external helpers, and downstream handling of exit status are not analyzed.
  Variables and doctor are not generators. No autofix is supplied because
  executing generated commands may change remote state.
  https://developer.atlassian.com/platform/forge/cli-reference/
  https://github.com/ibuchanan/ranch-rig-fence-rider/blob/main/docs/how-to/installation.md#run-a-short-script
rule:
  kind: pair
  has:
    field: value
    kind: string
    any:
      - regex: '(^"[ \t]*|[;&|][ \t]*)(eval|(sh|bash|zsh)[ \t]+-c)[ \t]+(\\")?\$\([ \t]*fence-rider[ \t]+(deploy|lint|install|uninstall|tunnel)([ \t]|\))'
      - all:
          - regex: '(^"[ \t]*|[;&|][ \t]*)fence-rider[ \t]+(deploy|lint|install|uninstall|tunnel)([ \t]+[^"\\$`;&|<>()]*)?[ \t]*\|[ \t]*(sh|bash|zsh)([ \t]+-s)?[ \t]*("$|[;&])'
          - not:
              regex: '\bpipefail\b'
  inside:
    kind: object
    inside:
      kind: pair
      has:
        field: key
        regex: '^"scripts"$'
      inside:
        kind: object
        inside:
          kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
