id: no-unguarded-fence-rider-evaluation
language: Json
severity: warning
message: >
  Fence Rider generation can fail silently here. Capture its output with `&&` before executing it.
note: >
  Fence Rider generators print no script on refusal and exit nonzero. Direct
  eval or sh -c of command substitution can turn that failure into a successful
  empty command. A direct pipe into a shell normally reports only the shell's
  status. Use cmd=$(fence-rider deploy) && sh -c "$cmd" sh so generation must
  succeed before execution. This check recognizes literal eval/sh/bash/zsh -c
  command substitutions and simple direct generator-to-shell pipelines in
  package scripts. Pipelines mentioning pipefail are excluded because their
  failure status may already be preserved. The literal root cmd=$(fence-rider ...);
  sh -c "$cmd" form (also eval/bash/zsh) is flagged because its semicolon does not
  gate execution on generation success. Other variable names, guarded captures
  and conditionals are not interpreted; arbitrary shell syntax, aliases, escaped arguments,
  external helpers, and downstream handling of exit status are not analyzed.
  Variables and doctor are not generators. No autofix is supplied because
  executing generated commands may change remote state.
  https://developer.atlassian.com/platform/forge/cli-reference/
  https://github.com/ibuchanan/ranch-rig-fence-rider/blob/main/docs/how-to/installation.md#run-a-short-script
rule:
  kind: pair
  has:
    field: value
    kind: string
    any:
      - regex: '^"[ \t]*cmd=\$\([ \t]*fence-rider[ \t]+(deploy|lint|install|uninstall|tunnel)([ \t]+[^"\\$`;&|<>()]*)?\)[ \t]*;[ \t]*(eval|(sh|bash|zsh)[ \t]+-c)[ \t]+(\\")?\$cmd\b'
      - regex: '(^"[ \t]*|[;&|][ \t]*)(eval|(sh|bash|zsh)[ \t]+-c)[ \t]+(\\")?\$\([ \t]*fence-rider[ \t]+(deploy|lint|install|uninstall|tunnel)([ \t]|\))'
      - all:
          - regex: '(^"[ \t]*|[;&|][ \t]*)fence-rider[ \t]+(deploy|lint|install|uninstall|tunnel)([ \t]+[^"\\$`;&|<>()]*)?[ \t]*\|[ \t]*(sh|bash|zsh)([ \t]+-s)?[ \t]*("$|[;&])'
          - not:
              regex: '\bpipefail\b'
  inside:
    kind: object
    inside:
      kind: pair
      has:
        field: key
        regex: '^"scripts"$'
      inside:
        kind: object
        inside:
          kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: [capability:secrets]
  category: secrets
  references:
    - https://github.com/ibuchanan/ranch-rig-fence-rider/blob/main/docs/how-to/installation.md#run-a-short-script
    - https://www.gnu.org/software/bash/manual/html_node/Pipelines.html
    - https://www.gnu.org/software/bash/manual/html_node/Command-Substitution.html
  precision: medium
  impact: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests flag literal eval/shell command substitution, direct shell pipes and root cmd capture followed by semicolon execution, while exempting guarded capture, a pipefail mention, non-generators and non-script contexts. Shell parsing, real pipefail state, conditional intent and downstream exit handling remain assessment gaps. This is failure-status masking, not evidence of untrusted code injection. Evidence: rule-tests/ecosol/secrets/no-unguarded-fence-rider-evaluation.test.yml (valid/invalid) and rule-tests/__snapshots__/no-unguarded-fence-rider-evaluation-snapshot.yml."
  impact-rationale: The Fence Rider execution contract and shell pipeline semantics explain how a refused generation can become successful empty eval/sh execution. Genuine lost failure status can let local/CI workflows report success without linting, deploying or installing, a bounded delivery/reliability failure rather than proven credential compromise.
