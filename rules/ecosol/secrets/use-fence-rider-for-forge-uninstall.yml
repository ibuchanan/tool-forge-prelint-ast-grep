id: use-fence-rider-for-forge-uninstall
language: Json
severity: info
message: >
  Replace direct `forge uninstall` with an executed Fence Rider script to resolve configuration without inspecting secrets.
note: >
  Prefer Fence Rider for uninstalling ecosol apps. It generates a value-free
  shell script; the caller must execute it, and SecretSpec supplies the
  configured inputs and installation targets. Avoid reading dotenv files or
  printing resolved values merely to construct an uninstall command.
  Uninstall changes remote state; using a wrapper does not authorize removal.
  OWASP recommends minimizing sensitive data in agent context; Forge reads
  manifest inputs from its process environment. Fence Rider is the team's
  implementation choice, not an OWASP or Forge requirement. It resolves the
  whole profile and does not redact Forge output or isolate credentials.
  This check recognizes literal command text in package scripts, not external
  helpers or shell aliases. Suppress it for an intentionally maintained alternative.
  https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html#8-data-protection-privacy
  https://developer.atlassian.com/platform/forge/manifest-reference/environment/
  https://github.com/ibuchanan/ranch-rig-fence-rider
rule:
  kind: pair
  has:
    field: value
    kind: string
    regex: '(^|[\s"'';&|(])forge[ \t]+uninstall([\s"'';&|)]|$)'
  inside:
    kind: object
    inside:
      kind: pair
      has:
        field: key
        regex: '^"scripts"$'
      inside:
        kind: object
        inside:
          kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  category: secrets
  references:
    - https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html#8-data-protection-privacy
    - https://developer.atlassian.com/platform/forge/manifest-reference/environment/
    - https://github.com/ibuchanan/ranch-rig-fence-rider
  precision: low
  impact: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests distinguish direct uninstall text from generated execution, aliases and non-script contexts. A direct or maintained alternative workflow can safely supply targets and inputs. Shell semantics, secret handling and authorization for removal remain assessment gaps, not established by command spelling. Evidence: rule-tests/ecosol/secrets/use-fence-rider-for-forge-uninstall.test.yml (valid/invalid) and rule-tests/__snapshots__/use-fence-rider-for-forge-uninstall-snapshot.yml."
  impact-rationale: The references describe process inputs and the team's value-free workflow. Genuine configuration drift can fail or misdirect intended removal and require bounded operational rework. The match does not establish unauthorized removal or sensitive-data loss; using a wrapper cannot authorize remote deletion.
