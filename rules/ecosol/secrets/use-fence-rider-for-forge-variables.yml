id: use-fence-rider-for-forge-variables
language: Json
severity: info
message: >
  Replace direct or legacy Forge variable uploads with `fence-rider variables` to upload runtime-scope values encrypted.
note: >
  Prefer Fence Rider for runtime-variable delivery in ecosol apps. SecretSpec's
  runtime scope is the upload allowlist, replacing the separate
  forge-variable-keys.json inventory and forge-vars-from-secretspec.js helper.
  Fence Rider resolves the full profile and validates selected values before
  the first upload, then uses forge variables set --encrypt. Upload failures
  can leave earlier writes in place; there is no rollback. Deploy separately
  to the same app and environment to activate changed values. Code-only
  deployments do not need another upload. This check recognizes literal
  forge variables set commands and node/bun invocations of the legacy helper
  under scripts/, not arbitrary upload implementations or script aliases.
  Fence Rider is a team convention, not a Forge requirement or credential
  isolation: upload values still appear in Forge's process arguments.
  Suppress this check for an intentionally maintained alternative.
  https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
  https://github.com/ibuchanan/ranch-rig-fence-rider/blob/main/docs/how-to/runtime.md
rule:
  kind: pair
  has:
    field: value
    kind: string
    any:
      - regex: '(^|[\s"'';&|(])forge[ \t]+variables[ \t]+set([\s"'';&|)]|$)'
      - regex: '(^|[\s"'';&|(])(node|bun)([ \t]+run)?[ \t]+(\./)?scripts/forge-vars-from-secretspec\.js([\s"'';&|)]|$)'
  inside:
    kind: object
    inside:
      kind: pair
      has:
        field: key
        regex: '^"scripts"$'
      inside:
        kind: object
        inside:
          kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
