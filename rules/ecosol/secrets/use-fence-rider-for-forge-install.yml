id: use-fence-rider-for-forge-install
language: Json
severity: info
message: >
  Replace direct `forge install` with an executed Fence Rider script to resolve configuration without inspecting secrets.
note: >
  Prefer Fence Rider for installation and upgrades in ecosol apps. It generates
  a value-free shell script; the caller must execute it, and SecretSpec resolves
  configuration in the child process. Site, product, and environment come from
  the configured controls rather than copied values or agent-visible exports.
  Keep consent and upgrade policy explicit in the calling script.
  OWASP recommends minimizing sensitive data in agent context; Forge reads
  manifest inputs from its process environment. Fence Rider is the team's
  implementation choice, not an OWASP or Forge requirement. It resolves the
  whole profile and does not redact Forge output or isolate credentials.
  This check recognizes literal command text in package scripts, not external
  helpers or shell aliases. Suppress it for an intentionally maintained alternative.
  https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html#8-data-protection-privacy
  https://developer.atlassian.com/platform/forge/manifest-reference/environment/
  https://github.com/ibuchanan/ranch-rig-fence-rider
rule:
  kind: pair
  has:
    field: value
    kind: string
    regex: '(^|[\s"'';&|(])forge[ \t]+install([\s"'';&|)]|$)'
  inside:
    kind: object
    inside:
      kind: pair
      has:
        field: key
        regex: '^"scripts"$'
      inside:
        kind: object
        inside:
          kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
