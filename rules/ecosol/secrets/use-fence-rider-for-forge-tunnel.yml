id: use-fence-rider-for-forge-tunnel
language: Json
severity: info
message: >
  Replace direct `forge tunnel` with an executed Fence Rider script to map runtime-scope variables for tunneling.
note: >
  Prefer Fence Rider for tunnels in ecosol apps. Resolving ordinary variables
  with secretspec run is not enough: Forge's tunnel reads runtime values from
  FORGE_USER_VAR_<name>. Fence Rider generates a script that maps the effective
  runtime-scope members to that prefix and clears stale ambient prefixed names.
  Generate and execute the script; generation alone does not start Forge.
  Tunnel uploads nothing and does not replace deployed runtime-variable setup.
  A connected tunnel contacts Forge and redirects development invocations;
  using a wrapper does not authorize that change. The full profile reaches
  Forge, and output is unredacted. This check recognizes literal forge tunnel
  text in package scripts, not external helpers, aliases, or shell semantics.
  Fence Rider is a team convention, not a Forge requirement. Suppress this
  check for an intentionally maintained alternative.
  https://developer.atlassian.com/platform/forge/environments-and-versions/#environment-variables
  https://github.com/ibuchanan/ranch-rig-fence-rider/blob/main/docs/how-to/runtime.md#tunnel-during-development
rule:
  kind: pair
  has:
    field: value
    kind: string
    regex: '(^|[\s"'';&|(])forge[ \t]+tunnel([\s"'';&|)]|$)'
  inside:
    kind: object
    inside:
      kind: pair
      has:
        field: key
        regex: '^"scripts"$'
      inside:
        kind: object
        inside:
          kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  category: secrets
  references:
    - https://developer.atlassian.com/platform/forge/environments-and-versions/#environment-variables
    - https://github.com/ibuchanan/ranch-rig-fence-rider/blob/main/docs/how-to/runtime.md#tunnel-during-development
  precision: low
  impact: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests identify literal direct tunnel text and accept guarded generated execution, aliases and non-script contexts. An equivalent maintained helper can already map runtime variables correctly. Effective FORGE_USER_VAR values, stale-prefix cleanup, authorization and actual execution remain assessment gaps. Evidence: rule-tests/ecosol/secrets/use-fence-rider-for-forge-tunnel.test.yml (valid/invalid) and rule-tests/__snapshots__/use-fence-rider-for-forge-tunnel-snapshot.yml."
  impact-rationale: Forge documents special tunnel environment variables; Fence Rider supplies the team's mapping workflow. Genuine missing or stale mapping can make development invocations behave incorrectly and waste debugging time. Direct tunneling is supported and wrapper choice does not establish production damage, unauthorized access or credential isolation.
