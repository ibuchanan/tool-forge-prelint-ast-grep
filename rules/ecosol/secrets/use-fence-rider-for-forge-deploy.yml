id: use-fence-rider-for-forge-deploy
language: Json
severity: info
message: >
  Replace direct `forge deploy` with an executed Fence Rider script to resolve configuration without inspecting secrets.
note: >
  Prefer Fence Rider for deployment in ecosol apps. It generates a value-free
  shell script; the caller must execute it, and SecretSpec resolves the configured
  inputs without embedding credentials in package scripts or agent-visible exports.
  Deployment does not upload runtime variables. When runtime values change,
  upload them separately and then deploy to the same app and environment;
  unchanged values do not need uploading before every deployment.
  OWASP recommends minimizing sensitive data in agent context. Fence Rider is
  the team's implementation choice, not an OWASP or Forge requirement. It
  resolves the whole profile and does not redact Forge output or isolate credentials.
  This check recognizes literal command text in package scripts, not external
  helpers or shell aliases. Suppress it for an intentionally maintained alternative.
  https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html#8-data-protection-privacy
  https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
  https://github.com/ibuchanan/ranch-rig-fence-rider
rule:
  kind: pair
  has:
    field: value
    kind: string
    regex: '(^|[\s"'';&|(])forge[ \t]+deploy([\s"'';&|)]|$)'
  inside:
    kind: object
    inside:
      kind: pair
      has:
        field: key
        regex: '^"scripts"$'
      inside:
        kind: object
        inside:
          kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  category: secrets
  references:
    - https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html#8-data-protection-privacy
    - https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
    - https://github.com/ibuchanan/ranch-rig-fence-rider
  precision: low
  impact: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests identify direct deploy text and accept Fence Rider, helpers and unrelated commands. Direct Forge CLI use is supported and an existing resolver may safely supply configuration. Shell semantics, actual secret handling and maintained alternatives remain assessment gaps; this is a team implementation preference, not proof of disclosure. Evidence: rule-tests/ecosol/secrets/use-fence-rider-for-forge-deploy.test.yml (valid/invalid) and rule-tests/__snapshots__/use-fence-rider-for-forge-deploy-snapshot.yml."
  impact-rationale: The references support resolving configuration without putting secrets in agent context. Genuine divergence from the intended delivery workflow can cause missing environment inputs or deployment rework. Direct Forge deployment alone is not unsafe; Fence Rider neither isolates credentials nor redacts output, so high security impact is not assigned to wrapper choice.
