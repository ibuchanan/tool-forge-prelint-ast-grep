id: use-fence-rider-for-forge-lint
language: Json
severity: info
message: >
  Replace direct `forge lint` with an executed Fence Rider script to resolve configuration without inspecting secrets.
note: >
  Prefer Fence Rider for Forge lint in ecosol apps, except the direct root
  scripts.lint:check:forge value `forge lint` maintained by Drop Calf Prelint.
  Only that command (with ordinary whitespace) is exempt; flags, wrappers,
  chaining and other script names retain this advisory preference. The exception
  does not establish that required environment inputs exist or are safe.
  Forge parses manifest inputs
  from its process environment even during validation. Generate and execute the
  Fence Rider lint script so SecretSpec supplies configuration, instead of
  asking a coding agent to read real dotenv files or print resolved values to
  diagnose missing inputs. SecretSpec's value-free check reports can diagnose
  resolution without disclosing credentials.
  OWASP recommends minimizing sensitive data in agent context. Fence Rider is
  the team's implementation choice, not an OWASP or Forge requirement. It
  resolves the whole profile and does not redact Forge output or isolate credentials.
  This check recognizes literal command text in package scripts, not external
  helpers or shell aliases. Suppress it for an intentionally maintained alternative.
  https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html#8-data-protection-privacy
  https://developer.atlassian.com/platform/forge/manifest-reference/environment/
  https://secretspec.dev/reference/cli/#check
  https://github.com/ibuchanan/ranch-rig-fence-rider
rule:
  kind: pair
  has:
    field: value
    kind: string
    regex: '(^|[\s"'';&|(])forge[ \t]+lint([\s"'';&|)]|$)'
  not:
    all:
      - has:
          field: key
          regex: '^"lint:check:forge"$'
      - has:
          field: value
          regex: '^"[ \t]*forge[ \t]+lint[ \t]*"$'
  inside:
    kind: object
    inside:
      kind: pair
      has:
        field: key
        regex: '^"scripts"$'
      inside:
        kind: object
        inside:
          kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  category: secrets
  references:
    - https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html#8-data-protection-privacy
    - https://developer.atlassian.com/platform/forge/manifest-reference/environment/
    - https://secretspec.dev/reference/cli/#check
    - https://github.com/ibuchanan/ranch-rig-fence-rider
  precision: low
  impact: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests distinguish literal Forge lint from Fence Rider, helpers and unrelated contexts. Direct validation can already receive environment inputs safely. Shell parsing, actual resolution, secret exposure and equivalent maintained workflows remain assessment gaps; missing the team's wrapper is not a Forge or OWASP violation. Evidence: rule-tests/ecosol/secrets/use-fence-rider-for-forge-lint.test.yml (valid/invalid) and rule-tests/__snapshots__/use-fence-rider-for-forge-lint-snapshot.yml."
  impact-rationale: Forge environment and SecretSpec check guidance support diagnosing configuration without disclosing values. Genuine failure to resolve inputs can block validation and delay delivery. No sensitive value or disclosure flow is detected, and adopting Fence Rider alone does not make tool output safe.
