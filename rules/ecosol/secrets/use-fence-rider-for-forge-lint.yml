id: use-fence-rider-for-forge-lint
language: Json
severity: info
message: >
  Replace direct `forge lint` with an executed Fence Rider script to resolve configuration without inspecting secrets.
note: >
  Prefer Fence Rider for Forge lint in ecosol apps. Forge parses manifest inputs
  from its process environment even during validation. Generate and execute the
  Fence Rider lint script so SecretSpec supplies configuration, instead of
  asking a coding agent to read real dotenv files or print resolved values to
  diagnose missing inputs. SecretSpec's value-free check reports can diagnose
  resolution without disclosing credentials.
  OWASP recommends minimizing sensitive data in agent context. Fence Rider is
  the team's implementation choice, not an OWASP or Forge requirement. It
  resolves the whole profile and does not redact Forge output or isolate credentials.
  This check recognizes literal command text in package scripts, not external
  helpers or shell aliases. Suppress it for an intentionally maintained alternative.
  https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html#8-data-protection-privacy
  https://developer.atlassian.com/platform/forge/manifest-reference/environment/
  https://secretspec.dev/reference/cli/#check
  https://github.com/ibuchanan/ranch-rig-fence-rider
rule:
  kind: pair
  has:
    field: value
    kind: string
    regex: '(^|[\s"'';&|(])forge[ \t]+lint([\s"'';&|)]|$)'
  inside:
    kind: object
    inside:
      kind: pair
      has:
        field: key
        regex: '^"scripts"$'
      inside:
        kind: object
        inside:
          kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
