id: require-fence-rider-script-execution
language: Json
severity: warning
message: >
  Fence Rider only prints this Forge script. Capture it successfully, then execute it with `sh -c`.
note: >
  Fence Rider deploy, lint, install, uninstall, and tunnel print shell scripts;
  they do not execute Forge. Use a guarded capture followed by execution, such
  as cmd=$(fence-rider deploy) && sh -c "$cmd" sh. The guard preserves generation
  failures, and the final sh supplies the generated script's positional zero.
  Variables uploads directly and doctor reports checks, so neither needs this
  execution wrapper. This check only recognizes a whole package-script value
  containing a bare generator command and simple literal arguments. Help and
  version requests are excluded. It does not trace assignments, composed
  commands, script aliases, quoting, or redirection. Suppress it for a script
  intentionally used only to print generated text. No autofix is supplied:
  executing a generated command may change remote state and requires permission.
  https://developer.atlassian.com/platform/forge/cli-reference/
  https://github.com/ibuchanan/ranch-rig-fence-rider/blob/main/docs/how-to/installation.md#run-a-short-script
rule:
  kind: pair
  has:
    field: value
    kind: string
    all:
      - regex: '^"[ \t]*fence-rider[ \t]+(deploy|lint|install|uninstall|tunnel)([ \t]+[^"\\$`;&|<>()]+)?[ \t]*"$'
      - not:
          regex: '(^|[ \t])(-h|--help|--version)([ \t]|"$)'
  inside:
    kind: object
    inside:
      kind: pair
      has:
        field: key
        regex: '^"scripts"$'
      inside:
        kind: object
        inside:
          kind: document
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
metadata:
  category: secrets
  references:
    - https://developer.atlassian.com/platform/forge/cli-reference/
    - https://github.com/ibuchanan/ranch-rig-fence-rider/blob/main/docs/how-to/installation.md#run-a-short-script
  precision: low
  impact: medium
  scope-profile: [unique]
  scope-rationale: Preserve package.json files with only node_modules excluded; tests and generated dist/coverage/specs package scripts remain included unlike the shared baseline. This does not establish Forge-app identity; ticket 08 owns scope normalization.
  precision-rationale: "Tests flag bare generators with literal arguments, excluding help, redirection, capture, aliases and non-script contexts. A bare generator can intentionally print reviewed text as the note allows; eventual execution and user intent are unresolved assessment gaps. Ordinary intentional printing can therefore match. Evidence: rule-tests/ecosol/secrets/require-fence-rider-script-execution.test.yml (valid/invalid) and rule-tests/__snapshots__/require-fence-rider-script-execution-snapshot.yml."
  impact-rationale: Fence Rider documents generation separately from execution. If a script meant to lint/deploy/install only prints text, required work is silently omitted and delivery can stall or report false success. This is bounded workflow harm; executing generated remote changes still requires separate permission.
