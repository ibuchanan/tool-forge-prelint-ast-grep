id: use-forge-ahead-logging
language: Json
severity: hint
message: >
  Add `@forge-ahead/logging` for structured & redacted Forge logging.
note: >
  Use `@forge-ahead/logging` for structured and redacted logging
  instead of backing into those features with ad hoc console.log calls
  that can leak unredacted payloads or blow up log volume.
  This rule assumes package.json belongs to a Forge app: in a monorepo, a
  workspace root or an internal shared library's package.json will also
  match — even one that imports @forge packages without being deployable
  itself. manifest.yml is the real signal for "is this a Forge app," and
  ast-grep can't check whether that file exists, so scope the scan to your
  Forge app directories rather than the whole monorepo.
  https://github.com/ibuchanan/forge-ahead-logging
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      stopBy: end
      kind: pair
      regex: '"@forge-ahead/logging"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
metadata:
  references: ["https://github.com/ibuchanan/forge-ahead-logging"]
  category: forge-ahead
  scope-profile: [unique]
  scope-rationale: Preserve package.json files with only node_modules excluded; tests and generated dist/coverage/specs packages remain included rather than the shared baseline. App identity is not resolved from this file; ticket 08 owns scope normalization.
  precision: medium
  precision-rationale: "Tests accept the preferred package and flag absence in Forge and express-only examples. The descendant-key check does not establish production dependency placement, app identity, redaction configuration or logger use; those are assessment gaps. Equivalent safe logging is possible. Evidence: rule-tests/ecosol/forge-ahead/use-forge-ahead-logging.test.yml (valid/invalid) and rule-tests/__snapshots__/use-forge-ahead-logging-snapshot.yml."
  impact: low
  impact-rationale: The referenced package provides a shared structured/redacted logger. Failing this dependency convention creates maintenance divergence; it does not establish sensitive logging, excessive volume or that installing the package makes logging safe.
