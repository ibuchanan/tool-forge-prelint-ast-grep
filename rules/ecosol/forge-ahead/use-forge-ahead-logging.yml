id: use-forge-ahead-logging
language: Json
severity: info
message: >
  Consider adding `@forge-ahead/logging` to `dependencies` for shared Forge logging helpers.
note: >
  This advisory checks a direct root dependencies entry for the team's preferred
  logging helpers. Drop Calf seeds the package, but its references are owner-managed;
  intentional removal or equivalent safe logging may warrant review and suppression
  rather than installation. A declaration does not prove logger use, compatibility,
  redaction configuration or safe log volume. Scope scans to Forge app directories:
  workspace roots and shared libraries also match, and ast-grep cannot check for
  manifest.yml in another file. Capability tags do not establish app identity.
  https://github.com/ibuchanan/forge-ahead-logging
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '^"dependencies"\s*:'
      has:
        kind: object
        has:
          kind: pair
          regex: '^"@forge-ahead/logging"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: [capability:forge-ahead]
  references:
    - https://github.com/ibuchanan/forge-ahead-logging
    - https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/forge-ahead.ts
  category: forge-ahead
  scope-profile: [package-json, tests]
  precision: medium
  precision-rationale: "Tests accept direct root production declarations with generated and owner-selected references and flag missing, development-only, nested and unrelated keys, including non-Forge packages. App identity, intentional owner removal, reference validity, logger use and redaction configuration remain assessment gaps; equivalent safe logging is possible. Evidence: rule-tests/ecosol/forge-ahead/use-forge-ahead-logging.test.yml and rule-tests/__snapshots__/use-forge-ahead-logging-snapshot.yml; scripts/check-fixtures.sh scans generated dependency declarations and isolated mutations."
  impact: low
  impact-rationale: The referenced package provides a shared structured/redacted logger. Failing this dependency convention creates maintenance divergence; it does not establish sensitive logging, excessive volume or that installing the package makes logging safe.
