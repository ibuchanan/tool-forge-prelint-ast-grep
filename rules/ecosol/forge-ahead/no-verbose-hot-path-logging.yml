id: no-verbose-hot-path-logging
language: TypeScript
severity: info
message: >
  Use @forge-ahead/logging's createForgeLogger instead of console.log,
  console.warn, console.error, console.info, or console.debug in Forge
  backend hot paths.
note: >
  Logging entire events, payloads, or resolver arguments
  can increase log volume and expose sensitive data.
  createForgeLogger({ name }) gives a structured logger
  (logger.info({ ... }, "message"), logger.debug({ ... }, "message")).
  See use-forge-ahead-logging-for-backend.
  See Forge cost optimisation guidance on logging best practices:
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
  https://github.com/ibuchanan/forge-ahead-logging
rule:
  kind: call_expression
  regex: '(?is)^console\.(log|warn|error|info|debug)\('
files:
  - "**/external/**"
  - "**/import-lifecycle/**"
  - "**/resolvers/**"
  - "**/src/index.ts"
ignores:
  - "**/*.spec.*"
  - "**/*.test.*"
  - "**/__tests__/**"
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
  - "**/test/**"
  - "**/tests/**"
metadata:
  references:
    - https://developer.atlassian.com/platform/forge/optimise-forge-costs/
    - https://github.com/ibuchanan/forge-ahead-logging
  category: forge-ahead
  scope-profile: [unique]
  scope-rationale: Preserve resolvers, external and import-lifecycle directories plus the exact src/index.ts entrypoint, without adding backend directories or other entrypoint extensions. This reviewed server-layout convention differs from the standard backend envelope and does not classify shared code automatically. Apply the shared baseline and complete test exclusions; build, vendors and fixtures remain eligible within the positive paths.
  precision: high
  precision-rationale: "Tests flag direct console.log/error calls, including a harmless startup literal, and accept the preferred logger or no logging. This directly detects the team's console-call prohibition, not verbosity, sensitive payloads or measured hotness. Lexically shadowed console and logger aliases are untested assessment gaps. Evidence: rule-tests/ecosol/forge-ahead/no-verbose-hot-path-logging.test.yml (valid/invalid) and rule-tests/__snapshots__/no-verbose-hot-path-logging-snapshot.yml."
  impact: low
  impact-rationale: Forge cost guidance and the logger reference support controlling logging and consistent structure. Genuine bypass of the chosen logger adds local diagnostic inconsistency; this rule does not inspect payload sensitivity or call frequency, so it does not establish credential exposure or substantial log cost.
