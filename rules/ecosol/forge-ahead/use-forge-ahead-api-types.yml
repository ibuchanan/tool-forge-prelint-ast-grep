id: use-forge-ahead-api-types
language: Json
severity: hint
message: >
  Add `@forge-ahead/atlassian-api-types` when this Forge app uses `@forge/api`.
note: >
  Apps that call Atlassian product APIs through @forge/api
  should depend on @forge-ahead/atlassian-api-types
  so request and response mappings can use generated Atlassian API types.
  Frontend-only or event-only apps do not need this package
  unless they also make Atlassian API calls.
  https://github.com/ibuchanan/forge-ahead-atlassian-api-types
rule:
  kind: object
  inside:
    kind: document
  all:
    - has:
        stopBy: end
        kind: pair
        regex: '"dependencies"\s*:'
        has:
          stopBy: end
          kind: string_content
          regex: "^@forge/api$"
    - not:
        has:
          kind: pair
          regex: '"@forge-ahead/atlassian-api-types"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
