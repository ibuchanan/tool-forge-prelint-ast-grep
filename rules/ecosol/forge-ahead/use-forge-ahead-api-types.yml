id: use-forge-ahead-api-types
language: Json
severity: info
message: >
  Consider adding `@forge-ahead/atlassian-api-types` to `dependencies` when this app uses `@forge/api`.
note: >
  This advisory checks a direct root dependencies entry when @forge/api is
  declared there. Generated Atlassian API types can reduce local type maintenance;
  the declaration does not prove product API calls, compatible types or actual use.
  Drop Calf seeds this package unconditionally, but its references are owner-managed.
  Intentional removal, frontend-only apps or equivalent local types may warrant
  review and suppression rather than installation. Scope scans to Forge app
  directories; dependency keys and capability tags do not establish app identity.
  https://github.com/ibuchanan/forge-ahead-atlassian-api-types
rule:
  kind: object
  inside:
    kind: document
  all:
    - has:
        kind: pair
        regex: '^"dependencies"\s*:'
        has:
          kind: object
          has:
            kind: pair
            regex: '^"@forge/api"\s*:'
    - not:
        has:
          kind: pair
          regex: '^"dependencies"\s*:'
          has:
            kind: object
            has:
              kind: pair
              regex: '^"@forge-ahead/atlassian-api-types"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: [capability:forge-ahead]
  references:
    - https://github.com/ibuchanan/forge-ahead-atlassian-api-types
    - https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/forge-ahead.ts
  category: forge-ahead
  scope-profile: [package-json, tests]
  precision: medium
  precision-rationale: "Tests require direct root production keys for both @forge/api applicability and the types helper, reject nested/unrelated/development-only entries and accept generated and owner-selected references. Depending on @forge/api does not prove product API calls or app identity; intentional removal, equivalent local types, reference validity and actual use remain assessment gaps. Evidence: rule-tests/ecosol/forge-ahead/use-forge-ahead-api-types.test.yml and rule-tests/__snapshots__/use-forge-ahead-api-types-snapshot.yml; scripts/check-fixtures.sh scans generated dependency declarations and isolated mutations."
  impact: low
  impact-rationale: The package supplies generated API types and mapping helpers; omitting the team's preferred source can add type-maintenance and integration-review work. Dependency absence alone does not demonstrate wrong requests or a runtime/security failure.
