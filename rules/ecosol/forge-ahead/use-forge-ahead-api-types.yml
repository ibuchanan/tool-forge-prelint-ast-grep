id: use-forge-ahead-api-types
language: Json
severity: hint
message: >
  Add `@forge-ahead/atlassian-api-types` when this Forge app uses `@forge/api`.
note: >
  Apps that call Atlassian product APIs through @forge/api
  should depend on @forge-ahead/atlassian-api-types
  so request and response mappings can use generated Atlassian API types.
  Frontend-only or event-only apps do not need this package
  unless they also make Atlassian API calls.
  https://github.com/ibuchanan/forge-ahead-atlassian-api-types
rule:
  kind: object
  inside:
    kind: document
  all:
    - has:
        stopBy: end
        kind: pair
        regex: '"dependencies"\s*:'
        has:
          stopBy: end
          kind: string_content
          regex: "^@forge/api$"
    - not:
        has:
          kind: pair
          regex: '"@forge-ahead/atlassian-api-types"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  references: ["https://github.com/ibuchanan/forge-ahead-atlassian-api-types"]
  category: forge-ahead
  scope-profile: [package-json, tests]
  precision: medium
  precision-rationale: "Tests distinguish production @forge/api from bridge/react/resolver/event-only dependencies and accept the preferred types package. Depending on @forge/api does not prove product API calls or a deployable app; equivalent local types and actual package usage remain assessment gaps. Evidence: rule-tests/ecosol/forge-ahead/use-forge-ahead-api-types.test.yml (valid/invalid) and rule-tests/__snapshots__/use-forge-ahead-api-types-snapshot.yml."
  impact: low
  impact-rationale: The package supplies generated API types and mapping helpers; omitting the team's preferred source can add type-maintenance and integration-review work. Dependency absence alone does not demonstrate wrong requests or a runtime/security failure.
