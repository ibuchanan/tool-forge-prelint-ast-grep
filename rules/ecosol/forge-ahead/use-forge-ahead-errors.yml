id: use-forge-ahead-errors
language: Json
severity: info
message: >
  Consider adding `@forge-ahead/errors` to `dependencies` for shared Forge error helpers.
note: >
  This advisory checks a direct root dependencies entry for the team's preferred
  error helpers. Drop Calf seeds the package, but its references are owner-managed;
  intentional removal or equivalent error normalization may warrant review and
  suppression rather than installation. A declaration does not prove helper use,
  compatibility or correct error handling. Scope scans to Forge app directories:
  workspace roots and shared libraries also match, and ast-grep cannot check for
  manifest.yml in another file. Capability tags do not establish app identity.
  https://github.com/ibuchanan/forge-ahead-errors
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '^"dependencies"\s*:'
      has:
        kind: object
        has:
          kind: pair
          regex: '^"@forge-ahead/errors"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: [capability:forge-ahead]
  references:
    - https://github.com/ibuchanan/forge-ahead-errors
    - https://github.com/ibuchanan/ranch-rig-drop-calf/blob/be86d05309a32f7eef8988205208c17ca94e7a4c/src/capabilities/forge-ahead.ts
  category: forge-ahead
  scope-profile: [package-json, tests]
  precision: medium
  precision-rationale: "Tests accept direct root production declarations with generated and owner-selected references and flag missing, development-only, nested and unrelated keys, including non-Forge packages. App identity, intentional owner removal, reference validity and actual helper use remain assessment gaps; equivalent error normalization may already exist. Evidence: rule-tests/ecosol/forge-ahead/use-forge-ahead-errors.test.yml and rule-tests/__snapshots__/use-forge-ahead-errors-snapshot.yml; scripts/check-fixtures.sh scans generated dependency declarations and isolated mutations."
  impact: low
  impact-rationale: The referenced helpers standardize error handling; genuine convention drift increases local maintenance and debugging friction. Missing this particular dependency is not evidence that errors are unhandled or application availability is compromised.
