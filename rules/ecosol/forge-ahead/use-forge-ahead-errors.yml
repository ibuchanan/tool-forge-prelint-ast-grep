id: use-forge-ahead-errors
language: Json
severity: hint
message: >
  Add `@forge-ahead/errors` to keep Forge error handling consistent.
note: >
  ecosol Forge apps should depend on @forge-ahead/errors
  as a production dependency so resolver, event, and API paths
  can share common error helpers and error normalization.
  This rule assumes package.json belongs to a Forge app: in a monorepo, a
  workspace root or an internal shared library's package.json will also
  match — even one that imports @forge packages without being deployable
  itself. manifest.yml is the real signal for "is this a Forge app," and
  ast-grep can't check whether that file exists, so scope the scan to your
  Forge app directories rather than the whole monorepo.
  https://github.com/ibuchanan/forge-ahead-errors
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      stopBy: end
      kind: pair
      regex: '"@forge-ahead/errors"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
