id: use-forge-ahead-errors
language: Json
severity: hint
message: >
  Add `@forge-ahead/errors` to keep Forge error handling consistent.
note: >
  ecosol Forge apps should depend on @forge-ahead/errors
  as a production dependency so resolver, event, and API paths
  can share common error helpers and error normalization.
  This rule assumes package.json belongs to a Forge app: in a monorepo, a
  workspace root or an internal shared library's package.json will also
  match — even one that imports @forge packages without being deployable
  itself. manifest.yml is the real signal for "is this a Forge app," and
  ast-grep can't check whether that file exists, so scope the scan to your
  Forge app directories rather than the whole monorepo.
  https://github.com/ibuchanan/forge-ahead-errors
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      stopBy: end
      kind: pair
      regex: '"@forge-ahead/errors"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
metadata:
  references: ["https://github.com/ibuchanan/forge-ahead-errors"]
  category: forge-ahead
  scope-profile: [unique]
  scope-rationale: Preserve package.json files with only node_modules excluded; tests and generated dist/coverage/specs packages remain included rather than the shared baseline. App identity is not resolved from this file; ticket 08 owns scope normalization.
  precision: medium
  precision-rationale: "Tests accept the preferred package and flag its absence even in an express-only package. The descendant-key check does not prove production dependency placement, app identity or actual helper usage; those are assessment gaps. Equivalent error normalization may already exist. Evidence: rule-tests/ecosol/forge-ahead/use-forge-ahead-errors.test.yml (valid/invalid) and rule-tests/__snapshots__/use-forge-ahead-errors-snapshot.yml."
  impact: low
  impact-rationale: The referenced helpers standardize error handling; genuine convention drift increases local maintenance and debugging friction. Missing this particular dependency is not evidence that errors are unhandled or application availability is compromised.
