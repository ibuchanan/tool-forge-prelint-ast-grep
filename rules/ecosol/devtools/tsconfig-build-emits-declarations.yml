id: tsconfig-build-emits-declarations
language: Json
severity: warning
message: >
  Bring tsconfig.build.json back in line with the repo-init baseline: extend
  tsconfig.json and emit declarations.
note: >
  repo-init's tsconfig.build.json sets extends: "./tsconfig.json" and
  compilerOptions.declaration: true so the build output stays type-checked
  against the same settings as local development while still emitting the
  .d.ts files consumers need.
  TypeScript TSConfig extends reference:
  https://www.typescriptlang.org/tsconfig/#extends
  TypeScript declaration emit reference:
  https://www.typescriptlang.org/tsconfig/#declaration
rule:
  kind: object
  inside:
    kind: document
  any:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:\s*"\./tsconfig\.json"'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"declaration"\s*:\s*true'
files:
  - "**/tsconfig.build.json"
ignores:
  - "**/node_modules/**"
