id: lefthook-runs-generated-guards
language: Yaml
severity: warning
message: >
  Bring lefthook.yml back in line with the repo-init hook template.
note: >
  repo-init wires pre-commit gitleaks, lint, format, and typecheck guards
  plus a pre-push test guard. Repos that predate the hook template, or that
  hand-edited lefthook.yml, commonly drop one of these on the way.
  Lefthook configuration reference:
  https://lefthook.dev/configuration/
  Gitleaks project:
  https://github.com/gitleaks/gitleaks
rule:
  kind: block_mapping
  inside:
    kind: block_node
    inside:
      kind: document
  any:
    - not:
        has:
          kind: block_mapping_pair
          regex: 'pre-commit:[\s\S]*?gitleaks:'
    - not:
        has:
          kind: block_mapping_pair
          regex: 'pre-commit:[\s\S]*?\blint:'
    - not:
        has:
          kind: block_mapping_pair
          regex: 'pre-commit:[\s\S]*?\bformat:'
    - not:
        has:
          kind: block_mapping_pair
          regex: 'pre-commit:[\s\S]*?\btypecheck:'
    - not:
        has:
          kind: block_mapping_pair
          regex: 'pre-push:[\s\S]*?\btest:'
files:
  - "**/lefthook.yml"
ignores:
  - "**/node_modules/**"
