id: use-forge-ahead-errors
language: Json
severity: hint
message: >
  Add `@forge-ahead/errors` to keep Forge error handling consistent.
note: >
  ecosol Forge apps should depend on @forge-ahead/errors as a production
  dependency so resolver, event, and API paths can share common error helpers
  and error normalization.
  npm dependencies reference:
  https://docs.npmjs.com/cli/v11/configuring-npm/package-json/#dependencies
rule:
  kind: object
  inside:
    kind: document
  all:
    - has:
        stopBy: end
        kind: pair
        regex: '"dependencies"\s*:'
        has:
          stopBy: end
          kind: string_content
          regex: "^@forge/(api|react|bridge|kvs|events|resolver)$"
    - not:
        has:
          kind: pair
          regex: '"@forge-ahead/errors"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
