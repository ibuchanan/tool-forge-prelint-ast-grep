id: require-biome-vcs-default-branch
language: Json
severity: warning
message: >
  Set the Biome config's vcs.defaultBranch to "main".
note: >
  vcs.defaultBranch pinned to "main" is needed for correct changed-file detection.
  Biome configuration reference:
  https://biomejs.dev/reference/configuration/
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '"vcs"\s*:[\s\S]*?"defaultBranch"\s*:\s*"main"'
files:
  - "**/biome.json"
  - "**/biome.jsonc"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  references: ["https://biomejs.dev/reference/configuration/"]
  category: devtools
  scope-profile: [unique]
  scope-rationale: "Select only the reviewed configuration filenames: biome.json and biome.jsonc. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  precision: medium
  precision-rationale: "Tests accept main and flag master or absence. The matcher cannot establish the actual repository default branch, resolve inheritance or observe changed-file invocation; a different real default is legitimate. Those contextual distinctions are assessment gaps. Evidence: rule-tests/ecosol/devtools/require-biome-vcs-default-branch.test.yml (valid/invalid) and rule-tests/__snapshots__/require-biome-vcs-default-branch-snapshot.yml."
  impact: low
  impact-rationale: Biome uses defaultBranch for changed-file comparisons; a genuinely wrong baseline can produce incomplete or noisy local checks and rework. The main spelling is the team convention, not a universal branch requirement.
