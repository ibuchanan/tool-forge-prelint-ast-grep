id: require-biome-vcs-default-branch
language: Json
severity: warning
message: >
  Set the Biome config's vcs.defaultBranch to "main".
note: >
  vcs.defaultBranch pinned to "main" is needed for correct changed-file detection.
  Biome configuration reference:
  https://biomejs.dev/reference/configuration/
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '"vcs"\s*:[\s\S]*?"defaultBranch"\s*:\s*"main"'
files:
  - "**/biome.json"
  - "**/biome.jsonc"
ignores:
  - "**/node_modules/**"
