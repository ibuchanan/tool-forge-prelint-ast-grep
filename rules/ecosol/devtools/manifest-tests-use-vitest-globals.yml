id: manifest-tests-use-vitest-globals
language: TypeScript
severity: warning
message: >
  Enable Vitest globals in vitest.config.ts
  (defineConfig({ test: { globals: true } }))
  so tests can use describe/it/expect without importing them.
note: >
  Forge test suites commonly assume global describe/it/expect.
  Without test.globals,
  those tests fail to run until every file adds explicit Vitest imports.
  Vitest globals config reference:
  https://vitest.dev/config/#globals
rule:
  kind: call_expression
  has:
    field: function
    kind: identifier
    regex: "^defineConfig$"
  not:
    has:
      stopBy: end
      kind: pair
      regex: "^globals\\s*:\\s*true\\b"
files:
  - "**/vitest.config.ts"
ignores:
  - "**/node_modules/**"
