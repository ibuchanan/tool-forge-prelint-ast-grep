id: use-repo-init-biome-config
language: Json
severity: warning
message: >
  Bring biome.json back in line with the repo-init baseline.
note: >
  repo-init's biome.json enables vcs.useIgnoreFile so Biome respects
  .gitignore, pins vcs.defaultBranch to "main" for correct changed-file
  detection, excludes .projen/** and dist from files.includes since those
  are generated, and sets formatter.indentStyle to "space".
  Biome configuration reference:
  https://biomejs.dev/reference/configuration/
rule:
  kind: object
  inside:
    kind: document
  any:
    - not:
        has:
          kind: pair
          regex: '"vcs"\s*:[\s\S]*?"useIgnoreFile"\s*:\s*true'
    - not:
        has:
          kind: pair
          regex: '"vcs"\s*:[\s\S]*?"defaultBranch"\s*:\s*"main"'
    - not:
        has:
          kind: pair
          regex: '"files"\s*:[\s\S]*?"!\.projen'
    - not:
        has:
          kind: pair
          regex: '"files"\s*:[\s\S]*?"!dist'
    - not:
        has:
          kind: pair
          regex: '"formatter"\s*:[\s\S]*?"indentStyle"\s*:\s*"space"'
files:
  - "**/biome.json"
ignores:
  - "**/node_modules/**"
