id: require-vitest-globals-false
language: TypeScript
severity: info
message: >
  Set test.globals to false in vitest.config.ts; import test APIs explicitly.
note: >
  Drop Calf disables Vitest globals so tests import describe, test, and expect
  explicitly instead of relying on ambient names. This rule checks
  defineConfig calls in vitest.config.ts.
  Vitest globals config reference:
  https://vitest.dev/config/#globals
rule:
  kind: call_expression
  has:
    field: function
    kind: identifier
    regex: "^defineConfig$"
  not:
    has:
      stopBy: end
      kind: pair
      regex: "^test\\s*:"
      has:
        stopBy: end
        kind: pair
        regex: "^globals\\s*:\\s*false\\b"
files:
  - "**/vitest.config.ts"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  references: ["https://vitest.dev/config/#globals"]
  category: devtools
  scope-profile: [unique]
  scope-rationale: "Select only the reviewed configuration filenames: vitest.config.ts, not alternative Vitest config extensions. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  precision: medium
  precision-rationale: "Tests cover defineConfig with globals false, true, missing test/globals and an unrelated top-level globals property. The name is not import-resolved and omitted globals defaults to false; aliases, inherited/merged configs and effective defaults remain assessment gaps. This enforces an explicit declaration, not proven ambient-global use. Evidence: rule-tests/ecosol/devtools/require-vitest-globals-false.test.yml (valid/invalid) and rule-tests/__snapshots__/require-vitest-globals-false-snapshot.yml."
  impact: low
  impact-rationale: Vitest documents optional globals and explicit API imports. Omitting the team's explicit false setting primarily obscures test conventions; it does not itself break tests or prove unsafe runtime behavior.
