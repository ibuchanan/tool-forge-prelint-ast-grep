id: tsconfig-for-forge-bundler
language: Json
severity: warning
message: >
  Keep tsconfig.json's Forge bundler baseline compilerOptions compatible.
note: >
  repo-init generates deploy-time compilerOptions with module: "ESNext",
  moduleResolution: "node", jsx: "react-jsx", target: "ES2022", rootDir:
  "src", outDir: "dist", strict: true, and noUncheckedIndexedAccess: true.
  Extra React, type, and strictness options are fine, but these baseline
  values should stay unchanged for Forge's webpack/ts-loader bundler. Use a
  separate tsconfig.typecheck.json for local-only module resolution choices
  such as NodeNext or bundler.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/
rule:
  kind: object
  inside:
    kind: document
  any:
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"module"\s*:\s*"ESNext"'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"moduleResolution"\s*:\s*"node"'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"jsx"\s*:\s*"react-jsx"'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"target"\s*:\s*"ES2022"'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"rootDir"\s*:\s*"src"'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"outDir"\s*:\s*"dist"'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"strict"\s*:\s*true'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"noUncheckedIndexedAccess"\s*:\s*true'
files:
  - "**/tsconfig.json"
ignores:
  - "**/node_modules/**"
