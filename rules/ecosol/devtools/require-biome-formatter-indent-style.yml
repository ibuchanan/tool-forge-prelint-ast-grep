id: require-biome-formatter-indent-style
language: Json
severity: warning
message: >
  Set the Biome config's formatter.indentStyle to "space".
note: >
  formatter.indentStyle: "space" keeps formatting consistent across editors and CI.
  Biome configuration reference:
  https://biomejs.dev/reference/configuration/
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '"formatter"\s*:[\s\S]*?"indentStyle"\s*:\s*"space"'
files:
  - "**/biome.json"
  - "**/biome.jsonc"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  references: ["https://biomejs.dev/reference/configuration/"]
  category: devtools
  scope-profile: [unique]
  scope-rationale: "Select only the reviewed configuration filenames: biome.json and biome.jsonc. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  precision: medium
  precision-rationale: "Tests cover explicit space, tab and absence. A text regex under formatter does not resolve extends or language/override settings; inherited spacing can be compliant. Those effective-configuration distinctions are assessment gaps. Evidence: rule-tests/ecosol/devtools/require-biome-formatter-indent-style.test.yml (valid/invalid) and rule-tests/__snapshots__/require-biome-formatter-indent-style-snapshot.yml."
  impact: low
  impact-rationale: The documented indentStyle controls a team formatting choice; genuine inconsistency creates recoverable diff and editor friction. Tabs are supported, not a security defect.
