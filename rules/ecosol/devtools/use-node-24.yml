id: use-node-24
language: Json
severity: hint
message: >
  Set package.json `engines.node` to `24.x` to match the repo-init baseline.
note: >
  repo-init writes package.json engines.node = "24.x". Older generated repos
  commonly drift on Node version, which can change local, CI, and Forge CLI
  behavior.
  npm engines reference:
  https://docs.npmjs.com/cli/v11/configuring-npm/package-json/#engines
rule:
  all:
    - kind: string_content
      regex: "^@forge/(api|react|bridge|kvs|events|resolver)$"
      inside:
        stopBy: end
        kind: pair
        regex: '"dependencies"\s*:'
    - not:
        inside:
          stopBy: end
          kind: object
          has:
            kind: pair
            regex: '"node"\s*:\s*"24\.x"'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
