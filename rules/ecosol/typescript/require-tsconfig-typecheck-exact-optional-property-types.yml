id: require-tsconfig-typecheck-exact-optional-property-types
language: Json
severity: warning
message: >
  compilerOptions.exactOptionalPropertyTypes
  distinguishes an optional property
  that's absent from one explicitly set to undefined.
note: >
  exactOptionalPropertyTypes
  distinguishes an optional property
  that's absent from one explicitly set to undefined.
  This needs TypeScript's type system;
  Biome's syntax-only linting has no equivalent rule.
  This is the most disruptive flag to adopt:
  it commonly surfaces errors against third-party .d.ts files
  (React's types especially)
  that weren't written with it in mind,
  not just your own code.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#exactOptionalPropertyTypes
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '"compilerOptions"\s*:[\s\S]*?"exactOptionalPropertyTypes"\s*:\s*true'
files:
  - "**/tsconfig.typecheck.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  tags: [capability:typescript]
  references:
    ["https://www.typescriptlang.org/tsconfig/#exactOptionalPropertyTypes"]
  category: typescript
  precision: medium
  scope-profile: [unique]
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.typecheck.json, not every tsconfig variant. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  precision-rationale: "Tests cover explicit true, false and omission with or without extends. The regex does not resolve inherited options, strict prerequisites or actual assignments; a compliant inherited flag can match. These are assessment gaps, not demonstrated incorrect optional-property behavior. Evidence: rule-tests/ecosol/typescript/require-tsconfig-typecheck-exact-optional-property-types.test.yml (valid/invalid) and rule-tests/__snapshots__/require-tsconfig-typecheck-exact-optional-property-types-snapshot.yml."
  impact: medium
  impact-rationale: TypeScript documents distinguishing absent optional properties from explicit undefined. Where application logic relies on that difference, genuine loss of checking can permit bounded data-handling mistakes. Missing the flag alone proves neither such code nor a security issue; adoption can also require third-party type changes.
