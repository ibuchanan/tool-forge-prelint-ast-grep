id: require-tsconfig-typecheck-extends-no-emit
language: Json
severity: error
message: >
  tsconfig.typecheck.json should extend tsconfig.json
  and set compilerOptions.noEmit to true,
  since this file exists purely to run `tsc --noEmit`.
note: >
  tsconfig.typecheck.json sets extends: "./tsconfig.json"
  and compilerOptions.noEmit: true
  so it type-checks against the same baseline
  without emitting files that would collide with tsconfig.build.json's output.
  This file exists purely to run `tsc --noEmit`.
  TypeScript TSConfig extends reference:
  https://www.typescriptlang.org/tsconfig/#extends
  TypeScript noEmit reference:
  https://www.typescriptlang.org/tsconfig/#noEmit
rule:
  kind: object
  inside:
    kind: document
  any:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:\s*"\./tsconfig\.json"'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"noEmit"\s*:\s*true'
files:
  - "**/tsconfig.typecheck.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  references:
    - https://www.typescriptlang.org/tsconfig/#extends
    - https://www.typescriptlang.org/tsconfig/#noEmit
  category: typescript
  precision: medium
  scope-profile: [unique]
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.typecheck.json, not every tsconfig variant. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  precision-rationale: "Tests cover literal ./tsconfig.json plus explicit noEmit and missing components. Effective inheritance, equivalent base paths/arrays and CLI noEmit can be compliant; regex matching does not load the base or validate nested structure. These are assessment gaps, not detected emit collisions. Evidence: rule-tests/ecosol/typescript/require-tsconfig-typecheck-extends-no-emit.test.yml (valid/invalid) and rule-tests/__snapshots__/require-tsconfig-typecheck-extends-no-emit-snapshot.yml."
  impact: medium
  impact-rationale: TypeScript documents extends and noEmit; genuine baseline divergence or unintended typecheck emit can produce inconsistent diagnostics or collide with local build artifacts. Harm is bounded workflow/build rework, not proof of a broken deployment.
