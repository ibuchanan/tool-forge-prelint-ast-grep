id: require-tsconfig-typecheck-no-implicit-override
language: Json
severity: info
message: >
  compilerOptions.noImplicitOverride
  requires an explicit override keyword
  when a subclass member overrides a base class member.
note: >
  noImplicitOverride requires an explicit override keyword
  when a subclass member overrides a base class member.
  This needs TypeScript's class hierarchy type information;
  Biome's syntax-only linting has no equivalent rule.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#noImplicitOverride
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '"compilerOptions"\s*:[\s\S]*?"noImplicitOverride"\s*:\s*true'
files:
  - "**/tsconfig.typecheck.json"
ignores:
  - "**/node_modules/**"
metadata:
  references: ["https://www.typescriptlang.org/tsconfig/#noImplicitOverride"]
  category: typescript
  precision: medium
  scope-profile: [unique]
  scope-rationale: Preserve only tsconfig.typecheck.json and node_modules exclusion; dist/coverage/specs and test-local configurations remain included. This filename has no standard artifact selector; ticket 08 owns scope normalization.
  precision-rationale: "Tests cover explicit true, false and omission including extends-only input. Effective inherited values and the presence of relevant class hierarchies are unresolved; nested regex structure and CLI settings are assessment gaps. The rule detects a config signal, not a faulty override. Evidence: rule-tests/ecosol/typescript/require-tsconfig-typecheck-no-implicit-override.test.yml (valid/invalid) and rule-tests/__snapshots__/require-tsconfig-typecheck-no-implicit-override-snapshot.yml."
  impact: low
  impact-rationale: TypeScript documents explicit override annotations as a refactoring check. Genuine omission weakens local inheritance-intent feedback and adds maintainability risk; the matcher does not support assuming a material application defect from the setting alone.
