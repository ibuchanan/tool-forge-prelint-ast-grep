id: require-tsconfig-out-dir-dist
language: Json
severity: error
message: >
  compilerOptions.outDir should be "dist",
  the standard local build output location.
note: >
  compilerOptions.outDir: "dist" is the standard local build output placeholder.
  Forge's bundler emits through its own temporary build directory
  regardless of this setting.
  Drift here still breaks
  local tsc output layout,
  .gitignore assumptions,
  and IDE tooling.
  This rule assumes a single self-contained tsconfig.json:
  ast-grep can't follow extends to a shared base config,
  so it backs off entirely whenever extends is present
  rather than risk flagging a setting that's actually inherited.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#outDir
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"outDir"\s*:\s*"dist"'
files:
  - "**/tsconfig.json"
ignores:
  - "**/node_modules/**"
metadata:
  references: ["https://www.typescriptlang.org/tsconfig/#outDir"]
  category: typescript
  precision: medium
  scope-profile: [unique]
  scope-rationale: Preserve only tsconfig.json and node_modules exclusion; dist/coverage/specs and test-local configs remain included. There is no standard tsconfig selector; ticket 08 owns normalization.
  precision-rationale: "Tests cover dist, another output path, missing options and extends backoff. The matcher cannot establish local layout requirements, effective CLI overrides or whether output is needed; alternative valid directories and nested regex structure are assessment gaps. Inherited configs are deliberately not checked. Evidence: rule-tests/ecosol/typescript/require-tsconfig-out-dir-dist.test.yml (valid/invalid) and rule-tests/__snapshots__/require-tsconfig-out-dir-dist-snapshot.yml."
  impact: low
  impact-rationale: TypeScript outDir selects local emit layout; divergence from dist can create bounded ignore/IDE and local build friction. Forge's bundler uses its own output, and a different valid local directory is not substantial application failure.
