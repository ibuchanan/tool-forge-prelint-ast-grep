id: require-tsconfig-typecheck-no-unchecked-indexed-access
language: Json
severity: info
message: >
  compilerOptions.noUncheckedIndexedAccess
  adds undefined to the type of array/object index access results.
note: >
  noUncheckedIndexedAccess
  adds undefined to the type of array/object index access results.
  This needs TypeScript's type system;
  Biome's syntax-only linting has no equivalent rule.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#noUncheckedIndexedAccess
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '"compilerOptions"\s*:[\s\S]*?"noUncheckedIndexedAccess"\s*:\s*true'
files:
  - "**/tsconfig.typecheck.json"
ignores:
  - "**/node_modules/**"
metadata:
  references:
    ["https://www.typescriptlang.org/tsconfig/#noUncheckedIndexedAccess"]
  category: typescript
  precision: medium
  scope-profile: [unique]
  scope-rationale: Preserve only tsconfig.typecheck.json and node_modules exclusion; dist/coverage/specs and test-local configurations remain included. This filename has no standard artifact selector; ticket 08 owns scope normalization.
  precision-rationale: "Tests cover explicit true, false and omission with extends. Effective inherited values and real array/object accesses remain assessment gaps; the regex cannot show a missing bounds/existence check or actual undefined result. Evidence: rule-tests/ecosol/typescript/require-tsconfig-typecheck-no-unchecked-indexed-access.test.yml (valid/invalid) and rule-tests/__snapshots__/require-tsconfig-typecheck-no-unchecked-indexed-access-snapshot.yml."
  impact: medium
  impact-rationale: TypeScript documents adding undefined to unchecked indexed results. Genuine loss of this guard can allow absent entries to cause bounded functionality failures where callers assume presence; missing configuration alone does not demonstrate such a failure.
