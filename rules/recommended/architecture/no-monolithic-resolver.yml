id: no-monolithic-resolver
language: TypeScript
severity: warning
message: >
  A resolver file with five or more resolver.define() actions is likely too broad.
note: >
  Split unrelated resolver actions by domain or feature
  so validation, API use, and error handling remain easy to review.
  See the Forge resolver reference for resolver.define() and getDefinitions():
  https://developer.atlassian.com/platform/forge/runtime-reference/forge-resolver/
rule:
  kind: program
  regex: 'resolver\.define\([\s\S]*resolver\.define\([\s\S]*resolver\.define\([\s\S]*resolver\.define\([\s\S]*resolver\.define\('
files:
  - "**/resolvers/**"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  precision: low
  precision-rationale: "Tests distinguish four from five resolver.define text occurrences. The whole-program regex does not establish unrelated domains, imported receiver identity or maintainability problems; a cohesive five-action resolver is an untested compliant case. Evidence: rule-tests/recommended/architecture/no-monolithic-resolver.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-monolithic-resolver-snapshot.yml."
  impact: low
  impact-rationale: Combining unrelated actions can make validation and error-handling review harder. The resolver reference describes action registration, not a five-action limit; the supported consequence is local maintainability, not proven application failure.
  scope-profile:
    - unique
  scope-rationale: Review resolver action aggregation only within resolvers directories, not every standard backend path. Preserve this subject-specific narrowing and test-local resolver examples, with the shared baseline. No backend, external or import-lifecycle expansion is approved.
  category: architecture
  references:
    - https://developer.atlassian.com/platform/forge/runtime-reference/forge-resolver/
