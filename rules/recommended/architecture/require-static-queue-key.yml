id: require-static-queue-key
language: TypeScript
severity: warning
message: >
  Queue keys must be string literals when constructing @forge/events Queue objects.
  Static keys can be validated against manifest consumer queue declarations.
note: >
  Dynamic queue keys hide the Async Events queue-to-consumer contract from automated checks.
  Use new Queue({ key: 'queue-name' }).
  The Queue key must match the queue field in the manifest consumer module. See:
  https://developer.atlassian.com/platform/forge/runtime-reference/async-events-api/
rule:
  all:
    - inside:
        stopBy: end
        kind: program
        has:
          any:
            - pattern: "import { Queue } from '@forge/events'"
            - pattern: "import { $$$A, Queue, $$$B } from '@forge/events'"
            - pattern: 'import { Queue } from "@forge/events"'
            - pattern: 'import { $$$A, Queue, $$$B } from "@forge/events"'
    - pattern:
        context: "{ key: $KEY }"
        selector: pair
    - inside:
        stopBy: end
        pattern: "new Queue($$$)"
    - not:
        any:
          - pattern:
              context: "{ key: '$$$KEY' }"
              selector: pair
          - pattern:
              context: '{ key: "$$$KEY" }'
              selector: pair
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: high
  precision-rationale: "Tests show an imported Queue with a literal key versus a variable key. The explicit literal-key convention is directly checked for visible named imports. Import aliases, lexical shadowing and whether the value matches a manifest consumer are untested gaps; correctness of the route is not established. Evidence: rule-tests/recommended/architecture/require-static-queue-key.test.yml (valid/invalid cases) and rule-tests/__snapshots__/require-static-queue-key-snapshot.yml."
  impact: medium
  impact-rationale: A wrong queue key can prevent intended async consumer processing. Async Events documents queue-to-consumer matching; nonliteral keys impede static review but a controlled variable is not inherently misrouted, and literals can still be wrong.
  scope-profile:
    - frontend
    - backend
    - tests
  category: architecture
  references:
    - https://developer.atlassian.com/platform/forge/runtime-reference/async-events-api/
