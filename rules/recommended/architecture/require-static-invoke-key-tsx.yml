id: require-static-invoke-key-tsx
language: Tsx
severity: warning
message: >
  invoke() keys must be string literals.
  Static keys can be validated against manifest.yml and resolver definitions.
note: >
  Dynamic invoke keys hide the frontend/backend contract from automated checks.
  Use invoke('function-key', payload) with a literal key.
  The invoke() functionKey must exactly match the resolver.define() key. See:
  https://developer.atlassian.com/platform/forge/custom-ui-bridge/invoke/
rule:
  any:
    - pattern: invoke($KEY)
    - pattern: invoke($KEY, $$$ARGS)
  not:
    any:
      - pattern: "invoke('$$$KEY')"
      - pattern: 'invoke("$$$KEY")'
      - pattern: "invoke('$$$KEY', $$$ARGS)"
      - pattern: 'invoke("$$$KEY", $$$ARGS)'
files:
  - "**/frontend/**"
ignores:
  - "**/node_modules/**"
metadata:
  precision: medium
  precision-rationale: "Tests distinguish literal keys from variables with and without payload. A nonliteral directly violates the literal-key convention when this is Forge invoke, but import identity and value propagation are unresolved; local functions and controlled constants are untested gaps. No resolver/manifest contract is cross-checked. Evidence: rule-tests/recommended/architecture/require-static-invoke-key-tsx.test.yml (valid/invalid cases) and rule-tests/__snapshots__/require-static-invoke-key-tsx-snapshot.yml."
  impact: medium
  impact-rationale: An incorrect resolver key can prevent a frontend request from reaching its intended action. Official invoke documentation requires matching the resolver definition; static literals improve reviewability but do not themselves guarantee correct routing, and controlled variables can work.
  scope-profile:
    - unique
  scope-rationale: Preserve **/frontend/** with only **/node_modules/** excluded. Tests, dist, coverage and specs remain scanned rather than applying the shared frontend baseline/test exclusions. Ticket 08 owns normalization.
  category: architecture
  references:
    - https://developer.atlassian.com/platform/forge/custom-ui-bridge/invoke/
