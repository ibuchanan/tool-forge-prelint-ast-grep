id: require-size-check-script
language: Json
severity: info
message: >
  Add `size:check` to build before running size-limit.
note: >
  When size-limit tooling is configured (a "size-limit" config key or an
  @size-limit/* devDependency), run `npm run build && size-limit` via
  `size:check`. Drop Calf's pre-push hook delegates to `check`, which selects
  `size:check`; lint owns aggregate composition and git-hooks owns hook wiring.
  A legacy `size` script alone does not satisfy this command convention;
  a separate owner-authored `size` script may coexist with `size:check`.
  See https://github.com/ai/size-limit
rule:
  all:
    - any:
        - kind: pair
          regex: '^"size-limit"\s*:'
        - kind: string_content
          regex: "^@size-limit/"
          inside:
            stopBy: end
            kind: pair
            regex: '"devDependencies"\s*:'
    - not:
        inside:
          stopBy: end
          kind: object
          has:
            kind: pair
            regex: '"size:check"\s*:\s*"npm run build && size-limit"'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags:
    - capability:size-limit
  precision: medium
  precision-rationale: "Tests distinguish configured size-limit tooling with the exact required command from missing, legacy or different scripts. Equivalent build/check orchestration and external size-limit configuration are untested gaps; textual command inequality is not proof that size checking is absent. Evidence: rule-tests/recommended/package-scripts/require-size-check-script.test.yml (valid/invalid cases) and rule-tests/__snapshots__/require-size-check-script-snapshot.yml."
  impact: low
  impact-rationale: Missing build-before-measure orchestration can leave stale measurements or a failing check aggregate, selected by the generated pre-push hook. Aggregate composition belongs to lint and hook wiring to git-hooks. The direct consequence is local tooling friction, not proven excessive spend.
  scope-profile:
    - package-json
    - tests
  category: package-scripts
  references:
    - https://github.com/ai/size-limit
