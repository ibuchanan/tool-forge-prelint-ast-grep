id: no-write-flags-in-readonly-script
language: Json
severity: warning
message: >
  Read-only script should not include a write-back flag; move it to the `:fix` variant instead.
note: >
  Scripts like `lint`, `lint:check`, `lint:check:*`, and `format:check` are expected to be read-only
  gates in CI. A `--write` or `--fix` flag on one of these makes the "check" script
  mutate files, which hides drift instead of failing on it.
  See the Biome CLI reference for the read-only vs --write distinction:
  https://biomejs.dev/reference/cli/
rule:
  kind: pair
  regex: '^"(lint|lint:check(:[a-zA-Z0-9_-]+)*|format:check)"\s*:\s*"[^"]*(--write|--fix)[^"]*"'
  inside:
    stopBy: end
    kind: pair
    regex: '"scripts"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  # Biome supplies read-only formatting/lint tasks; lint owns read-only aggregate
  # wiring. This guard materially checks both conventions, not exclusive ownership.
  tags: [capability:biome, capability:lint]
  precision: medium
  precision-rationale: "The regex finds --write or --fix text in lint/lint:check/lint:check:*/format:check script values. Tests distinguish fix variants, but inert quoted examples, flag substrings and tool-specific meanings are untested gaps; the rule is not a shell parser. Evidence: rule-tests/recommended/package-scripts/no-write-flags-in-readonly-script.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-write-flags-in-readonly-script-snapshot.yml."
  impact: medium
  impact-rationale: A genuinely mutating check can rewrite source during CI and hide formatting or lint drift instead of reporting it, reducing gate reliability. Biome documents the write flag, but a textual flag match alone does not prove mutation.
  scope-profile:
    - package-json
    - tests
  category: package-scripts
  references:
    - https://biomejs.dev/reference/cli/
