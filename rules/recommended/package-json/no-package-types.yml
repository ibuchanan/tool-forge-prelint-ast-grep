id: no-package-types
language: Json
severity: warning
message: >
  package.json shouldn't declare types. Forge apps are deployables, not
  libraries, and nothing in the Forge pipeline reads this field.
note: >
  types points consumers at this package's type declarations — a Forge app
  is never consumed as a dependency, so there are no consumers to point at
  anything. Declaring it implies a library-consumption contract that
  doesn't exist.
  npm package.json fields reference:
  https://docs.npmjs.com/cli/v11/configuring-npm/package-json/#types
rule:
  kind: object
  inside:
    kind: document
  has:
    kind: pair
    regex: '^"types"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: "The root package object directly declares types in tests, but the matcher cannot establish deployable identity or inspect a neighboring manifest. Internal libraries legitimately declare this field; their treatment and package self-reference uses remain assessment gaps. Evidence: rule-tests/recommended/package-json/no-package-types.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-package-types-snapshot.yml."
  impact: low
  impact-rationale: Library-facing metadata on a deployable can mislead maintainers about its entrypoint/consumer contract. Official npm documentation describes these fields, but harmless unused fields do not establish a build or runtime failure; shared library packages may require them.
  scope-profile:
    - package-json
    - tests
  category: package-json
  references:
    - https://docs.npmjs.com/cli/v11/configuring-npm/package-json/#types
