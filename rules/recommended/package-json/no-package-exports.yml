id: no-package-exports
language: Json
severity: warning
message: >
  package.json shouldn't declare exports. Forge apps are deployables, not
  libraries, and nothing in the Forge pipeline reads this field.
note: >
  exports defines the public API surface a package offers to whatever
  imports it — a Forge app has no consumers to offer an API surface to, and
  Forge's bundler resolves entrypoints from manifest.yml regardless.
  Declaring it implies a library-consumption contract that doesn't exist.
  npm package.json fields reference:
  https://docs.npmjs.com/cli/v11/configuring-npm/package-json/#exports
rule:
  kind: object
  inside:
    kind: document
  has:
    kind: pair
    regex: '^"exports"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
