id: no-unsafe-custom-ui-csp
language: Yaml
severity: warning
message: >
  Unsafe script CSP weakens execution restrictions. Prefer bundled scripts or hash-pinned
  sources.
note: >
  Reviews unsafe-inline, unsafe-eval and exact wildcard entries only under
  permissions.content.scripts, including flow YAML. Style unsafe-inline has different
  implications and is not matched; hash-pinned script entries are not unrestricted inline
  execution. Supported CSP exceptions require review, not automatic removal. See
  https://top10.owasp.org/2025/A02_2025-Security_Misconfiguration/ and
  https://developer.atlassian.com/platform/forge/manifest-reference/permissions/ Inline scalar
  declarations with YAML anchors/tags are inspected; alias references and merge expansion are
  not resolved.
utils:
  mapping-pair:
    any:
      - kind: block_mapping_pair
      - kind: flow_pair
rule:
  all:
    - any:
        - kind: plain_scalar
          regex: "^[\"']*(unsafe-inline|unsafe-eval|\\*)[\"']*$"
        - kind: single_quote_scalar
          regex: "^[\"']*(unsafe-inline|unsafe-eval|\\*)[\"']*$"
        - kind: double_quote_scalar
          regex: "^[\"']*(unsafe-inline|unsafe-eval|\\*)[\"']*$"
    - inside:
        stopBy:
          matches: mapping-pair
        any:
          - kind: block_mapping_pair
          - kind: flow_pair
        has:
          field: key
          regex: '^["'']?(?:scripts)["'']?$'
        inside:
          stopBy:
            matches: mapping-pair
          any:
            - kind: block_mapping_pair
            - kind: flow_pair
          has:
            field: key
            regex: '^["'']?(?:content)["'']?$'
          inside:
            stopBy:
              matches: mapping-pair
            any:
              - kind: block_mapping_pair
              - kind: flow_pair
            has:
              field: key
              regex: '^["'']?(?:permissions)["'']?$'
            not:
              inside:
                stopBy: end
                matches: mapping-pair
files:
  - "**/manifest.yml"
  - "**/manifest.yaml"
ignores:
  - "**/node_modules/**"
metadata:
  precision: medium
  precision-rationale: "Path-aware block/flow matchers distinguish unsafe script entries from styles, hashes, URLs and unrelated keys; inline anchors are covered. A supported reviewed script exception can still be justified. Alias/merge resolution and whether unsafe execution is actually needed remain assessment gaps. Evidence: rule-tests/recommended/security/no-unsafe-custom-ui-csp.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-unsafe-custom-ui-csp-snapshot.yml."
  impact: high
  impact-rationale: Permitting unrestricted inline or evaluated scripts weakens CSP defense in depth. If untrusted script text reaches execution, weakened restrictions can permit sensitive-data access or user-context actions. The configuration alone does not establish an exploitable injection.
  scope-profile:
    - unique
  scope-rationale: Preserve **/manifest.yml and **/manifest.yaml with only **/node_modules/** excluded. Test-local manifests, dist, coverage and specs remain scanned, unlike the shared manifest/tests baseline. Ticket 08 owns normalization.
  category: security
  references:
    - https://developer.atlassian.com/platform/forge/manifest-reference/permissions/
    - https://top10.owasp.org/2025/A02_2025-Security_Misconfiguration/
  owasp: A02:2025
