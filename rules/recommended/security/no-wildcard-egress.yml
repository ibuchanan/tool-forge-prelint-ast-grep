id: no-wildcard-egress
language: Yaml
severity: warning
message: >
  Do not use wildcard external egress in Forge manifests.
  Declare the specific backend or client domains the app needs.
note: >
  Wildcard egress makes data movement harder to audit
  and can block security review.
  Prefer a narrow permissions.external.fetch allowlist.
  See the Forge runtime egress permissions reference for declaring specific domains:
  https://developer.atlassian.com/platform/forge/runtime-egress-permissions/
rule:
  all:
    - kind: block_sequence_item
      regex: '^\s*-\s*["'']?\*["'']?\s*$'
    - inside:
        stopBy: end
        kind: block_mapping_pair
        regex: 'external\s*:'
files:
  - "**/manifest.yml"
  - "**/manifest.yaml"
ignores:
  - "**/node_modules/**"
