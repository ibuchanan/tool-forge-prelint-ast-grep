id: no-wildcard-egress
language: Yaml
severity: warning
message: >
  Wildcard fetch egress permits every destination. Prefer an explicit domain allowlist.
note: >
  Reviews exact wildcard fetch entries under permissions.external.fetch.backend/client, in
  scalar or address-object form, including flow YAML. Wildcards are supported and may be
  intentional (for example client popup workflows); a match is not an invalid manifest or proof
  of exfiltration. Specific host wildcards and remote-reference resolution are outside this
  check. See https://top10.owasp.org/2025/A02_2025-Security_Misconfiguration/ and
  https://developer.atlassian.com/platform/forge/manifest-reference/permissions/ Inline scalar
  declarations with YAML anchors/tags are inspected; alias references and merge expansion are
  not resolved.
utils:
  mapping-pair:
    any:
      - kind: block_mapping_pair
      - kind: flow_pair
rule:
  all:
    - any:
        - kind: plain_scalar
          regex: "^[\"']\\*[\"']$"
        - kind: single_quote_scalar
          regex: "^[\"']\\*[\"']$"
        - kind: double_quote_scalar
          regex: "^[\"']\\*[\"']$"
    - any:
        - inside:
            stopBy:
              matches: mapping-pair
            any:
              - kind: block_mapping_pair
              - kind: flow_pair
            has:
              field: key
              regex: '^["'']?(?:backend|client)["'']?$'
            inside:
              stopBy:
                matches: mapping-pair
              any:
                - kind: block_mapping_pair
                - kind: flow_pair
              has:
                field: key
                regex: '^["'']?(?:fetch)["'']?$'
              inside:
                stopBy:
                  matches: mapping-pair
                any:
                  - kind: block_mapping_pair
                  - kind: flow_pair
                has:
                  field: key
                  regex: '^["'']?(?:external)["'']?$'
                inside:
                  stopBy:
                    matches: mapping-pair
                  any:
                    - kind: block_mapping_pair
                    - kind: flow_pair
                  has:
                    field: key
                    regex: '^["'']?(?:permissions)["'']?$'
                  not:
                    inside:
                      stopBy: end
                      matches: mapping-pair
        - inside:
            stopBy:
              matches: mapping-pair
            any:
              - kind: block_mapping_pair
              - kind: flow_pair
            has:
              field: key
              regex: '^["'']?(?:address)["'']?$'
            inside:
              stopBy:
                matches: mapping-pair
              any:
                - kind: block_mapping_pair
                - kind: flow_pair
              has:
                field: key
                regex: '^["'']?(?:backend|client)["'']?$'
              inside:
                stopBy:
                  matches: mapping-pair
                any:
                  - kind: block_mapping_pair
                  - kind: flow_pair
                has:
                  field: key
                  regex: '^["'']?(?:fetch)["'']?$'
                inside:
                  stopBy:
                    matches: mapping-pair
                  any:
                    - kind: block_mapping_pair
                    - kind: flow_pair
                  has:
                    field: key
                    regex: '^["'']?(?:external)["'']?$'
                  inside:
                    stopBy:
                      matches: mapping-pair
                    any:
                      - kind: block_mapping_pair
                      - kind: flow_pair
                    has:
                      field: key
                      regex: '^["'']?(?:permissions)["'']?$'
                    not:
                      inside:
                        stopBy: end
                        matches: mapping-pair
files:
  - "**/manifest.yml"
  - "**/manifest.yaml"
ignores:
  - "**/node_modules/**"
metadata:
  precision: medium
  precision-rationale: "Exact wildcard fetch scalars and address objects are distinguished from domain wildcards, unrelated locations and nested metadata in block/flow YAML. The note permits intentional wildcard workflows, so narrowing feasibility needs review. Alias/merge expansion and remote-reference resolution remain gaps. Evidence: rule-tests/recommended/security/no-wildcard-egress.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-wildcard-egress-snapshot.yml."
  impact: high
  impact-rationale: An unrestricted fetch destination removes a destination allowlist barrier; if compromised code or untrusted destinations are used, sensitive data can be sent to arbitrary hosts. Supported wildcard workflows and a declaration alone do not prove exfiltration.
  scope-profile:
    - unique
  scope-rationale: Preserve **/manifest.yml and **/manifest.yaml with only **/node_modules/** excluded. Test-local manifests, dist, coverage and specs remain scanned, unlike the shared manifest/tests baseline. Ticket 08 owns normalization.
  category: security
  references:
    - https://developer.atlassian.com/platform/forge/manifest-reference/permissions/
    - https://top10.owasp.org/2025/A02_2025-Security_Misconfiguration/
  owasp: A02:2025
