id: no-wildcard-egress
language: Yaml
severity: warning
message: >
  Wildcard fetch or script egress permits every destination. Prefer an explicit domain allowlist.
note: >
  Reviews exact wildcard entries under permissions.external.fetch.backend/client and
  permissions.external.scripts, in scalar or address-object form, including flow YAML.
  Wildcards are supported and may be intentional (for example client popup workflows); a match is not an invalid manifest or proof
  of exfiltration. Specific host wildcards and remote-reference resolution are outside this
  check. See https://top10.owasp.org/2025/A02_2025-Security_Misconfiguration/ and
  https://developer.atlassian.com/platform/forge/manifest-reference/permissions/ Inline scalar
  declarations with YAML anchors/tags are inspected; alias references, merge expansion and
  block scalars are not resolved.
utils:
  mapping-pair:
    any:
      - kind: block_mapping_pair
      - kind: flow_pair
rule:
  all:
    - any:
        - kind: plain_scalar
          regex: "^[\"']\\*[\"']$"
        - kind: single_quote_scalar
          regex: "^[\"']\\*[\"']$"
        - kind: double_quote_scalar
          regex: "^[\"']\\*[\"']$"
    - any:
        - inside:
            stopBy:
              matches: mapping-pair
            matches: mapping-pair
            has:
              field: key
              regex: '^["'']?scripts["'']?$'
            inside:
              stopBy:
                matches: mapping-pair
              matches: mapping-pair
              has:
                field: key
                regex: '^["'']?external["'']?$'
              inside:
                stopBy:
                  matches: mapping-pair
                matches: mapping-pair
                has:
                  field: key
                  regex: '^["'']?permissions["'']?$'
                not:
                  inside:
                    stopBy: end
                    matches: mapping-pair
        - inside:
            stopBy:
              matches: mapping-pair
            any:
              - kind: block_mapping_pair
              - kind: flow_pair
            has:
              field: key
              regex: '^["'']?(?:backend|client)["'']?$'
            inside:
              stopBy:
                matches: mapping-pair
              any:
                - kind: block_mapping_pair
                - kind: flow_pair
              has:
                field: key
                regex: '^["'']?(?:fetch)["'']?$'
              inside:
                stopBy:
                  matches: mapping-pair
                any:
                  - kind: block_mapping_pair
                  - kind: flow_pair
                has:
                  field: key
                  regex: '^["'']?(?:external)["'']?$'
                inside:
                  stopBy:
                    matches: mapping-pair
                  any:
                    - kind: block_mapping_pair
                    - kind: flow_pair
                  has:
                    field: key
                    regex: '^["'']?(?:permissions)["'']?$'
                  not:
                    inside:
                      stopBy: end
                      matches: mapping-pair
        - inside:
            stopBy:
              matches: mapping-pair
            matches: mapping-pair
            has:
              field: key
              regex: '^["'']?address["'']?$'
            inside:
              stopBy:
                matches: mapping-pair
              matches: mapping-pair
              has:
                field: key
                regex: '^["'']?scripts["'']?$'
              inside:
                stopBy:
                  matches: mapping-pair
                matches: mapping-pair
                has:
                  field: key
                  regex: '^["'']?external["'']?$'
                inside:
                  stopBy:
                    matches: mapping-pair
                  matches: mapping-pair
                  has:
                    field: key
                    regex: '^["'']?permissions["'']?$'
                  not:
                    inside:
                      stopBy: end
                      matches: mapping-pair
        - inside:
            stopBy:
              matches: mapping-pair
            any:
              - kind: block_mapping_pair
              - kind: flow_pair
            has:
              field: key
              regex: '^["'']?(?:address)["'']?$'
            inside:
              stopBy:
                matches: mapping-pair
              any:
                - kind: block_mapping_pair
                - kind: flow_pair
              has:
                field: key
                regex: '^["'']?(?:backend|client)["'']?$'
              inside:
                stopBy:
                  matches: mapping-pair
                any:
                  - kind: block_mapping_pair
                  - kind: flow_pair
                has:
                  field: key
                  regex: '^["'']?(?:fetch)["'']?$'
                inside:
                  stopBy:
                    matches: mapping-pair
                  any:
                    - kind: block_mapping_pair
                    - kind: flow_pair
                  has:
                    field: key
                    regex: '^["'']?(?:external)["'']?$'
                  inside:
                    stopBy:
                      matches: mapping-pair
                    any:
                      - kind: block_mapping_pair
                      - kind: flow_pair
                    has:
                      field: key
                      regex: '^["'']?(?:permissions)["'']?$'
                    not:
                      inside:
                        stopBy: end
                        matches: mapping-pair
files:
  - "**/manifest.yaml"
  - "**/manifest.yml"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: "Exact wildcard fetch and external script scalars/address objects are distinguished from domain wildcards, unrelated locations and nested metadata in block/flow YAML, including quoted keys and inline anchors/tags. Intentional wildcard workflows still need review. Aliases, merges, block scalars and remote-reference resolution remain gaps. Evidence: rule-tests/recommended/security/no-wildcard-egress.test.yml, rule-tests/__snapshots__/no-wildcard-egress-snapshot.yml and scripts/check-security-fixtures.sh (manifest routing in all four tiers)."
  impact: high
  impact-rationale: An unrestricted fetch or script destination removes a destination allowlist barrier; if compromised code or untrusted destinations are used, sensitive data can be sent to arbitrary hosts or scripts loaded from them. Supported wildcard workflows and a declaration alone do not prove exfiltration or script injection.
  scope-profile:
    - manifest
    - tests
  category: security
  references:
    - https://developer.atlassian.com/platform/forge/manifest-reference/permissions/
    - https://top10.owasp.org/2025/A02_2025-Security_Misconfiguration/
  owasp: A02:2025
