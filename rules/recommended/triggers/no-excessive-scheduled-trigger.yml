id: no-excessive-scheduled-trigger
language: Yaml
severity: info
message: >
  Avoid five-minute or hourly scheduled triggers for slow-changing data.
note: >
  Frequent schedules increase invocations and product API calls.
  Prefer product triggers, webhooks, or a slower interval
  when the data does not change often.
  See Forge cost optimisation guidance on choosing the right trigger interval:
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
rule:
  all:
    - kind: block_mapping_pair
      regex: '^\s*interval\s*:\s*(fiveMinutes?|hour|hourly)'
    - inside:
        stopBy: end
        kind: block_mapping_pair
        regex: 'scheduledTrigger\s*:'
files:
  - "**/manifest.yaml"
  - "**/manifest.yml"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: low
  precision-rationale: "Tests distinguish fiveMinutes/hour from day/week schedules. The block regex does not observe data-change rate, invocation volume or required freshness; legitimate frequent polling routinely matches. Flow YAML and workload justification remain assessment gaps. Evidence: rule-tests/recommended/triggers/no-excessive-scheduled-trigger.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-excessive-scheduled-trigger-snapshot.yml."
  impact: medium
  impact-rationale: Unnecessarily frequent polling repeats invocations and product calls, increasing bounded operational cost. Cost guidance recommends suitable intervals; a frequent schedule alone does not prove waste or a runaway loop.
  scope-profile:
    - manifest
    - tests
  category: triggers
  references:
    - https://developer.atlassian.com/platform/forge/optimise-forge-costs/
