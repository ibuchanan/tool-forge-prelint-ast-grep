id: review-high-function-memory
language: Yaml
severity: warning
message: >
  Review high Forge function memory allocation against observed usage.
note: >
  memoryMiB directly affects GB-second consumption. Keep higher allocations only
  when profiling shows they reduce duration enough or are required for workload size.
  See Forge cost optimisation guidance on function memory and compute costs:
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
rule:
  all:
    - kind: block_mapping_pair
      regex: '^\s*memoryMiB\s*:\s*(1024|2048)\b'
    - inside:
        stopBy: end
        kind: block_mapping_pair
        regex: 'functions\s*:'
files:
  - "**/manifest.yaml"
  - "**/manifest.yml"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: low
  precision-rationale: "Tests compare 512 MiB with 1024/2048 MiB under a functions key. The matcher does not profile duration or workload size; supported allocations can be cost-effective. Flow YAML and actual GB-seconds remain assessment gaps. Evidence: rule-tests/recommended/cost/review-high-function-memory.test.yml (valid/invalid cases) and rule-tests/__snapshots__/review-high-function-memory-snapshot.yml."
  impact: medium
  impact-rationale: Unnecessarily high memory can increase memory-times-duration consumption; a larger allocation may instead shorten runtime or be required. Cost guidance requires profiling, not automatic downsizing; a declaration alone proves no spend increase.
  scope-profile:
    - manifest
    - tests
  category: cost
  references:
    - https://developer.atlassian.com/platform/forge/optimise-forge-costs/
