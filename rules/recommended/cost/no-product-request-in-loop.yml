id: no-product-request-in-loop
language: TypeScript
severity: warning
message: >
  Avoid Atlassian product API requests inside loops or array callbacks.
note: >
  Product requests in repeated callbacks often create N+1 API patterns. Prefer
  bulk endpoints, search fields, batching, or bounded pagination.
  See Forge cost optimisation guidance on avoiding N+1 API patterns:
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
rule:
  kind: call_expression
  regex: '^((api\.)?(asUser|asApp)\(\)\.|api\.)?(requestJira|requestConfluence|requestGraph|requestBitbucket)\s*\('
  inside:
    stopBy: end
    any:
      - kind: for_statement
      - kind: for_in_statement
      - kind: while_statement
      - kind: do_statement
      - kind: arrow_function
        inside:
          stopBy: end
          kind: call_expression
          regex: '\.(map|forEach|flatMap|reduce|some|every|filter)\s*\('
      - kind: function_expression
        inside:
          stopBy: end
          kind: call_expression
          regex: '\.(map|forEach|flatMap|reduce|some|every|filter)\s*\('
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
metadata:
  precision: medium
  precision-rationale: "Tests contrast a standalone request with a forEach request. Recognized call names under ancestor loops/callbacks do not establish imported client identity, iteration bounds, immediate execution or availability of bulk alternatives. Bounded pagination and deferred nested functions remain untested contextual gaps. Evidence: rule-tests/recommended/cost/no-product-request-in-loop.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-product-request-in-loop-snapshot.yml."
  impact: medium
  impact-rationale: A genuine avoidable N+1 request sequence increases API traffic, latency and rate-limit pressure. Cost guidance supports bulk/bounded access, but not every loop is excessive; existing pagination can require repeated calls.
  scope-profile:
    - frontend
    - backend
  category: cost
  references:
    - https://developer.atlassian.com/platform/forge/optimise-forge-costs/
