id: review-max-function-timeout
language: Yaml
severity: info
message: >
  Review long Forge function timeout against realistic worst-case runtime.
note: >
  Tighter timeouts make crash and out-of-memory costs more predictable. Keep long
  timeoutSeconds values only when the function genuinely needs them.
  See Forge cost optimisation guidance on function timeouts and compute costs:
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
rule:
  all:
    - kind: block_mapping_pair
      regex: '^\s*timeoutSeconds\s*:\s*(25|[3-9][0-9]|[1-9][0-9]{2,})\b'
    - inside:
        stopBy: end
        kind: block_mapping_pair
        regex: 'functions\s*:'
files:
  - "**/manifest.yaml"
  - "**/manifest.yml"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: low
  precision-rationale: "Tests compare 10 seconds with 25/30 seconds under a functions key. This is a selected regex threshold, not all timeouts or a runtime observation; legitimate long-running functions routinely match. Actual execution duration and cancellation remain assessment gaps. Evidence: rule-tests/recommended/cost/review-max-function-timeout.test.yml (valid/invalid cases) and rule-tests/__snapshots__/review-max-function-timeout-snapshot.yml."
  impact: medium
  impact-rationale: An unnecessarily generous timeout can let stuck work consume compute longer before termination. Cost guidance supports realistic bounds, but a timeout maximum is not billed duration and short limits may break legitimate workloads.
  scope-profile:
    - manifest
    - tests
  category: cost
  references:
    - https://developer.atlassian.com/platform/forge/optimise-forge-costs/
