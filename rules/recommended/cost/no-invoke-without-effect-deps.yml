id: no-invoke-without-effect-deps
language: Tsx
severity: warning
message: >
  invoke() in useEffect should have an explicit dependency array.
note: >
  Effects without a dependency array run after every render and can create
  avoidable resolver invocations. Add stable dependencies or an empty array.
  See Forge cost optimisation guidance on reducing unnecessary invocations:
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
rule:
  kind: call_expression
  regex: '^useEffect\s*\('
  has:
    stopBy: end
    pattern: invoke($$$)
  not:
    regex: '^useEffect\s*\([\s\S]*,\s*[^)]'
files:
  - "**/frontend/**"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: "Tests compare missing dependencies with explicit empty/nonempty arrays. The matcher uses textual argument shape and does not resolve hook/invoke imports or intent. A deliberately every-render effect and commas inside the callback are untested gaps, not proof of excess calls. Evidence: rule-tests/recommended/cost/no-invoke-without-effect-deps.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-invoke-without-effect-deps-snapshot.yml."
  impact: medium
  impact-rationale: Unintended every-render resolver work can increase invocation cost and slow the screen; React documents effect dependency behavior. Deliberately repeated synchronization may be correct and the syntax alone does not establish a runaway render loop.
  scope-profile:
    - frontend
    - tests
  category: cost
  references:
    - https://developer.atlassian.com/platform/forge/optimise-forge-costs/
    - https://react.dev/reference/react/useEffect
