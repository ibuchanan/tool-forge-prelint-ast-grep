id: no-multiple-invokes-in-effect
language: Tsx
severity: warning
message: >
  Multiple invoke() calls in one loading effect can often be batched.
note: >
  Batch related resolver calls into one resolver action when they are needed
  for the same screen state.
  See Forge cost optimisation guidance on reducing unnecessary invocations:
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
rule:
  kind: call_expression
  regex: '^useEffect\s*\([\s\S]*invoke\([\s\S]*invoke\('
files:
  - "**/frontend/**"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: low
  precision-rationale: "Tests contrast one versus two invoke text occurrences inside a useEffect call. It neither resolves imports nor proves independent calls are batchable or executed on every run. Legitimate separate actions routinely match; nested/deferred calls and control flow remain untested gaps. Evidence: rule-tests/recommended/cost/no-multiple-invokes-in-effect.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-multiple-invokes-in-effect-snapshot.yml."
  impact: medium
  impact-rationale: Genuinely redundant screen-loading calls add resolver overhead and latency. Cost guidance supports batching related work, but separate contracts, permissions or caching can justify multiple requests; their count alone does not demonstrate waste.
  scope-profile:
    - frontend
    - tests
  category: cost
  references:
    - https://developer.atlassian.com/platform/forge/optimise-forge-costs/
