id: no-storage-operation-in-loop
language: TypeScript
severity: warning
message: >
  Avoid Forge storage reads and writes inside loops or array callbacks.
note: >
  KVS operations are billed by data volume, and writes are especially expensive.
  Batch operations, query Custom Entities, or reduce the data touched per run.
  See Forge cost optimisation guidance on storage operation costs:
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
rule:
  kind: call_expression
  regex: '^(storage|kvs)\.(get|set|delete|query)\s*\('
  inside:
    stopBy: end
    any:
      - kind: for_statement
      - kind: for_in_statement
      - kind: while_statement
      - kind: do_statement
      - kind: arrow_function
        inside:
          stopBy: end
          kind: call_expression
          regex: '\.(map|forEach|flatMap|reduce|some|every|filter)\s*\('
      - kind: function_expression
        inside:
          stopBy: end
          kind: call_expression
          regex: '\.(map|forEach|flatMap|reduce|some|every|filter)\s*\('
ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
