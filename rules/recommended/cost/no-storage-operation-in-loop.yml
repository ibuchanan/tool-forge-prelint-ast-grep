id: no-storage-operation-in-loop
language: TypeScript
severity: warning
message: >
  Avoid Forge storage reads and writes inside loops or array callbacks.
note: >
  KVS operations are billed by data volume, and writes are especially expensive.
  Batch operations, query Custom Entities, or reduce the data touched per run.
  See Forge cost optimisation guidance on storage operation costs:
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
rule:
  kind: call_expression
  regex: '^(storage|kvs)\.(get|set|delete|query)\s*\('
  inside:
    stopBy: end
    any:
      - kind: for_statement
      - kind: for_in_statement
      - kind: while_statement
      - kind: do_statement
      - kind: arrow_function
        inside:
          stopBy: end
          kind: call_expression
          regex: '\.(map|forEach|flatMap|reduce|some|every|filter)\s*\('
      - kind: function_expression
        inside:
          stopBy: end
          kind: call_expression
          regex: '\.(map|forEach|flatMap|reduce|some|every|filter)\s*\('
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
metadata:
  precision: medium
  precision-rationale: "Tests contrast a standalone storage.get with Promise.all over mapped keys. Receiver names and ancestor callbacks do not establish Forge import identity, operation count or batch feasibility; small independent key access and deferred calls remain untested gaps. Evidence: rule-tests/recommended/cost/no-storage-operation-in-loop.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-storage-operation-in-loop-snapshot.yml."
  impact: medium
  impact-rationale: Avoidable repeated storage reads/writes increase data touched, latency and operational cost. Cost guidance supports reducing work, but the syntax proves neither large volumes nor that a supported batch can replace independent operations.
  scope-profile:
    - frontend
    - backend
  category: cost
  references:
    - https://developer.atlassian.com/platform/forge/optimise-forge-costs/
