id: no-unpaginated-product-search
language: TypeScript
severity: warning
message: >
  Product search/list requests should include explicit pagination.
note: >
  Add maxResults, limit, cursor, startAt, or equivalent pagination so the app
  does not fetch more data than it needs.
  See Forge cost optimisation guidance on bounding API responses:
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
rule:
  kind: call_expression
  regex: '^((api\.)?(asUser|asApp)\(\)\.|api\.)?(requestJira|requestConfluence)\s*\([^)]*(/search|/search\?|/rest/api/[^)]*/search|/wiki/rest/api/[^)]*/search)'
  not:
    regex: "(maxResults|limit|cursor|startAt|nextPage)"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
metadata:
  precision: medium
  precision-rationale: "Tests compare a literal search URL with/without maxResults. The regex recognizes pagination-related tokens but cannot follow options variables, endpoint defaults or imported receiver identity. Bounded server defaults and indirection are untested gaps; absent text does not prove an unbounded response. Evidence: rule-tests/recommended/cost/no-unpaginated-product-search.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-unpaginated-product-search-snapshot.yml."
  impact: medium
  impact-rationale: A genuinely oversized search response adds transfer work and latency, while incorrect page handling can omit needed results. Cost guidance supports bounding API work; the matcher does not prove data loss or substantial consumption.
  scope-profile:
    - frontend
    - backend
  category: cost
  references:
    - https://developer.atlassian.com/platform/forge/optimise-forge-costs/
