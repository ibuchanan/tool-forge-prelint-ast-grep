id: no-unpaginated-product-search-tsx
language: Tsx
severity: warning
message: >
  Product search/list requests should include explicit pagination.
note: >
  Add maxResults, limit, cursor, startAt, or equivalent pagination so the app
  does not fetch more data than it needs.
  See Forge cost optimisation guidance on bounding API responses:
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
rule:
  kind: call_expression
  regex: '^((api\.)?(asUser|asApp)\(\)\.|api\.)?(requestJira|requestConfluence)\s*\([^)]*(/search|/search\?|/rest/api/[^)]*/search|/wiki/rest/api/[^)]*/search)'
  not:
    regex: "(maxResults|limit|cursor|startAt|nextPage)"
ignores:
  - "**/node_modules/**"
  - "**/*.test.tsx"
  - "**/*.spec.tsx"
metadata:
  precision: medium
  precision-rationale: "Tests compare a literal search URL with/without maxResults. The regex recognizes pagination-related tokens but cannot follow options variables, endpoint defaults or imported receiver identity. Bounded server defaults and indirection are untested gaps; absent text does not prove an unbounded response. Evidence: rule-tests/recommended/cost/no-unpaginated-product-search-tsx.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-unpaginated-product-search-tsx-snapshot.yml."
  impact: medium
  impact-rationale: A genuinely oversized search response adds transfer work and latency, while incorrect page handling can omit needed results. Cost guidance supports bounding API work; the matcher does not prove data loss or substantial consumption.
  scope-profile:
    - unique
  scope-rationale: Preserve unrestricted TSX source selection with node_modules and .test.tsx/.spec.tsx exclusions only. Shared dist/coverage/specs and test-directory exclusions are missing; ticket 08 owns normalization.
  category: cost
  references:
    - https://developer.atlassian.com/platform/forge/optimise-forge-costs/
