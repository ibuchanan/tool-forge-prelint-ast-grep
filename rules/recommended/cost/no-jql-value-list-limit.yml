id: no-jql-value-list-limit
message: Avoid returning explicit value lists in JQL fragments. Use query conditions or pagination instead to stay under the 1,000-value limit.
severity: warning
language: TypeScript
rule:
  all:
    - any:
        - kind: template_string
        - kind: binary_expression
        - kind: string
    - regex: "(?i)IN\\s*\\("
    - regex: "\\.join\\s*\\("
    - not:
        regex: "(?i)page|limit|offset|filter"
    - any:
        - inside:
            stopBy: end
            pattern: "{ jql: $$$ }"
        - inside:
            stopBy: end
            pattern: "jql: $VAL"
note: >
  Returning a JQL fragment like `key IN (ISSUE-1, ...)` hits a 1,000-value validation limit in Jira.
  Prefer returning query conditions (e.g., `project = X AND labels = Y`) which bypass this limit entirely.
  See: https://developer.atlassian.com/platform/forge/working-around-jql-1000-limit/
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
metadata:
  precision: medium
  precision-rationale: "Tests cover joined IN lists and a page-named sliced list exemption. The matcher does not count values or trace upstream bounds, and keyword exemptions are textual; a small joined list is an untested compliant case, not proof of exceeding 1,000 values. Evidence: rule-tests/recommended/cost/no-jql-value-list-limit.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-jql-value-list-limit-snapshot.yml."
  impact: medium
  impact-rationale: Actually exceeding the documented JQL function value limit can reject a query and break the dependent search workflow. A joined list below the limit is valid; the matcher does not establish cardinality.
  scope-profile:
    - frontend
    - backend
  category: cost
  references:
    - https://developer.atlassian.com/platform/forge/working-around-jql-1000-limit/
