id: no-verbose-hot-path-logging
language: TypeScript
severity: warning
message: >
  Avoid console.log in Forge backend hot paths.
note: >
  Logging entire events, payloads, or resolver arguments can increase log volume
  and expose sensitive data. Use scoped, redacted debug logs instead.
  See Forge cost optimisation guidance on logging best practices:
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
rule:
  pattern: console.log($$$)
files:
  - "**/resolvers/**"
  - "**/external/**"
  - "**/import-lifecycle/**"
  - "**/src/index.ts"
ignores:
  - "**/node_modules/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
