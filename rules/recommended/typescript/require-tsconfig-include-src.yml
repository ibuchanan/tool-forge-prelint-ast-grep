id: require-tsconfig-include-src
language: Json
severity: warning
message: >
  Bring tsconfig.json's include back in line with the repo-init baseline:
  ["src"].
note: >
  repo-init generates include: ["src"] so tsc's file discovery covers the
  same backend source tree the Forge manifest's handler paths point into.
  If include drifts away from the directory containing your manifest
  handlers, local type-checking silently stops covering files the bundler
  still builds.
  This rule assumes a single self-contained tsconfig.json:
  ast-grep can't follow extends to a shared base config,
  so it backs off entirely whenever extends is present
  rather than risk flagging a setting that's actually inherited.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#include
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"include"\s*:\s*\[[^\]]*"src"'
files:
  - "**/tsconfig.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: "Tests require a literal src array entry, permit additional entries and skip extends. Default discovery, src glob equivalents, files lists and alternate handler directories are untested gaps; missing this exact text need not leave handlers unchecked. Evidence: rule-tests/recommended/typescript/require-tsconfig-include-src.test.yml (valid/invalid cases) and rule-tests/__snapshots__/require-tsconfig-include-src-snapshot.yml."
  impact: medium
  impact-rationale: Actually excluding handler sources from local compilation can leave type errors undiscovered until bundling or execution. TypeScript file-discovery documentation supports the consequence, but the matcher cannot inspect handlers or effective project coverage.
  scope-profile:
    - unique
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.json, not arbitrary extended/compiler config names. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  category: typescript
  references:
    - https://www.typescriptlang.org/tsconfig/#include
