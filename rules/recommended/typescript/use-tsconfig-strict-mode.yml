id: use-tsconfig-strict-mode
language: Json
severity: info
message: >
  Consider setting tsconfig.json compilerOptions.strict to true.
note: >
  strict is typical for Forge apps' tsconfig.json
  but not enforced by the Forge bundler itself.
  It is safe to omit,
  but recommended for catching type errors
  before they reach the bundler.
  This rule assumes a single self-contained tsconfig.json:
  ast-grep can't follow extends to a shared base config,
  so it backs off entirely whenever extends is present
  rather than risk flagging a setting that's actually inherited.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#strict
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"strict"\s*:\s*true'
files:
  - "**/tsconfig.json"
ignores:
  - "**/node_modules/**"
metadata:
  precision: low
  precision-rationale: "Tests compare explicit strict true with false/absence and skip extends. Individual strict suboptions or deliberate staged adoption are untested gaps; omission is explicitly permitted by the note, so it is conditional advice. Evidence: rule-tests/recommended/typescript/use-tsconfig-strict-mode.test.yml (valid/invalid cases) and rule-tests/__snapshots__/use-tsconfig-strict-mode-snapshot.yml."
  impact: medium
  impact-rationale: Genuinely unchecked type mistakes can cause bounded application defects that stricter static checking may catch earlier. TypeScript documents strictness options; missing the umbrella flag does not prove a runtime defect or absence of all strict checks.
  scope-profile:
    - unique
  scope-rationale: Preserve **/tsconfig.json with only **/node_modules/** excluded, including test-local and generated configurations. This artifact has no standard selector and lacks the dist/coverage/specs baseline. Ticket 08 owns normalization.
  category: typescript
  references:
    - https://www.typescriptlang.org/tsconfig/#strict
