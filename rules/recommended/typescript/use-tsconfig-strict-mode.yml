id: use-tsconfig-strict-mode
language: Json
severity: info
message: >
  Consider setting tsconfig.json compilerOptions.strict to true.
note: >
  strict is typical for Forge apps' tsconfig.json
  but not enforced by the Forge bundler itself.
  It is safe to omit,
  but recommended for catching type errors
  before they reach the bundler.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#strict
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '"compilerOptions"\s*:[\s\S]*?"strict"\s*:\s*true'
files:
  - "**/tsconfig.json"
ignores:
  - "**/node_modules/**"
