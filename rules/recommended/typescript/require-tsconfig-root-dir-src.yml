id: require-tsconfig-root-dir-src
language: Json
severity: warning
message: >
  Bring tsconfig.json's compilerOptions.rootDir back in line with the
  repo-init baseline: "src".
note: >
  repo-init generates compilerOptions.rootDir: "src" so the bundler knows
  where the backend source tree starts. Forge's bundler manages its own
  temporary build directory regardless of this setting, but drift here
  still breaks local tsc output layout and IDE tooling.
  This rule assumes a single self-contained tsconfig.json:
  ast-grep can't follow extends to a shared base config,
  so it backs off entirely whenever extends is present
  rather than risk flagging a setting that's actually inherited.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#rootDir
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"rootDir"\s*:\s*"src"'
files:
  - "**/tsconfig.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: "Tests compare exact src with other/missing rootDir and skip extends. Equivalent paths, inferred rootDir and alternate source layouts remain untested gaps; an exact baseline mismatch does not prove broken output. Evidence: rule-tests/recommended/typescript/require-tsconfig-root-dir-src.test.yml (valid/invalid cases) and rule-tests/__snapshots__/require-tsconfig-root-dir-src-snapshot.yml."
  impact: low
  impact-rationale: An unsuitable local source root can produce unexpected emission layout or compiler diagnostics, creating recoverable tooling friction. TypeScript documents rootDir behavior; the retained note says Forge manages its own temporary build directory.
  scope-profile:
    - unique
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.json, not arbitrary extended/compiler config names. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  category: typescript
  references:
    - https://www.typescriptlang.org/tsconfig/#rootDir
