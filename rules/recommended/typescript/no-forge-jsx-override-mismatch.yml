id: no-forge-jsx-override-mismatch
language: Json
severity: error
message: >
  tsconfig.json compilerOptions.jsx must be "react"
  to match what the Forge bundler hardcodes.
note: >
  Forge's webpack/ts-loader bundler hardcodes
  jsx: "react"
  at build time, regardless of what this file says.
  Declaring anything else or omitting makes tsconfig.json misrepresent
  what actually happens to your code once Forge builds it.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#jsx
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '"compilerOptions"\s*:[\s\S]*?"jsx"\s*:\s*"react"'
files:
  - "**/tsconfig.json"
ignores:
  - "**/node_modules/**"
