id: no-forge-jsx-override-mismatch
language: Json
severity: warning
message: >
  tsconfig.json compilerOptions.jsx should be "react-jsx"
  for UI Kit 2 apps using @forge/react.
note: >
  UI Kit 2 (@forge/react) is real React and needs the automatic JSX runtime.
  A documented Forge community fix for a "createElement is not a function"
  runtime crash was switching jsx to "react-jsx" and removing jsxFactory and
  jsxFragmentFactory, which are leftovers from the deprecated @forge/ui
  (UI Kit 1) framework.
  This rule assumes a single self-contained tsconfig.json:
  ast-grep can't follow extends to a shared base config,
  so it backs off entirely whenever extends is present
  rather than risk flagging a setting that's actually inherited.
  https://community.developer.atlassian.com/t/forgeui-ui-kit-2-with-typescript-runtime-error-i-default-createelement-is-not-a-function/75838
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"jsx"\s*:\s*"react-jsx"'
files:
  - "**/tsconfig.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: "Tests cover react-jsx versus other/missing settings and intentionally skip configs with extends. Neither UI Kit 2 identity nor delegated JSX transformation is established; a backend-only or separately transformed project is an untested contextual gap. Evidence: rule-tests/recommended/typescript/no-forge-jsx-override-mismatch.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-forge-jsx-override-mismatch-snapshot.yml."
  impact: high
  impact-rationale: An incompatible JSX transform can break UI Kit rendering with createElement failures in the linked incident. The impact depends on actual UI Kit code and build transformation; a different JSX setting alone does not prove runtime failure.
  scope-profile:
    - unique
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.json, not arbitrary extended/compiler config names. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  category: typescript
  references:
    - https://community.developer.atlassian.com/t/forgeui-ui-kit-2-with-typescript-runtime-error-i-default-createelement-is-not-a-function/75838
    - https://www.typescriptlang.org/tsconfig/#jsx
