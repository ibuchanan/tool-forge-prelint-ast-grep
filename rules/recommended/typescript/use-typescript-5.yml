id: use-typescript-5
language: Json
severity: warning
message: >
  package.json's typescript devDependency
  should stay pinned to a 5.x major version.
note: >
  Forge bundler runs a separate, pinned @babel/parser pass
  to extract metadata like dependency lists and ESM detection.
  New syntax introduced in a TypeScript 6.x/7.x release can fail that parse
  before your code even reaches type-checking,
  which is the most likely breaking point
  ("Application code metadata processing failed").
  A major bump can also outpace what the bundler's pinned ts-loader version supports
  against the TypeScript Compiler API.
  The bundler's peerDependencies allow >=5.0.0,
  but it's only tested against the 5.x line.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/
  npm dependency version reference:
  https://docs.npmjs.com/cli/v11/configuring-npm/package-json/#dependencies
rule:
  kind: pair
  regex: '^"typescript"\s*:'
  not:
    regex: '^"typescript"\s*:\s*"[\^~]?5(\.(x|\*|[0-9]+)){0,2}"$'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  tags: [capability:typescript]
  precision: medium
  precision-rationale: "Tests distinguish simple 5.x dependency strings from 4.x/6.x and no declaration. The pair matcher is not restricted to devDependencies and the regex is not a semver resolver; compatible compound ranges, prereleases and lockfile resolutions are untested gaps. Evidence: rule-tests/recommended/typescript/use-typescript-5.test.yml (valid/invalid cases) and rule-tests/__snapshots__/use-typescript-5-snapshot.yml."
  impact: medium
  impact-rationale: An actually incompatible compiler or syntax release can stop metadata parsing or bundling, delaying delivery. npm documents dependency ranges, but the matcher does not inspect the installed Forge Babel parser or ts-loader; claims about their exact pinned support remain source assertions, not test evidence.
  scope-profile:
    - package-json
    - tests
  category: typescript
  references:
    - https://docs.npmjs.com/cli/v11/configuring-npm/package-json/#dependencies
    - https://www.typescriptlang.org/tsconfig/
