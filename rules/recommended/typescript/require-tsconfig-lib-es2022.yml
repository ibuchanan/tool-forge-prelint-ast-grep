id: require-tsconfig-lib-es2022
language: Json
severity: warning
message: >
  tsconfig.json compilerOptions.lib must include "ES2022" to match the
  global APIs available on Forge's Node 18 runtime.
note: >
  lib is derived from Forge's Node 18 backend runtime's global API surface,
  not a team convention — every Forge app runs against the same globals.
  Unlike jsx/jsxFactory/sourceMap, the bundler does not correct a wrong lib
  for you: drift here means tsc can type-check calls to globals the runtime
  doesn't actually have, or reject globals it does. Extra lib entries (e.g.
  "DOM" for Custom UI frontend code sharing this tsconfig) are fine on top.
  This rule assumes a single self-contained tsconfig.json:
  ast-grep can't follow extends to a shared base config,
  so it backs off entirely whenever extends is present
  rather than risk flagging a setting that's actually inherited.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#lib
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"lib"\s*:\s*\[[^\]]*"ES2022"'
files:
  - "**/tsconfig.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: "Tests check literal ES2022 membership, allow DOM and skip extends. Default libs and other compatible runtime baselines are not resolved. The native Node 18 assumption is historical, not validated against an app runtime; these are assessment gaps. Evidence: rule-tests/recommended/typescript/require-tsconfig-lib-es2022.test.yml (valid/invalid cases) and rule-tests/__snapshots__/require-tsconfig-lib-es2022-snapshot.yml."
  impact: medium
  impact-rationale: A real mismatch between type libraries and available runtime globals can cause compilation failures or acceptance of unavailable APIs. TypeScript documents lib selection; a different compatible lib set is not itself an execution failure.
  scope-profile:
    - unique
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.json, not arbitrary extended/compiler config names. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  category: typescript
  references:
    - https://www.typescriptlang.org/tsconfig/#lib
