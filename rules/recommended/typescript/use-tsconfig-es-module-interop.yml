id: use-tsconfig-es-module-interop
language: Json
severity: info
message: >
  Consider setting tsconfig.json compilerOptions.esModuleInterop to true.
note: >
  esModuleInterop is typical for Forge apps' tsconfig.json
  but not enforced by the Forge bundler itself.
  It is safe to omit,
  but recommended for clean interop with Atlassian's mixed CJS/ESM packages.
  This rule assumes a single self-contained tsconfig.json:
  ast-grep can't follow extends to a shared base config,
  so it backs off entirely whenever extends is present
  rather than risk flagging a setting that's actually inherited.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#esModuleInterop
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"esModuleInterop"\s*:\s*true'
files:
  - "**/tsconfig.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  precision: low
  precision-rationale: "Tests compare explicit true with false/absence and skip extends. The note permits omission. Projects with no affected imports or intentionally different CJS/ESM conventions routinely match; actual module interoperability is an untested gap. Evidence: rule-tests/recommended/typescript/use-tsconfig-es-module-interop.test.yml (valid/invalid cases) and rule-tests/__snapshots__/use-tsconfig-es-module-interop-snapshot.yml."
  impact: medium
  impact-rationale: A genuine CommonJS/default-import mismatch can cause compilation or runtime import failures. TypeScript documents interop helpers, but missing this optional setting does not establish any incompatible import.
  scope-profile:
    - unique
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.json, not arbitrary extended/compiler config names. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  category: typescript
  references:
    - https://www.typescriptlang.org/tsconfig/#esModuleInterop
