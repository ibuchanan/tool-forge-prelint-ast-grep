id: no-forge-source-map-override-mismatch
language: Json
severity: info
message: >
  tsconfig.json compilerOptions.sourceMap must be true
  to match what the Forge bundler hardcodes.
note: >
  Forge's webpack/ts-loader bundler hardcodes
  sourceMap: true
  at build time, regardless of what this file says.
  Declaring anything else or omitting makes tsconfig.json misrepresent
  what actually happens to your code once Forge builds it.
  This rule assumes a single self-contained tsconfig.json:
  ast-grep can't follow extends to a shared base config,
  so it backs off entirely whenever extends is present
  rather than risk flagging a setting that's actually inherited.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#sourceMap
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"sourceMap"\s*:\s*true'
files:
  - "**/tsconfig.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: "Tests check sourceMap true versus false/absent and skip extends. The matcher does not inspect the installed Forge bundler; its hardcoded override is an unchanged source claim, not demonstrated by these tests. Nested property text and alternate build paths remain untested gaps. Evidence: rule-tests/recommended/typescript/no-forge-source-map-override-mismatch.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-forge-source-map-override-mismatch-snapshot.yml."
  impact: low
  impact-rationale: A local config that misrepresents generated source maps can confuse debugging and tooling expectations. TypeScript documents sourceMap output; the retained note says Forge overrides it, so omission alone is not a build or runtime failure.
  scope-profile:
    - unique
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.json, not arbitrary extended/compiler config names. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  category: typescript
  references:
    - https://www.typescriptlang.org/tsconfig/#sourceMap
