id: use-tsconfig-skip-lib-check
language: Json
severity: hint
message: >
  Consider setting tsconfig.json compilerOptions.skipLibCheck to true.
note: >
  skipLibCheck is typical for Forge apps' tsconfig.json
  but not enforced by the Forge bundler itself.
  It is safe to omit,
  but recommended to avoid type-checking third-party .d.ts files
  you don't control.
  This rule assumes a single self-contained tsconfig.json:
  ast-grep can't follow extends to a shared base config,
  so it backs off entirely whenever extends is present
  rather than risk flagging a setting that's actually inherited.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#skipLibCheck
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"skipLibCheck"\s*:\s*true'
files:
  - "**/tsconfig.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  tags: [capability:typescript]
  precision: low
  precision-rationale: "Tests compare explicit true with false/absence and skip extends. Full declaration checking is legitimate and can catch real incompatibilities; performance and third-party declaration failures are untested gaps rather than proven violations. Evidence: rule-tests/recommended/typescript/use-tsconfig-skip-lib-check.test.yml (valid/invalid cases) and rule-tests/__snapshots__/use-tsconfig-skip-lib-check-snapshot.yml."
  impact: low
  impact-rationale: Checking dependency declaration files may increase local typecheck time or expose third-party diagnostics. TypeScript documents the speed-versus-accuracy tradeoff; enabling skipLibCheck can hide errors, so this is tooling advice, not mandatory correctness.
  scope-profile:
    - unique
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.json, not arbitrary extended/compiler config names. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  category: typescript
  references:
    - https://www.typescriptlang.org/tsconfig/#skipLibCheck
