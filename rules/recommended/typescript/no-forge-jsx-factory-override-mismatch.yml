id: no-forge-jsx-factory-override-mismatch
language: Json
severity: error
message: >
  tsconfig.json compilerOptions.jsxFactory (and jsxFragmentFactory) should be
  removed; UI Kit 2 apps don't use a custom JSX pragma.
note: >
  jsxFactory: "ForgeUI.createElement" was required by the deprecated @forge/ui
  (UI Kit 1) framework, which had its own non-React createElement. UI Kit 2
  (@forge/react) is real React using the automatic JSX runtime — declaring
  jsxFactory or jsxFragmentFactory alongside it produces broken createElement
  calls and a runtime crash. Remove both options.
  https://community.developer.atlassian.com/t/forgeui-ui-kit-2-with-typescript-runtime-error-i-default-createelement-is-not-a-function/75838
rule:
  kind: object
  inside:
    kind: document
  has:
    kind: pair
    regex: '"compilerOptions"\s*:[\s\S]*?"(jsxFactory|jsxFragmentFactory)"\s*:'
files:
  - "**/tsconfig.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: "Tests distinguish explicit factory/fragment-factory declarations from no pragma. The matcher does not establish UI Kit 2 usage, automatic runtime settings or the property value; legitimate non-UI-Kit JSX factories remain an untested gap. Unlike sibling config checks it does not back off on extends. Evidence: rule-tests/recommended/typescript/no-forge-jsx-factory-override-mismatch.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-forge-jsx-factory-override-mismatch-snapshot.yml."
  impact: high
  impact-rationale: A genuinely incompatible legacy JSX factory in a UI Kit 2 build can prevent UI rendering through createElement failures, as the linked community incident illustrates. Declaring any factory in an arbitrary tsconfig does not prove that incident applies.
  scope-profile:
    - unique
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.json, not arbitrary extended/compiler config names. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  category: typescript
  references:
    - https://community.developer.atlassian.com/t/forgeui-ui-kit-2-with-typescript-runtime-error-i-default-createelement-is-not-a-function/75838
    - https://www.typescriptlang.org/tsconfig/#jsxFactory
