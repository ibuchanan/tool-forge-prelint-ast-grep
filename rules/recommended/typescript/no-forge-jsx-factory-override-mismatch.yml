id: no-forge-jsx-factory-override-mismatch
language: Json
severity: error
message: >
  tsconfig.json compilerOptions.jsxFactory must be "ForgeUI.createElement"
  to match what the Forge bundler hardcodes.
note: >
  Forge's webpack/ts-loader bundler hardcodes
  jsxFactory: "ForgeUI.createElement"
  at build time, regardless of what this file says.
  Declaring anything else or omitting makes tsconfig.json misrepresent
  what actually happens to your code once Forge builds it.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#jsxFactory
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      regex: '"compilerOptions"\s*:[\s\S]*?"jsxFactory"\s*:\s*"ForgeUI\.createElement"'
files:
  - "**/tsconfig.json"
ignores:
  - "**/node_modules/**"
