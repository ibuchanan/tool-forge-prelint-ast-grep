id: require-tsconfig-module-resolution-node
language: Json
severity: warning
message: >
  Set base tsconfig.json compilerOptions.moduleResolution to "Node"; use a separate config for local typechecking.
note: >
  Drop Calf's Forge-app base uses Node resolution for its local build and
  Forge Webpack baseline. TypeScript accepts case-equivalent Node spellings.
  This is not a universal runtime or installed-bundler compatibility test.
  The separately scoped tsconfig.typecheck.json can use Node or Bundler
  resolution according to dependency traits; this rule does not inspect it.
  Other owner-selected base policies need review and possible suppression.
  This rule assumes a single self-contained tsconfig.json:
  ast-grep can't follow extends to a shared base config,
  so it backs off entirely whenever extends is present
  rather than risk flagging a setting that's actually inherited.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#moduleResolution
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"moduleResolution"\s*:\s*"(?i:node)"'
files:
  - "**/tsconfig.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  tags: [capability:typescript]
  precision: medium
  precision-rationale: "Tests accept case-equivalent Node spellings, reject Bundler/missing base settings and skip extends. Native fixtures keep typecheck Node/Bundler variants outside this base-only scope. Compatible defaults and alternate base policies remain assessment gaps; no imports or installed Forge bundler are inspected. Evidence: rule-tests/recommended/typescript/require-tsconfig-module-resolution-node.test.yml (valid/invalid cases) and rule-tests/__snapshots__/require-tsconfig-module-resolution-node-snapshot.yml."
  impact: medium
  impact-rationale: A genuine local-versus-build resolver mismatch can accept imports that later fail to bundle. TypeScript documents resolver modes; a different mode is not proof that any import is incompatible.
  scope-profile:
    - unique
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.json, not arbitrary extended/compiler config names. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  category: typescript
  references:
    - https://www.typescriptlang.org/tsconfig/#moduleResolution
