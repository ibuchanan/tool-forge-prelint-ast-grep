id: require-tsconfig-module-resolution-node
language: Json
severity: error
message: >
  tsconfig.json compilerOptions.moduleResolution must be "Node" to match how
  Forge's Node 18 runtime and webpack actually resolve packages.
note: >
  moduleResolution is derived from Forge's Node 18 backend runtime, not a
  team convention — every Forge app resolves packages the same way. Unlike
  jsx/jsxFactory/sourceMap, the bundler does not correct a wrong
  moduleResolution for you: drift here (e.g. "bundler" or "NodeNext") can
  make tsc accept import specifiers that fail to resolve once actually
  built. Use a separate tsconfig.typecheck.json if you want a different
  moduleResolution for local-only tooling.
  This rule assumes a single self-contained tsconfig.json:
  ast-grep can't follow extends to a shared base config,
  so it backs off entirely whenever extends is present
  rather than risk flagging a setting that's actually inherited.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#moduleResolution
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"moduleResolution"\s*:\s*"Node"'
files:
  - "**/tsconfig.json"
ignores:
  - "**/node_modules/**"
metadata:
  precision: medium
  precision-rationale: "Tests distinguish exact Node text from bundler/missing settings and skip extends. Case-equivalent accepted values, compatible defaults and alternate frontend configurations are untested gaps. No actual import or installed Forge bundler is inspected; Node 18 scope is an unchanged historical assumption. Evidence: rule-tests/recommended/typescript/require-tsconfig-module-resolution-node.test.yml (valid/invalid cases) and rule-tests/__snapshots__/require-tsconfig-module-resolution-node-snapshot.yml."
  impact: medium
  impact-rationale: A genuine local-versus-build resolver mismatch can accept imports that later fail to bundle. TypeScript documents resolver modes; a different mode is not proof that any import is incompatible.
  scope-profile:
    - unique
  scope-rationale: Preserve **/tsconfig.json with only **/node_modules/** excluded, including test-local and generated configurations. This artifact has no standard selector and lacks the dist/coverage/specs baseline. Ticket 08 owns normalization.
  category: typescript
  references:
    - https://www.typescriptlang.org/tsconfig/#moduleResolution
