id: require-tsconfig-target-es2022
language: Json
severity: warning
message: >
  tsconfig.json compilerOptions.target must be "ES2022" to match the Forge
  Node 18 runtime.
note: >
  target is derived from Forge's Node 18 backend runtime, not a team
  convention — every Forge app compiles against the same runtime. Unlike
  jsx/jsxFactory/sourceMap, the bundler does not correct a wrong target for
  you: drift here means tsc silently allows syntax the runtime can't
  actually execute.
  This rule assumes a single self-contained tsconfig.json: ast-grep can't
  follow extends to a shared base config, so it backs off entirely whenever
  extends is present rather than risk flagging a setting that's actually
  inherited.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#target
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"target"\s*:\s*"ES2022"'
files:
  - "**/tsconfig.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  tags: [capability:typescript]
  precision: medium
  precision-rationale: "Tests compare exact ES2022 with other/missing targets and skip extends. Older compatible emit targets, alternate runtimes and build overrides are untested gaps. The preserved Node 18 assertion is not verified by metadata migration. Evidence: rule-tests/recommended/typescript/require-tsconfig-target-es2022.test.yml (valid/invalid cases) and rule-tests/__snapshots__/require-tsconfig-target-es2022-snapshot.yml."
  impact: medium
  impact-rationale: A genuinely unsupported emitted syntax target can cause build or execution failures. TypeScript target documentation explains downleveling; a lower compatible target is not inherently a Forge runtime violation.
  scope-profile:
    - unique
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.json, not arbitrary extended/compiler config names. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  category: typescript
  references:
    - https://www.typescriptlang.org/tsconfig/#target
