id: use-tsconfig-consistent-file-casing
language: Json
severity: info
message: >
  Consider setting tsconfig.json compilerOptions.forceConsistentCasingInFileNames to true.
note: >
  forceConsistentCasingInFileNames is typical for Forge apps' tsconfig.json
  but not enforced by the Forge bundler itself.
  It is safe to omit,
  but recommended to catch import-path casing
  that would break on case-sensitive filesystems
  (like the ones Forge's build/CI run on).
  This rule assumes a single self-contained tsconfig.json:
  ast-grep can't follow extends to a shared base config,
  so it backs off entirely whenever extends is present
  rather than risk flagging a setting that's actually inherited.
  TypeScript TSConfig reference:
  https://www.typescriptlang.org/tsconfig/#forceConsistentCasingInFileNames
rule:
  kind: object
  inside:
    kind: document
  all:
    - not:
        has:
          kind: pair
          regex: '^"extends"\s*:'
    - not:
        has:
          kind: pair
          regex: '"compilerOptions"\s*:[\s\S]*?"forceConsistentCasingInFileNames"\s*:\s*true'
files:
  - "**/tsconfig.json"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  tags: [capability:typescript]
  precision: low
  precision-rationale: "Tests recognize explicit true, false/absence and extends backoff. The note permits omission; compiler-version defaults and actual casing inconsistencies are untested gaps. A missing explicit option routinely matches otherwise working projects. Evidence: rule-tests/recommended/typescript/use-tsconfig-consistent-file-casing.test.yml (valid/invalid cases) and rule-tests/__snapshots__/use-tsconfig-consistent-file-casing-snapshot.yml."
  impact: medium
  impact-rationale: Actual path-case inconsistencies can break imports on case-sensitive CI or deployment filesystems. TypeScript documents the check, but absence of explicit true does not establish such an inconsistency or whether the effective default is already true.
  scope-profile:
    - unique
  scope-rationale: "Select only the reviewed configuration filenames: tsconfig.json, not arbitrary extended/compiler config names. No standard artifact selector names these files. Preserve test-local configurations and helpers intentionally, apply the shared baseline, and keep build, vendor and fixture directories eligible. Filename routing does not establish application identity."
  category: typescript
  references:
    - https://www.typescriptlang.org/tsconfig/#forceConsistentCasingInFileNames
