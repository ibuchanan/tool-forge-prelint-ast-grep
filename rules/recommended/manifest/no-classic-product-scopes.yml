id: no-classic-product-scopes
language: Yaml
severity: hint
message: >
  Prefer granular Forge scopes over classic product scopes when available.
note: >
  Classic scopes such as read:jira-work and read:confluence-content.all are broad.
  Use granular scopes unless the app needs classic scope compatibility.
# NOTE: Current Atlassian public docs say to prefer classic scopes and use granular only
# as a fallback. This rule reflects internal direction toward granular scopes; a docs
# link should be added once that guidance is reflected in the public documentation.
rule:
  kind: block_sequence_item
  regex: '^\s*-\s*["'']?(read|write|manage):(jira|confluence)[-.]'
files:
  - "**/manifest.yml"
  - "**/manifest.yaml"
