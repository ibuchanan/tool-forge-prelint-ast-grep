id: review-forge-remotes
language: Yaml
severity: hint
message: >
  Forge Remote declarations need explicit eligibility, residency, and auth review.
note: >
  Remotes are valid when needed,
  but they change Runs on Atlassian eligibility and data handling.
  Document why the endpoint is required and how it is secured.
  See the Forge remotes manifest reference for eligibility, data residency, and inScopeEUD:
  https://developer.atlassian.com/platform/forge/manifest-reference/remotes/
rule:
  kind: block_mapping_pair
  regex: '^remotes\s*:'
files:
  - "**/manifest.yml"
  - "**/manifest.yaml"
ignores:
  - "**/node_modules/**"
