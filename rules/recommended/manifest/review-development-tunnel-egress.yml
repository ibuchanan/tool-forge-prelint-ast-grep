id: review-development-tunnel-egress
language: Yaml
severity: warning
message: Review development-tunnel egress. Remove it before release or justify the destination.
note: >
  Reviews literal tunnel service hosts in permissions.external.fetch.backend/client
  and scripts/styles/images/fonts/media/frames lists (scalar or address-object form),
  in block/flow YAML. A declaration is a
  review candidate, not proof of exfiltration or an abandoned tunnel. Remove development
  destinations before release or document their ownership and intended use.
  YAML aliases, merge expansion, computed values and remote references are not resolved.
  See https://developer.atlassian.com/platform/forge/manifest-reference/permissions/
utils:
  mapping-pair:
    any:
      - kind: block_mapping_pair
      - kind: flow_pair
  external:
    matches: mapping-pair
    has:
      field: key
      regex: '^["'']?external["'']?$'
    inside:
      stopBy:
        matches: mapping-pair
      matches: mapping-pair
      has:
        field: key
        regex: '^["'']?permissions["'']?$'
      not:
        inside:
          stopBy: end
          matches: mapping-pair
  egress-list:
    any:
      - matches: fetch-list
      - matches: mapping-pair
        has:
          field: key
          regex: '^["'']?(scripts|styles|images|fonts|media|frames)["'']?$'
        inside:
          stopBy:
            matches: mapping-pair
          matches: external
  fetch-list:
    matches: mapping-pair
    has:
      field: key
      regex: '^["'']?(backend|client)["'']?$'
    inside:
      stopBy:
        matches: mapping-pair
      matches: mapping-pair
      has:
        field: key
        regex: '^["'']?fetch["'']?$'
      inside:
        stopBy:
          matches: mapping-pair
        matches: external
  egress-item:
    any:
      - kind: block_sequence_item
        inside:
          kind: block_sequence
          inside:
            kind: block_node
            inside:
              matches: egress-list
      - kind: flow_node
        inside:
          kind: flow_sequence
          inside:
            kind: flow_node
            inside:
              matches: egress-list
rule:
  kind: flow_node
  regex: '(?i)^["'']?(https?://)?(\*\.|[a-z0-9-]+\.)*(ngrok(-free)?\.(io|app|dev)|localtunnel\.me|loca\.lt|trycloudflare\.com|serveo\.net|localhost\.run|tunnelmole\.(com|net)|localtonet\.com|pinggy\.io)\.?(:[0-9]+)?([/?#][^\s"'']*)?["'']?$'
  all:
    - any:
        - matches: egress-item
        - inside:
            matches: egress-item
        - inside:
            matches: mapping-pair
            has:
              field: key
              regex: '^["'']?address["'']?$'
            inside:
              stopBy:
                matches: mapping-pair
              matches: egress-item
files:
  - "**/manifest.yaml"
  - "**/manifest.yml"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: >
    Literal known tunnel hosts are bounded to egress paths and hostname boundaries;
    intentional tunnel use still needs review. Block/flow and counterexample evidence
    lives in rule-tests/recommended/manifest/review-development-tunnel-egress.test.yml.
    YAML aliases, merges and remote references are not resolved.
  impact: high
  impact-rationale: >
    A stale or reassigned tunnel destination can receive sensitive requests or supply
    untrusted resources. A declaration alone does not prove traffic or compromise.
  scope-profile:
    - manifest
    - tests
  category: manifest
  references:
    - https://developer.atlassian.com/platform/forge/manifest-reference/permissions/
  owasp: A02:2025
