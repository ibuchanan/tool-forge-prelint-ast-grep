id: review-broad-manifest-scopes
language: Yaml
severity: hint
message: >
  Review this admin-level scope against the principle of least privilege.
note: >
  Admin scopes grant broad access across a product. Confirm the app actually
  needs admin-level access rather than a narrower read/write scope.
  See the Valiantys Forge style guide's least-privilege guidance:
  https://www.valiantys.com/en/resources/forge-style-guide
rule:
  kind: block_sequence_item
  regex: '^\s*-\s*["'']?admin:'
files:
  - "**/manifest.yaml"
  - "**/manifest.yml"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: low
  precision-rationale: "An admin:-prefixed block sequence item is a review signal, not proof that it is a scope, unnecessary or unreviewed. Legitimate required administration and flow YAML coverage remain assessment gaps. Evidence: rule-tests/recommended/manifest/review-broad-manifest-scopes.test.yml (valid/invalid cases) and rule-tests/__snapshots__/review-broad-manifest-scopes-snapshot.yml."
  impact: high
  impact-rationale: Unnecessarily granting administrative access can enable unauthorized product-wide configuration changes or sensitive-data access if application credentials or authorization are compromised. A required admin scope is not itself a vulnerability.
  scope-profile:
    - manifest
    - tests
  category: manifest
  references:
    - https://developer.atlassian.com/platform/forge/manifest-reference/permissions/
    - https://top10.owasp.org/2025/A02_2025-Security_Misconfiguration/
