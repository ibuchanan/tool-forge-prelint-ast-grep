id: prefer-frame-for-custom-ui
language: Tsx
severity: warning
message: >
  Embed Custom UI inside UI Kit with the Frame component instead of a raw iframe.
note: >
  '@forge/react' ships a Frame component specifically for embedding Custom UI
  inside a UI Kit app. A raw iframe skips the sizing, loading, and permissions
  handling Frame provides.
  See the Valiantys Forge style guide's UI Kit vs Custom UI guidance:
  https://www.valiantys.com/en/resources/forge-style-guide
rule:
  any:
    - pattern: <iframe $$$>$$$</iframe>
    - pattern: <iframe $$$/>
    - pattern: <iframe />
files:
  - "**/frontend/**"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: "Tests distinguish raw iframe syntax from Frame and other components. Frontend paths alone do not establish UI Kit rather than ordinary Custom UI DOM; legitimate iframe embedding and imported component identity remain untested contextual gaps. Evidence: rule-tests/recommended/frontend-ui/prefer-frame-for-custom-ui.test.yml (valid/invalid cases) and rule-tests/__snapshots__/prefer-frame-for-custom-ui-snapshot.yml."
  impact: medium
  impact-rationale: Trying to embed Custom UI through unsupported DOM in UI Kit can prevent the embedded surface working as intended. Frame documents a supported UI Kit embedding boundary; ordinary browser iframe usage is not universally incorrect.
  scope-profile:
    - frontend
    - tests
  category: frontend-ui
  references:
    - https://developer.atlassian.com/platform/forge/ui-kit/components/frame/
