id: review-duplicate-page-title
language: Tsx
severity: hint
message: >
  This heading duplicates the page title Forge already renders from the module's
  `title` in manifest.yml.
note: >
  Forge page-type modules (global pages, project pages, admin pages, and similar)
  display the module's `title` from manifest.yml in the page chrome automatically.
  An xlarge/xxlarge <Heading> repeating that title is a common duplicate-title
  pattern, especially in coding-agent-generated Forge UI. Compare this heading
  against the module's `title` in manifest.yml and remove it if it repeats the
  title, or use a smaller heading size if it serves a different purpose.
  See the Forge manifest modules reference:
  https://developer.atlassian.com/platform/forge/manifest-reference/modules/
rule:
  all:
    - kind: jsx_element
    - has:
        field: open_tag
        has:
          field: name
          regex: "^Heading$"
    - has:
        field: open_tag
        has:
          kind: jsx_attribute
          regex: 'size\s*=\s*"x?xlarge"'
files:
  - "**/frontend/**"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: low
  precision-rationale: "Tests distinguish xlarge/xxlarge Heading elements from smaller headings and Text. The matcher never reads module title, heading text or module type; legitimate large section headings routinely match. Cross-file duplication and component identity remain assessment gaps. Evidence: rule-tests/recommended/frontend-ui/review-duplicate-page-title.test.yml (valid/invalid cases) and rule-tests/__snapshots__/review-duplicate-page-title-snapshot.yml."
  impact: low
  impact-rationale: A genuinely repeated module title adds visual clutter and confusing heading hierarchy. Forge modules define page titles, but a large heading alone does not establish duplication or accessibility noncompliance; removing it without comparison may remove useful structure.
  scope-profile:
    - frontend
    - tests
  category: frontend-ui
  references:
    - https://developer.atlassian.com/platform/forge/manifest-reference/modules/
    - https://www.w3.org/WAI/tutorials/page-structure/headings/
