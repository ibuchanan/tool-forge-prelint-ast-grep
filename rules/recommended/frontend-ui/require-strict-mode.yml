id: require-strict-mode
language: Tsx
severity: warning
message: >
  ForgeReconciler.render() should wrap the root component in <React.StrictMode>.
  Found ForgeReconciler.render() call without <React.StrictMode> as the top-level element.
note: >
  Wrapping with React.StrictMode enables additional development-time warnings and
  is the recommended pattern for Forge UI Kit apps.
  See https://developer.atlassian.com/platform/forge/ui-kit/use-ui-kit/
rule:
  pattern: ForgeReconciler.render($ARG)
  not:
    has:
      stopBy: end
      pattern: <React.StrictMode>$$$</React.StrictMode>
files:
  - "**/frontend/**"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: "Tests compare a direct React.StrictMode wrapper with an unwrapped App. Aliased StrictMode and wrappers supplied by another component are untested gaps; the matcher accepts any nested matching element, not exclusively the top-level wrapper claimed in the message. Evidence: rule-tests/recommended/frontend-ui/require-strict-mode.test.yml (valid/invalid cases) and rule-tests/__snapshots__/require-strict-mode-snapshot.yml."
  impact: low
  impact-rationale: Omitting StrictMode loses optional development-time diagnostics for render/effect issues. React documents these checks as development-only, so omission alone does not establish production failure or a leak.
  scope-profile:
    - frontend
    - tests
  category: frontend-ui
  references:
    - https://react.dev/reference/react/StrictMode
    - https://developer.atlassian.com/platform/forge/ui-kit/use-ui-kit/
