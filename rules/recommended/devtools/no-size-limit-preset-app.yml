id: no-size-limit-preset-app
language: Json
severity: warning
message: >
  Don't use @size-limit/preset-app to measure a Forge app's bundle size.
note: >
  preset-app builds with webpack and launches headless Chrome via Puppeteer
  to time a page load in a browser context. A Forge app's backend bundle
  never runs in a browser, so that measurement doesn't apply, and the
  Puppeteer dependency adds unnecessary weight and CI friction.
  Use @size-limit/file to measure raw byte size instead.
  See https://github.com/ai/size-limit#-presets-app
rule:
  all:
    - kind: string_content
      regex: "^@size-limit/preset-app$"
    - inside:
        stopBy: end
        kind: pair
        regex: '"devDependencies"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: medium
  precision-rationale: "The matcher finds preset-app string content under devDependencies, not the measured artifact or actual use. Tests compare file versus app presets. A package containing a legitimate Custom UI browser bundle or an unrelated matching string value is an untested assessment gap. Evidence: rule-tests/recommended/devtools/no-size-limit-preset-app.test.yml (valid/invalid cases) and rule-tests/__snapshots__/no-size-limit-preset-app-snapshot.yml."
  impact: low
  impact-rationale: Using browser-load measurement for a backend-only artifact adds unnecessary browser tooling and misleading measurements. Size Limit documents different presets; this is recoverable CI/tooling friction, not evidence of application failure.
  scope-profile:
    - package-json
    - tests
  category: devtools
  references:
    - https://github.com/ai/size-limit#-presets-app
