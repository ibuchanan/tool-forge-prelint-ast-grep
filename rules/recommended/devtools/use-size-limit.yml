id: use-size-limit
language: Json
severity: hint
message: >
  Add size-limit to measure and prevent bundle bloat
note: >
  Bundle bloat contributes to unwanted Forge spend.
  size-limit reports the exact byte cost of your JavaScript after build
  and can fail CI if the bundle exceeds a threshold.
  Add @size-limit/file to devDependencies
  and a "size-limit" key to package.json.
  See https://github.com/ai/size-limit
rule:
  kind: string_content
  regex: "^build$"
  inside:
    stopBy: end
    kind: pair
    regex: '"scripts"\s*:'
  not:
    inside:
      stopBy: end
      kind: object
      has:
        kind: pair
        regex: '"size-limit"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  precision: low
  precision-rationale: "A build string under scripts without a nearby size-limit pair triggers. Tests cover inline config and non-build scripts, not external configuration, another budget tool or monorepo orchestration. A normal build without this particular tool routinely matches. Evidence: rule-tests/recommended/devtools/use-size-limit.test.yml (valid/invalid cases) and rule-tests/__snapshots__/use-size-limit-snapshot.yml."
  impact: low
  impact-rationale: Omitting bundle-budget tooling reduces visibility into byte growth. Size Limit can enforce a chosen threshold, but missing this tool alone proves neither bundle bloat nor material Forge spend; the immediate impact is development feedback.
  scope-profile:
    - package-json
    - tests
  category: devtools
  references:
    - https://github.com/ai/size-limit
