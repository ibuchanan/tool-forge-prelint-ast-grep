id: use-detect-secrets
language: Json
severity: hint
message: >
  Add detect-secrets to scan for credentials leaks
note: >
  Make sure you don't accidentally leave the keys to your front door hanging in plain sight.
  detect-secrets of scans codebases, configuration files, and commit histories to find leaked sensitive data.
  Add @lirantal/detect-secrets to devDependencies and run it as a pre-commit hook.
  See https://github.com/lirantal/detect-secrets
rule:
  kind: string_content
  regex: "^@forge/api$"
  inside:
    stopBy: end
    kind: pair
    regex: '"dependencies"\s*:'
  not:
    inside:
      stopBy: end
      kind: object
      has:
        kind: pair
        regex: "detect-secrets"
files:
  - "**/package.json"
