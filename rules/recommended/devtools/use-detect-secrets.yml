id: use-detect-secrets
language: Json
severity: hint
message: >
  Add detect-secrets to scan for committed credentials in CI.
note: >
  Regex-based secret detection misses novel formats and generates false positives.
  detect-secrets builds a verified baseline and fails CI on new findings.
  Add @lirantal/detect-secrets to devDependencies and run it as a pre-commit hook.
  See https://github.com/lirantal/detect-secrets
rule:
  kind: string_content
  regex: "^@forge/api$"
  inside:
    stopBy: end
    kind: pair
    regex: '"dependencies"\s*:'
  not:
    inside:
      stopBy: end
      kind: object
      has:
        kind: pair
        regex: "detect-secrets"
files:
  - "**/package.json"
