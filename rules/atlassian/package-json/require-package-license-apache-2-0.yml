id: require-package-license-apache-2-0
language: Json
severity: warning
message: >
  package.json's license field should be "Apache-2.0",
  matching Atlassian's OSS credo.
note: >
  Atlassian's OSS template repo provide an Apache 2.0 license
  (in a LICENSE file).
  npm package.json fields reference:
  https://docs.npmjs.com/cli/v11/configuring-npm/package-json/#license
  Atlassian's OSS credo for Sample Apps:
  https://go.atlassian.com/credo-checklist-sample-app
rule:
  kind: object
  inside:
    kind: document
  not:
    has:
      kind: pair
      all:
        - has:
            field: key
            regex: '^"license"$'
        - has:
            field: value
            regex: '^"Apache-2\.0"$'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  # Node derives package licensing from the catalog annotation consumed by OSS.
  tags: [capability:oss, capability:node]
  references:
    - https://docs.npmjs.com/cli/v11/configuring-npm/package-json/#license
    - https://go.atlassian.com/credo-checklist-sample-app
  category: package-json
  precision: medium
  scope-profile: [package-json, tests]
  precision-rationale: "Tests accept the literal root Apache-2.0 license and flag MIT, missing license and nested license lookalikes, including private and express-only packages. Explicit key/value field checks prevent nested declarations from satisfying the root policy. Escape-encoded keys/values require native validation. The matcher cannot establish that the package is an Atlassian OSS sample or compare LICENSE text. Applicability and legal approval are assessment gaps, not inferred from the filename. Evidence: rule-tests/atlassian/package-json/require-package-license-apache-2-0.test.yml (valid/invalid) and rule-tests/__snapshots__/require-package-license-apache-2-0-snapshot.yml."
  impact: medium
  impact-rationale: npm documents license declarations and the referenced sample-app credo supplies the organization convention. Genuine divergence in an approved sample can misstate downstream usage terms and block release until corrected; this is bounded compliance/release risk, not a security flaw or a legal determination.
