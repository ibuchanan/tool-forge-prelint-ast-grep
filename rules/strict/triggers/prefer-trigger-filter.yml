id: prefer-trigger-filter
language: Yaml
severity: info
message: >
  Product event triggers should use manifest-level filtering where possible
note: >
  Manifest filters prevent irrelevant events from invoking the function at all.
  Add filter.expression or document why every matching event needs processing.
  See the Atlassian app events reference for available filter properties (expression, ignoreSelf, appIsLicensed):
  https://developer.atlassian.com/platform/forge/events-reference/product-events/
rule:
  all:
    - kind: block_sequence_item
    - has:
        stopBy: end
        kind: block_mapping_pair
        regex: '^\s*events\s*:'
    - not:
        has:
          stopBy: end
          kind: block_mapping_pair
          regex: '^\s*filter\s*:'
    - not:
        has:
          stopBy: end
          regex: "avi:forge:"
    - inside:
        stopBy: end
        kind: block_mapping_pair
        regex: 'trigger\s*:'
files:
  - "**/manifest.yaml"
  - "**/manifest.yml"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  category: triggers
  references:
    - https://developer.atlassian.com/platform/forge/events-reference/product-events/
  precision: low
  precision-rationale: >-
    Trigger sequence items with events but no filter match, except items containing avi:forge events. Tests cover a filter, a lifecycle event and an unfiltered product trigger. A handler may legitimately process every event, as the note allows, and documented exemptions are not recognized; this ordinary compliant-match case is an untested assessment gap. Filter validity and selectivity are not checked. Evidence: rule-tests/strict/triggers/prefer-trigger-filter.test.yml and rule-tests/__snapshots__/prefer-trigger-filter-snapshot.yml.
  impact: medium
  impact-rationale: >-
    Product-event documentation explains manifest filtering before invocation. Genuinely avoidable invocations can add compute cost and operational load, a bounded consumption consequence; not every unfiltered trigger has irrelevant events or warrants a filter.
  scope-profile:
    - manifest
    - tests
