id: no-verbose-hot-path-logging
language: TypeScript
severity: warning
message: >
  Avoid console.log in Forge backend hot paths.
note: >
  Logging entire events, payloads, or resolver arguments can increase log volume
  and expose sensitive data. Use scoped, redacted debug logs instead.
rule:
  pattern: console.log($$$)
files:
  - "**/resolvers/**"
  - "**/external/**"
  - "**/import-lifecycle/**"
  - "**/src/index.ts"
ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
