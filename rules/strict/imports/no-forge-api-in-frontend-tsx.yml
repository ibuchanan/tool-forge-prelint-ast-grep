id: no-forge-api-in-frontend-tsx
language: Tsx
severity: warning
message: >
  Do not import '@forge/api' in frontend files (src/frontend/**).
  Frontend code runs in the browser via @forge/bridge, not the Forge backend runtime.
  Use '@forge/bridge' to communicate with the backend instead.
note: >
  @forge/api is a backend-only package. Importing it in frontend files will cause
  runtime errors because the Forge runtime APIs are not available in the browser.
  See https://developer.atlassian.com/platform/forge/ui-kit/use-ui-kit/
rule:
  any:
    - pattern: "import $$$IMPORTS from '@forge/api'"
    - pattern: "import '@forge/api'"
    - pattern: 'import $$$IMPORTS from "@forge/api"'
    - pattern: 'import "@forge/api"'
files:
  - "**/frontend/**"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  category: imports
  references:
    - https://developer.atlassian.com/platform/forge/ui-kit/use-ui-kit/
  precision: medium
  precision-rationale: >-
    Exact @forge/api import patterns are selected in frontend paths; the test distinguishes an api import from bridge invoke. Runtime-bearing imports violate the frontend boundary, but erased type-only imports and non-runtime frontend content are untested compliant-match distinctions. Namespace/side-effect/quote variants lack dedicated tests; no module-resolution analysis occurs. Evidence: rule-tests/strict/imports/no-forge-api-in-frontend-tsx.test.yml and rule-tests/__snapshots__/no-forge-api-in-frontend-tsx-snapshot.yml.
  impact: high
  impact-rationale: >-
    UI Kit guidance separates frontend bridge access from backend Forge APIs. Actually bundling backend-only runtime code into the UI can prevent the application frontend from building or loading. The import spelling alone does not establish that erased types contribute runtime code.
  scope-profile:
    - frontend
    - tests
