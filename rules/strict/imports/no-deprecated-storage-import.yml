id: no-deprecated-storage-import
language: TypeScript
severity: warning
message: >
  Do not import 'storage' from '@forge/api' — it is deprecated.
  Use '@forge/kvs' instead.
note: >
  The storage API from @forge/api is the legacy storage interface.
  @forge/kvs provides the modern replacement with better typing and custom entities.
  See https://developer.atlassian.com/platform/forge/runtime-reference/storage-api/
rule:
  any:
    - pattern: "import { $$$A, storage, $$$B } from '@forge/api'"
    - pattern: 'import { $$$A, storage, $$$B } from "@forge/api"'
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  category: imports
  references:
    - https://developer.atlassian.com/platform/forge/runtime-reference/storage-api/
  precision: high
  precision-rationale: >-
    The variadic named-import pattern directly detects storage from exact @forge/api; mixed storage imports match while another @forge/api export is negative. The sole-import sibling has narrower structure and may overlap; it is not a language companion. Aliased/type-only forms and double-quote matching are not covered by this test. Evidence: rule-tests/strict/imports/no-deprecated-storage-import.test.yml and rule-tests/__snapshots__/no-deprecated-storage-import-snapshot.yml.
  impact: medium
  impact-rationale: >-
    The storage API reference documents @forge/kvs as the replacement for legacy @forge/api storage. Genuine legacy usage incurs migration work and misses newer supported storage capabilities, a bounded maintenance/delivery consequence; deprecation alone does not prove data loss or immediate runtime failure.
  scope-profile:
    - frontend
    - backend
    - tests
