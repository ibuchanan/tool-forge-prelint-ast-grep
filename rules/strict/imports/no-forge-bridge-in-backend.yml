id: no-forge-bridge-in-backend
language: TypeScript
severity: error
message: >
  Do not import '@forge/bridge' in Forge backend runtime code.
  Bridge APIs are browser/frontend-only; backend functions should use '@forge/api'
  or receive data through resolver arguments instead.
note: >
  Importing @forge/bridge from resolvers, external clients, lifecycle handlers,
  or src/index.ts can bundle browser-only APIs into Forge backend code.
  @forge/bridge is a frontend-only JavaScript API for UI Kit and Custom UI apps.
  Backend functions should use '@forge/api' instead. See:
  https://developer.atlassian.com/platform/forge/apis-reference/ui-api-bridge/bridge/
rule:
  any:
    - pattern: "import $$$IMPORTS from '@forge/bridge'"
    - pattern: "import '@forge/bridge'"
    - pattern: 'import $$$IMPORTS from "@forge/bridge"'
    - pattern: 'import "@forge/bridge"'
files:
  - "**/external/**"
  - "**/import-lifecycle/**"
  - "**/resolvers/**"
  - "**/src/index.ts"
ignores:
  - "**/coverage/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/specs/**"
metadata:
  category: imports
  references:
    - https://developer.atlassian.com/platform/forge/apis-reference/ui-api-bridge/bridge/
  precision: medium
  precision-rationale: >-
    Exact @forge/bridge imports match in selected backend paths, while @forge/api is negative. The matcher does not resolve erased type-only imports or whether a selected file is bundled as backend; those are untested compliant-match distinctions. Side-effect, namespace and quote variants lack dedicated tests. Evidence: rule-tests/strict/imports/no-forge-bridge-in-backend.test.yml and rule-tests/__snapshots__/no-forge-bridge-in-backend-snapshot.yml.
  impact: high
  impact-rationale: >-
    The Bridge reference defines frontend interaction with Atlassian host APIs. Executing browser-only bridge dependencies in a backend entrypoint can prevent backend startup or resolver operation, a substantial app failure. Erased imports and unused modules need not cause this consequence.
  scope-profile:
    - unique
  scope-rationale: >-
    Preserve resolvers, external and import-lifecycle directories plus the exact src/index.ts entrypoint, without adding backend directories or other entrypoint extensions. This reviewed server-layout convention differs from the standard backend envelope and does not classify shared code automatically. Apply the shared baseline and intentionally include test-local configurations and helpers within those positive paths.
