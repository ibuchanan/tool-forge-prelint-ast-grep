id: no-frontend-escape-imports
language: TypeScript
severity: error
message: >
  Frontend files must not import from outside src/frontend/ (except src/util/).
  Keep frontend code self-contained; use @forge/bridge to call the backend.
note: >
  Importing backend modules from frontend code couples the two layers and can
  introduce backend-only APIs into the browser bundle.
  See https://developer.atlassian.com/platform/forge/ui-kit/use-ui-kit/
rule:
  kind: import_statement
  regex: '(from\s+["''](\.\./external|\.\./import-lifecycle|\.\./queues|\.\./\.\./|\.\./\.\./\.\./|\.\./\.\./\.\./\.\./)|import\s+["''](\.\./external|\.\./import-lifecycle|\.\./queues|\.\./\.\./|\.\./\.\./\.\./|\.\./\.\./\.\./\.\./))'
  not:
    regex: '(from\s+["'']\.\./(\.\./)*util(?:/|["''])|import\s+["'']\.\./(\.\./)*util(?:/|["'']))'
files:
  - "**/frontend/**"
