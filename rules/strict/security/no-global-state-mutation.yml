id: no-global-state-mutation
language: TypeScript
severity: warning
message: >
  Avoid mutating `global` or `globalThis`.
  Keep Forge tenant data per invocation or tenant-keyed.
note: >
  Forge runtime processes can be reused across invocations,
  and tenant-specific data stored through global objects can leak into later invocations.
  Keep request-specific state local to the handler,
  key caches by a tenant identifier,
  or use Forge Storage for durable cross-invocation data.
  See Forge security's data isolation guidance:
  https://developer.atlassian.com/platform/forge/security/
  See also the tenant data isolation guide:
  https://developer.atlassian.com/platform/forge/tenant-data-isolation/
rule:
  any:
    - pattern: globalThis.$PROP = $VALUE
    - pattern: globalThis[$KEY] = $VALUE
    - pattern: global.$PROP = $VALUE
    - pattern: global[$KEY] = $VALUE
    - pattern: globalThis.$PROP += $VALUE
    - pattern: globalThis[$KEY] += $VALUE
    - pattern: global.$PROP += $VALUE
    - pattern: global[$KEY] += $VALUE
    - pattern: globalThis.$PROP ??= $VALUE
    - pattern: globalThis[$KEY] ??= $VALUE
    - pattern: global.$PROP ??= $VALUE
    - pattern: global[$KEY] ??= $VALUE
    - pattern: globalThis.$PROP ||= $VALUE
    - pattern: globalThis[$KEY] ||= $VALUE
    - pattern: global.$PROP ||= $VALUE
    - pattern: global[$KEY] ||= $VALUE
    - pattern: globalThis.$PROP++
    - pattern: global.$PROP++
    - pattern: ++globalThis.$PROP
    - pattern: ++global.$PROP
    - pattern: delete globalThis.$PROP
    - pattern: delete globalThis[$KEY]
    - pattern: delete global.$PROP
    - pattern: delete global[$KEY]
    - kind: call_expression
      regex: '^global(This)?\.[A-Za-z_$][A-Za-z0-9_$]*\.(set|add|delete|clear|push|pop|shift|unshift|splice)\s*\('
ignores:
  - "**/node_modules/**"
  - "**/frontend/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
metadata:
  category: security
  references:
    - https://developer.atlassian.com/platform/forge/security/
    - https://developer.atlassian.com/platform/forge/tenant-data-isolation/
  precision: high
  precision-rationale: >-
    Assignments, updates, deletes and listed mutator calls on global/globalThis
    directly violate the stated no-global-mutation convention.
    rule-tests/strict/security/no-global-state-mutation.test.yml and
    rule-tests/__snapshots__/no-global-state-mutation-snapshot.yml together
    cover direct/bracket writes, increment, delete and a tenant-keyed global Map
    write, with local state and global crypto reads negative. This is not proof
    of tenant data leakage; shadowed global names and unlisted mutation forms
    are assessment gaps, not covered runtime identity or dataflow analysis.
  impact: high
  impact-rationale: >-
    If request-specific tenant data is retained in a reused Forge process and
    later read without tenant isolation, another invocation can receive that
    data. Forge tenant-isolation guidance supports this cross-tenant exposure
    risk. Harmless global constants or tenant-keyed state do not establish that
    harm.
  scope-profile:
    - unique
  scope-rationale: >-
    Preserve legacy TypeScript-only scanning with unrestricted positive scope
    minus frontend paths, node_modules and .test.ts/.spec.ts filenames. This is
    a backend-intended exclusion boundary, not the standard backend
    positive-directory selection. dist, build, coverage, specs, other test
    suffixes and test directories remain scanned. No JS/TSX companions exist;
    those parser coverage gaps and scope normalization require separate review
    in ticket 08.
