id: no-hardcoded-secret-literals
language: TypeScript
severity: error
message: >
  SEC-03: Do not commit literal credentials or private keys in Forge source.
note: >
  Rotate exposed credentials, remove them from source, and read secrets from
  Forge environment variables or secure configuration.
rule:
  kind: string
  regex: "(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----)"
ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
