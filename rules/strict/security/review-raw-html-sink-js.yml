id: review-raw-html-sink-js
language: JavaScript
severity: warning
metadata:
  category: security
  owasp: "A03:2021 - Injection"
  cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation
    (Cross-site Scripting)"
  references:
    - https://top10.owasp.org/2025/A05_2025-Injection/
    - https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
    - https://developer.atlassian.com/platform/forge/shared-responsibility-model/
    - https://owasp.org/Top10/A03_2021-Injection/
    - https://cwe.mitre.org/data/definitions/79.html
  precision: low
  precision-rationale: >-
    Raw-HTML assignments, document writes, insertion calls and dangerous React
    properties are broad review signals, including ordinary sanitized/literal
    values. rule-tests/strict/security/review-raw-html-sink-js.test.yml and
    rule-tests/__snapshots__/review-raw-html-sink-js-snapshot.yml together cover
    sinks and negative text rendering/non-sink strings. Receiver DOM identity,
    source trust and sanitizer correctness are unresolved; a match is not proof
    of XSS. TSX/JS add a JSX-attribute branch absent from the TypeScript parser
    rule; the policy and ratings remain the same.
  impact: high
  impact-rationale: >-
    Unsanitized attacker-controlled HTML rendered into an active DOM can execute
    script in the page's origin and expose private content or authenticated
    actions. CWE-79 and OWASP injection/output-handling guidance support that
    consequence. Safe literal/sanitized rendering and non-DOM receivers do not
    establish executable injection.
  scope-profile:
    - frontend
    - backend
message: >
  Raw HTML rendering can execute untrusted content. Prefer text rendering or review
  sanitization.
note: >
  Reports raw HTML sinks, including sanitized or literal values, for review. Ordinary text
  rendering and HTML-shaped strings alone are not sinks. This does not determine DOM types,
  source trust or sanitizer correctness. Applies outside UI Kit frontend paths because Custom UI
  can live elsewhere. See https://top10.owasp.org/2025/A05_2025-Injection/,
  https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/ and
  https://developer.atlassian.com/platform/forge/shared-responsibility-model/
rule:
  any:
    - pattern: $NODE.innerHTML = $VALUE
    - pattern: $NODE.outerHTML = $VALUE
    - kind: assignment_expression
      has:
        field: left
        kind: subscript_expression
        has:
          field: index
          kind: string
          regex: '^["''](innerHTML|outerHTML)["'']$'
    - pattern: $NODE.insertAdjacentHTML($$$ARGS)
    - pattern: document.write($$$ARGS)
    - pattern: document.writeln($$$ARGS)
    - kind: pair
      has:
        field: key
        regex: '^["'']?dangerouslySetInnerHTML["'']?$'
    - kind: assignment_expression
      has:
        field: left
        kind: member_expression
        has:
          field: property
          regex: ^dangerouslySetInnerHTML$
    - kind: jsx_attribute
      has:
        kind: property_identifier
        regex: ^dangerouslySetInnerHTML$
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
