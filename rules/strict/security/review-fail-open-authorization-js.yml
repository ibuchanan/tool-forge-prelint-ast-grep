id: review-fail-open-authorization-js
language: JavaScript
severity: warning
message: >
  Review allow-on-error authorization. Deny access or propagate permission-check failures.
note: >
  Reviews literal return true from a try/catch handler in narrowly named authorization helpers
  when the try body contains a permission-check-shaped call. Names and method shapes are review
  heuristics, not semantic proof of authorization or exploitability. Logging the failure does
  not make an allow fallback safe. Nested function returns and unrelated true values are
  excluded; only the nearest catch handler is considered. Promise catch callbacks, implicit
  allow values, custom helper names, permission checks in other files and complete control-flow
  semantics are outside this matcher. Confirm fail-closed behavior with failure-path tests. See
  https://top10.owasp.org/2025/A10_2025-Mishandling_of_Exceptional_Conditions/ and
  https://developer.atlassian.com/platform/forge/runtime-reference/authorize-api/
rule:
  kind: return_statement
  pattern: return true
  all:
    - inside:
        stopBy:
          any:
            - kind: function_declaration
            - kind: function_expression
            - kind: arrow_function
            - kind: method_definition
            - kind: catch_clause
        kind: catch_clause
        inside:
          kind: try_statement
          has:
            field: body
            has:
              stopBy:
                any:
                  - kind: function_declaration
                  - kind: function_expression
                  - kind: arrow_function
                  - kind: method_definition
              kind: call_expression
              has:
                field: function
                any:
                  - kind: identifier
                    regex: ^(checkPermission|checkAuthorization|authorizeUser|verifyAccess|verifyPermission|hasPermission|isAuthorized)$
                  - kind: member_expression
                    has:
                      field: property
                      regex: ^(checkPermission|checkAuthorization|verifyAccess|verifyPermission|hasPermission|isAuthorized|canRead|canEdit|canDelete|canUpdate|canCreate|canAccess)$
    - inside:
        stopBy:
          any:
            - kind: function_declaration
            - kind: function_expression
            - kind: arrow_function
            - kind: method_definition
        any:
          - kind: function_declaration
            has:
              field: name
              regex: ^(isAuthorized|isAllowed|hasPermission|hasAccess|checkPermission|checkAuthorization|authorizeUser|can(Read|Edit|Write|Delete|Create|Update|Access|Administer))$
          - kind: function_expression
            has:
              field: name
              regex: ^(isAuthorized|isAllowed|hasPermission|hasAccess|checkPermission|checkAuthorization|authorizeUser|can(Read|Edit|Write|Delete|Create|Update|Access|Administer))$
          - kind: method_definition
            has:
              field: name
              regex: ^(isAuthorized|isAllowed|hasPermission|hasAccess|checkPermission|checkAuthorization|authorizeUser|can(Read|Edit|Write|Delete|Create|Update|Access|Administer))$
          - any:
              - kind: arrow_function
              - kind: function_expression
            inside:
              kind: variable_declarator
              has:
                field: name
                regex: ^(isAuthorized|isAllowed|hasPermission|hasAccess|checkPermission|checkAuthorization|authorizeUser|can(Read|Edit|Write|Delete|Create|Update|Access|Administer))$
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
metadata:
  category: security
  references:
    - https://top10.owasp.org/2025/A10_2025-Mishandling_of_Exceptional_Conditions/
    - https://developer.atlassian.com/platform/forge/runtime-reference/authorize-api/
    - https://cwe.mitre.org/data/definitions/636.html
  precision: medium
  precision-rationale: >-
    Literal return true in the nearest catch of a narrowly named authorization
    helper with a permission-shaped try call is a concrete allow-on-error
    signal.
    rule-tests/strict/security/review-fail-open-authorization-js.test.yml and
    rule-tests/__snapshots__/review-fail-open-authorization-js-snapshot.yml
    together cover helper forms and logging before allow, with deny/throw,
    unrelated calls and nested returns negative. Names do not resolve permission
    semantics; Promise catches, implicit allow and cross-file checks are gaps.
  impact: high
  impact-rationale: >-
    When true grants access, converting a failed permission check into true lets
    a caller bypass authorization during an exception. OWASP
    exceptional-condition guidance and Forge authorize support fail-closed
    handling; a syntactic match does not prove the helper is a security decision
    or that an exception occurs.
  owasp: "A10:2025 - Mishandling of Exceptional Conditions"
  cwe: "CWE-636: Not Failing Securely (Failing Open)"
  scope-profile:
    - frontend
    - backend
