id: no-jwt-none-algorithm-js
language: JavaScript
severity: warning
message: Remove the JWT `none` algorithm. Configure an explicit allowed signing algorithm.
note: >
  Matches object pairs with an algorithm/algorithms key and a literal none value or
  array entry, case-insensitively. Comments and strings containing configuration text
  are not matched. This configuration-shape policy assumes JWT usage; unrelated algorithm
  objects can match too. It does not resolve JWT libraries, prove that verification is
  disabled, or trace option variables. There is no automatic algorithm substitution.
  See https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
metadata:
  category: security
  owasp: "A02:2021 - Cryptographic Failures"
  cwe: "CWE-347: Improper Verification of Cryptographic Signature"
  precision: medium
  precision-rationale: >-
    An algorithm/algorithms object key with a literal none entry is a concrete
    unsigned-token configuration signal.
    rule-tests/strict/security/no-jwt-none-algorithm-js.test.yml and
    rule-tests/__snapshots__/no-jwt-none-algorithm-js-snapshot.yml together
    cover case/quote/array forms and JWT-shaped calls, with signed algorithms,
    comments, strings and computed options negative. Unrelated algorithm objects
    can match; library identity, option use and signature-verification behavior
    are not resolved.
  impact: high
  impact-rationale: >-
    A verifier accepting attacker-controlled unsigned JWTs as authenticated can
    allow forged claims and authorization bypass. RFC 7518 defines unsecured
    JWTs, and CWE-347 supports the signature-verification consequence. Merely
    creating an unsigned token or an unrelated algorithm object does not prove a
    verifier accepts it or grants access.
  references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
    - https://www.rfc-editor.org/rfc/rfc7518.html#section-3.6
    - https://cwe.mitre.org/data/definitions/347.html
  scope-profile:
    - frontend
    - backend
rule:
  kind: pair
  all:
    - has:
        field: key
        regex: '(?i)^["'']?algorithms?["'']?$'
    - has:
        field: value
        any:
          - kind: string
            regex: '(?i)^["'']none["'']$'
          - kind: array
            has:
              kind: string
              regex: '(?i)^["'']none["'']$'
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
