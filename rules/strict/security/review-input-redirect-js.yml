id: review-input-redirect-js
language: JavaScript
severity: warning
message: Review input-derived redirect targets. Allow only approved destinations.
note: >
  Matches the first redirect argument when its syntax contains payload, an object.payload,
  request.body or request.queryParameters expression. Only destination-first signatures
  are checked, not status-code-first redirect APIs. Source and receiver names
  are heuristics. No taint tracking, alias resolution, destination validation or sanitizer
  recognition is performed; a match is not proof of an open redirect.
  See https://owasp.org/Top10/A01_2021-Broken_Access_Control/
metadata:
  category: security
  owasp: "A01:2021 - Broken Access Control"
  cwe: "CWE-601: URL Redirection to Untrusted Site (Open Redirect)"
  references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    - https://cwe.mitre.org/data/definitions/601.html
  precision: medium
  precision-rationale: >-
    Direct input syntax in a destination-first redirect argument is a concrete
    destination-review signal.
    rule-tests/strict/security/review-input-redirect-js.test.yml and
    rule-tests/__snapshots__/review-input-redirect-js-snapshot.yml together
    cover direct/composed targets and fixed, options-only, string/comment and
    alias negatives. Approved destinations and receiver identity are not
    resolved; status-code-first APIs and sanitizer behavior are coverage gaps,
    not evidence of an open redirect.
  impact: medium
  impact-rationale: >-
    An unrestricted user-supplied redirect can send users from a trusted
    workflow to an attacker-controlled site and enable phishing or disrupt
    navigation. CWE-601 and OWASP access-control guidance support this bounded
    consequence. Authentication bypass or credential theft requires additional
    conditions and is not established by the first-argument signal.
  scope-profile:
    - frontend
    - backend
rule:
  any:
    - pattern: $RES.redirect($TARGET, $$$ARGS)
    - pattern: $RES.redirect($TARGET)
constraints:
  TARGET:
    any:
      - matches: input-source
      - has:
          stopBy: end
          matches: input-source
utils:
  input-source:
    any:
      - kind: identifier
        regex: ^payload$
      - pattern: $X.payload
      - pattern: $REQ.queryParameters
      - pattern: $REQ.body
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
