id: review-webtrigger-literal-secret
language: TypeScript
severity: warning
message: Review literal compared with request headers or query parameters; load shared secrets securely.
note: >
  A web-trigger authentication secret embedded in source can be read by anyone with access to
  the app bundle. This rule finds comparisons of request header or query values with a string
  literal; some literals are harmless labels rather than secrets, and variable aliases are
  not traced. Store real shared secrets per installation and use constant-time comparison.
  See https://developer.atlassian.com/platform/forge/runtime-reference/web-trigger/
rule:
  all:
    - kind: binary_expression
    - regex: "===?|!==?"
    - has:
        stopBy: end
        kind: member_expression
        regex: '\.(headers|queryParameters)\b'
    - has:
        kind: string
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
metadata:
  category: security
  precision: low
  precision-rationale: >-
    Syntax identifies literal comparisons near headers/queryParameters but cannot determine whether
    a literal is an authentication secret or whether an alias has been used. See
    rule-tests/strict/security/review-webtrigger-literal-secret.test.yml.
  impact: high
  impact-rationale: >-
    If the compared literal is a shared authentication secret, exposing the source can bypass
    authentication. A literal comparison alone does not prove this behavior.
  scope-profile: [frontend, backend]
  references:
    - https://developer.atlassian.com/platform/forge/runtime-reference/web-trigger/
    - https://cwe.mitre.org/data/definitions/798.html
  cwe: "CWE-798: Use of Hard-coded Credentials"
