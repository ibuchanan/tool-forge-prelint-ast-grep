id: review-input-module-load-js
language: JavaScript
severity: warning
message: Review input-derived module names. Load code only from a fixed allowlist.
note: >
  Matches the first require/import argument when its syntax contains payload,
  an object.payload, request.body or request.queryParameters expression. Source names
  are heuristics, not proven provenance. No taint tracking, alias resolution, lexical
  shadowing or sanitizer recognition is performed. Fixed module names are not matched;
  variable aliases and cross-function or cross-file flows are not traced.
  See https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
metadata:
  category: security
  owasp: "A08:2021 - Software and Data Integrity Failures"
  cwe: "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
  references:
    - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
    - https://cwe.mitre.org/data/definitions/829.html
  precision: medium
  precision-rationale: >-
    Direct input syntax in require/import's first argument signals dynamic code
    selection. rule-tests/strict/security/review-input-module-load-js.test.yml
    and rule-tests/__snapshots__/review-input-module-load-js-snapshot.yml
    together cover direct and composed module names, with fixed names,
    options-only input, strings/comments and aliases negative. Allowlisting,
    source trust, require shadowing and cross-file flows are not resolved; a
    permitted selection can still match and is an assessment gap.
  impact: high
  impact-rationale: >-
    If an attacker selects executable code outside a fixed trusted allowlist,
    loading it can execute under the application's privileges. OWASP software
    integrity guidance and CWE-829 support this consequence. A dynamic name does
    not prove untrusted code exists or is reachable in the runtime/bundle.
  scope-profile:
    - frontend
    - backend
rule:
  any:
    - pattern: require($TARGET, $$$ARGS)
    - pattern: require($TARGET)
    - pattern: import($TARGET, $$$ARGS)
    - pattern: import($TARGET)
constraints:
  TARGET:
    any:
      - matches: input-source
      - has:
          stopBy: end
          matches: input-source
utils:
  input-source:
    any:
      - kind: identifier
        regex: ^payload$
      - pattern: $X.payload
      - pattern: $REQ.queryParameters
      - pattern: $REQ.body
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
