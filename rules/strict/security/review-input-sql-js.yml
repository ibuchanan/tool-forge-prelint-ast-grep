id: review-input-sql-js
language: JavaScript
severity: warning
message: Review input-derived SQL statements. Bind values and allowlist dynamic identifiers.
note: >
  Matches only the first query/execute/raw argument when its syntax contains payload,
  an object.payload, request.body or request.queryParameters expression. Bound values in
  subsequent arguments are not matched. Method and source names are heuristics, not
  resolved SQL clients or proven provenance. No taint tracking, alias resolution or
  sanitizer recognition is performed. The imported Forge SQL prepare/executeRaw APIs
  are covered separately by review-dynamic-forge-sql.
  See https://owasp.org/Top10/A03_2021-Injection/
metadata:
  category: security
  owasp: "A03:2021 - Injection"
  cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
  references:
    - https://owasp.org/Top10/A03_2021-Injection/
    - https://cwe.mitre.org/data/definitions/89.html
  precision: medium
  precision-rationale: >-
    Direct input syntax in query/execute/raw's first statement argument is a
    concrete SQL-review signal.
    rule-tests/strict/security/review-input-sql-js.test.yml and
    rule-tests/__snapshots__/review-input-sql-js-snapshot.yml together cover
    direct/composed statements, with bound values in later arguments, fixed
    statements, strings/comments and aliases negative. Method names do not
    establish SQL clients; sanitizers and dataflow are not resolved. Forge SQL
    prepare/executeRaw has separate rules.
  impact: high
  impact-rationale: >-
    Untrusted input interpreted as SQL syntax can read or alter unauthorized
    records under the database connection's privileges. OWASP injection guidance
    and CWE-89 support the confidentiality/integrity consequence. A direct input
    expression alone does not prove executable SQL injection or unsafe bindings.
  scope-profile:
    - unique
  scope-rationale: >-
    Preserve unrestricted positive source scope across frontend, backend and
    Custom UI paths. Legacy ignores exclude node_modules, dist, build, *.test.*,
    *.spec.* and __tests__. Unlike the shared sets, coverage, specs and
    test/tests directories without those suffixes remain scanned, while build is
    additionally excluded. This reviewed migration exception preserves behavior
    only; ticket 08 must review normalization.
rule:
  any:
    - pattern: $DB.query($TARGET, $$$ARGS)
    - pattern: $DB.query($TARGET)
    - pattern: $DB.execute($TARGET, $$$ARGS)
    - pattern: $DB.execute($TARGET)
    - pattern: $DB.raw($TARGET, $$$ARGS)
    - pattern: $DB.raw($TARGET)
constraints:
  TARGET:
    any:
      - matches: input-source
      - has:
          stopBy: end
          matches: input-source
utils:
  input-source:
    any:
      - kind: identifier
        regex: ^payload$
      - pattern: $X.payload
      - pattern: $REQ.queryParameters
      - pattern: $REQ.body
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
