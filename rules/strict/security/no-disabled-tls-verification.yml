id: no-disabled-tls-verification
language: TypeScript
severity: error
metadata:
  category: security
  owasp: "A05:2021 - Security Misconfiguration"
  cwe: "CWE-295: Improper Certificate Validation"
  precision: high
  precision-rationale: >-
    Literal global TLS bypasses and false rejectUnauthorized options at imported
    Node HTTPS/TLS/undici clients directly violate the verification policy.
    rule-tests/strict/security/no-disabled-tls-verification.test.yml and
    rule-tests/__snapshots__/no-disabled-tls-verification-snapshot.yml together
    cover bypasses, client/import aliases and inline options, with true
    verification and unrelated objects negative. External option objects,
    CommonJS imports, other libraries and lexical binding identity remain gaps.
  impact: high
  impact-rationale: >-
    Disabling certificate validation permits an attacker able to intercept a
    connection to impersonate the peer and read or alter sensitive traffic. Node
    TLS documentation and CWE-295 support this concrete consequence;
    runtime/network access and transmitted data determine actual exposure.
  references:
    - https://nodejs.org/api/tls.html
    - https://nodejs.org/api/cli.html#node_tls_reject_unauthorizedvalue
    - https://top10.owasp.org/2025/A04_2025-Cryptographic_Failures/
    - https://developer.atlassian.com/platform/forge/shared-responsibility-model/
    - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
    - https://cwe.mitre.org/data/definitions/295.html
  scope-profile:
    - unique
  scope-rationale: >-
    Preserve unrestricted positive source scope across frontend, backend and
    Custom UI paths. Legacy ignores exclude node_modules, dist, build, *.test.*,
    *.spec.* and __tests__. Unlike the shared sets, coverage, specs and
    test/tests directories without those suffixes remain scanned, while build is
    additionally excluded. This reviewed migration exception preserves behavior
    only; ticket 08 must review normalization.
message: >
  TLS certificate verification is disabled. Restore verification or configure a trusted CA.
note: >
  Flags the literal global TLS bypass and inline rejectUnauthorized: false options at imported
  Node https/tls and undici clients. Ordinary similarly named objects are not matched. Import
  aliases are supported; options stored elsewhere, CommonJS client imports and other TLS
  libraries require separate review. Remotes and tooling differ from managed Forge HTTPS egress.
  No universal certificate-pinning requirement is implied. See
  https://top10.owasp.org/2025/A04_2025-Cryptographic_Failures/, https://nodejs.org/api/tls.html
  and https://developer.atlassian.com/platform/forge/shared-responsibility-model/
rule:
  any:
    - kind: assignment_expression
      all:
        - has:
            field: left
            any:
              - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED
              - kind: subscript_expression
                all:
                  - has:
                      field: object
                      pattern: process.env
                  - has:
                      field: index
                      kind: string
                      regex: '^["'']NODE_TLS_REJECT_UNAUTHORIZED["'']$'
        - has:
            field: right
            kind: string
            regex: '^["'']0["'']$'
    - all:
        - any:
            - all:
                - any:
                    - kind: call_expression
                      has:
                        field: function
                        kind: member_expression
                        all:
                          - has:
                              field: object
                              pattern: $CLIENT
                          - has:
                              field: property
                              regex: ^(request|get|connect|Agent|TLSSocket)$
                    - kind: new_expression
                      has:
                        field: constructor
                        kind: member_expression
                        all:
                          - has:
                              field: object
                              pattern: $CLIENT
                          - has:
                              field: property
                              regex: ^(Agent|TLSSocket)$
                - inside:
                    stopBy: end
                    kind: program
                    has:
                      kind: import_statement
                      all:
                        - has:
                            field: source
                            regex: '^["''](node:)?(https|tls)["'']$'
                        - has:
                            kind: import_clause
                            any:
                              - has:
                                  kind: identifier
                                  pattern: $CLIENT
                              - has:
                                  kind: namespace_import
                                  has:
                                    kind: identifier
                                    pattern: $CLIENT
            - all:
                - any:
                    - kind: call_expression
                      has:
                        field: function
                        kind: identifier
                        pattern: $CLIENT
                    - kind: new_expression
                      has:
                        field: constructor
                        kind: identifier
                        pattern: $CLIENT
                - inside:
                    stopBy: end
                    kind: program
                    has:
                      kind: import_statement
                      all:
                        - has:
                            field: source
                            regex: '^["'']((node:)?(https|tls)|undici)["'']$'
                        - has:
                            stopBy: end
                            kind: import_specifier
                            any:
                              - all:
                                  - has:
                                      field: name
                                      pattern: $CLIENT
                                      regex: ^(Agent|Client|Pool|request|get|connect|TLSSocket)$
                                  - not:
                                      has:
                                        field: alias
                                        kind: identifier
                              - all:
                                  - has:
                                      field: name
                                      regex: ^(Agent|Client|Pool|request|get|connect|TLSSocket)$
                                  - has:
                                      field: alias
                                      pattern: $CLIENT
        - has:
            field: arguments
            has:
              kind: object
              has:
                stopBy:
                  any:
                    - kind: call_expression
                    - kind: arrow_function
                    - kind: function_expression
                kind: pair
                all:
                  - has:
                      field: key
                      regex: '^["'']?rejectUnauthorized["'']?$'
                  - has:
                      field: value
                      pattern: "false"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
