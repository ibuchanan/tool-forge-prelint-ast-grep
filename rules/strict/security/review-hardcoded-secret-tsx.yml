id: review-hardcoded-secret-tsx
language: Tsx
severity: warning
message: Review secret-like string literals. Store credentials in encrypted Forge variables or KVS secrets.
note: >
  Matches static strings and non-interpolated templates assigned to secret-like identifiers
  or object keys. A name does not prove a credential: placeholders, labels and empty strings
  can match. Interpolated templates are excluded by the static-literal check;
  that is not a guarantee that their contents are secret-free. No dataflow, entropy or provider
  validation is performed. Use encrypted Forge environment variables or the KVS secret API,
  not ordinary storage, for real secrets. Rotate any credential exposed in source.
  See https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/ and
  https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
metadata:
  category: security
  precision: low
  precision-rationale: >
    Secret-like identifier/key names plus static literals are a review heuristic,
    not proof of credentials. rule-tests/strict/security/review-hardcoded-secret-tsx.test.yml
    covers declarations, assignments, object keys, templates, and safe dynamic
    values. Labels, placeholders, and empty strings can still match as the note
    acknowledges; those false-positive cases are an assessment gap in the tests.
  impact: high
  impact-rationale: >
    Genuine hard-coded credentials can expose authenticated access when source
    is shared or client-visible. OWASP authentication guidance and encrypted
    Forge variables support protecting those credentials. This consequence is
    conditional on a real secret; name-only matches do not prove compromise.
  references:
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
    - https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
  scope-profile: [unique]
  scope-rationale: >
    Preserve legacy unrestricted positive scope and exclusions for node_modules,
    dist, build, test/spec filename suffixes, and __tests__. coverage and specs
    remain scanned, as do test/tests directories without excluded filenames.
    This is a migration deviation, not permanent approval; ticket 08 must review
    both the extra build exclusion and differences from the shared sets.
  owasp: "A07:2021 - Identification and Authentication Failures"
  cwe: "CWE-798: Use of Hard-coded Credentials"
rule:
  any:
    - kind: variable_declarator
      all:
        - has:
            field: name
            kind: identifier
            matches: secret-name
        - has:
            field: value
            matches: static-string
    - kind: assignment_expression
      all:
        - has:
            field: left
            kind: identifier
            matches: secret-name
        - has:
            field: right
            matches: static-string
    - kind: pair
      all:
        - has:
            field: key
            any:
              - kind: property_identifier
                matches: secret-name
              - kind: string
                regex: '(?i)(api[_-]?key|secret|token|password|passwd|client[_-]?secret|private[_-]?key|access[_-]?key|auth)["'']$'
        - has:
            field: value
            matches: static-string
utils:
  secret-name:
    regex: "(?i)(api[_-]?key|secret|token|password|passwd|client[_-]?secret|private[_-]?key|access[_-]?key|auth)$"
  static-string:
    any:
      - kind: string
      - kind: template_string
        not:
          has:
            kind: template_substitution
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
