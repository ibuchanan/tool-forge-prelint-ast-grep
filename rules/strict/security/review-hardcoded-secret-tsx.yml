id: review-hardcoded-secret-tsx
language: Tsx
severity: warning
message: Review secret-like string literals. Store credentials in encrypted Forge variables or KVS secrets.
note: >
  Matches static strings and non-interpolated templates assigned to secret-like identifiers
  or object keys. A name does not prove a credential: placeholders, labels and empty strings
  can match. Interpolated templates are excluded by the static-literal check;
  that is not a guarantee that their contents are secret-free. No dataflow, entropy or provider
  validation is performed. Use encrypted Forge environment variables or the KVS secret API,
  not ordinary storage, for real secrets. Rotate any credential exposed in source.
  See https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/ and
  https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
metadata:
  category: security
  owasp: "A07:2021 - Identification and Authentication Failures"
  cwe: "CWE-798: Use of Hard-coded Credentials"
rule:
  any:
    - kind: variable_declarator
      all:
        - has:
            field: name
            kind: identifier
            matches: secret-name
        - has:
            field: value
            matches: static-string
    - kind: assignment_expression
      all:
        - has:
            field: left
            kind: identifier
            matches: secret-name
        - has:
            field: right
            matches: static-string
    - kind: pair
      all:
        - has:
            field: key
            any:
              - kind: property_identifier
                matches: secret-name
              - kind: string
                regex: '(?i)(api[_-]?key|secret|token|password|passwd|client[_-]?secret|private[_-]?key|access[_-]?key|auth)["'']$'
        - has:
            field: value
            matches: static-string
utils:
  secret-name:
    regex: "(?i)(api[_-]?key|secret|token|password|passwd|client[_-]?secret|private[_-]?key|access[_-]?key|auth)$"
  static-string:
    any:
      - kind: string
      - kind: template_string
        not:
          has:
            kind: template_substitution
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
