id: no-weak-hash-js
language: JavaScript
severity: warning
message: Avoid MD5/SHA-1 for cryptographic integrity. Use SHA-256 or a dedicated password-hashing algorithm.
note: >
  Matches createHash calls and methods with literal MD5/SHA-1 first arguments,
  case-insensitively. Method names are a heuristic; imports, aliases, purpose and lexical
  shadowing are not resolved. Non-security checksums may be legitimate. SHA-256 alone is
  not suitable for password storage; use a password hashing scheme such as scrypt or Argon2.
  See https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
metadata:
  category: security
  owasp: "A02:2021 - Cryptographic Failures"
  cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
  precision: medium
  precision-rationale: >-
    Literal MD5/SHA-1 first arguments to createHash calls/methods signal weak
    cryptographic hashing. rule-tests/strict/security/no-weak-hash-js.test.yml
    and rule-tests/__snapshots__/no-weak-hash-js-snapshot.yml together cover
    case variants and arbitrary receivers, with stronger algorithms, computed
    first arguments and later md5 arguments negative. Imports, purpose and
    shadowing are unresolved; legitimate non-security checksums can match and
    are an assessment gap, not a measured false-positive rate.
  impact: high
  impact-rationale: >-
    Using collision-broken MD5/SHA-1 where adversarial integrity depends on
    collision resistance can permit forged content. OWASP cryptographic guidance
    and CWE-327 support this consequence. Non-security checksums need not suffer
    that harm; plain SHA-256 is also insufficient for password storage, which
    requires a dedicated password-hashing scheme.
  references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
    - https://nodejs.org/api/crypto.html#cryptocreatehashalgorithm-options
    - https://cwe.mitre.org/data/definitions/327.html
  scope-profile:
    - frontend
    - backend
rule:
  any:
    - pattern: $C.createHash($ALGORITHM, $$$ARGS)
    - pattern: $C.createHash($ALGORITHM)
    - pattern: createHash($ALGORITHM, $$$ARGS)
    - pattern: createHash($ALGORITHM)
constraints:
  ALGORITHM:
    kind: string
    regex: '(?i)^["''](md5|sha1)["'']$'
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
