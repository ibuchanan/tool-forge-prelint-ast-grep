id: no-insecure-randomness
language: TypeScript
severity: warning
message: Avoid `Math.random()` for secret-like values. Use `crypto.randomBytes()` or `crypto.randomUUID()`.
note: >
  Reports Math.random() calls within the value of a declaration, assignment or object
  property with a security-sensitive name suffix. Names are heuristics, not proof of
  security use. Randomness in unrelated sibling values is not matched. Aliases, dataflow,
  and lexical shadowing are not resolved; only token/secret/password/passwd/key/nonce/salt/
  otp/session/csrf suffixes are recognized (not sessionId).
  See https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
metadata:
  category: security
  owasp: "A02:2021 - Cryptographic Failures"
  cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator
    (PRNG)"
  precision: medium
  precision-rationale: >-
    Math.random in a value with a security-sensitive name suffix is a concrete
    weak-randomness signal, but names do not establish security use.
    rule-tests/strict/security/no-insecure-randomness.test.yml and
    rule-tests/__snapshots__/no-insecure-randomness-snapshot.yml together cover
    declarations, assignments, properties and composed values, with unrelated
    siblings, sessionId, secure generators and aliases negative. Harmless
    similarly named values and lexical shadowing remain assessment gaps; no
    measured false-positive rate or dataflow analysis is available.
  impact: high
  impact-rationale: >-
    If predictable non-cryptographic randomness supplies an authentication
    token, OTP or CSRF secret, guessing that value can enable unauthorized
    actions. MDN Math.random, Node crypto and CWE-338 support using
    cryptographic randomness. Not every named key, nonce or salt needs
    unpredictability, and matching source syntax does not establish an
    exploitable token.
  references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
    - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math/random
    - https://nodejs.org/api/crypto.html#cryptorandombytessize-callback
    - https://cwe.mitre.org/data/definitions/338.html
  scope-profile:
    - unique
  scope-rationale: >-
    Preserve unrestricted positive source scope across frontend, backend and
    Custom UI paths. Legacy ignores exclude node_modules, dist, build, *.test.*,
    *.spec.* and __tests__. Unlike the shared sets, coverage, specs and
    test/tests directories without those suffixes remain scanned, while build is
    additionally excluded. This reviewed migration exception preserves behavior
    only; ticket 08 must review normalization.
rule:
  pattern: Math.random()
  inside:
    stopBy: end
    any:
      - kind: variable_declarator
        all:
          - has:
              field: name
              kind: identifier
              regex: "(?i)(token|secret|password|passwd|key|nonce|salt|otp|session|csrf)$"
          - has:
              field: value
              matches: random-expression
      - kind: assignment_expression
        all:
          - has:
              field: left
              kind: identifier
              regex: "(?i)(token|secret|password|passwd|key|nonce|salt|otp|session|csrf)$"
          - has:
              field: right
              matches: random-expression
      - kind: pair
        all:
          - has:
              field: key
              any:
                - kind: property_identifier
                  regex: "(?i)(token|secret|password|passwd|key|nonce|salt|otp|session|csrf)$"
                - kind: string
                  regex: '(?i)(token|secret|password|passwd|key|nonce|salt|otp|session|csrf)["'']$'
          - has:
              field: value
              matches: random-expression
utils:
  random-expression:
    any:
      - pattern: Math.random()
      - has:
          stopBy: end
          pattern: Math.random()
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
