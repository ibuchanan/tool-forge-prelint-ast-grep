id: no-dynamic-code-evaluation-js
language: JavaScript
severity: error
metadata:
  category: security
  owasp: "A03:2021 - Injection"
  cwe:
    "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code
    (Eval Injection)"
  precision: high
  precision-rationale: >-
    Direct eval/Function invocations and literal string timer callbacks
    establish the stated dynamic-evaluation convention violation, not input
    trust or an exploit.
    rule-tests/strict/security/no-dynamic-code-evaluation-js.test.yml and
    rule-tests/__snapshots__/no-dynamic-code-evaluation-js-snapshot.yml together
    cover these calls and negative function callbacks, object methods and
    visible declaration/import/parameter shadowing. Shadowing is conservatively
    excluded, not fully resolved; aliases, indirect evaluation and
    stored/interpolated timer expressions remain coverage gaps. TypeScript/TSX
    recognize required_parameter and optional_parameter nodes; the JavaScript
    companion only needs identifier parameters. This parser difference does not
    change policy judgments.
  impact: high
  impact-rationale: >-
    When untrusted input is evaluated as code, it can execute under application
    privileges and access private data or perform unauthorized operations. OWASP
    injection/output-handling guidance and CWE-95 support this consequence.
    Fixed trusted expressions and empty invocations still violate the convention
    but do not by themselves establish exploitation.
  references:
    - https://top10.owasp.org/2025/A05_2025-Injection/
    - https://owasp.org/Top10/A03_2021-Injection/
    - https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
    - https://developer.atlassian.com/platform/forge/shared-responsibility-model/
    - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/eval
    - https://cwe.mitre.org/data/definitions/95.html
  scope-profile:
    - frontend
    - backend
message: >
  Avoid dynamic code evaluation. Use fixed operations and validated data instead.
note: >
  Flags direct eval and Function calls/constructors, string-form setTimeout and setInterval callbacks,
  not object methods. Visible declarations and parameters of the same name in enclosing scopes are
  excluded conservatively; this is not a JavaScript name resolver and aliases/indirect evaluation need
  separate analysis. Arrow functions and function expressions as callbacks are valid; shadowed local
  timer identifiers are excluded. A match identifies an execution sink, not proven exploitability. See
  https://top10.owasp.org/2025/A05_2025-Injection/,
  https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/ and
  https://developer.atlassian.com/platform/forge/shared-responsibility-model/
rule:
  all:
    - any:
        - kind: call_expression
          has:
            field: function
            kind: identifier
            pattern: $NAME
            regex: ^(eval|Function)$
        - kind: new_expression
          has:
            field: constructor
            kind: identifier
            pattern: $NAME
            regex: ^Function$
        - kind: call_expression
          all:
            - has:
                field: function
                kind: identifier
                pattern: $NAME
                regex: ^(setTimeout|setInterval)$
            - has:
                field: arguments
                has:
                  nthChild: 1
                  any:
                    - kind: string
                    - kind: template_string
                      not:
                        has:
                          kind: template_substitution
    - not:
        inside:
          stopBy: end
          all:
            - any:
                - kind: program
                - kind: statement_block
                - kind: function_declaration
                - kind: function_expression
                - kind: arrow_function
            - any:
                - has:
                    stopBy:
                      any:
                        - kind: program
                        - kind: statement_block
                        - kind: function_declaration
                        - kind: function_expression
                        - kind: arrow_function
                    any:
                      - kind: variable_declarator
                        has:
                          field: name
                          pattern: $NAME
                      - kind: function_declaration
                        has:
                          field: name
                          pattern: $NAME
                      - kind: class_declaration
                        has:
                          field: name
                          pattern: $NAME
                      - kind: import_clause
                        has:
                          kind: identifier
                          pattern: $NAME
                      - kind: import_specifier
                        any:
                          - has:
                              field: alias
                              pattern: $NAME
                          - all:
                              - has:
                                  field: name
                                  pattern: $NAME
                              - not:
                                  has:
                                    field: alias
                                    kind: identifier
                - has:
                    field: parameters
                    has:
                      stopBy: end
                      any:
                        - kind: identifier
                          pattern: $NAME
                - has:
                    field: parameter
                    pattern: $NAME
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
