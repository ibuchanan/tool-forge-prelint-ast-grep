id: review-untrusted-authorization-identity-tsx
language: Tsx
severity: warning
message: >
  Review input-supplied impersonation identity. Use trusted caller context or independently
  authorize the target.
note: >
  Reviews direct payload/inputs/modelOutput/toolArgs identity fields (accountId, userId,
  callerAccountId) passed to imported @forge/api asUser, including default, namespace and named
  aliases. This is explicit impersonation, not an ordinary target account ID in application
  data. Such targets can be legitimate when independently authorized; validation may exist
  elsewhere. Source names are a heuristic, not proof of untrusted provenance. Destructuring,
  renamed sources, lexical shadowing, cross-file flows, custom permission wrappers and
  role-based decisions are not analyzed. Forge authorize() takes no caller-identity argument and
  is not treated as one. See
  https://developer.atlassian.com/platform/forge/apis-reference/fetch-api-product-requestjira/,
  https://developer.atlassian.com/platform/forge/app-context-security/,
  https://developer.atlassian.com/platform/forge/manifest-reference/modules/rovo-action/ and
  https://top10.owasp.org/2025/A01_2025-Broken_Access_Control/
rule:
  all:
    - kind: call_expression
    - any:
        - all:
            - has:
                field: function
                kind: member_expression
                all:
                  - has:
                      field: object
                      kind: identifier
                      pattern: $API
                  - has:
                      field: property
                      regex: ^asUser$
            - inside:
                stopBy: end
                kind: program
                has:
                  kind: import_statement
                  all:
                    - has:
                        field: source
                        regex: '^["'']@forge/api["'']$'
                    - has:
                        kind: import_clause
                        any:
                          - has:
                              kind: identifier
                              pattern: $API
                          - has:
                              kind: namespace_import
                              has:
                                kind: identifier
                                pattern: $API
        - all:
            - has:
                field: function
                kind: identifier
                pattern: $ASUSER
            - inside:
                stopBy: end
                kind: program
                has:
                  kind: import_statement
                  all:
                    - has:
                        field: source
                        regex: '^["'']@forge/api["'']$'
                    - has:
                        stopBy: end
                        kind: import_specifier
                        any:
                          - all:
                              - has:
                                  field: name
                                  pattern: $ASUSER
                                  regex: ^asUser$
                              - not:
                                  has:
                                    field: alias
                                    kind: identifier
                          - all:
                              - has:
                                  field: name
                                  regex: ^asUser$
                              - has:
                                  field: alias
                                  pattern: $ASUSER
    - has:
        field: arguments
        has:
          nthChild: 1
          any:
            - kind: member_expression
              all:
                - has:
                    field: property
                    regex: ^(accountId|userId|callerAccountId)$
                - has:
                    field: object
                    any:
                      - kind: identifier
                        regex: ^(payload|inputs|modelOutput|toolArgs)$
                      - pattern: request.payload
                      - pattern: request.body
                      - pattern: event.body
            - kind: subscript_expression
              all:
                - has:
                    field: index
                    kind: string
                    regex: '^["''](accountId|userId|callerAccountId)["'']$'
                - has:
                    field: object
                    kind: identifier
                    regex: ^(payload|inputs|modelOutput|toolArgs)$
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
metadata:
  category: security
  references:
    - https://developer.atlassian.com/platform/forge/apis-reference/fetch-api-product-requestjira/
    - https://developer.atlassian.com/platform/forge/app-context-security/
    - https://developer.atlassian.com/platform/forge/manifest-reference/modules/rovo-action/
    - https://top10.owasp.org/2025/A01_2025-Broken_Access_Control/
    - https://cwe.mitre.org/data/definitions/639.html
  precision: medium
  precision-rationale: >-
    Direct named input identity fields passed to imported Forge asUser are a
    concrete impersonation-review signal.
    rule-tests/strict/security/review-untrusted-authorization-identity-tsx.test.yml
    and
    rule-tests/__snapshots__/review-untrusted-authorization-identity-tsx-snapshot.yml
    together cover default/namespace/named aliases and input forms, with
    trusted-context IDs, validated wrappers, other imports, ordinary target IDs
    and no-argument asUser negative. Independent authorization, source trust and
    lexical shadowing are unresolved; legitimate authorized impersonation can
    still match, and destructured aliases are gaps.
  impact: high
  impact-rationale: >-
    If a caller selects another user's impersonation identity without
    independent authorization, product requests can use privileges the caller
    should not control. Forge product-request/app-context guidance and OWASP
    access control support this risk. asUser arguments alone do not prove
    missing authorization or that the runtime grants the requested identity.
  owasp: "A01:2025 - Broken Access Control"
  cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
  scope-profile:
    - unique
  scope-rationale: >-
    Preserve unrestricted positive source scope across frontend, backend and
    Custom UI paths. Legacy ignores exclude node_modules, dist, build, *.test.*,
    *.spec.* and __tests__. Unlike the shared sets, coverage, specs and
    test/tests directories without those suffixes remain scanned, while build is
    additionally excluded. This reviewed migration exception preserves behavior
    only; ticket 08 must review normalization.
