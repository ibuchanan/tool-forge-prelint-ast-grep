id: review-input-fetch-url-tsx
language: Tsx
severity: warning
message: Review input-derived fetch URLs. Allowlist destination hosts and validate redirects.
note: >
  Matches only the first fetch argument when its syntax contains payload, an object.payload,
  request.body or request.queryParameters expression. Subsequent body/header arguments are
  not matched. Source and receiver names are heuristics, not proven provenance. Even an
  interpolation on a fixed host triggers review; this rule does not understand URL structure,
  server versus browser execution, destination validation or Forge egress restrictions.
  No taint tracking, alias resolution or sanitizer recognition is performed.
  See https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
metadata:
  category: security
  owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
  cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
  references:
    - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
    - https://cwe.mitre.org/data/definitions/918.html
  precision: medium
  precision-rationale: >-
    Direct payload/body/query syntax in the first fetch URL is a concrete input
    signal. rule-tests/strict/security/review-input-fetch-url-tsx.test.yml and
    rule-tests/__snapshots__/review-input-fetch-url-tsx-snapshot.yml together
    cover direct and interpolated/concatenated destinations, with fixed URLs,
    body/options-only input, strings/comments and aliases negative. Fixed-host
    interpolation can still match; URL structure, allowed hosts, browser/server
    context, import identity and sanitizer correctness are not resolved. This is
    not taint analysis or proof of SSRF.
  impact: high
  impact-rationale: >-
    If an attacker controls a server-side fetch destination without suitable
    restrictions, the server can access private services or disclose data using
    its network privileges. OWASP SSRF and CWE-918 support this consequence.
    Browser fetches and validated/fixed-host destinations need contextual
    review; Forge egress controls also constrain reachability.
  scope-profile:
    - frontend
    - backend
rule:
  any:
    - pattern: fetch($TARGET, $$$ARGS)
    - pattern: fetch($TARGET)
    - pattern: $API.fetch($TARGET, $$$ARGS)
    - pattern: $API.fetch($TARGET)
constraints:
  TARGET:
    any:
      - matches: input-source
      - has:
          stopBy: end
          matches: input-source
utils:
  input-source:
    any:
      - kind: identifier
        regex: ^payload$
      - pattern: $X.payload
      - pattern: $REQ.queryParameters
      - pattern: $REQ.body
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
