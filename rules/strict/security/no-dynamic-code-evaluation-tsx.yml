id: no-dynamic-code-evaluation-tsx
language: Tsx
severity: error
metadata:
  category: security
  owasp: "A03:2021 - Injection"
  cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code (Eval Injection)"
message: >
  Avoid dynamic code evaluation. Use fixed operations and validated data instead.
note: >
  Flags direct eval and Function calls/constructors, string-form setTimeout and setInterval callbacks,
  not object methods. Visible declarations and parameters of the same name in enclosing scopes are
  excluded conservatively; this is not a JavaScript name resolver and aliases/indirect evaluation need
  separate analysis. Arrow functions and function expressions as callbacks are valid; shadowed local
  timer identifiers are excluded. A match identifies an execution sink, not proven exploitability. See
  https://top10.owasp.org/2025/A05_2025-Injection/,
  https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/ and
  https://developer.atlassian.com/platform/forge/shared-responsibility-model/
rule:
  all:
    - any:
        - kind: call_expression
          has:
            field: function
            kind: identifier
            pattern: $NAME
            regex: ^(eval|Function)$
        - kind: new_expression
          has:
            field: constructor
            kind: identifier
            pattern: $NAME
            regex: ^Function$
        - kind: call_expression
          all:
            - has:
                field: function
                kind: identifier
                pattern: $NAME
                regex: ^(setTimeout|setInterval)$
            - has:
                field: arguments
                has:
                  nthChild: 1
                  any:
                    - kind: string
                    - kind: template_string
                      not:
                        has:
                          kind: template_substitution
    - not:
        inside:
          stopBy: end
          all:
            - any:
                - kind: program
                - kind: statement_block
                - kind: function_declaration
                - kind: function_expression
                - kind: arrow_function
            - any:
                - has:
                    stopBy:
                      any:
                        - kind: program
                        - kind: statement_block
                        - kind: function_declaration
                        - kind: function_expression
                        - kind: arrow_function
                    any:
                      - kind: variable_declarator
                        has:
                          field: name
                          pattern: $NAME
                      - kind: function_declaration
                        has:
                          field: name
                          pattern: $NAME
                      - kind: class_declaration
                        has:
                          field: name
                          pattern: $NAME
                      - kind: import_clause
                        has:
                          kind: identifier
                          pattern: $NAME
                      - kind: import_specifier
                        any:
                          - has:
                              field: alias
                              pattern: $NAME
                          - all:
                              - has:
                                  field: name
                                  pattern: $NAME
                              - not:
                                  has:
                                    field: alias
                                    kind: identifier
                - has:
                    field: parameters
                    has:
                      stopBy: end
                      any:
                        - kind: identifier
                          pattern: $NAME
                        - kind: required_parameter
                          has:
                            field: pattern
                            pattern: $NAME
                        - kind: optional_parameter
                          has:
                            field: pattern
                            pattern: $NAME
                - has:
                    field: parameter
                    pattern: $NAME
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
