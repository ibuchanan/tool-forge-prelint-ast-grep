id: no-hardcoded-atlassian-token
language: TypeScript
severity: error
message: >
  Do not commit Atlassian API tokens in source
note: >
  Rotate the exposed token immediately,
  remove it from source,
  and read it from Forge environment variables
  or secure configuration instead.
  Use 'forge variables set --encrypt' to store secrets safely per environment:
  https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
rule:
  kind: string
  regex: '\b(ATATT3xFfG[a-zA-Z0-9_\-=]{20,})\b'
ignores:
  - "**/*.test.ts"
  - "**/*.spec.ts"
