id: no-hardcoded-atlassian-token
language: TypeScript
severity: warning
message: >
  Do not commit Atlassian API tokens in source
note: >
  Rotate the exposed token immediately,
  remove it from source,
  and read it from Forge environment variables
  or secure configuration instead.
  Use 'forge variables set --encrypt' to store secrets safely per environment:
  https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
metadata:
  category: security
  precision: medium
  precision-rationale: >
    The string matcher recognizes an Atlassian-token prefix and at least 20
    following characters. rule-tests/strict/security/no-hardcoded-atlassian-token.test.yml
    covers assignments, arguments, object values, ordinary placeholders, and short
    prefixes. It does not distinguish genuine credentials from realistic fabricated
    strings; that identity distinction is an assessment gap, not live-token validation.
  impact: high
  impact-rationale: >
    A genuine API token committed to source can expose authenticated access to
    anyone who obtains it, requiring revocation and rotation. Encrypted Forge
    variables avoid embedding the credential; the consequence assumes a real
    credential, not every matching synthetic string.
  references:
    - https://developer.atlassian.com/platform/forge/cli-reference/variables-set/
    - https://cwe.mitre.org/data/definitions/798.html
  scope-profile: [frontend, backend]
rule:
  kind: string
  regex: '\b(ATATT3xFfG[a-zA-Z0-9_\-=]{20,})\b'
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
