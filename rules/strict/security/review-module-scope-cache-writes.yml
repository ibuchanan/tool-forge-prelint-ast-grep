id: review-module-scope-cache-writes
language: TypeScript
severity: warning
message: >
  Review module-scope cache writes.
  Key tenant data by `cloudId` or use Forge Storage.
note: >
  Forge apps run in a multi-tenant runtime
  where module-level variables and in-memory caches
  can survive across invocations.
  Static cache keys and Atlassian identifiers
  such as issue keys are not tenant identifiers;
  key in-memory caches by cloudId or installationId,
  or use Forge Storage for durable cross-invocation data.
  See Forge security's data isolation guidance:
  https://developer.atlassian.com/platform/forge/security/
  See also the tenant data isolation guide:
  https://developer.atlassian.com/platform/forge/tenant-data-isolation/
utils:
  moduleCacheDeclaration:
    any:
      - matches: bareModuleCacheDeclaration
      - kind: export_statement
        has:
          matches: bareModuleCacheDeclaration
  bareModuleCacheDeclaration:
    any:
      - all:
          - pattern: const $CACHE = $INIT
          - regex: '^\s*const\s+.*=\s*(\{|\[|new\s+(Map|Set)\b)'
      - all:
          - pattern: "const $CACHE: $TYPE = $INIT"
          - regex: '^\s*const\s+.*=\s*(\{|\[|new\s+(Map|Set)\b)'
rule:
  any:
    - pattern: $CACHE.$PROP = $VALUE
      inside:
        stopBy: end
        kind: program
        has:
          matches: moduleCacheDeclaration
    - pattern: $CACHE[$KEY] = $VALUE
      inside:
        stopBy: end
        kind: program
        has:
          matches: moduleCacheDeclaration
    - pattern: $CACHE.set($KEY, $VALUE)
      inside:
        stopBy: end
        kind: program
        has:
          matches: moduleCacheDeclaration
    - pattern: $CACHE.add($VALUE)
      inside:
        stopBy: end
        kind: program
        has:
          matches: moduleCacheDeclaration
    - pattern: $CACHE.push($VALUE)
      inside:
        stopBy: end
        kind: program
        has:
          matches: moduleCacheDeclaration
constraints:
  KEY:
    any:
      - regex: '^["'']'
      - regex: '(^|\.)(issue\.(key|id)|page\.id|content\.id)$'
ignores:
  - "**/node_modules/**"
  - "**/frontend/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
metadata:
  category: security
  references:
    - https://developer.atlassian.com/platform/forge/security/
    - https://developer.atlassian.com/platform/forge/tenant-data-isolation/
  precision: medium
  precision-rationale: >-
    Selected writes to module-declared object/array/Map/Set caches with static
    or listed resource keys signal possible missing tenant isolation.
    rule-tests/strict/security/review-module-scope-cache-writes.test.yml and
    rule-tests/__snapshots__/review-module-scope-cache-writes-snapshot.yml
    together cover static/resource-key and exported-array writes, with
    handler-local and cloudId-keyed cache use negative. The matcher does not
    establish value sensitivity, tenant confinement, binding identity under
    shadowing or all key forms; shared public caches can be legitimate and
    require review.
  impact: high
  impact-rationale: >-
    A process-reused cache holding private tenant data under a shared key can
    return one tenant's data to another; issue/page identifiers are not a
    general tenant partition. Forge tenant-isolation guidance supports
    tenant-keying or isolated storage. Public cached data alone does not
    establish disclosure.
  scope-profile:
    - unique
  scope-rationale: >-
    Preserve legacy TypeScript-only scanning with unrestricted positive scope
    minus frontend paths, node_modules and .test.ts/.spec.ts filenames. This is
    a backend-intended exclusion boundary, not the standard backend
    positive-directory selection. dist, build, coverage, specs, other test
    suffixes and test directories remain scanned. No JS/TSX companions exist;
    those parser coverage gaps and scope normalization require separate review
    in ticket 08.
