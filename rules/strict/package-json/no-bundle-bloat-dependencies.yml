id: no-bundle-bloat-dependencies
language: Json
severity: warning
message: >
  Avoid production dependencies that commonly add avoidable bundle/runtime weight.
note: >
  Prefer platform fetch over axios, native date APIs or smaller date libraries
  over moment, and per-function utilities over whole lodash.
rule:
  all:
    - kind: string_content
      regex: "^(moment|lodash|axios)$"
    - inside:
        stopBy: end
        kind: pair
        regex: '"dependencies"\s*:'
files:
  - "**/package.json"
