id: prefer-forge-fetch
language: Json
severity: warning
message: >
  Prefer Forge platform fetch over third-party HTTP client libraries.
note: >
  The Forge runtime provides api.fetch() for general HTTP requests
  and api.asUser().requestJira() / api.asApp().requestConfluence() for product APIs.
  Third-party HTTP clients require egress entries,
  add bundle weight,
  and do not integrate with Forge's auth or network policies.
  See the Forge Fetch API reference for the full range of built-in HTTP options:
  https://developer.atlassian.com/platform/forge/runtime-reference/fetch-api/
rule:
  all:
    - kind: string_content
      regex: "^(node-fetch|cross-fetch|isomorphic-fetch|request|axios|form-data|got|superagent|abort-controller|isomorphic-form-data)$"
    - inside:
        stopBy: end
        kind: pair
        regex: '"dependencies"\s*:'
files:
  - "**/package.json"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  category: package-json
  references:
    - https://developer.atlassian.com/platform/forge/runtime-reference/fetch-api/
  precision: medium
  precision-rationale: >-
    Exact listed client names beneath a dependencies pair match; tests cover production clients, devDependencies, other packages and partial-name negatives. The matcher also accepts matching string values, not just dependency keys. Actual usage, frontend/backend needs and legitimate multipart/polyfill requirements are untested contextual gaps; presence alone does not prove an incompatible client. Evidence: rule-tests/strict/package-json/prefer-forge-fetch.test.yml and rule-tests/__snapshots__/prefer-forge-fetch-snapshot.yml.
  impact: medium
  impact-rationale: >-
    The Forge Fetch API reference supplies built-in HTTP/product request capabilities. A genuinely unnecessary or incompatible third-party client can add bundle weight or break affected backend HTTP integration, a bounded delivery/reliability cost. Package presence proves neither missing authorization nor bypass of network policy.
  scope-profile:
    - package-json
    - tests
