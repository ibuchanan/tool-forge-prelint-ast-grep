id: no-disallowed-fetch-port
language: TypeScript
severity: error
message: >
  Fetch URL uses a port that Forge's egress proxy does not allow. Use one of the ten allowed destination ports instead.
note: >
  Forge's Node.js runtime egress proxy allows outbound fetch connections only on ports
  80, 443, 8080, 8443, 8444, 7990, 8089, 8090, 8085, and 8060 —
  any other destination port is blocked at runtime.
  Hardcoding a port outside this list fails once deployed,
  even if it works against a different host in local testing.
  See https://developer.atlassian.com/platform/forge/function-reference/nodejs-runtime/#https-only
rule:
  all:
    - kind: call_expression
      regex: '^(api\.(asUser\(\)\.|asApp\(\)\.)?)?fetch\s*\(\s*["'']https?://[^/"'']+:[0-9]+'
    - not:
        regex: '://[^/"'']+:(?:80|443|8080|8443|8444|7990|8089|8090|8085|8060)(?:[/?#"'']|$)'
ignores:
  - "**/node_modules/**"
  - "**/frontend/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
metadata:
  category: api-usage
  references:
    - https://developer.atlassian.com/platform/forge/function-reference/nodejs-runtime/#https-only
  precision: medium
  precision-rationale: >-
    Named fetch calls with quoted HTTP(S) URLs and ports outside the fixed allowlist match. Tests cover allowed ports, rejected ports and a URL variable negative. Import identity, custom fetch wrappers and dynamic URLs are not resolved; same-named local clients are an untested contextual gap. Evidence: rule-tests/strict/api-usage/no-disallowed-fetch-port.test.yml and rule-tests/__snapshots__/no-disallowed-fetch-port-snapshot.yml.
  impact: medium
  impact-rationale: >-
    The cited runtime egress contract blocks unsupported destination ports. A genuine Forge request to such a port fails after deployment, disrupting the affected integration rather than demonstrating a security exploit. The fixed port list needs review when platform support changes.
  scope-profile:
    - unique
  scope-rationale: >-
    Preserve unrestricted positive TypeScript scope with frontend excluded, not the standard backend directory selection. Legacy ignores contain only node_modules, frontend and *.test.ts/tsx; dist, coverage, specs, *.spec.*, __tests__, test and tests remain scanned. Ticket 08 owns reviewed normalization; no runtime is inferred from the parser.
