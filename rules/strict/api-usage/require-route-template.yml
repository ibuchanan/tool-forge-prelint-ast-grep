id: require-route-template
language: TypeScript
severity: error
message: >
  API request paths must use the route`` template tag or assumeTrustedRoute().
  Passing raw strings directly is unsafe and bypasses Forge's URL validation.
note: >
  The route`` template tag ensures the URL is validated
  against the product's allowed endpoints.
  assumeTrustedRoute() can be used for dynamic paths
  that have been validated by other means.
  Use: api.asUser().requestJira(route`/rest/api/3/issue/${issueId}`)
  See https://developer.atlassian.com/platform/forge/runtime-reference/product-fetch-api/
rule:
  any:
    - pattern: requestJira($STR, $$$)
    - pattern: requestConfluence($STR, $$$)
    - pattern: requestGraph($STR, $$$)
    - pattern: requestBitbucket($STR, $$$)
  not:
    any:
      - pattern: requestJira(route`$$$`, $$$)
      - pattern: requestJira(assumeTrustedRoute($$$), $$$)
      - pattern: requestJira(route`$$$`)
      - pattern: requestJira(assumeTrustedRoute($$$))
      - pattern: requestConfluence(route`$$$`, $$$)
      - pattern: requestConfluence(assumeTrustedRoute($$$), $$$)
      - pattern: requestConfluence(route`$$$`)
      - pattern: requestConfluence(assumeTrustedRoute($$$))
      - pattern: requestGraph(route`$$$`, $$$)
      - pattern: requestGraph(assumeTrustedRoute($$$), $$$)
      - pattern: requestGraph(route`$$$`)
      - pattern: requestGraph(assumeTrustedRoute($$$))
      - pattern: requestBitbucket(route`$$$`, $$$)
      - pattern: requestBitbucket(assumeTrustedRoute($$$), $$$)
      - pattern: requestBitbucket(route`$$$`)
      - pattern: requestBitbucket(assumeTrustedRoute($$$))
ignores:
  - "**/*.spec.*"
  - "**/*.test.*"
  - "**/__tests__/**"
  - "**/coverage/**"
  - "**/dist/**"
  - "**/frontend/**"
  - "**/node_modules/**"
  - "**/specs/**"
  - "**/test/**"
  - "**/tests/**"
metadata:
  category: api-usage
  references:
    - https://developer.atlassian.com/platform/forge/runtime-reference/product-fetch-api/
  precision: medium
  precision-rationale: >-
    Bare product request calls with an unrecognized first argument match; direct route templates and assumeTrustedRoute calls are negative. Variables holding an already validated route, same-named local functions, qualified receivers and interprocedural flows are not resolved; validated variables are an untested compliant-match gap. Evidence: rule-tests/strict/api-usage/require-route-template.test.yml and rule-tests/__snapshots__/require-route-template-snapshot.yml.
  impact: high
  impact-rationale: >-
    The product-fetch reference explains route construction and encoding of untrusted path/query values. If raw untrusted values redirect a privileged product request, unauthorized records can be read or changed. This conditional high-impact path-manipulation risk is not proof that every matched argument is unvalidated.
  scope-profile:
    - unique
  scope-rationale: >-
    Exclude conventional frontend paths while retaining root src/index.ts, shared utilities and unconventional server layouts. This negative boundary is intentionally not the standard backend directory selection and does not establish runtime identity. Use the shared baseline and complete test exclusions; build, vendors and fixtures remain included outside excluded paths.
