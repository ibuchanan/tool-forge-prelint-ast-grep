id: require-as-user-or-as-app
language: TypeScript
severity: error
message: >
  API requests must be authorized via api.asUser() or api.asApp().
  Do not call requestJira() or requestConfluence() directly on 'api'.
note: >
  Forge requires explicit authorization context for all product API calls.
  api.asUser() makes the request on behalf of the current user.
  api.asApp() makes the request as the app itself.
  See https://developer.atlassian.com/platform/forge/apis-reference/product-rest-api-reference/
rule:
  any:
    - pattern: api.requestJira($$$)
    - pattern: api.requestConfluence($$$)
    - pattern: api.requestGraph($$$)
    - pattern: api.requestBitbucket($$$)
    - pattern: requestJira($$$)
    - pattern: requestConfluence($$$)
    - pattern: requestGraph($$$)
    - pattern: requestBitbucket($$$)
  not:
    any:
      - pattern: api.asUser().requestJira($$$)
      - pattern: api.asApp().requestJira($$$)
      - pattern: api.asUser().requestConfluence($$$)
      - pattern: api.asApp().requestConfluence($$$)
      - pattern: api.asUser().requestGraph($$$)
      - pattern: api.asApp().requestGraph($$$)
      - pattern: api.asUser().requestBitbucket($$$)
      - pattern: api.asApp().requestBitbucket($$$)
ignores:
  - "**/*.spec.*"
  - "**/*.test.*"
  - "**/__tests__/**"
  - "**/coverage/**"
  - "**/dist/**"
  - "**/frontend/**"
  - "**/node_modules/**"
  - "**/specs/**"
  - "**/test/**"
  - "**/tests/**"
metadata:
  category: api-usage
  references:
    - https://developer.atlassian.com/platform/forge/apis-reference/product-rest-api-reference/
  precision: medium
  precision-rationale: >-
    Direct api product methods and bare named product requests match while asUser/asApp examples are negative. Import provenance and locally bound wrappers are unresolved; a bare wrapper may already supply authorization, an untested compliant-match gap. The rule does not prove an authorization bypass. Evidence: rule-tests/strict/api-usage/require-as-user-or-as-app.test.yml and rule-tests/__snapshots__/require-as-user-or-as-app-snapshot.yml.
  impact: medium
  impact-rationale: >-
    The product REST reference defines explicit user/app authorization contexts. Genuine misuse can fail API requests or select the wrong intended principal, disrupting the affected workflow. No request execution, privileges or unauthorized access is demonstrated by a name-only match.
  scope-profile:
    - unique
  scope-rationale: >-
    Exclude conventional frontend paths while retaining root src/index.ts, shared utilities and unconventional server layouts. This negative boundary is intentionally not the standard backend directory selection and does not establish runtime identity. Use the shared baseline and complete test exclusions; build, vendors and fixtures remain included outside excluded paths.
