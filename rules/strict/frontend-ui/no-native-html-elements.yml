id: no-native-html-elements
language: Tsx
severity: error
message: >
  Do not use native HTML elements in Forge UI Kit frontend code.
  Use the equivalent UI Kit component from '@forge/react' instead.
note: >
  Forge UI Kit renders components via its own reconciler — native HTML elements
  are not supported and will cause rendering errors.
  See https://developer.atlassian.com/platform/forge/ui-kit/components/
utils:
  isNativeHtml:
    any:
      - pattern: <div $$$>$$$</div>
      - pattern: <div />
      - pattern: <span $$$>$$$</span>
      - pattern: <span />
      - pattern: <p $$$>$$$</p>
      - pattern: <p />
      - pattern: <a $$$>$$$</a>
      - pattern: <a />
      - pattern: <button $$$>$$$</button>
      - pattern: <button />
      - pattern: <input $$$>$$$</input>
      - pattern: <input />
      - pattern: <form $$$>$$$</form>
      - pattern: <form />
      - pattern: <strong $$$>$$$</strong>
      - pattern: <strong />
      - pattern: <em $$$>$$$</em>
      - pattern: <em />
      - pattern: <table $$$>$$$</table>
      - pattern: <table />
      - pattern: <tr $$$>$$$</tr>
      - pattern: <tr />
      - pattern: <td $$$>$$$</td>
      - pattern: <td />
rule:
  matches: isNativeHtml
files:
  - "**/frontend/**"
ignores:
  - "**/node_modules/**"
metadata:
  category: frontend-ui
  references:
    - https://developer.atlassian.com/platform/forge/ui-kit/components/
  precision: medium
  precision-rationale: >-
    Selected native-element JSX forms match; Box and Stack/Text forms are negative. Native HTML is unsupported in UI Kit, but frontend paths can also contain legitimate Custom UI HTML. Runtime identity is not checked; Custom UI and most enumerated element branches lack test evidence. Evidence: rule-tests/strict/frontend-ui/no-native-html-elements.test.yml and rule-tests/__snapshots__/no-native-html-elements-snapshot.yml.
  impact: high
  impact-rationale: >-
    UI Kit component documentation supports its reconciler-based component model. Genuine unsupported native elements in a UI Kit root can prevent the app UI from rendering, a substantial application failure. This consequence does not apply to valid DOM rendering in Custom UI.
  scope-profile:
    - unique
  scope-rationale: >-
    Preserve **/frontend/** positive selection and node_modules-only exclusion, including tests and generated content. The directory does not establish UI Kit versus Custom UI. Missing dist, coverage and specs exclusions prevent a standard frontend/tests declaration; ticket 08 must review routing and runtime distinctions.
