id: no-deprecated-table
language: Tsx
severity: error
message: >
  Do not use <Table> in UI Kit; use <DynamicTable> instead
note: >
  The <Table> component was deprecated in UI Kit 2 in favour of <DynamicTable>,
  which supports sorting, pagination, and better accessibility.
  See https://developer.atlassian.com/platform/forge/ui-kit/components/dynamic-table/
rule:
  any:
    - pattern: <Table $$$>$$$</Table>
    - pattern: <Table />
files:
  - "**/frontend/**"
