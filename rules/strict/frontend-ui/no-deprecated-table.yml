id: no-deprecated-table
language: Tsx
severity: warning
message: >
  Do not use <Table> in UI Kit; use <DynamicTable> instead
note: >
  The <Table> component was deprecated in UI Kit 2 in favour of <DynamicTable>,
  which supports sorting, pagination, and better accessibility.
  See https://developer.atlassian.com/platform/forge/ui-kit/components/dynamic-table/
rule:
  any:
    - pattern: <Table $$$>$$$</Table>
    - pattern: <Table />
files:
  - "**/frontend/**"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  category: frontend-ui
  references:
    - https://developer.atlassian.com/platform/forge/ui-kit/components/dynamic-table/
  precision: medium
  precision-rationale: >-
    Table JSX forms match while DynamicTable is negative. No import binding establishes that Table is a Forge component rather than a valid local or Custom UI component; those compliant cases are untested gaps. The test proves the named JSX convention, not component provenance. Evidence: rule-tests/strict/frontend-ui/no-deprecated-table.test.yml and rule-tests/__snapshots__/no-deprecated-table-snapshot.yml.
  impact: medium
  impact-rationale: >-
    The DynamicTable reference supports the replacement UI Kit component and its rendering/pagination features. Genuine legacy table usage can break the affected table or require migration, a bounded functionality consequence; a same-named local component does not establish that harm.
  scope-profile:
    - frontend
    - tests
