id: no-storage-query-scan
language: TypeScript
severity: warning
message: >
  Bound Forge storage queries before getMany().
note: >
  storage.query().getMany() and kvs.query().getMany()
  can scan many entities without an explicit limit.
  Prefer indexed Custom Entity queries,
  narrower predicates,
  and cursor-based pagination.
  See Forge cost optimisation guidance on bounding storage queries with .limit():
  https://developer.atlassian.com/platform/forge/optimise-forge-costs/
rule:
  kind: call_expression
  regex: '^(storage|kvs)\.query\(\)(\.[A-Za-z_$][A-Za-z0-9_$]*\([^)]*\))*\.getMany\('
  not:
    regex: '\.limit\s*\('
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/test/**"
  - "**/tests/**"
metadata:
  category: performance
  references:
    - https://developer.atlassian.com/platform/forge/optimise-forge-costs/
  precision: medium
  precision-rationale: >-
    storage/kvs query chains ending in getMany without a visible limit match. Tests cover predicates/orderBy, explicit limits at different positions and non-query storage calls. Import provenance, default platform bounds, query selectivity and result volume are unresolved; small/default-bounded queries are untested compliant-match distinctions. Evidence: rule-tests/strict/performance/no-storage-query-scan.test.yml and rule-tests/__snapshots__/no-storage-query-scan-snapshot.yml.
  impact: medium
  impact-rationale: >-
    Forge cost guidance recommends bounding storage reads and paginating. Genuinely broad repeated queries can increase read consumption and latency, a bounded cost/reliability problem. A missing explicit limit alone does not prove an unlimited scan, large result volume or substantial resource exhaustion.
  scope-profile:
    - frontend
    - backend
