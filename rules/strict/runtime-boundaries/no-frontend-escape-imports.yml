id: no-frontend-escape-imports
language: TypeScript
severity: warning
message: >
  Frontend files must not import backend runtime modules.
  Keep frontend code self-contained; use @forge/bridge to call backend code.
note: >
  Importing backend modules from frontend code couples the two layers and can
  introduce backend-only APIs into the browser bundle.
  Resolver imports are covered by no-resolver-import-in-frontend.
  See https://developer.atlassian.com/platform/forge/ui-kit/use-ui-kit/
rule:
  kind: import_statement
  regex: '(from\s+["''](?:\.\./)+(?:external|import-lifecycle|queues)(?:/|["''])|import\s+["''](?:\.\./)+(?:external|import-lifecycle|queues)(?:/|["'']))'
files:
  - "**/frontend/**"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/specs/**"
metadata:
  category: runtime-boundaries
  references:
    - https://developer.atlassian.com/platform/forge/ui-kit/use-ui-kit/
  precision: medium
  precision-rationale: >-
    Relative imports escaping into external, import-lifecycle or queues names match. Tests distinguish those paths from components, util and the separately checked resolvers. No filesystem or transitive dependency resolution establishes backend runtime content; same-named pure modules, type-only imports and path aliases are untested contextual distinctions. Evidence: rule-tests/strict/runtime-boundaries/no-frontend-escape-imports.test.yml and rule-tests/__snapshots__/no-frontend-escape-imports-snapshot.yml.
  impact: high
  impact-rationale: >-
    UI Kit frontend/backend separation supports calling backend code through bridge. A genuine runtime boundary escape can pull backend-only APIs into the browser and prevent application UI startup. Pure shared modules or erased type imports do not necessarily have this consequence; naming alone proves no sensitive-data leak.
  scope-profile:
    - frontend
    - tests
