pre-commit:
  commands:
    format:
      run: npm run format
      stage_fixed: true

pre-push:
  commands:
    test:
      run: npm run test
    # Slow (minutes): only needed when rule globs or tier membership change.
    file-targeting:
      glob:
        - "rules/**"
        - "sgconfig*.yml"
        - "rule-tests/fixtures/scope-routing.tsv"
        - "scripts/check-scope-fixtures.sh"
      run: npm run test:file-targeting
